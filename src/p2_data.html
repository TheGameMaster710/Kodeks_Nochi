   {t:'История', list:[
     '**1784, [[Война Гекаты]]** — анархическая ячейка Тремер Джоуэла Пэйна разгромлена. Двое её Тремер присягают Камарилье.',
     '**1900, [[Прибытие Дона Треволли]]** — в Нью-Йорк из Италии прибывает [[Дон Треволли]], уже вампир Тремер. В том же году он обращает свою мафиозную семью, и с неё начинается нынешний клан. Среди обращённых [[Адам Сэндлер]].',
     '**1920** — Дон уходит в Римскую Камарилью и оставляет место в Совете примогенов своему потомку, [[Адам Сэндлер|Адаму Сэндлеру]].',
     '**1995, [[Казнь Джареда Трелли]]** — Камарилья казнит [[Джаред Трелли|Джареда Трелли]], потомка Адама. Он обратил [[Ева Хайнц|Еву Хайнц]], она основала анархическую ячейку, а за дела потомка отвечает сир.',
     '**Конец 90-х, [[Рейд на семью Треволли]]** — масштабный рейд на людей семьи Треволли. Банды больше не существует.'
   ]},
   {t:'Крепость', text:'Логово клана — [[Нью-Йоркская публичная библиотека]]. Её открытая секция выглядит как обычный читальный зал. Через служебные помещения можно спуститься в подземную, «тайную» часть. Дверь туда открывает только амулет Тремер, без него вниз не попасть.'},
   {t:'Тайная библиотека', list:[
     '**Тайная секция** — здесь хранятся все запрещённые книги. Выносить их нельзя, читать можно только на месте.',
     '**Жилой комплекс** — постоянных жителей здесь почти нет. Это скорее бесплатный мотель для любого Тремер, который вмещает до 100 гостей одновременно. Здесь же живут Непризнанные.',
     '**Лекторий** — зал для тренировок.'
   ]},
   {t:'Архивы и доступ', table:{head:['Кто','Что доступно'], rows:[
     ['Люди','открытая секция: всё, что можно знать людям'],
     ['Тремер с амулетом','вся библиотека, с правом изучать книги и практиковать в её залах'],
     ['Примогены и Княгиня','всё, без ограничений'],
     ['Другие кланы','запретные секции, но за плату: кровь в пакетах или услугу'],
     ['Анархи','только публичное']
   ]}},
   {t:'Кто решает', text:'Доступ к сведениям, закрытым для вампирского сообщества, определяют двое: примоген и хранитель библиотеки [[Питер Лин]].'},
   {t:'Принятие в клан', text:'Кого принять в клан, решает лично примоген. Он судит по родословной: [[Адам Сэндлер|Адам]] пробует кровь обращённого техникой Магии крови «Вкус крови». Новый участник получает амулет и свободный доступ в библиотеку. Наставников у новичков нет. Им открывают книги и дают право изучать их и практиковать в залах. Число Объятий никто не контролирует, но за дела потомка отвечает его сир.\n\nВсе Тремер могут углублённо изучать три клановые дисциплины: Прорицание, Магию крови и Доминирование. Четвёртую при желании можно перенять у другого клана. Обязательной техники, которую знали бы все, нет.'},
   {t:'Непризнанные', text:'Если у обращённого не хватает магического потенциала, примоген не признаёт его родословную. Таких Тремер официально называют Непризнанными, и их около 30. Им разрешено жить в библиотеке и помогать клану обычной человеческой работой: сортировать книги, убираться. К делам клана и к знаниям о магии их не допускают.\n\nЖизнь Непризнанных близка к людской. Из библиотеки их не выгоняют, они находятся под личной защитой примогена, и тронуть их никто не смеет. За работу им платят кровью в пакетах, чтобы они могли усмирять голод. Эти пакеты клан получает через связи [[Вентру]].'},
   {t:'Анархическая ячейка', text:'Анархи-Тремер и их союзники из клана [[Малкавиан]] считают, что магическая сила должна быть доступна только тем кланам, чья кровь к ней располагает. Для них важен именно клан, а не родословная, которая была у человека до посмертия. Книги, по которым те же знания могут изучать другие кланы, они хотят уничтожить. На счету ячейки поджоги, кражи и порча книг, в том числе в самой библиотеке. Больше всего [[Адам Сэндлер|Адам]] боится, что однажды они подожгут библиотеку целиком и весь архив сгорит.\n\nЯчейкой руководит [[Ева Хайнц]]. Это Тремер без маговской родословной, которую обратили случайно. Её сиром был [[Джаред Трелли]], один из потомков Адама, и в 1995 году Камарилья казнила его ([[Казнь Джареда Трелли]]): она основала анархическую ячейку, а за дела обращённого отвечает его сир. Прах казнённых Камарилья собирает в урны и хранит у себя. Еву не признали полноценной Тремер и записали в Непризнанные. В библиотеке она не жила и на клан не работала. Мириться с элитарностью тех, у кого есть колдовская родословная, она не захотела и основала собственную группу в районе [[Флэтбуш]]. Вторая её глава — [[Мэри Таунсвилл]] из клана [[Малкавиан]]. Собираются они у старого голландского кладбища при Реформатской церкви.'},
   {t:'Вражда ветвей', text:'Ветви враждуют из-за идеологии. Ева пытается переманить на свою сторону молодняк и в первую очередь Непризнанных, потому что сама когда-то числилась одной из них.\n\nАмулетов Анархи не носят. Тот же исторический символ они набивают татуировкой на левом плече. В отличие от амулета на цепочке, татуировку у них не отнять.'},
   {t:'Законы клана', text:'Тремер наказывают за нарушение правил раздачи знаний, за анархизм и за нарушение законов Камарильи. Судит Совет примогенов.'},
   {t:'Прежние Тремер', text:'До нынешнего клана в городе была анархическая ячейка Тремер, которую возглавлял [[Джоуэл Пэйн]]. Она пала в [[Война Гекаты|Войне Гекаты]]. Учение Джоуэла признано еретическим и запрещено для всех. Найденные страницы его дневника Камарилья отбирает и сжигает, а владельца отдаёт под суд.\n\n[[Адам Сэндлер|Адам]] считает, что это наследие нужно сохранить в его архиве и открывать только высшим чинам Камарильи, Княгине и гостям с её разрешения. Его предложения каждый раз отклоняют.'},
   {t:'Маги и ведьмы', text:'Смертные маги и ведьмы считаются главными врагами клана за пределами вампирского мира. Тремер их истребляют, а книги и вещи убитых забирают в тайную секцию библиотеки.'},
   {t:'Цели в городе', list:[
     'Уничтожить анархическую ячейку.',
     'Защититься от [[орден Святого Леопольда|Второй Инквизиции]].',
     'Оборонять архивы.'
   ]},
   {t:'Двор', text:'Камарильская часть клана полностью лояльна [[Геката|Княгине]] и даёт ей свободный доступ в архивы библиотеки. С Римской Камарильей, где сейчас находится [[Дон Треволли]], нью-йоркский клан ничто не связывает, кроме общих законов секты.'},
   {t:'Отношения с другими кланами', table:{head:['Клан','Отношение'], rows:[
     ['[[Вентру]]','союзники. Через их связи клан получает кровь в пакетах'],
     ['[[Носферату]]','с двором Чарльза Уилфорда дружеское соперничество: Носферату славятся древней историей и любят мериться с Тремер знаниями. Анархи Дэвида Палумбо помогают анархической ячейке, и с ними клан враждует'],
     ['[[Малкавиан]]','неприязнь, потому что клан поддерживает анархическую ячейку'],
     ['[[Гангрел]], [[Тореадор]]','Тремер их не уважают за то, что те набирают всех без разбора или по очень странным критериям']
   ]}},
   {t:'Слухи', list:[
     'Тремер читают мысли гостей библиотеки и продают услышанное.',
     'В закрытых секциях лежит досье на каждого вампира города.',
     'Под библиотекой остались сейфы «семьи» Треволли.',
     'Непризнанных используют для опытов.',
     'Тремер могут найти любого вампира по капле крови.'

 {id:'nosferatu', name:'Носферату',
  short:'Клан двух дворов: английская аристократия Чарльза Уилфорда в замке Бельведер и Анархи Дэвида Палумбо на кладбище Вудлон',
  tags:['аристократы','замок Бельведер','Вудлон','уродство','грейхаунды','титулы','Буффало'],
  img:'images/nosferatu.jpg',
  disciplines:['Анимализм','Затемнение','Могущество'],
  bane:'У каждого Носферату есть уродство, и у каждого оно своё. Общая примета у клана одна — уши. Их либо нет вовсе, и тогда на их месте остаются только отверстия в черепе, либо они похожи на уши летучей мыши. Из-за такой внешности Носферату заметен в толпе, а обычного человека его вид отталкивает.',
  concept:[
   ['Репутация','При Дворе их считают снобами, но уважают за тягу к истории. Анархи знают здешних Носферату как помешанных на изысканиях Джоуэла Пэйна'],
   ['Раскол','Двор [[Чарльз Уилфорд|Чарльза Уилфорда]] и ячейка [[Дэвид Палумбо|Дэвида Палумбо]] никогда не были одним целым. Они пришли в город порознь и терпеть друг друга не могут'],
   ['В городе с','1784 года. Первые Камарильские Носферату погибли в 1835-м. Анархи пришли в 1890-х, а нынешний двор приехал в 1975-м'],
   ['Численность','Около 120 при дворе Чарльза и около 80 в ячейке Палумбо'],
   ['Символ','Клан его не носит. Знак ставят на документы как печать или прячут в подписи'],
   ['Примоген','[[Чарльз Уилфорд]]']
  ],
  blocks:[
   {t:'Два клана под одним именем', text:'Камарильские Носферату — это аристократия, которая держится в стороне от городских дел. Многие из них когда-то были людьми благородного происхождения и владеют состояниями, а живёт двор в основном на деньги, нажитые ещё в Англии. В Нью-Йорке они представляют свой клан, и практической пользы городу от них почти нет.\n\nАнархи с Вудлона устроены иначе. Их привело сюда учение [[Джоуэл Пэйн|Джоуэла Пэйна]], и они до сих пор собирают его по страницам.'},
   {t:'Облик', text:'Двор Чарльза одевается аристократично, с иголочки. Анархи предпочитают закрытую одежду, под которой уродства не видно: чёрное пальто до пят и высокий ворот, поднятый до самого лица.'},
   {t:'Титулы', text:'Поколение при дворе Чарльза имеет вес, но ещё больше значит титул. Сам Чарльз для своих Принц. [[Геката]] об этом знает и считает такое звание безобидной причудой аристократа.'},
   {t:'Ранги двора', table:{head:['Ранг','Кто'], rows:[
     ['Принц','[[Чарльз Уилфорд]]'],
     ['Придворные','Носят звание вместе с должностью. Так, [[Йоган Курт]] — придворный маг'],
     ['Вельможи','Стоят ниже придворных'],
     ['Прислуга','Низший ранг. С него начинают все, кого обратили уже в Нью-Йорке']
   ]}},
   {t:'Приезжие и местные', text:'В 1975 году с Чарльзом из Англии приехала свита из шестидесяти Носферату. С тех пор двор вырос вдвое. Приехавшие считаются знатью, а обращённые уже здесь начинают с прислуги. У Йогана Курта, например, двадцать слуг: десятерых он привёз с собой, ещё десятерых обратил в Нью-Йорке.'},
   {t:'Возвышение и наказание', text:'Подняться можно долгой и верной службой. Новый ранг жалует только сам Чарльз, и каждый раз это торжественная церемония в замке. Титул заверяют грамотой с печатью клана.\n\nПровинившегося могут понизить, на время лишить пищи или отдать под суд Камарильи. Если нарушен закон секты, судит она. Если проступок касается только клана, решает Чарльз.'},
   {t:'Замок Бельведер', text:'Резиденция Чарльза и логово всего двора — [[Замок Бельведер]] в Центральном парке. Для смертных это городская достопримечательность, куда днём водят экскурсии. На деле Чарльз владеет им через подставные фонды, а подвалы и катакомбы для посетителей закрыты. Этими стенами и подземельями угодья двора и ограничены.\n\nДнём наверху работают гули и люди, связанные узами крови, а вампиры отдыхают внизу. Их сон стерегут грейхаунды. Ночью псов выпускают погулять, и они добегают до самого парка.'},
   {t:'Высокомерие', text:'Люди Чарльза архаичны. Всякого, кто по поколению дальше от Каина, они ставят ниже себя, а простых смертных и подавно. С «простолюдинами» они позволяют себе вольности: держатся надменно или пытаются распоряжаться ими как прислугой. В клубе «[[Эден]]» это то и дело выводит из себя других посетителей.'},
   {t:'Маскарад', text:'На людях Носферату либо прикрываются Затемнением, либо не показываются вовсе. В «Эдене» проще: там уродство легко списать на грим.'},
   {t:'Кормление', text:'Двор Чарльза пьёт только у согласных: у людей, связанных узами крови, и у собственных смертных слуг и гулей. На Вудлоне нравы проще. По типу хищника тамошние Анархи почти все расхитители могил или уличные коты.'},
   {t:'Ячейка Палумбо', text:'[[Дэвид Палумбо]] пришёл в Нью-Йорк из Буффало в 1890-х годах ([[Прибытие Дэвида Палумбо]]) и привёл с собой готовую ячейку. Он узнал, что в городе не осталось ни одного его сородича, и услышал об учении Джоуэла Пэйна.\n\nУстроена она просто: есть Палумбо, и есть те, кем он правит. Званий и приближённых у него нет. Собираются Анархи в Бронксе, и место их сбора — [[Кладбище Вудлон]]. Постоянно там обитает около трети из них, в склепах и подземных помещениях, а остальные только приходят на сборы.'},
   {t:'Чего хотят Анархи', text:'С помощью учения Пэйна они рассчитывают получить магическую силу и вернуть Анархам власть над городом. Для этого ячейка собирает [[Дневник Джоуэла Пэйна|страницы его дневника]] и ищет урну с его прахом. Палумбо знает, что от Джоуэла остался только пепел, и всё равно намерен его вернуть. Как именно, посторонним неизвестно.'},
   {t:'Союзники и соседи', text:'С группой [[Ева Хайнц|Евы Хайнц]] у ячейки союз: обе ищут урны и помогают друг другу чем могут. Находки они делят. Страницы дневника достаются Палумбо, а картины Эвы Сэймур получает [[Мэри Таунсвилл]].\n\nВ дела [[Джеймс Боулдер|Джеймса Боулдера]] Палумбо не лезет. Банда Джеймса, в которой около 150 вампиров, остаётся крупнейшей силой Анархов в городе.'},
   {t:'Вражда ветвей', text:'Чарльз считает Анархов своего клана неотёсанными варварами, которые прячутся в норах на вонючем кладбище, как крысы. По его мнению, они недостойны называться частью клана и вообще существовать.\n\nСтоит ему узнать о планах ячейки, он делает всё, чтобы их сорвать. До открытой войны дело не доходит: она стала бы нарушением Маскарада.'},
   {t:'История', list:[
     '**1784, [[Война Гекаты]]** — в первом Совете примогенов место Носферату занимает агент Афинской Камарильи.',
     '**1835, [[Великий пожар]]** — гибнут все Камарильские Носферату города, около пяти вампиров, и среди них примоген. Клана в Нью-Йорке не остаётся.',
     '**1890-е, [[Прибытие Дэвида Палумбо]]** — из Буффало приходит ячейка Анархов и занимает кладбище Вудлон.',
     '**1975, [[Прибытие Чарльза Уилфорда]]** — агент Лондонской Камарильи узнаёт, что место примогена Носферату пустует, и просит своего Князя отправить его в Нью-Йорк посланником. Тот соглашается. Вместе с новым примогеном приезжает его свита.',

 {id:'war-legacy', name:'Наследие войны', kind:'Достоинство', dots:'•–•••••',
  short:'Связь персонажа с [[Война Гекаты|Войной Гекаты]] 1784 года',
  tags:['Война Гекаты','урны','реликвия','1784','присягнувшие','убежища Анархов','дневник Джоуэла'],
  concept:[

   ['Когда берётся','Только при создании персонажа'],
   ['Ступени','Накапливаются: каждая следующая включает все предыдущие'],

  text:'**• Легенда той ночи.** Персонаж знает о войне больше, чем рассказывает официальная версия, включая то, о чём при Дворе вслух не говорят.\n\n**•• Карта старого города.** Знает, где находились убежища всех трёх ячеек, и владеет тайным входом в одно из них.\n\n**••• Тень присягнувших.** Знает настоящую личность одного из пятерых присягнувших. Этот вампир считается Контактом на 2 точки.\n\n**•••• Наследие павших.** Владеет одной из трёх реликвий войны, по одной от каждого из павших вожаков: страницей дневника Джоуэла Пэйна, кольцом клуба Воробья или картиной Эвы Сэймур.\n\n**••••• Пепел Анархов.** Знает, где хранятся урны с прахом старых Анархов.',
  blocks:[
   {t:'Легенда той ночи', text:'Официальную историю [[Война Гекаты|Войны Гекаты]] при Дворе знает каждый. Владелец первой ступени знает и то, что в неё не вошло. Такое знание считается допустимым для своих: оно показывает, что вампир предан истории Камарильи, а не просто пересказывает вампирские байки.\n\nВ годовщину войны, 25 ноября, владельцев этого Достоинства приглашают на закрытый приём в клубе «[[Эден]]».'},
   {t:'Карта старого города', text:'Особняк [[Джоуэл Пэйн|Джоуэла Пэйна]] в Южном округе, логово Эвы Сэймур в Монтгомери и клуб Воробья во Внешнем теперь принадлежат Камарилье и охраняются. Свободного доступа туда нет.\n\nВладелец второй ступени знает расположение всех трёх убежищ. В одно из них у него есть тайный вход, через который можно пробраться внутрь незаметно. Какое это убежище, игрок выбирает при создании персонажа. Ход в бывший клуб Воробья выводит только в заброшенные подвалы под «[[Эден|Эденом]]»: от самого клуба и его сокровищницы они отрезаны.\n\nЕсли Камарилья узнает о тайном входе, его замуруют, как замуровали подвал с лабораторией Джоуэла. Знание о расположении убежищ у персонажа останется.'},
   {t:'Тень присягнувших', text:'Из пятерых присягнувших трое принадлежат к клану Малкавиан и двое к клану [[Тремер]]. Все они носят маски, и мало кто знает, что они бывшие Анархи.\n\nВладелец третьей ступени знает, кто скрывается под одной из масок. Клан, имя и нынешнее положение этого вампира игрок придумывает при создании персонажа. Присягнувший считается Контактом на 2 точки.\n\nКонтакт дорожит своей маской. Если владелец раскроет его как бывшего Анарха, Контакт будет потерян, а точка третьей ступени исчезнет.\n\nНекоторым в Камарилье может не понравиться, что персонаж знает настоящие личности тех, кто скрывается за масками.'},
   {t:'Реликвии', cards:[
     {name:'Страница дневника', tag:'Джоуэл Пэйн', text:'Лист из [[Дневник Джоуэла Пэйна|дневника Джоуэла Пэйна]]. Персонаж знает один из четырёх ритуалов Джоуэла; какой именно, определяет бросок к4 при создании. Некоторые ритуалы требуют определённой дисциплины. За страницами охотится ячейка Анархов из клана [[Носферату]], которую возглавляет [[Дэвид Палумбо]].'},
     {name:'Кольцо', tag:'Воробей', text:'[[Кольцо клуба Воробья]]. Пока оно на виду, Анархи принимают владельца за своего и относятся к нему как к собрату со Статусом 0. Тому, кто и так принадлежит к секте, оно даёт 1 дополнительную точку Статуса. При значении −2 или ниже реликвия не помогает. Камарилья изымает и уничтожает такие перстни, а за ношение ведёт на суд.'},
     {name:'Картина', tag:'Эва Сэймур', text:'[[Картина Эвы Сэймур]]. Человек, который смотрел на неё не меньше 18 секунд, до рассвета выполняет приказы владельца, если не пройдёт проверку Силы воли со сложностью 2. Действует только на людей, не больше чем на троих одновременно и один раз за ночь на каждого. Держать такие полотна Камарилья разрешает только примогенам. Такие полотна собирают [[Селена Василиу]] в Камарилье и [[Мэри Таунсвилл]] у Анархов.'}
   ]},
   {t:'Цена реликвии', text:'Игрок выбирает одну реликвию при создании персонажа. У каждой есть тот, кто хочет её заполучить или уничтожить, и для владельца он считается Недостатком «Противник» на 1 точку. У картины Противник приходит из чужой секты: для персонажа Камарильи это [[Мэри Таунсвилл]], для Анарха — [[Селена Василиу]]. Дополнительных точек за этот Недостаток персонаж не получает.\n\nЕсли реликвию украдут или уничтожат, точка четвёртой ступени исчезает.'},
   {t:'Пепел Анархов', text:'Все урны хранятся в одном месте, и владелец пятой ступени знает, где именно.'},
   {t:'Известные носители', text:'[[Геката]] и [[Селена Василиу]] обладают пятой ступенью.'}

 {id:'hecate-war', name:'Война Гекаты', year:1784,
  short:'Ночь на 25 ноября 1784 года: Геката в одиночку вырезала три анархические ячейки и стала Княгиней Нью-Йорка',
  tags:['Геката','Анархи','урны','Джоуэл Пэйн','Эва Сэймур','Воробей','Кровавые залы','Совет примогенов'],
  concept:[
   ['Когда','Ночь на 25 ноября 1784 года — ровно через год после того, как город покинули британцы'],

   ['Итог','Анархи уничтожены, пятеро присягнули Камарилье; Геката — Княгиня, наутро — первый Совет примогенов'],
   ['Название','Так войну прозвали следующие поколения: по сути, её вёл один вампир']
  ],
  blocks:[
   {t:'Город Анархов', text:'Анархи приплыли в Америку вместе с революционерами и расправились с немногими Камарильцами, которые прибыли тем же путём. Город поделили между собой три ячейки, примерно по пятнадцать вампиров в каждой. У каждой был свой глава и своя территория, и пока никто не лез на чужую, в городе держался мир.'},
   {t:'Три ячейки', cards:[
     {name:'Джоуэл Пэйн', tag:'Тремер · Южный округ', text:'Могущественный Тремер-доминатор, безумный и жадный до денег. Торговал обращением в гулей и искал в магии коренных американцев новые пути для магии Тремер. Жил в небольшом особняке в Южном округе, где держал библиотеку и лабораторию.'},
     {name:'Эва Сэймур', tag:'Малкавиан · округ Монтгомери', text:'В Старом Свете была художницей и представительницей древнейшей профессии. Уплыла в Новый Свет с группой единомышленниц, надеясь освободиться от гнёта Камарильи. Страдала шизофренией со зрительными галлюцинациями. Свои видения она писала на холсте и вывешивала в небольшой галерее при убежище. На [[Картина Эвы Сэймур|картины]] сходились зеваки, которыми кормилась ячейка.'},
     {name:'Воробей', tag:'Вентру · Внешний округ', text:'Держал небольшой джентльменский клуб, под которым скрывалось логово его ячейки. Покинув Старый Свет, стал скрывать своё настоящее имя. С Гекатой его ничего не связывало, хотя оба они из одного клана. Тем, кого он признавал своими союзниками, он вручал [[Кольцо клуба Воробья|золотое кольцо]], которое служило пропуском в клуб.'}
   ]},
   {t:'Посланница Афин', text:'[[Геката]] прибыла в город как агент Афинской Камарильи. В Афинах с самого начала решили, что она станет здешней Княгиней. По легенде, она пришла совершенно одна.'},
   {t:'Одна ночь', text:'Геката вырезала все три ячейки за одну кровопролитную ночь. Анархи не успели даже собрать силы, так что вся война свелась к одному сражению.\n\nПервой пала Эва Сэймур, вторым — [[Джоуэл Пэйн]], последним — Воробей. Джоуэл натравил на Гекату десяток своих гулей, а потом попытался подчинить её Доминированием, но её воля оказалась сильнее. Она только улыбнулась и размозжила ему голову о ближайшую стену.\n\nВсех троих она убила голыми руками, одной грубой силой.'},
   {t:'Рассвет', text:'На рассвете Геката вынесла всех трёх лидеров под солнце во Внешнем округе. Где именно это произошло, неизвестно.'},
   {t:'Присягнувшие', text:'Казни избежали пятеро из сорока пяти Анархов: трое Малкавиан и двое Тремер. Они сдались без боя, отреклись от прежних идеалов и присягнули Камарилье. Всем пятерым дали маски, поэтому даже среди вампиров мало кто знает, кем они были раньше. Возможно, кто-то из них жив до сих пор, но не афиширует этого.\n\nОба Тремер были потомками и учениками Джоуэла Пэйна. Принося присягу, они отказались от его еретического учения и позволили стереть себе память о нём. Стирала её сама Геката, и восстановить эту память невозможно.\n\nВсё, что сегодня известно о той ночи, рассказали эти пятеро. От них же известно, что с лидерами Геката расправилась голыми руками.'},
   {t:'Первый Совет', text:'Наутро в город прибыли агенты Афинской Камарильи. Из них собрали первый Совет примогенов: по одному представителю от семи крупных кланов — Бруха, Гангрел, Тореадор, Малкавиан, Носферату, Тремер и Вентру.\n\nПримогены Тремер, Бруха, Гангрел, Малкавиан и Носферату пали позже, в 1835 году. Огонь [[Великий пожар|Великого пожара]] вышел из-под контроля, а следом Анархи ударили по «[[Эден|Эдену]]», и эти пятеро не пережили ни того, ни другого. Их места пустовали, пока клан заново не окреп в городе: у Тремер до 1900 года, у Носферату до 1975-го. Из первого Совета своё место до сих пор занимает только [[Селена Василиу]], которая представляет Тореадор с 1784 года. Она самая преданная Гекате из примогенов, ценит искусство и всегда одета с иголочки.'},
   {t:'Трофеи', text:'Имущество ячеек Геката передала Камарилье. Особняк Джоуэла и логово Эвы стали убежищами Камарильи, а подвал с лабораторией Джоуэла по приказу Гекаты замуровали. Клуб Воробья перестраивали около пятнадцати лет — так появился «[[Эден]]».\n\nНью-йоркские [[Картина Эвы Сэймур|картины Эвы]] тоже отошли Камарилье. Три из них сгорели на складе во время [[Великий пожар|Великого пожара]] 1835 года. Четыре хранятся у неё до сих пор, и одну держит у себя Селена Василиу.\n\nДневник Джоуэла Пэйна Камарилья признала еретическим и уничтожила, но [[Дневник Джоуэла Пэйна|его страницы]] до сих пор находят у Анархов. Они ценятся гораздо выше его золота.\n\n[[Кольцо клуба Воробья|Кольца]], которые носили вампиры ячейки Воробья и его гости, Камарилья до сих пор изымает и уничтожает.'},
   {t:'«Кровавые залы»', text:'Смертным властям та ночь оставила несколько громких дел, которые так и не были раскрыты: залы, залитые кровью, и при этом ни тел, ни орудий, ни отпечатков пальцев. Газеты прозвали их «Кровавыми залами».\n\nТой же зимой при загадочных обстоятельствах исчезли сразу несколько богатейших жителей Нью-Йорка.'},
   {t:'Память', text:'Камарильские вспоминают ту ночь как великую победу, а некоторые отмечают её годовщину: в «[[Эден]]», бывшем клубе Воробья, в этот день проходит закрытый приём. На него приглашают тех, кто обладает [[Наследие войны|Наследием войны]]. Для Анархов это дата траура.\n\nПрисягнувшие запомнили, что за всю ночь Геката улыбнулась только раз — перед тем как расправиться с Джоуэлом Пэйном. С тех пор её улыбка считается при Дворе дурным знаком.'},
   {t:'Урны', text:'Некоторые Анархи одержимы идеей найти урны с прахом старых Анархов Нью-Йорка и вывести их из торпора. Где хранятся урны, не знает никто.\n\nБольше всех этим занята группа [[Ева Хайнц|Евы Хайнц]]. Вторая глава её ячейки, Малкавианка [[Мэри Таунсвилл]], внушает Еве, что её имя не случайно так похоже на имя Эвы Сэймур и что это знак судьбы.\n\nЕсть и вторая группа — ячейка Анархов из клана [[Носферату]], которую возглавляет [[Дэвид Палумбо]]. Их интересует только урна [[Джоуэл Пэйн|Джоуэла Пэйна]]: они по страницам собирают его учение и хотят возродить и учение, и его самого. С группой Евы у них союз, и находками они делятся.'}

 {id:'boulder', name:'Джеймс Боулдер',

  clan:'Бруха', sect:'Анархи',

  blocks:[
   {t:'До Объятия', text:'Был правой рукой главы мафиозной семьи. Глава семьи тоже был Бруха, он и стал сиром Джеймса.'},
   {t:'Объятие и потеря сира', text:'Сир Джеймса был силён, но Камарилья казнила его за нарушение Маскарада ([[Казнь сира Джеймса]]). Прах казнённых она собирает в урны и хранит у себя, так что урна этого Бруха тоже где-то у неё. Джеймс убеждён, что дело было не в слабости: сира просто застали в неудачный момент и не дали времени исправить последствия. Виновной он считает [[Геката|Гекату]], которая правит городом и лично вынесла приговор. Эта казнь остаётся его главной личной травмой и одним из корней его ненависти ко всей секте.'},
   {t:'Браунсвилл — его империя', text:'Джеймс и есть преступность Браунсвилла. За десятилетия он подмял под себя все враждебные банды и не даёт появляться новым. От мафиозного прошлого у него остались методы: крышевание и легальные заведения для прикрытия. Клубы, бордели, кафе и магазины разбросаны по всей территории его угодий. Смертные видят в этом обычную организованную преступность и не подозревают о вампирах.\n\nРядовые под его началом считаются просто солдатами. Иерархии между ними нет, решает только грубая сила. Чуть ближе к нему стоят [[Могильщик]] и [[Майкл Коул]]. Их Джеймс уважает за исполнительность больше остальных, но за провал спросит с них так же, как с любого другого.'},
   {t:'Характер', text:'Пафосен и постоянно показывает окружающим своё силовое превосходство. Говорит уверенно, приказным тоном, будто все ему должны. Людей называет «мясом». По-настоящему своими считает только Анархов, которые, как и он, готовы погрузить мир в хаос.\n\nЛюбит сигареты и сигары. Держит собственные заведения для «джентльменских» развлечений вроде бильярда и боулинга. Это легальное прикрытие, а не место вербовки.'},
   {t:'Как он судит новообращённых', text:'Новообращённых выстраивают перед ним в шеренгу в баре «Мясорубка». Джеймс проходит вдоль строя. Любого, кто покажется ему недостойным, он убивает или выпивает досуха на месте.'},
   {t:'Что о нём рассказывают', text:'Один из его подчинённых не выполнил поручение и решил лично в этом признаться. Куски бедолаги до сих пор находят в самых дальних углах охотничьих угодий Джеймса.'},
   {t:'Ненависть и слабость', text:'Сильнее всего он ненавидит, когда ему указывают, что делать. Неподчинение и слабость выводят его из себя. Настоящая его уязвимость — собственная криминальная империя. Это главное достижение его посмертия, и любое вмешательство в его дела приводит его в ярость.'},
   {t:'Ракель Корнехо', text:'Личной истории между ними нет, их вражда чисто идейная. Её гуманизм Джеймс считает признаком слабости. Состоятельных Бруха в целом он называет слабаками, которые пытаются спасти куски мяса, сами просящиеся им в рот.\n\nОткрытой войны не будет, пока Камарилья серьёзно не ослабнет или не окажется на грани гибели. Джеймс знает, что вампиры есть и в других городах, и понимает, что открытого нарушения Маскарада ему не пережить.'},
   {t:'Полиция в Браунсвилле', text:'Попытки полиции вмешаться в его дела возмущают Джеймса до крайности. Любого полицейского, замеченного в Браунсвилле, убивают, а от тела избавляются так, чтобы не осталось следов. Пока это сходит ему с рук: власти связывают исчезновения с обычной преступностью, а не с вампирами. Но пропавших уже слишком много, и долго так продолжаться не может.'}

   {t:'Власть и манера', text:'Когда она говорит, все вокруг замолкают. Никто не смеет даже усомниться в её авторитете, и этой властью она с удовольствием упивается. Обычно она сама зовёт нужных ей вампиров на аудиенцию. Попасть к ней по приглашению, а не за проступок, считается огромной честью.\n\nОна знает себе цену и не скрывает этого. Сила и значимость видны в каждом её действии, но она показывает их без агрессии, элегантно, как нечто само собой разумеющееся.'},

   {t:'Ночи Княгини', text:'Управляет сетью бизнесов. Деньги у неё собственные: это накопления, которые она унаследовала из прошлых жизней. Легальным фасадом служат ночные клубы для людей, которые помешаны на вампирах. По ночам она обычно заключает сделки и ведёт переговоры с коллегами из Камарилий Европы, попивая вино, смешанное с кровью. Она любит театр и вообще всё, что относится к высокому искусству.'},
   {t:'Маскарад', text:'Для Гекаты Маскарад не просто закон. Это способ жизни, который поддерживает благополучие и людей, и вампиров.\n\nВторую Инквизицию она считает врагом, с которым нужно бороться. Но открытое противостояние невозможно, потому что само стало бы нарушением Маскарада. Поэтому она посылает агентов, которые срывают операции Инквизиции из тени и портят ей репутацию.'},
   {t:'Договор с Анархами', text:'В наши ночи повторить 1784 или 1835 год нельзя: резня или пожар такого размаха приведут в город Вторую Инквизицию. Поэтому между Гекатой и Анархами действует негласный договор. Они живут в отведённых им угодьях и подчиняются законам Камарильи, а она их не истребляет.'},

  blocks:[
   {t:'Объятие', text:'Её обратил [[Майкл Коул]], когда они встречались. Сейчас они расстались. [[Джеймс Боулдер]] знает, что Майкл её сир.\n\nРакель пришлось пройти смотр новообращённых в баре «[[Мясорубка]]», и она осталась жива. Как ей это удалось, неизвестно.'},
   {t:'Вторая ветка', text:'Ракель первой из Бруха, выросших в трущобах, выбилась в люди. Помог ей экоактивизм. Она лично основала вторую, состоятельную ветку клана.\n\nДжеймса такая наглость возмутила, но дальше слов дело не пошло. Ракель заявила, что выходит из-под его власти и переходит под власть [[Геката|Гекаты]]. По законам Камарильи нападение на сородича, который тебе не подвластен, карается казнью. Джеймс и его люди в Камарилью не входят, но её законам подчиняться обязаны.'},
   {t:'Характер', text:'Обычно спокойна и открыта, всегда энергична и жизнерадостна. Она прислушивается к чужим идеям и любит от них отталкиваться: задумки сородичей она старается превратить во что-то полезное для человечества.\n\nСпокойствие изменяет ей, когда она видит наплевательское отношение к природе и людям. Какой-то одной главной заботы у неё нет, но экологические проблемы Земли занимают её постоянно. Сильнее всего её задевает всё, что наносит большой вред экологии планеты. Этого она не скрывает.'},
   {t:'Активизм', text:'Активизм для неё основная работа. Ракель держит собственный форум, где собралось около двух миллионов экоактивистов со всего мира. Письма и общение на форуме занимают около 80% её ночей. Остальное время уходит на дела её половины клана и на жизнь Камарильи.\n\nИногда она выступает с публичными речами. Делает она это в закрытых помещениях и только после заката.\n\nВсё держится на пожертвованиях и на её общественной значимости. Деньги идут на её проекты и идеи и совсем немного на личные нужды.'},
   {t:'Маскарад и кормление', text:'Маскарад для неё один из главных принципов: без него невозможно спокойно вести человечество к лучшему будущему. Ракель часто бывает на публике и попадает на фотографии. Чтобы никто не заметил, что она не стареет, она меняет внешность гримом и косметикой.\n\nСама она питается только донорской кровью в пакетах. Для неё важен каждый человек, поэтому участникам её ветки запрещено кормиться от тех, кто не дал согласия.'},
   {t:'Кого она обращает', text:'Лично она обращает только тех активистов, которые ярко себя проявили и, по её мнению, важны для выживания человечества. Обычных людей она не обращает.\n\nСлучайных новообращённых она изгоняет и передаёт [[Джеймс Боулдер|Джеймсу]]. Она в принципе против того, чтобы пить кровь у первого попавшегося человека, а тем более против незапланированного Объятия.'},
   {t:'Сила', text:'Её сильные дисциплины — Присутствие и Стремительность, но развиты они сравнительно невысоко.'},
   {t:'При Дворе', text:'В [[Геката|Гекате]] она видит отличного лидера и надёжного соратника и благодарна ей за место в Совете примогенов. В клубе «[[Эден]]» бывает только по делам Двора.\n\nДвор в целом посмеивается над её наивностью, но в лицо ей этого никто не говорит. Представители [[Малкавиан]] и [[Тореадор]] её жалеют, а представители [[Гангрел]] и [[Носферату]] недолюбливают.'},

   {t:'Служба', text:'Хранителем Элизиума она служит уже около 50 лет. Отчитывается она перед Советом примогенов в целом и перед Адамом Сэндлером в частности. [[Геката|Гекату]] считает выдающимся лидером, который действительно заботится о людях.\n\nС кланами [[Бруха]], [[Носферату]] и [[Гангрел]] отношения у неё напряжённые. Это неприязнь к кланам в целом, потому что именно их представители чаще всего устраивают неприятности в клубе.'},
   {t:'Как она держит порядок', text:'Порядок она держит авторитетом и угрозами. Если слова не помогают, в ход идёт магия. Чаще всего это «Касание скорпиона», которое вызывает боль и утихомиривает агрессивного сородича.\n\nСмертные завсегдатаи считают это частью шоу. Она касается «актёра-вампира», его вены по всему телу слегка подсвечиваются, и он «изображает» боль.'},
   {t:'Папка с бумагами', text:'С папкой она почти не расстаётся. Среди бумаг спрятано несколько заранее заготовленных заклятий.'},
   {t:'Характер', text:'Ведёт себя сварливо, и многие принимают это за стервозность. Это не маска, такой у неё характер. Кейт по природе интроверт и недолюбливает общество.\n\nС примогенами она почтительна и не грубит. С равными и с теми, кто ниже по статусу, раздражения не сдерживает. Снисходительнее, чем к остальным, она относится только к нескольким своим гулям-охранникам.'},
   {t:'Магия', text:'Кейт интересует вся [[Магия крови|магия крови]], и она пытается постичь её целиком. Её цель — стать величайшим магом-вампиром в городе. Она собирает все древние тексты и магические артефакты, какие может достать, и постоянно что-то изучает. Свободное время она чаще всего проводит за книгами.\n\nУчеников она не берёт и всё держит при себе. Её главный соперник на пути к званию сильнейшего — [[Йоган Курт]], маг из клана Носферату.'},

   {t:'Характер', text:'Аристократичен до старомодности. Крайне консервативен, не признаёт ничего нового и славится снобизмом.\n\nИерархию он считает лучшей формой правления: младшие должны подчиняться старшим и не задирать головы. Пока у [[Геката|Гекаты]] есть власть и сила, он подчиняется её воле.'},
   {t:'Магия', text:'Силён в [[Магия крови|магии крови]] и [[Анимализм|анимализме]]. [[Кейт Флэмор]] изучает всё без разбора, а он намеренно углубляет то, что уже знает, и за новое не берётся. У него два главных направления: усиление людского резонанса и влияние на зверей.\n\nЕго почерк узнают по техникам анимализма «Усмирить зверя» и «Пробуждение паразита». В угодьях Чарльза можно встретить множество очарованных грейхаундов. Днём они стерегут сон клана в подземельях замка, а ночью гуляют по парку.'},
   {t:'Соперничество с Кейт Флэмор', text:'Соперничество тянется с тех пор, как он приехал в город в 1975 году ([[Прибытие Чарльза Уилфорда]]). Прямого противостояния между ними нет, они соперничают за статус. Каждый хочет, чтобы вампирское общество считало более опытным и сильным именно его. Йоган на неё не нападает. Он просто показывает своё превосходство заметными проявлениями магии, чаще всего на закрытых приёмах в «Эдене».\n\nВ основе лежат борьба за звание сильнейшего мага и его пренебрежение к более молодому вампиру. Клан [[Тремер]] он вообще недолюбливает. По его мнению, талант к магии достаётся им почти без усилий, а ему пришлось его заслужить.'},

  blocks:[
   {t:'Семья Треволли', text:'При жизни он был целеустремлённым и беспринципным человеком мафиозной семьи Дона Треволли. Занимался в основном выбиванием долгов и доставкой грузов. В 1900 году Дон обращал свою семью и обратил его как верного участника группировки. Адаму тогда было около тридцати. Так он вошёл в клан Тремер.\n\nСемья Треволли была второй по силе мафиозной семьёй Нью-Йорка. К концу 90-х многих её участников арестовали после масштабного рейда ([[Рейд на семью Треволли]]). Самого Дона найти так и не удалось: полиция не знала, что он давно в Риме. Банды больше не существует. Адам подозревает, что рейд устроили по наводке [[Джеймс Боулдер|Джеймса Боулдера]].'},
   {t:'Наследник места в Совете', text:'В 1920 году Дон Треволли уехал в Римскую Камарилью и оставил своё место в Совете примогенов Адаму, старшему из своих потомков. Если Дон вернётся, он по праву займёт это место снова.\n\nУ Адама есть свои потомки. Среди них [[Кейт Флэмор]], Хранитель Элизиума, и [[Коул Бренан]]. Был ещё [[Джаред Трелли]]. В 1995 году Камарилья казнила его ([[Казнь Джареда Трелли]]). Он обратил [[Ева Хайнц|Еву Хайнц]], а она основала анархическую ячейку Тремер и возглавляет её до сих пор. За дела потомка отвечает сир, поэтому спросили с него самого.'},
   {t:'При Дворе', text:'Держится весело, но по-джентльменски. Он вежлив и немного насмешлив, любит шутки и не боится чёрного юмора. Шутить он перестаёт, только когда дела действительно плохи. Над старшими по званию, то есть над [[Геката|Гекатой]] и Доном, он не шутит никогда.\n\nПри Дворе его считают легкомысленным и лёгким на подъём. В общем-то, так он себя и ведёт.'},
   {t:'Галантность', text:'Иногда он делает вид, что ухаживает за дамами из Совета, например за [[Ракель Корнехо]]. Для него это игра с равными и обычная джентльменская вежливость: открыть даме дверь, заказать ей коктейль, пока примогены ждут приглашения.'},
   {t:'Совет и Геката', text:'К Гекате он относится с уважением, а к остальным членам Совета как к равным. Раз глава Камарильи поставила их на один уровень, значит, так оно и есть. Тем, как сейчас устроены дела, он вполне доволен.'},
   {t:'Крепость Тремер', text:'Логово клана — [[Нью-Йоркская публичная библиотека]]. Через её служебные помещения можно попасть в жилые помещения клана и в тайные секции, где хранятся книги о магии и ритуалах.\n\nПостоянных жителей там почти нет. Это скорее бесплатный мотель для любого Тремер, который вмещает до 100 гостей одновременно. По официальной версии все они числятся стажёрами библиотеки. Подробнее об этом рассказано в заметке клана [[Тремер]].'},
   {t:'Чего он добивается', text:'Он отстаивает интересы клана и бережёт его крепость. Адам считает, что Тремер должны продолжать древние традиции и хранить знания о магии и о мире в целом. Эту традицию он поддерживает всеми способами: расширяет коллекцию библиотеки и сохраняет знания человечества.\n\nМолодые Тремер, по его мнению, слишком полагаются на современные технологии. Сам он предпочитает бумагу цифре и пытается привить это младшим в клане.'},
   {t:'Руками других', text:'Действовать сам он не любит. Любую работу он поручает подручным или своей правой руке, [[Коул Бренан|Коулу Бренану]].\n\nЕсли колдовать всё-таки приходится ему самому, в пачке сигар у него лежит несколько свёртков с заранее заготовленными заклятьями. Заготавливает их для него Кейт.'},
   {t:'Наследие Джоуэла Пэйна', text:'[[Джоуэл Пэйн]] возглавлял прежних Тремер города, и его учение признано еретическим. Адам считает, что это наследие всё равно нужно сохранить. Доступ к нему, по его мнению, должны получать только высшие чины Камарильи, Княгиня и приезжие гости с её разрешения. Он несколько раз предлагал перенести оставшиеся записи в свой архив и каждый раз получал отказ.'},
   {t:'Кейт Флэмор', text:'С ней он ведёт себя скорее по-отцовски. Он знает о её планах и амбициях, не мешает им, а иногда даже помогает.\n\nЗа соперничеством Кейт с [[Йоган Курт|Йоганом Куртом]] он только наблюдает и не вмешивается. При этом он убеждён, что маг из Носферату никогда не станет искуснее мага из Тремер, и внушает это Кейт.'},
   {t:'Где его найти', text:'Почти каждый вечер он проводит в клубе «[[Эден]]», всегда в VIP-зоне. Там он выпивает, разглядывает посетителей и охотно болтает с любым желающим, особенно с дамами. В остальное время его можно найти в крепости клана.\n\nОн открыт для любого разговора, пока собеседник не переходит границ приличия, не хамит и не делает вид, будто имеет над ним какую-то власть.'}
  ],
  ties:[
   '[[Дон Треволли]] — его сир и бывший глава семьи. Адам занимает его место в Совете и уступит его, если Дон вернётся из Римской Камарильи',
   '[[Кейт Флэмор]] — его потомок, Хранитель Элизиума. Адам относится к ней по-отцовски, знает о её амбициях и иногда помогает',
   '[[Коул Бренан]] — его потомок и правая рука: секретарь, шофёр и маг',

   '[[Джоуэл Пэйн]] — павший глава прежних Тремер города; Адам хочет сохранить его наследие в своём архиве, но получает отказ',

 {id:'brennan', name:'Коул Бренан',
  short:'Секретарь, шофёр и правая рука Адама Сэндлера. Холодный педантичный маг, который всегда рядом со своим сиром',
  tags:['секретарь','шофёр','правая рука','маг','история','библиотека','Раскопать секреты'],
  img:'images/brennan.jpg',
  clan:'Тремер', sect:'Камарилья', role:'Секретарь и правая рука примогена Тремер', sire:'Адам Сэндлер', gen:10,
  concept:[
   ['На посмертии','Около 20 лет, на вид ему 25–30. Обращён в XXI веке'],
   ['Поколение','10-е, как и у [[Кейт Флэмор]]'],
   ['При Адаме','Секретарь, шофёр и маг. Стал правой рукой [[Адам Сэндлер|Адама Сэндлера]] после пяти лет службы'],
   ['Логово','[[Нью-Йоркская публичная библиотека]], комната рядом с покоями Адама'],
   ['Облик','Короткие каштановые волосы, веснушки, тёмная одежда. От него веет холодом и педантичностью']

  blocks:[
   {t:'Объятие', text:'Родился и вырос в Нью-Йорке. Выучился на экономиста и пытался работать по специальности. Однажды вечером, во время прогулки, его прямо на улице, в переходе, обратил [[Адам Сэндлер]], который почувствовал в нём магическую родословную.\n\nВсех прежних друзей из человеческой жизни Коул потерял, поэтому единственным настоящим другом считает сира.'},
   {t:'Служба', text:'Правой рукой Адама он стал после пяти лет службы в клане. Он составляет расписание, планирует маршруты, водит машину, изучает магию крови и при необходимости её применяет.\n\nРасписание Адама он строит педантично, с точностью до минуты. Машины меняет каждые пять лет и выбирает неприметные, как у большинства обывателей. Оружия он не носит, но обучен самообороне, чтобы защитить себя и сира. Сейчас он ездит на неприметном сером седане. В багажнике лежит набор для ночных «раскопок»: лопата, фонарь и перчатки.\n\nОн всегда рядом с Адамом.'},
   {t:'Характер', text:'Серьёзный и собранный, к любой ситуации подходит с холодным расчётом. Он интроверт и склонен не доверять незнакомцам. Говорит официально и сдержанно, сухо и по делу.\n\nЛюдям, которые с ним встречаются, рядом с ним становится скорее страшно, чем спокойно. Холодность у него осталась ещё со смертных лет. Молодого экономиста, который пытался работать по специальности, никто не принимал всерьёз, и сдержанность стала его защитой задолго до Объятия.'},
   {t:'Магия', text:'Опытный маг с высокой силой крови. Его сильнейшая на сегодня техника называется «Раскопать секреты». Коул делает порез на пальце и мазком своей крови помечает предмет, после чего узнаёт всё, что когда-либо было о нём написано. Техника действует только на вещи, но не на людей.\n\nКогда Адам поручает ему сотворить конкретное заклинание или воспользоваться свитком, Коул думает, что сир просто не хочет зря тратить свои силы.'},
   {t:'Кормление', text:'По типу хищника Коул относится к расхитителям могил. Для этого он и возит в багажнике набор для ночных «раскопок».'},
   {t:'История людей', text:'В редкие свободные минуты он изучает историю во всех её проявлениях и с головой уходит в каждую книгу, какую может найти. Ему нравится, что больше не нужно работать «по-людски» и можно посвятить себя служению сиру и изучению людской истории, а заодно тому, как в неё вписано вампирское общество.\n\nОтдельная его задача — искать в документах следы вмешательства вампиров в людские события, чтобы найти их раньше Инквизиции, то есть [[орден Святого Леопольда|ордена Святого Леопольда]]. Упоминания, найденные в открытых документах, он подчищает, но только в бумажных источниках и только в Нью-Йоркской публичной библиотеке.'},
   {t:'Отношения с Адамом', text:'Он обращается к сиру «мистер Сэндлер». Коул предан ему, глубоко его уважает и благодарен за то, что Адам вырвал его из рутины. Сам Адам общается с ним как с секретарём: сдержанно и без шуток.'},
   {t:'При Дворе', text:'Политические игры вампиров ему безразличны. Он просто исполняет то, о чём просит сир, и старается делать это как можно лучше. По просьбе Адама [[Геката]] разрешила ему присутствовать на заседаниях Совета за спиной сира. После заседаний Коул обсуждает их с Адамом наедине и предлагает идеи для следующего.'},
   {t:'С другими Тремер', text:'К остальным Тремер в библиотеке он относится ровно: не принижает их, не заискивает и общается как с равными. С [[Кейт Флэмор|Кейт]] у него только рабочие отношения. Знания нужны им обоим, но разные: Кейт интересует магия, а его история. Области их изучения не пересекаются, а сама она для него один из важных контактов сира.'},
   {t:'Гости Адама', text:'Он считает, что люди не приходят просто так: у каждого есть личные мотивы и желание нажиться на других. Недоверия он не показывает, а подозрения обсуждает с сиром наедине, когда гости уйдут. Адам обычно отмахивается и отшучивается. Без прямого указания сира Коул мешать гостям не станет.'},
   {t:'Претендент', text:'Хранитель библиотеки [[Питер Лин]], Тремер 11-го поколения, считает, что место правой руки Адама должно принадлежать ему. Коулу это безразлично, как и вся политика, и поэтому он не видит в сопернике угрозы.'}

 {id:'payne', name:'Джоуэл Пэйн', dead:true,
  short:'Глава анархической ячейки Тремер, павший в Войне Гекаты. Безумный старик-торговец, чей дневник объявлен ересью',

  concept:[
   ['Годы','Обращён в 1203 году, пал в ночь на 25 ноября 1784 года. На посмертии провёл около 580 лет'],

  blocks:[
   {t:'До Объятия', text:'Родом из Англии. При жизни был торговцем и мошенником и всерьёз увлекался эзотерикой.'},
   {t:'Ссора с Камарильей', text:'Камарилья запрещала напрямую продавать обычным людям то, что доступно вампиру. Джоуэл за деньги обращал людей в гулей, и за это его преследовали.\n\nЕго имя стало нарицательным. Когда вампир берёт со смертных деньги за дар крови, старые сородичи до сих пор говорят о нём: «Торгует, как Пэйн».'},
   {t:'Новый Свет', text:'В Америку он приплыл вместе с революционерами. Ему нужна была свобода от Камарильи, но ещё больше его интересовали магические практики коренного населения. Знания у коренных жителей он добывал Доминированием и торговлей, которая обычно была выгодна ему, а не им.'},
   {t:'Ячейка', text:'В ячейке было около пятнадцати Тремер, и всех объединяла одна идея: с помощью магии коренных американцев найти для магии Тремер новые направления и применения. Джоуэл был их идейным лидером.\n\nДвое из ячейки, его потомки и ученики, в ночь войны присягнули Камарилье. Они отказались от его учения и позволили стереть себе память о нём. Стирала её сама [[Геката]], и восстановить эту память невозможно.'},
   {t:'Характер', text:'Глубокий старик, одержимый безумной идеей и жадный до денег. Он постоянно потирал руки и говорил слегка возбуждённо, будто всё время чего-то ждал.\n\nДва других главы, [[Эва Сэймур]] и [[Воробей]], его мало волновали. Пока они не мешали его исследованиям, он о них не думал.\n\nВоробей прислал ему [[Кольцо клуба Воробья|кольцо-приглашение]] в свой клуб в знак того, что признаёт его товарищем по делу Анархов. Джоуэл его носил, но в клуб так ни разу и не пришёл. После его падения перстень отправили в сокровищницу клуба «[[Эден]]», и там ли он сейчас, неизвестно.'},
   {t:'Дело', text:'Зарабатывал торговлей, мошенничеством и продажей магических услуг. К нему шли в основном богатые горожане, которые хотели научиться колдовать или жить вечно, и солдаты, которым нужны были силы перед сражением.'},
   {t:'Сила', text:'Могущественный доминатор. Его главной техникой считается «Манипулирование массами»: она позволяла держать под контролем до десяти человек одновременно.\n\nХодят слухи, что его гули умели колдовать.'},
   {t:'Изыскания', text:'Он искал способы развить магию вампиров, и что-то у него, судя по всему, получилось: его дневник и все копии дневника считаются еретическими.\n\nОн похищал обычных жителей и ставил на них опыты. Цель этих опытов Камарилья засекретила и признала еретической.'},
   {t:'Особняк', text:'В особняке были библиотека, лаборатория и небольшое жилое помещение, где могла проводить день вся ячейка. Сейчас это убежище Камарильи, а подвал с лабораторией замурован по приказу Гекаты.'},
   {t:'Падение', text:'В ночь [[Война Гекаты|Войны Гекаты]] он пал вторым. Когда [[Геката]] вошла в его логово, он натравил на неё десяток своих гулей, а потом попытался подчинить её Доминированием. Она только улыбнулась и размозжила ему голову о ближайшую стену. На рассвете его вместе с двумя другими лидерами вынесли под солнце.\n\nПрисягнувшие запомнили, что за всю ночь она улыбнулась только раз. С тех пор её улыбка считается при Дворе дурным знаком.'},
   {t:'Дневник', text:'Своё учение он записывал в кожаный фолиант, в котором было около 250 страниц ([[Дневник Джоуэла Пэйна]]). Камарилья признала эти записи еретическими и уничтожила, но страницы его изысканий до сих пор время от времени находят у Анархов.\n\nСтраницу легко узнать. Это пожелтевшая, потёртая от времени бумага с чёрной ажурной рамкой по краю. Текст написан кровью на древнеанглийском. Встречаются и подделки, которые продают доверчивым.\n\nНайденные страницы Камарилья отбирает, а их владельца отдаёт под суд.'},

var ITEMS=[
 {id:'sparrow-ring', name:'Кольцо клуба Воробья',
  short:'Золотой перстень с рубином, которым Воробей отмечал тех, кого признавал Анархами. Пропуск в его клуб и знак старых Анархов Нью-Йорка',
  tags:['реликвия','Воробей','Анархи','Война Гекаты','Статус','перстень','рубин','аукцион'],
  img:'images/sparrow-ring.jpg',
  concept:[
   ['Облик','Массивный золотой перстень с прямоугольным рубином и ребристыми боками. Все кольца клуба выглядят одинаково'],
   ['Знак','На внутренней стороне, под камнем, выгравирована птица — воробей'],
   ['Происхождение','Джентльменский клуб Воробья во Внешнем округе, до 1784 года'],
   ['Сколько их','Изготовили около 35 колец. До наших дней уцелело около 15'],
   ['Эффект','Анархи принимают владельца за своего и относятся к нему как к собрату со Статусом 0. Тому, кто и так принадлежит к секте, кольцо даёт 1 дополнительную точку Статуса'],
   ['Цена','2 точки Ресурсов. Покупка снижает Ресурсы на эту величину до конца текущей истории, продажа на тот же срок их повышает']

  blocks:[
   {t:'Кольцо-приглашение', text:'Кольцо служило пропуском в клуб Воробья. Тот, кто его носил, входил туда как гость. Воробей вручал кольца всем Анархам, которых признавал своими союзниками, а пятнадцать вампиров его собственной ячейки носили точно такие же.\n\nВсего колец было около 35. Получить такое кольцо значило быть признанным Анархом.'},
   {t:'Кому их вручали', text:'[[Джоуэл Пэйн]] получил кольцо как знак того, что Воробей признаёт его товарищем по делу Анархов. Джоуэл носил его на правой руке, но в клуб по этому приглашению так ни разу и не пришёл. После его падения перстень отправили в сокровищницу клуба «[[Эден]]». Там ли он до сих пор, неизвестно. Тех, кто собирает страницы его дневника, эта вещь не интересует.\n\n[[Эва Сэймур]] кольца не получила. У некоторых участниц её ячейки они были.'},
   {t:'Кольцо самого Воробья', text:'[[Воробей]] носил такое же кольцо, и с виду оно ничем не отличалось от остальных. По слухам, рубин в нём был фальшивым. Будто бы на самом деле это стеклянный сосуд, в котором хранилось немного крови Каина, а тот, кто её выпьет, на короткое время получит невероятную силу.'},
   {t:'Как кольца разошлись', text:'После [[Война Гекаты|Войны Гекаты]] клуб перестроили в «[[Эден]]». Часть колец выкрали. Другие нашли в личных домах тех, кто их носил, уже после гибели владельцев. Новые экземпляры до сих пор изредка всплывают на аукционах смертных: кто-нибудь находит кольцо на чердаке и выставляет на торги как старинную драгоценность.\n\nИз-за слуха о кольце Воробья некоторые уцелевшие кольца попадаются с выбитым или заменённым камнем. Кто-то уже проверял, не стекло ли это.'},
   {t:'Что оно даёт', text:'Силы в кольце нет. Его действие держится на уважении Анархов к собственной истории: кольцо буквально означает, что его владельца признали Анархом.\n\nЕго нужно носить на виду. Тогда Анархи принимают владельца за своего и относятся к нему как к собрату со Статусом 0, даже если хорошо знают, что он из Камарильи. Тому, кто и так принадлежит к секте, кольцо даёт 1 дополнительную точку Статуса в ней.\n\nКольцо не спасает того, чья репутация среди Анархов уже испорчена. При Статусе −2 или ниже своим его всё равно не считают, а кольцо на его руке только вызывает вопросы.\n\nКольцо с выбитым или заменённым камнем Анархи признают так же, как целое.'},
   {t:'Подделки', text:'Подделать кольцо можно, но фальшивки встречаются редко. Если Анархи сомневаются, они просят снять перстень и показать гравировку под камнем. Отказ считается признанием в обмане.'},
   {t:'Закон Камарильи', text:'Носить символы Анархов по законам Камарильи запрещено. Вампира, который появился с таким кольцом при Дворе, сразу хватают и ведут на суд. Если найдутся другие доказательства его анархических дел, его накажут в соответствии с ними.\n\nСами кольца Камарилья изымает и уничтожает как имущество Анархов.'},
   {t:'Аукционы', text:'Когда кольцо всплывает на аукционе, им обычно интересуются сразу обе стороны, и Камарилья, и Анархи. Кольцо стоит 2 точки Ресурсов. У покупателя Ресурсы снижаются на 2 до конца текущей истории, у продавца на тот же срок повышаются на 2. Потом уровень возвращается к прежнему.\n\nПродавец расплачивается репутацией. Он получает −2 к Статусу у той стороны, которой кольцо не досталось. Если кольцо купил смертный, продавец получает −1 к Статусу у обеих сторон.'},
   {t:'Среди Анархов сегодня', text:'Намеренно кольца никто не разыскивает, но среди Анархов они считаются ценной и уважаемой реликвией.'}

 {id:'seymour-painting', name:'Картина Эвы Сэймур',
  short:'Полотно главы анархической ячейки Малкавиан. Она писала свои видения, и смертный, который засмотрится на такую картину, до рассвета подчиняется её владельцу',

  img:'images/seymour-painting.jpg',
  concept:[
   ['Автор','[[Эва Сэймур]], глава ячейки Малкавиан в округе Монтгомери'],
   ['Сюжет','Красно-чёрное небо, закрученное воронкой вокруг чёрного солнца, и город высоких башен под ним'],
   ['Сколько их','За всю жизнь Эва написала около 50 картин, из них 12 в Нью-Йорке'],
   ['Эффект','Человек, который смотрел на полотно не меньше 18 секунд, до рассвета выполняет приказы владельца. Избежать этого позволяет проверка Силы воли со сложностью 2'],
   ['Предел','Только люди, не больше троих одновременно и не чаще одного раза за ночь на каждого'],
   ['Цена','4 точки Ресурсов. Покупка снижает Ресурсы на эту величину до конца текущей истории, продажа на тот же срок их повышает']
  ],
  blocks:[
   {t:'Что на них изображено', text:'Эва писала видения, которые приходили к ней во время шизофренических припадков. Она уверяла, что это тёмное будущее и что его пророчат всем древние сущности в её голове.\n\nВсе её полотна выполнены в одной манере. Небо на них закручено в воронку, а под ним стоит город, каких в её время ещё не строили.'},
   {t:'Откуда в них сила', text:'Сила картин идёт от безумия Эвы и от дисциплин клана [[Малкавиан]]. Подчиняют те работы, на которых есть воронка. Она есть почти на всех, а на нью-йоркских на каждой.'},
   {t:'Галерея Эвы', text:'Эва писала, чтобы выразить свои видения, и вывешивала готовые работы в небольшой галерее при своём убежище. Туда сходились зеваки, которыми потом кормилась её ячейка.\n\nСейчас в этом доме убежище Камарильи. Сам зал сохранился. Картины из него вывезли, но крюки и выцветшие прямоугольники на стенах остались.'},
   {t:'Как она подчиняет', text:'Человеку нужно смотреть на полотно не меньше 18 секунд. В этот момент он проходит проверку Силы воли со сложностью 2. Если проверка провалена, до рассвета он будет выполнять приказы владельца.\n\nКартина держит не больше троих одновременно. Четвёртый зритель, который начал смотреть последним, избежит её действия, если ни один из первых троих не устоял. На одного человека она действует один раз за ночь: если он устоял, до следующего заката полотно над ним не властно. В другую ночь попытку можно повторить.\n\nПриказ, который грозит жизни подчинённого, даёт ему новую проверку Силы воли со сложностью 2. Если она удалась, человек освобождается.\n\nПосле рассвета человек помнит эту ночь обрывками, как после тяжёлого похмелья. Поэтому владельцы обычно заканчивают ночь приказом напиться и лечь спать: утром провалы в памяти легко списать на выпивку.'},
   {t:'Кто считается владельцем', text:'Подчинённый слушается того, кому картина принадлежала в момент подчинения. Если ночью она сменит хозяина, человек всё равно останется при прежнем.\n\nПолучить права на неё можно двумя способами. Первый — документ о праве собственности, подписанный кровью. Второй — провести рядом с полотном больше 12 часов подряд, при условии что прежний владелец за это время к нему не приблизится.'},
   {t:'Вампиры и гули', text:'На вампиров и гулей картина не действует. Глядя на неё, они чувствуют ужас, а Малкавиан — благоговение. Это только ощущение, проверок оно не требует.'},

   {t:'Судьба картин', text:'Около 38 работ Эва написала ещё в Старом Свете, и они остались в Европе. Тамошние Камарильи по возможности разыскивают их и прячут.\n\nИз двенадцати нью-йоркских полотен после [[Война Гекаты|Войны Гекаты]] часть досталась Камарилье. Три сгорели в 1835 году, когда [[Великий пожар]] добрался до одного из её складов. Четыре хранятся у неё до сих пор, и одно из них держит у себя [[Селена Василиу]]. Судьба ещё пяти неизвестна.'},
