   {t:'Кто решает', text:'Доступ к закрытой информации для вампирского сообщества определяют примоген и хранитель библиотеки — [[Питер Лин]].'},
   {t:'Принятие в клан', text:'Кого принять, решает лично примоген — по родословной: [[Адам Сэндлер|Адам]] пробует кровь обращённого техникой Магии крови «Вкус крови». Новый участник получает амулет и беспрепятственный доступ в библиотеку. Учат не конкретные наставники: принятым дают доступ к книгам и право их изучать и практиковать в залах. Количество Объятий не контролируется.\n\nВсе Тремер могут углублённо изучать три клановые дисциплины — Прорицание, Магию крови и Доминирование, — а четвёртую по желанию перенять у другого клана. Обязательной техники, которую знали бы все, нет.'},
   {t:'Непризнанные', text:'Если достаточного магического потенциала в обращённом нет, примоген не признаёт его родословную — такие Тремер официально зовутся Непризнанными. Их около 30. Им позволено жить в библиотеке и помогать клану с человеческой работой — сортировать книги, убираться, — но к делам клана и знаниям о магии их не допускают.\n\nЖизнь Непризнанных близка к людской. Их не выдворяют наружу, они под личной защитой примогена, и тронуть их никто не смеет. За работу им платят кровью в пакетах, чтобы усмирять голод, — пакеты клан получает через связи [[Вентру]].'},
   {t:'Анархическая ячейка', text:'Анархи-Тремер и их союзники из [[Малкавиан]] считают, что магическая сила должна быть доступна только тем кланам, чья кровь к этому располагает, — важен именно клан, а не то, какая родословная была у человека до посмертия. Книги, по которым другие кланы могут изучать те же знания, должны быть уничтожены. На счету ячейки поджоги, кражи и порча книг — в том числе в самой библиотеке. Больше всего [[Адам Сэндлер|Адам]] боится, что однажды они подожгут библиотеку целиком и весь архив сгорит.\n\nЯчейкой руководит [[Ева Хайнц]] — Тремер без маговской родословной, обращённая случайно. Её сира, [[Джаред Трелли|Джареда Трелли]], одного из потомков Адама, Камарилья казнила за это Объятие. Еву не признали полноценной Тремер; от жизни Непризнанной она отказалась, как и от элитарности тех, у кого есть колдовская родословная, и основала свою ячейку во [[Флэтбуш|Флэтбуше]]. Второй глава ячейки — из клана [[Малкавиан]]. Собираются у старого голландского кладбища при Реформатской церкви.'},
   {t:'Вражда ветвей', text:'Между ветвями — идеологическая вражда. Ева пытается переманить на свою сторону молодняк, и в первую очередь Непризнанных: она сама когда-то была одной из них.\n\nАмулетов Анархи не носят. Их знак — тот же исторический символ, набитый татуировкой на левом плече: его, в отличие от амулета на цепочке, не отнять.'},
   {t:'Законы клана', text:'Тремер карают за нарушение правил раздачи знаний, за анархизм и за нарушение правил Камарильи. Судит Совет примогенов.'},
   {t:'Маги и ведьмы', text:'Смертные маги и ведьмы — главные враги клана не среди вампиров. Тремер их истребляют, а книги и вещи убитых уходят в тайную секцию библиотеки.'},
   {t:'Цели в городе', list:[

   {t:'Двор', text:'Камарильская часть клана полностью лояльна [[Геката|Княгине]] и даёт ей беспрепятственный доступ в архивы библиотеки. С Римской Камарильей, где сейчас [[Дон Треволли]], нью-йоркский клан не связывает ничего, кроме общей логики Камарильи.'},

 {id:'boulder', name:'Джеймс Боулдер',

  blocks:[
   {t:'До Объятия', text:'Был правой рукой главы мафиозной семьи. Сам глава семьи — тоже Бруха — и стал его сиром.'},
   {t:'Объятие и потеря сира', text:'Сир Джеймса был силён — казнён Камарильей за нарушение Маскарада. Джеймс убеждён: сира просто застали в неудачный момент и не дали времени исправить последствия, а вовсе не то, что он был слаб. Ответственной за приговор Джеймс считает [[Геката|Гекату]] — предводительницу Камарильи в городе, лично выносившую приговор. Эта казнь — главная личная травма Джеймса и один из корней его ненависти к Камарилье.'},
   {t:'Браунсвилл — его империя', text:'Джеймс и есть преступность Браунсвилла: за десятилетия подмял под себя все враждебные банды и блокирует появление новых. От мафиозного прошлого остались методы — крышевание и легальные бизнесы прикрытия: клубы, бордели, кафе, магазины по всей территории его угодий. Смертные видят в этом обычную организованную преступность, не подозревая о вампирах.\n\nРядовые под ним — просто солдаты, иерархии между ними нет, только грубая сила. Чуть ближе стоят [[Могильщик]] и [[Майкл Коул]] — их Джеймс уважает за исполнительность больше прочих, но и с них при провале спросит так же, как с любого другого.'},
   {t:'Характер', text:'Пафосен, постоянно демонстрирует силовое превосходство над окружающими. Говорит уверенно, в приказном тоне — будто все ему должны. Людей называет «мясом». Анархов — готовых, как и он, погрузить мир в хаос, — считает единственными по-настоящему своими.\n\nЛюбит сигареты и сигары, держит собственные заведения для «джентльменских» развлечений — бильярд, боулинг. Это легальное прикрытие, не место вербовки.'},
   {t:'Как он судит новообращённых', text:'Свежеобращённых выстраивают перед ним в шеренгу в баре «Мясорубка». Джеймс проходит вдоль строя — и любого, кто покажется ему недостойным, убивает или выпивает досуха на месте.'},
   {t:'Что о нём рассказывают', text:'Один из подчинённых, не выполнивший поручение, решил лично признаться в этом Джеймсу. Куски бедолаги до сих пор находят в самых дальних уголках его охотничьих угодий.'},
   {t:'Ненависть и слабость', text:'Сильнее всего ненавидит, когда ему указывают, что делать — неподчинение и слабость выводят его из себя. Настоящая же его уязвимость — собственная криминальная империя: это главное достижение его посмертия, и любое вмешательство в его дела приводит его в ярость.'},
   {t:'Ракель Корнехо', text:'Личной истории между ними нет — вражда сугубо идейная. Джеймс считает её гуманистические порывы признаком слабости, а состоятельных Бруха в целом — слабаками, пытающимися спасти куски мяса, которые сами просятся им в рот.\n\nОткрытой войны не будет, пока Камарилья не окажется серьёзно ослаблена или на грани гибели: Джеймс знает, что вампиры есть и в других городах, и открытого нарушения Маскарада ему не пережить.'},
   {t:'Полиция в Браунсвилле', text:'Джеймса крайне возмущают попытки полиции вмешаться в его дела. Любого замеченного в Браунсвилле полицейского убивают и избавляются от тела так, чтобы не осталось и следа. Пока сходит с рук — власти связывают исчезновения с обычной преступностью, не с вампирами.'}

   {t:'История', list:[

   {t:'Облик', text:'Всегда одета с иголочки, в стиле old money: дорогой, чаще всего белый пиджак; её классическая палитра — белый, красный и золотой. Длинные чёрные волосы, золотые украшения. Узнают её сразу по двум вещам — дорогим золотым серьгам с бриллиантами и массивному золотому христианскому кресту на подвеске.'},
   {t:'Власть и манера', text:'Когда она говорит, все вокруг замолкают — никто не смеет даже усомниться в её авторитете, и этой властью она с удовольствием упивается. Обычно она сама зовёт определённых вампиров на аудиенцию; попасть к ней по приглашению, а не за проступок, считается огромной честью.\n\nОна знает себе цену и не скрывает этого. Сила и значимость видны в каждом её действии — но не через агрессию, а элегантно, просто как факт на фоне.'},
   {t:'Сила', text:'Славится высокими Доминированием и Могуществом. Прекрасно читает людей и их эмоции — некоторые считают, что и это заслуга её дисциплин.'},
   {t:'Ночи Княгини', text:'Управляет сетью бизнесов. Деньги — её собственные накопления, унаследованные из прошлых жизней; легальный фасад — ночные клубы для людей с фетишем на вампиров. По ночам обычно заключает сделки и ведёт переговоры с коллегами из Камарилий Европы, попивая вино, смешанное с кровью. Любит театр и другие высокохудожественные мероприятия.'},
   {t:'Маскарад', text:'Для Гекаты Маскарад — не просто закон, а способ жизни и поддержания благополучия как среди людей, так и среди вампиров.\n\nВторую Инквизицию она считает врагом, с которым нужно бороться, — но открытое противостояние невозможно: оно само по себе стало бы нарушением Маскарада. Поэтому она посылает агентов срывать операции Инквизиции из тени и портить ей репутацию.'},
   {t:'Что выводит её из себя', text:'Неуважение. Мнимая сила, за которой ничего нет, и вседозволенность — грубо говоря, вампиры, не чтущие этикет.'},
   {t:'Личное', text:'Постоянных привязанностей нет. По слухам, иногда она заводит связи на одну ночь в Эдене — но подтвердить этого никто не может.'}

 {id:'cornejo', name:'Ракель Корнехо',
  short:'Основательница богатой ветки Бруха и примоген клана — экоактивистка, за которой следят два миллиона человек по всему миру',
  img:'images/cornejo.jpg',

  concept:[

  blocks:[
   {t:'Объятие', text:'Её обратил [[Майкл Коул]], когда они встречались. Сейчас они расстались; [[Джеймс Боулдер]] знает, что Майкл — её сир.\n\nРакель пришлось пройти через смотр новообращённых в баре «[[Мясорубка]]» — и она осталась жива. Как ей это удалось, неизвестно.'},
   {t:'Вторая ветка', text:'Ракель первой из Бруха трущоб вырвалась в люди — благодаря экоактивизму — и лично основала вторую, состоятельную ветку клана.\n\nДжеймс был возмущён такой наглостью, но дальше словесного недовольства дело не пошло: Ракель заявила, что выходит из-под его власти и переходит под власть [[Геката|Гекаты]]. По законам Камарильи нападение на сородича вне своей власти карается казнью, а Джеймс и его люди, хоть и не часть Камарильи, обязаны подчиняться её законам.'},
   {t:'Характер', text:'Обычно спокойна и открыта, всегда энергична и жизнерадостна. Прислушивается к чужим идеям и любит от них отталкиваться — пытается обернуть задумки сородичей во что-то полезное для человечества.\n\nСпокойствие изменяет ей при виде наплевательского отношения к природе и людям. Конкретной насущной беды у неё нет, но экологические проблемы Земли занимают её постоянно — и больше всего гложет любое действие, масштабно вредящее экологии планеты. Этого она не скрывает.'},
   {t:'Активизм', text:'Активизм — её основная работа. Ракель держит собственный форум, где собрано около двух миллионов экоактивистов со всего мира. Письма и общение на форуме занимают около 80% её ночей; остальное время уходит на проблемы своей половины клана и участие в жизни Камарильи.\n\nИногда выступает с публичными речами — в закрытых помещениях и ближе к вечеру.\n\nВсё держится только на пожертвованиях и общественной значимости: деньги идут на её проекты и идеи, немного — на личные нужды.'},
   {t:'Маскарад и кормление', text:'Маскарад для неё — один из главных принципов: без него невозможно спокойно направлять человечество к лучшему будущему. Чтобы публичность и фотографии не выдали, что она не стареет, Ракель меняет внешность с помощью пластики и косметики.\n\nСама питается исключительно донорской пакетированной кровью. Каждый человек важен — участникам её ветки запрещено кормиться от несогласных.'},
   {t:'Кого она обращает', text:'Лично обращает только тех активистов, кто достаточно ярко себя проявил и, по её мнению, важен для дальнейшего выживания человечества. Обычных людей не обращает.\n\nСлучайных новообращённых изгоняет и передаёт [[Джеймс Боулдер|Джеймсу]]: она против случайного кормления на людях в принципе, не говоря уже об обращении.'},
   {t:'Сила', text:'Сильные дисциплины — Присутствие и Стремительность, но на сравнительно невысоком уровне.'},
   {t:'При Дворе', text:'Видит в [[Геката|Гекате]] отличного лидера и надёжного соратника и благодарна ей за место в Совете примогенов. В клубе «[[Эден]]» бывает только по делам Двора.\n\nДвор в целом посмеивается над её наивностью — но в лицо ей этого никто не говорит. Представители [[Малкавиан]] и [[Тореадор]] относятся к ней с жалостью, представители [[Гангрел]] и [[Носферату]] — недолюбливают.'},
   {t:'Анархи', text:'Считает, что новая волна Анархов посягает на людей — а значит, заслуживает смерти, и чем быстрее, тем лучше.'},
   {t:'История', list:[
     '**1982, [[Марш за ядерное разоружение]]** — около миллиона человек в Центральном парке, крупнейшая демонстрация в истории США на тот момент.',
     '**2001, [[Закрытие свалки Фреш-Киллс]]** — одна из крупнейших свалок мира на Стейтен-Айленде закрыта после многолетних протестов жителей.',
     '**2011, [[Occupy Wall Street]]** — одна из теневых организаторов и спонсоров движения.',

 {id:'flamor', name:'Кейт Флэмор',

   ['Должность','Хранитель Элизиума в «[[Эден]]» — около 50 лет; по документам клуба — бухгалтер'],

  blocks:[
   {t:'Объятие', text:'Была обычной студенткой и пришла в клуб на вечеринку. [[Адам Сэндлер]] — примоген от Тремер в Совете — почувствовал в её родословной талантливую магичку и обратил её прямо здесь, в «[[Эден]]», около 75 лет назад.'},
   {t:'Служба', text:'Хранитель Элизиума уже около 50 лет. Отчитывается перед Советом примогенов в целом и перед Адамом Сэндлером в частности. [[Геката|Гекату]] считает выдающимся лидером, который действительно заботится о людях.\n\nС [[Бруха]], [[Носферату]] и [[Гангрел]] у неё напряжённые отношения — это общая неприязнь к кланам как таковым: именно их представители чаще всего устраивают неприятности в клубе.'},
   {t:'Как она держит порядок', text:'Авторитетом и угрозами. Если слова не помогают — магией: чаще всего «Касанием скорпиона», чтобы вызвать боль и утихомирить агрессивно настроенного сородича.\n\nСмертные завсегдатаи считают это частью шоу: она касается «актёра-вампира», его вены по всему телу чуть подсвечиваются — и он «изображает» боль.'},
   {t:'Папка с бумагами', text:'С папкой она почти не расстаётся — среди бумаг запрятано несколько заранее заготовленных заклятий.'},
   {t:'Характер', text:'Ведёт себя сварливо, и многие принимают это за стервозность. Это не маска, а её настоящий характер: Кейт интровертна по природе и недолюбливает общество.\n\nК примогенам относится с должным почтением и не грубит; с равными и теми, кто ниже по статусу, раздражения не сдерживает. Снисходительнее, чем к остальным, она только к нескольким своим гулям-охранникам.'},
   {t:'Магия', text:'Кейт интересуется всей [[Магия крови|магией крови]] в целом и пытается постичь её целиком — её цель стать величайшим магом-вампиром на территории города. Она собирает все древние тексты и магические артефакты, какие только может достать, и постоянно что-то изучает; в свободное время чаще всего пропадает за книгами.\n\nУчеников не берёт — всё держит при себе. Главный соперник на пути к званию сильнейшего — [[Йоган Курт]], маг из клана Носферату.'},
   {t:'Работа для неонатов', text:'Иногда Кейт нанимает неонатов Камарильи — искать для неё артефакты или похищать их у Анархов.'},
   {t:'Кабинет', text:'Небольшой собственный кабинет со спальным местом — в том же здании, что и клуб, и соединён с «[[Эден]]» служебными коридорами.'},
   {t:'Что о ней рассказывают', text:'Однажды пятеро бугаёв-Бруха из банды [[Джеймс Боулдер|Джеймса Боулдера]] попытались устроить драку на закрытой вечеринке в «Эдене», где были только вампиры. Через минуту все пятеро корчились от боли, а Кейт лишь плюнула кровью им в лицо и ушла, приказав охране утащить их в подвал. Что с ними стало — неизвестно; больше их никто не видел.'},
   {t:'Что выводит её из себя', text:'Когда принижают её знания магии или показывают, что она чего-то не знает.'}

 {id:'kurt', name:'Йоган Курт',

   ['Шрам','Трещина-шрам через лицо не зарастает. Кто её оставил и почему она не заживает, в вампирском обществе никто не знает']
  ],
  blocks:[
   {t:'Затворник', text:'На людях не показывается — живёт в резиденции Чарльза. В обществе сородичей его можно встретить разве что на закрытых приёмах для вампиров в «[[Эден]]» или среди своего клана, в той же резиденции.'},
   {t:'Характер', text:'Аристократичен — можно сказать, архаичен. Крайне консервативен и не признаёт ничего нового; славится своим снобизмом.\n\nСчитает иерархию лучшей формой правления: младшие должны подчиняться старшим и не задирать головы. Пока [[Геката]] имеет власть и силу, он подчиняется её воле.'},
   {t:'Магия', text:'Силён в [[Магия крови|магии крови]] и [[Анимализм|анимализме]]. В отличие от [[Кейт Флэмор]], которая изучает всё без разбора, он намеренно углубляет уже изученное, не расширяя круг предметов. Два главных направления — усиление людского резонанса и влияние на зверей.\n\nЕго почерк знают по техникам анимализма — «Усмирить зверя» и «Пробуждение паразита». В угодьях Чарльза можно встретить множество очарованных грейхаундов.'},
   {t:'Соперничество с Кейт Флэмор', text:'Тянется с самого его прибытия в город. Прямого противостояния нет — соперничество статусное: оба добиваются того, чтобы вампирское общество считало одного опытнее и сильнее другого. Йоган её не атакует — он просто демонстрирует фактическое превосходство заметными проявлениями магии, чаще всего на закрытых приёмах в «Эдене».\n\nВ основе — борьба за звание сильнейшего мага и пренебрежение к более юному вампиру. [[Тремер]] он вообще недолюбливает: их талант к магии, по его мнению, достаётся им почти без стараний — не то что ему.'},
   {t:'Свита', text:'Около двадцати молодых Носферату, которых он обратил лично. По сути это прислуга: выполняют мелкие поручения и иногда отправляются на задания по его просьбе. Относится к ним так же, как ко всем младшим, — как к низшей прислуге.'},
   {t:'Цели', text:'Доказать своё превосходство над окружающими и совершенствовать собственные силы.'},
   {t:'В глазах Гекаты', text:'Геката видит в нём обычного последователя своего сира — того, кто и не думает под неё копать.'}
  ],
  ties:[

 {id:'sandler', name:'Адам Сэндлер',
  short:'Примоген Тремер в Совете — весёлый джентльмен со шляпой в руках, бывший человек мафиозной семьи, хранитель клановой крепости в Публичной библиотеке',
  img:'images/sandler.jpg', imgPos:'50% 0%',
  clan:'Тремер', sect:'Камарилья', role:'Примоген Тремер', sire:'Дон Треволли', gen:9,
  concept:[

   ['Поколение','9-е — сир [[Дон Треволли]] 8-го поколения'],
   ['В Совете','Примоген от Тремер около ста лет — место оставил ему сир, [[Дон Треволли]]'],
   ['Логово','[[Нью-Йоркская публичная библиотека]] — крепость клана Тремер'],
   ['Облик','Шляпа старой эпохи — он всегда носит её с собой. С пачкой сигар не расстаётся']
  ],
  blocks:[
   {t:'Семья Треволли', text:'При жизни — целеустремлённый и беспринципный человек мафиозной семьи Дона Треволли: занимался в основном коллекторством и доставкой грузов. Дон обратил его как верного участника своей группировки — так Адам и вошёл в клан Тремер.\n\nСемья Треволли была второй по силе мафиозной семьёй Нью-Йорка. К концу 90-х многих её участников взяли по итогам масштабного рейда; самого Дона найти так и не удалось. Банды больше не существует. Адам подозревает, что рейд был проведён по наводке [[Джеймс Боулдер|Джеймса Боулдера]].'},
   {t:'Наследник места в Совете', text:'Около ста лет назад Дон Треволли отправился в Римскую Камарилью и оставил своё место в Совете примогенов Адаму — своему старшему сыну в мире вампиров. По праву, если Дон вернётся, он вновь займёт это место.\n\nПотомки у Адама есть — среди них [[Кейт Флэмор]], Хранитель Элизиума, и [[Коул Бренан]]. Был и [[Джаред Трелли]] — его Камарилья казнила за Объятие [[Ева Хайнц|Евы Хайнц]], нынешней главы анархической ячейки Тремер.'},
   {t:'При Дворе', text:'Держится навеселе, но по-джентльменски. Вежлив и немного насмешлив, любит шутки и не боится чёрного юмора. Перестаёт шутить только при действительно плохих обстоятельствах — и никогда не шутит в адрес старших по званию: [[Геката|Гекаты]] и Дона.\n\nПри Дворе его считают легкомысленным и лёгким на подъём — и, в принципе, так он себя и ведёт.'},
   {t:'Галантность', text:'Иногда делает вид, что обхаживает представительниц Совета, — например, [[Ракель Корнехо]]. Это игра с равными и, по его мнению, обычная джентльменская вежливость: открыть даме дверь, заказать ей коктейль, пока примогены ждут приглашения, и тому подобное.'},
   {t:'Совет и Геката', text:'К Гекате относится с уважением, к остальным членам Совета — как к равным: раз глава Камарильи признала их на одном уровне, значит, так оно и есть. Нынешней организацией дел вполне доволен.'},
   {t:'Крепость Тремер', text:'Логово клана — [[Нью-Йоркская публичная библиотека]]. Через её служебные помещения можно попасть в обитаемые помещения клана и в тайные секции, заполненные книгами о магии и различными ритуалами.\n\nПостоянных жителей почти нет: это скорее бесплатный мотель для любого Тремер, способный одновременно вместить до 100 гостей. По официальной версии все они числятся стажёрами библиотеки. Подробнее — в заметке клана [[Тремер]].'},
   {t:'Чего он добивается', text:'Отстаивает интересы клана и сохранность его крепости. Считает, что Тремер должны продолжать древние традиции и быть хранителями знаний — и о магии, и о мире в целом, — и поддерживает эту традицию всеми возможными способами: расширяет коллекцию библиотеки и сохраняет знания человечества.\n\nМолодые Тремер, по его мнению, слишком полагаются на современные технологии. Сам он предпочитает бумажные источники цифровым и пытается привить это младшим представителям клана.'},
   {t:'Руками других', text:'Не любит действовать сам: любую работу поручает подручным или своей правой руке — [[Коул Бренан|Коулу Бренану]].\n\nЕсли колдовать всё-таки нужно лично ему, в пачке сигар у него лежит несколько свёртков с заранее заготовленными заклятьями. Заготавливает их для него Кейт.'},
   {t:'Кейт Флэмор', text:'Ведёт себя с ней скорее по-отцовски. Знает о её планах и амбициях и не смеет им мешать, а иногда даже помогает.\n\nЗа соперничеством Кейт с [[Йоган Курт|Йоганом Куртом]] только наблюдает и не вмешивается, но убеждён, что маг из Носферату никогда не станет искуснее мага из Тремер, — и внушает это Кейт.'},
   {t:'Где его найти', text:'Почти каждый вечер — в «[[Эден]]», всегда в VIP-зоне. Выпивает, разглядывает посетителей и не прочь поболтать с любым желающим, особенно с дамами. В остальное время — в крепости клана.\n\nОткрыт к любому разговору, пока собеседник не переходит рамки приличий, не начинает хамить и не делает вид, будто обладает какой-то властью над ним.'}
