function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function pad(n){return (n<10?'0':'')+n;}

function findIn(arr,id){for(var i=0;i<arr.length;i++)if(arr[i].id===id)return arr[i];return null;}
/* Порядок карточек так, как их видит игрок в сетке раздела. По нему считаются
   номер на карточке, «запись №» на странице и «Дело №» на папке личности. */
function gridOrder(c){
  var a=c.arr;
  if(c.id==='people'){
    var gr={},ord=[];
    a.forEach(function(x){var g=x.clan||'Без клана';if(!gr[g]){gr[g]=[];ord.push(g);}gr[g].push(x);});
    ord.sort(function(p,q){if(p==='Без клана')return q==='Без клана'?0:1;if(q==='Без клана')return -1;return p.localeCompare(q,'ru');});
    return ord.reduce(function(r,g){return r.concat(gr[g].slice().sort(function(p,q){return (p.name||'').localeCompare(q.name||'','ru');}));},[]);
  }
  if(c.id==='loresheets'){
    var it=a.map(function(x,i){return {x:x,y:x.year==null?Infinity:x.year,i:i};})
      .concat((GHOSTS.loresheets||[]).filter(function(n){return !LINKS[n];}).map(function(n,i){
        var y=(typeof LORE_YEARS!=='undefined'?LORE_YEARS[n]:null);return {x:null,y:y==null?Infinity:y,i:a.length+i};}));
    it.sort(function(p,q){return p.y-q.y||p.i-q.i;});
    return it.filter(function(o){return o.x;}).map(function(o){return o.x;});
  }
  if(c.id==='domains'){
    var kinds=Object.keys(DOMAIN_KINDS);
    return kinds.reduce(function(r,k){return r.concat(a.filter(function(d){return d.kind===k;}));},[])
      .concat(a.filter(function(d){return !DOMAIN_KINDS[d.kind];}));
  }
  if(c.id==='places'){
    var out=[];
    function add(p){if(out.indexOf(p)<0)out.push(p);}
    function domPlaces(d){PLACES.filter(function(p){return p.domain===d.id;}).forEach(add);
      DOMAINS.filter(function(x){return x.domain===d.id;}).forEach(domPlaces);}
    var areas=(CITY_MAP.areas||[]).slice();
    PLACES.concat(DOMAINS).forEach(function(x){if(x.area&&areas.indexOf(x.area)<0)areas.push(x.area);});
    areas.forEach(function(ar){
      PLACES.filter(function(p){return p.area===ar&&!(p.domain&&findIn(DOMAINS,p.domain));}).forEach(add);
      DOMAINS.filter(function(d){return d.area===ar&&!(d.domain&&findIn(DOMAINS,d.domain));}).forEach(domPlaces);});
    PLACES.filter(function(p){return !p.area;}).forEach(add);
    PLACES.forEach(add);
    return out;
  }
  return a;
}
function numOf(arr,x){

  var k=(c?gridOrder(c):arr).indexOf(x);
  return pad((k<0?arr.indexOf(x):k)+1);
}

  var n=parseInt(h,16);return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')';}
function R(a,b){return a+Math.random()*(b-a);}
function plural(n,a,b,c){var m=n%10,h=n%100;if(m===1&&h!==11)return a;if(m>=2&&m<=4&&(h<12||h>14))return b;return c;}

function wikiTag(target,label){
  var t=String(target).trim(),href=LINKS[t];
  return href?'<a class="wiki" href="'+href+'" title="Открыть заметку «'+esc(t)+'»">'+label+'</a>'
             :'<span class="wiki" title="Заметки пока нет">'+label+'</span>';
}
function inl(s){return esc(s)
  .replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g,function(_,t,l){return wikiTag(t,l);})
  .replace(/\[\[([^\]]+)\]\]/g,function(_,t){return wikiTag(t,t);})
  .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
function md(s){ if(s==null) return ''; var p=String(s).split(/\n{2,}/);
  return p.length>1?p.map(function(x){return '<p>'+inl(x).replace(/\n/g,'<br>')+'</p>';}).join(''):inl(s).replace(/\n/g,'<br>');}
function nameLink(n){return n?wikiTag(n,esc(n)):'<span class="blank">—</span>';}
function hrefOf(n){return n?LINKS[String(n).trim()]||null:null;}
function same(a,b){if(!a||!b)return false;if(a===b)return true;var ha=hrefOf(a);return !!ha&&ha===hrefOf(b);}
function dots(n,max){n=+n||0;max=max||5;var s='';for(var i=0;i<max;i++)s+=i<n?'●':'<i>●</i>';return '<span class="dots">'+s+'</span>';}

function growTa(id,val,ph,attrs){return '<textarea class="grow one" rows="1"'+(id?' id="'+id+'"':'')+(ph?' placeholder="'+esc(ph)+'"':'')+(attrs||'')+'>'+esc(val||'')+'</textarea>';}
function growFit(el){if(!el||!el.offsetParent)return;el.style.height='auto';el.style.height=(el.scrollHeight+el.offsetHeight-el.clientHeight)+'px';}

document.addEventListener('input',function(e){var t=e.target;if(t&&t.classList&&t.classList.contains('grow')){

function blockHtml(b){

  if(b.list) inner+='<div class="panel"><ul>'+b.list.map(function(x){return '<li>'+md(x)+'</li>';}).join('')+'</ul></div>';
  if(b.table) inner+=tableHtml(b.table);
  if(b.cards) inner+='<div class="grid">'+b.cards.map(function(c){
    return '<div class="card">'+(c.tag?'<span class="tag">'+esc(c.tag)+'</span>':'')+'<h4>'+wikiTag(c.name,esc(c.name))+'</h4><div class="eff">'+md(c.text)+'</div></div>';}).join('')+'</div>';

function tieKey(t){var s=typeof t==='string'?t:(t&&t.text)||'';var m=s.match(/^\s*\[\[([^\]|]+)/);return m?m[1].trim():null;}
function tieRows(ties){
  var rows=[];
  ties.forEach(function(t){
    var isGm=typeof t!=='string'&&t.gm,text=typeof t==='string'?t:(t.text||''),k=tieKey(t);
    if(isGm&&k){
      for(var i=0;i<rows.length;i++)if(!rows[i].gm&&rows[i].key&&same(rows[i].key,k)){
        rows[i].parts.push(text.replace(/^\s*\[\[[^\]]+\]\]\s*[—–-]\s*/,''));return;}
    }
    rows.push({key:k,gm:!!isGm,text:text,parts:[]});
  });
  return rows;
}
function commonTail(x){
  var out='';
  if(x.concept&&x.concept.length) out+=section('Концепция','',defsHtml(x.concept));
  (x.blocks||[]).filter(gmOk).forEach(function(b){out+=blockHtml(b);});
  var tr=tieRows((x.ties||[]).filter(gmOk));
  if(tr.length) out+=section('Связи',tr.length,'<div class="panel"><ul>'+tr.map(function(r){
    if(r.gm) return '<li class="gm-li">'+md(r.text)+' '+gmBadge()+'</li>';
    return '<li>'+md(r.text)+r.parts.map(function(p){return ' <span class="gm-inl">'+gmBadge()+' '+md(p)+'</span>';}).join('')+'</li>';}).join('')+'</ul></div>');
  if(typeof localWebHtml==='function') out+=localWebHtml(x);
  out+=playlistHtml(x.playlist);
  out+=backlinksHtml(x);

function strings(o,acc){acc=acc||[];
  if(typeof o==='string') acc.push(o);
  else if(Array.isArray(o)) o.forEach(function(v){strings(v,acc);});
  else if(o&&typeof o==='object'){ if(o.gm&&!gmOn()) return acc; for(var k in o) if(k!=='id'&&k!=='acc'&&k!=='acc2'&&k!=='shape') strings(o[k],acc);}
  return acc;}
function allEntries(){
  var out=[];
  CATS.forEach(function(c){c.arr.forEach(function(x){out.push({x:x,href:'#/'+c.route+'/'+x.id,cat:c.one,name:x.name});});});
  PCS.forEach(function(x){out.push({x:x,href:'#/pc/'+x.id,cat:'персонаж',name:x.name});});
  SESSIONS.forEach(function(s){out.push({x:s,href:'#/cons',cat:'журнал',name:'Сессия '+s.n});});
  CHRON.forEach(function(c,i){out.push({x:c,href:'#/tool/chron',cat:c.kind==='memoriam'?'мемориам':'хроника',name:c.title||c.when||('Ночь '+(i+1))});});
  if(CHRONICLE.premise.length||CHRONICLE.history.length) out.push({x:CHRONICLE,href:'#/world',cat:'хроника',name:CHRONICLE.title||'Заглавная заметка'});
  return out;
}
function mentions(x){
  var names=[x.name].concat(x.aliases||[]).concat(x.full?[x.full]:[]);
  return allEntries().filter(function(e){
    if(e.x===x) return false;
    var txt=strings(e.x).join('\n');
    return names.some(function(n){return n&&(txt.indexOf('[['+n+']]')>-1||txt.indexOf('[['+n+'|')>-1);});
  });
}
function backlinksHtml(x){
  var m=mentions(x); if(!m.length) return '';
  return section('Упоминания',m.length,'<div class="filt">'+m.map(function(e){
    return '<a class="chip hot" href="'+e.href+'">'+esc(e.cat)+' · '+esc(e.name)+'</a>';}).join(' ')+'</div>');
}

function chipsFor(c,x){
  var ch=[];
  if(c.id==='clans'){(x.disciplines||[]).forEach(function(d){ch.push(d);});}
  else if(c.id==='disciplines'){if(x.kind)ch.push(x.kind);if(x.resonance)ch.push(x.resonance);ch.push((x.powers||[]).length+' сил');}
  else if(c.id==='loresheets'){if(x.year!=null)ch.push(String(x.year));if((x.levels||[]).length)ch.push(x.levels.length+' ступеней');}
  else if(c.id==='sects'){var m=membersOf('sect',x);ch.push(m.length+' '+plural(m.length,'член','члена','членов'));}
  else if(c.id==='people'){[x.clan,x.sect,x.role,x.gen?x.gen+'-е пок.':''].forEach(function(v){if(v)ch.push(v);});}
  else if(c.id==='threats'){if(x.kind)ch.push(x.kind);}
  else if(c.id==='domains'){if(x.kind&&DOMAIN_KINDS[x.kind])ch.push(DOMAIN_KINDS[x.kind][0]);if(x.threat!=null)ch.push('угроза '+x.threat);}
  else (x.quick||[]).slice(0,3).forEach(function(q){ch.push(q[1]);});
  return ch;
}
function listCard(c,x){
  var ch=chipsFor(c,x);
  return '<a class="god-card'+(x.dead?' dead':'')+'" href="#/'+c.route+'/'+x.id+'" style="--c:'+(x.acc||c.c)+'">'+
    '<span class="k">'+numOf(c.arr,x)+' · '+esc(c.one.toUpperCase())+(x.dead?' · ☾ торпор':'')+'</span><h3>'+esc(x.name)+'</h3>'+
    (x.short?'<p class="pr">'+inl(x.short)+'</p>':'')+
    '<div class="foot">'+ch.map(function(v,i){return '<span class="chip'+(i===0?' hot':'')+'">'+esc(v)+'</span>';}).join('')+'</div></a>';
}

function ghostCount(c){

function viewList(c){
  setTheme(c.theme);
  if(c.kind==='cards') return viewCards(c,null);
  if(c.kind==='tree') return viewPlaces();
  if(c.kind==='map') return viewDomains();
  if(c.id==='players') return viewPlayers();
  if(c.id==='loresheets') return viewLoresheets(c);
  if(c.id==='people') return viewPeople(c);
  var cards=c.arr.map(function(x){return listCard(c,x);}).join('');
  var ghosts='',hint='';
  if(c.id==='clans'){ghosts=CLAN_REF.filter(function(r){return !LINKS[r[0]];}).map(function(r){
    return ghostCard('КЛАН',r[0],r[1],'');}).join('');hint='Пунктирные карточки — заготовки из книги. Как только появится запись с тем же именем, заготовка исчезнет.';}
  else if(c.id==='disciplines'){ghosts=DISC_REF.filter(function(r){return !LINKS[r[0]];}).map(function(r){
    return ghostCard('ДИСЦИПЛИНА',r[0],r[1]!=='—'?['резонанс: '+r[1]]:[],'');}).join('');hint='Пунктирные карточки — заготовки из книги. Как только появится запись с тем же именем, заготовка исчезнет.';}
  else if(GHOSTS[c.id]&&GHOSTS[c.id].length){ghosts=GHOSTS[c.id].filter(function(n){return !LINKS[n];}).map(function(n){
    return ghostCard(c.one.toUpperCase(),n,[],'');}).join('');hint='Пунктирные карточки — упомянуты в заметках, но своей записи ещё нет. Как только появится запись с тем же именем, заготовка исчезнет.';}
  var inner=(cards||ghosts)?'<div class="gods">'+cards+ghosts+'</div>':emptyBox('Записей пока нет','Раздел ждёт первых заметок хроники.');
  if(ghosts) inner+='<p class="hint">'+hint+'</p>';
  listShell(c,inner);
}

function viewPeople(c){
  var groups={},order=[];
  c.arr.forEach(function(x){var g=x.clan||'Без клана';
    if(!groups[g]){groups[g]=[];order.push(g);}groups[g].push(x);});
  order.sort(function(a,b){if(a==='Без клана')return b==='Без клана'?0:1;
    if(b==='Без клана')return -1;return a.localeCompare(b,'ru');});
  var gh=(GHOSTS.people||[]).filter(function(n){return !LINKS[n];});
  var sections=order.map(function(g){
    var list=groups[g].slice().sort(function(a,b){return (a.name||'').localeCompare(b.name||'','ru');});
    return '<div class="u-m34-0-14 sec-head"><h3>'+esc(g)+'</h3><span class="eyebrow">'+list.length+' '+plural(list.length,'запись','записи','записей')+'</span></div>'+
      '<div class="gods">'+list.map(function(x){return listCard(c,x);}).join('')+'</div>';});
  var inner=sections.join('');
  if(gh.length) inner+='<div class="u-m34-0-14 sec-head"><h3>Клан неизвестен</h3><span class="eyebrow">'+gh.length+' '+plural(gh.length,'заготовка','заготовки','заготовок')+'</span></div>'+

function personSub(p){return '<a class="subcard" href="'+personHref(p)+'" style="--c:'+(p.acc||'var(--acc)')+'">'+
  '<span class="k">'+(PCS.indexOf(p)>-1?'персонаж игрока':'личность')+(p.dead?' · ☾ торпор':'')+'</span><h4>'+esc(p.name)+'</h4>'+
  '<div class="ds">'+esc([p.clan,p.sect,p.role].filter(Boolean).join(' · ')||p.short||'')+'</div></a>';}
function politicsHtml(x){
  var n=x.name,out='';
  var bonds=BONDS.filter(gmOk).filter(function(b){return same(b.thrall,n)||same(b.regnant,n);});
  var boons=BOONS.filter(gmOk).filter(function(b){return same(b.debtor,n)||same(b.creditor,n);});
  function relNote(r){return same(r.a,n)?(r.note||''):(r.noteB||'');}
  var rel=RELATIONS.filter(gmOk).filter(function(r){return same(r.a,n)||(same(r.b,n)&&r.noteB);});
  function gb(o){return o.gm?' '+gmBadge():'';}
  var sire=x.sire, childer=allPeople().filter(function(p){return same(p.sire,n);});
  var rows=[];
  if(sire) rows.push('<li>Сир: '+nameLink(sire)+'</li>');
  if(childer.length) rows.push('<li>Потомки: '+childer.map(function(p){return nameLink(p.name);}).join(', ')+'</li>');
  bonds.forEach(function(b){rows.push('<li>Кровные узы '+dots(b.level,3)+': '+nameLink(b.thrall)+' → '+nameLink(b.regnant)+(b.note?' — '+inl(b.note):'')+gb(b)+'</li>');});
  boons.forEach(function(b){var L=BOON_LEVELS[b.level]||['?',''];
    rows.push('<li>'+L[0]+' долг ('+(BOON_STATUS[b.status]||b.status)+'): '+nameLink(b.debtor)+' должен '+nameLink(b.creditor)+(b.why?' — '+inl(b.why):'')+gb(b)+'</li>');});
  var relRows=[];
  rel.forEach(function(r){var other=same(r.a,n)?r.b:r.a;
    if(r.gm)for(var i=0;i<relRows.length;i++)if(!relRows[i].r.gm&&same(relRows[i].other,other)){relRows[i].parts.push(r);return;}
    relRows.push({r:r,other:other,parts:[]});});
  relRows.forEach(function(w){var r=w.r,T=REL_TYPES[r.type]||REL_TYPES.other;
    rows.push('<li><span style="color:'+T[1]+'">'+T[0]+'</span>: '+nameLink(w.other)+(relNote(r)?' — '+inl(relNote(r)):'')+gb(r)+
      w.parts.map(function(p){var PT=REL_TYPES[p.type]||REL_TYPES.other,same_t=p.type===r.type;
        return ' <span class="gm-inl">'+gmBadge()+' '+(same_t?'':'<span style="color:'+PT[1]+'">'+PT[0]+'</span>'+(relNote(p)?': ':''))+inl(relNote(p))+'</span>';}).join('')+'</li>');});
  if(x.status) Object.keys(x.status).forEach(function(s){rows.push('<li>Статус ('+esc(s)+'): '+dots(statusNow(n,s,x.status[s]))+'</li>');});
  if(rows.length) out=section('Положение среди Сородичей',rows.length,'<div class="panel"><ul>'+rows.join('')+'</ul></div>');
  return out;
}

var TRK_OBJ={};
function trkKey(x){return (x._liveKind==='pcs'?'lpc:':PCS.indexOf(x)>-1?'pc:':PEOPLE.indexOf(x)>-1?'person:':'threat:')+x.id;}
function trkDefault(x){var t=x.track||{};
  return {hunger:t.hunger!=null?t.hunger:1,hMax:t.healthMax||7,hSup:0,hAgg:0,wMax:t.wpMax||5,wSup:0,wAgg:0,
    hum:t.humanity!=null?t.humanity:7,stains:0};}
function trkGet(key){var x=TRK_OBJ[key];if(!x)return null;
  var d=trkDefault(x);
  if(x._liveKind==='pcs'){
    ['hunger','hMax','hSup','hAgg','wMax','wSup','wAgg','hum','stains'].forEach(function(k){if(x[k]!=null)d[k]=x[k];});
  } else if(isLivePc(x)){
    var live=PCSTATE_CACHE[key];
    if(live) for(var k in d) if(live[k]!=null) d[k]=live[k];
  } else {
    var s=STORE.get('trk:'+key,null);
    if(s) for(var k2 in d) if(s[k2]!=null) d[k2]=s[k2];
  }
  d.hMax=(x.track&&x.track.healthMax)||d.hMax;d.wMax=(x.track&&x.track.wpMax)||d.wMax;
  if(x._liveKind==='pcs'&&x.attrs){var dv=pcDerived(x);d.hMax=dv.hMax;d.wMax=dv.wMax;}
  return d;}
function trkSet(key,st){
  var x=TRK_OBJ[key];
  if(isLivePc(x)&&!canEditLivePc(x)){refreshTrackers(key);return;}
  st.hunger=Math.max(0,Math.min(5,st.hunger));st.hum=Math.max(0,Math.min(10,st.hum));st.stains=Math.max(0,Math.min(10,st.stains));
  ['h','w'].forEach(function(p){var mx=st[p+'Max'];st[p+'Agg']=Math.max(0,Math.min(mx,st[p+'Agg']));st[p+'Sup']=Math.max(0,Math.min(mx-st[p+'Agg'],st[p+'Sup']));});
  STORE.set('trk:'+key,st);
  if(x&&x._liveKind==='pcs') for(var sk in st) x[sk]=st[sk];
  if(isLivePc(x)){if(x._liveKind!=='pcs')PCSTATE_CACHE[key]=st;pcSyncWrite(x,st);}
  refreshTrackers(key);}
function damage(st,p,kind,sign){
  var mx=st[p+'Max'];
  if(sign<0){if(kind==='s')st[p+'Sup']--;else st[p+'Agg']--;return;}
  var free=mx-st[p+'Sup']-st[p+'Agg'];
  if(kind==='s'){if(free>0)st[p+'Sup']++;else if(st[p+'Sup']>0){st[p+'Sup']--;st[p+'Agg']++;}}
  else{if(free>0)st[p+'Agg']++;else if(st[p+'Sup']>0){st[p+'Sup']--;st[p+'Agg']++;}}
}

     ctl('<div class="ctl"><button class="mini" data-act="d" data-p="h" data-k="s">+ ╱</button><button class="mini" data-act="d" data-p="h" data-k="a">+ ✕</button>'+

   '</div>'+ctl('<div class="u-mt8 ctl"><button class="mini" data-act="reset" title="Вернуть стартовые значения персонажа">Сброс к стартовым</button></div>');
}
function trackerHtml(x){var key=trkKey(x);TRK_OBJ[key]=x;return '<div class="trkwrap" data-trk="'+key+'">'+trkInner(key)+'</div>';}
function refreshTrackers(key){
  [].forEach.call(document.querySelectorAll('[data-trk="'+key+'"]'),function(el){el.innerHTML=trkInner(key);});
  [].forEach.call(document.querySelectorAll('[data-mini="'+key+'"]'),function(el){el.innerHTML=miniPips(key);});
  if(dkPc&&dkPc.value===key) dkHun.value=trkGet(key).hunger;
}
function remorse(key){
  var x=TRK_OBJ[key],st=trkGet(key);
  if(!st.stains){pushLog('Раскаяние · '+x.name,'Скверны нет — проверка не нужна','—','');return;}
  var n=Math.max(1,10-st.hum-st.stains),r=[],ok=false;
  for(var i=0;i<n;i++){var v=d(10);r.push(v);if(v>=6)ok=true;}
  if(ok){st.stains=0;}else{st.hum-=1;st.stains=0;}
  trkSet(key,st);
  pushLog('Раскаяние · '+x.name,'['+r.join(' ')+']',ok?'Сохранил':'−1 Чел.',ok?'ok':'no');
  openDock();
}
function onTrk(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var w=b.closest('[data-trk],[data-mini]');if(!w)return;
  var key=w.getAttribute('data-trk')||w.getAttribute('data-mini'),st=trkGet(key),a=b.getAttribute('data-act'),v=+b.getAttribute('data-v');
  if(a==='hun'){st.hunger=(st.hunger===v)?v-1:v;}
  else if(a==='hun0') st.hunger=0;
  else if(a==='d') damage(st,b.getAttribute('data-p'),b.getAttribute('data-k'),1);
  else if(a==='h') damage(st,b.getAttribute('data-p'),b.getAttribute('data-k'),-1);
  else if(a==='hum') st.hum+=v;
  else if(a==='stn') st.stains+=v;
  else if(a==='remorse'){remorse(key);return;}
  else if(a==='rouse'){rouseFor(key,false);return;}
  else if(a==='reset'){
    var x2=TRK_OBJ[key];
    if(isLivePc(x2)&&!canEditLivePc(x2)){refreshTrackers(key);return;}
    STORE.del('trk:'+key);
    if(isLivePc(x2)){var d0=trkDefault(x2);if(x2._liveKind!=='pcs')PCSTATE_CACHE[key]=d0;pcSyncWrite(x2,d0);}
    refreshTrackers(key);return;
  }
  else return;
  trkSet(key,st);
}

function evalPool(r){
  var succ=0,tens=0,hTen=false,hOne=false;
  r.dice.forEach(function(x){if(x.v>=6)succ++;if(x.v===10){tens++;if(x.h)hTen=true;}if(x.h&&x.v===1)hOne=true;});
  var pairs=Math.floor(tens/2);succ+=pairs*2;
  var crit=pairs>0,messy=crit&&hTen,D=r.dif,v={succ:succ,crit:crit,messy:messy,hOne:hOne};
  if(D>0){
    var win=succ>=D;v.cls=win?(messy?'messy':'win'):(hOne?'bestial':'fail');
    v.title=win?(messy?'Грязный крит':crit?'Критический успех':'Успех'):(hOne?'Звериный провал':succ===0?'Полный провал':'Провал');
    v.text=succ+' усп. против сложности '+D+(win?' · перевес '+(succ-D):' · не хватило '+(D-succ));
    if(win&&messy) v.text+=' · успех, но Зверь берёт своё: одержимость или последствия по решению рассказчика';
    if(!win&&hOne) v.text+=' · провал с участием Зверя: одержимость или иная беда';
  }else{
    v.cls=messy?'messy':'win';v.title=succ+' '+plural(succ,'успех','успеха','успехов');
    var f=[];if(crit)f.push(messy?'грязный крит (если бросок успешен)':'критический успех (если бросок успешен)');
    if(hOne)f.push('звериный провал, если бросок провален');if(!succ)f.push('ни одного успеха');
    v.text=f.join(' · ')||'сложность не задана — сравните с ней сами';
  }
  return v;
}

function rouseFor(key,twice){

var ROLL_RE=/(пул\s+(\d{1,2})(?:\s*[\/,;]\s*сл\.?\s*(\d{1,2}))?)|(проверк[аеуи]\s+пробуждения)|((\d{0,2})[кК](\d{1,3})(?:\s*([+−–-])\s*(\d{1,3}))?)/gi;
function activateRolls(root){
  var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),skip={BUTTON:1,SCRIPT:1,STYLE:1,A:1,TEXTAREA:1,INPUT:1,SELECT:1,OPTION:1},targets=[],node;
  while((node=walker.nextNode())){var par=node.parentNode;
    if(!par||skip[par.nodeName]||(par.closest&&par.closest('a,button,svg,.srch-res,.dock')))continue;
    ROLL_RE.lastIndex=0;if(ROLL_RE.test(node.nodeValue))targets.push(node);}
  targets.forEach(function(n){
    var txt=n.nodeValue,frag=document.createDocumentFragment(),last=0,m,made=0;ROLL_RE.lastIndex=0;
    while((m=ROLL_RE.exec(txt))){
      var prev=m.index>0?txt.charAt(m.index-1):'';
      if(/[0-9A-Za-zА-Яа-яЁё]/.test(prev))continue;
      var b=document.createElement('button');b.type='button';b.className='roll';b.textContent=m[0];
      if(m[1]){b.dataset.pool=m[2];if(m[3])b.dataset.dif=m[3];}
      else if(m[4]){b.dataset.rouse='1';}
      else{var sides=+m[7],cnt=m[6]?+m[6]:1;if([2,3,4,6,8,10,12,20,100].indexOf(sides)<0||cnt<1||cnt>30)continue;
        b.dataset.n=cnt;b.dataset.s=sides;b.dataset.m=m[9]?(m[8]==='+'?1:-1)*(+m[9]):0;}
      if(m.index>last)frag.appendChild(document.createTextNode(txt.slice(last,m.index)));
      frag.appendChild(b);last=m.index+m[0].length;made++;}
    if(!made)return;
    if(last<txt.length)frag.appendChild(document.createTextNode(txt.slice(last)));
    n.parentNode.replaceChild(frag,n);});
}

  if(t1<=5)temp=TEMPERAMENT[0];else if(t1<=8)temp=TEMPERAMENT[1];else{t2=d(10);temp=t2>=9?TEMPERAMENT[3]:TEMPERAMENT[2];}
  var r=d(10),hum=null;RESONANCE.forEach(function(x){if(x.roll&&r>=x.roll[0]&&r<=x.roll[1])hum=x;});
  var dys=temp===TEMPERAMENT[3]&&hum.dys.length?hum.dys[Math.floor(Math.random()*hum.dys.length)]:null;
  RES_LAST={t1:t1,t2:t2,temp:temp,r:r,hum:hum,dys:dys};
  pushLog('Резонанс','темп. ['+t1+(t2?'/'+t2:'')+'] · тип ['+r+']',temp===TEMPERAMENT[0]?'нет':temp[1]+' '+hum.name,'');
}

    res='<div class="u-mb20 panel"><div class="eyebrow">результат · темперамент к10: '+R0.t1+(R0.t2?' → '+R0.t2:'')+' · тип к10: '+R0.r+'</div>'+
      '<h3 class="u-fs40 u-m8-0">'+(none?'Без резонанса':esc(R0.temp[1])+' · '+esc(R0.hum.name))+'</h3>'+
      '<p class="u-c-dim">'+esc(R0.temp[2])+'</p>'+
      (none?'':'<p>Дисциплины: <b>'+R0.hum.disc.map(esc).join(', ')+'</b>. Эмоции жертвы: '+esc(R0.hum.mood)+'.</p>')+
      (R0.dys?'<div class="note"><b>Дискразия</b>'+esc(R0.dys)+' — точный эффект задаёт рассказчик.</div>':'')+'</div>';}
  var temp=tableHtml({cap:'Темперамент — к10',head:['к10','Темперамент','Эффект'],rows:TEMPERAMENT.map(function(x){return [x[0]?x[0][0]+'–'+x[0][1]:'9–10 на втором к10',x[1],x[2]];})});
  var hum=tableHtml({cap:'Тип резонанса — к10',head:['к10','Резонанс','Дисциплины','Эмоции','Дискразии'],rows:RESONANCE.map(function(x){
    return [x.roll?x.roll[0]+'–'+x.roll[1]:'—',x.name,x.disc.join(', '),x.mood,x.dys.join(', ')||'—'];})});
  toolShell(t,'Кровь несёт эмоцию жертвы. Бросьте резонанс при кормлении: темперамент решает, есть ли эффект, тип — какие дисциплины он усиливает.',
    '<div class="tabs"><button class="mini pri" id="resRoll">Бросить резонанс</button></div>'+res+temp+hum);
  document.getElementById('resRoll').addEventListener('click',function(){rollResonance();viewResonance(t);});

function sha256Hex(text){
  var enc=new TextEncoder().encode(text);
  return crypto.subtle.digest('SHA-256',enc).then(function(buf){
    return Array.prototype.map.call(new Uint8Array(buf),function(b){return b.toString(16).padStart(2,'0');}).join('');
  });
}

function bootAuth(cb){
  if(window.name==='KODEKS_TEST_BYPASS'){SESSION={uid:'test',username:'test',role:'admin',displayName:'Тест'};cb();return;}
  if(KODEKS_PREVIEW){SESSION={uid:'preview',username:'preview',role:'master',displayName:'Предпросмотр',preview:true};renderUserBadge();cb();return;}
  var gate=document.getElementById('authGate');
  gate.classList.remove('hidden');
  if(!fbAuth){
    gate.innerHTML='<div class="auth-card"><h2>Не удалось загрузить Firebase</h2>'+
      '<p class="note">Проверьте интернет-соединение (SDK грузится с www.gstatic.com) и обновите страницу. '+
      'Если это повторяется — возможно, блокировщик рекламы/скриптов режет Google-домены.</p></div>';
    return;
  }
  gate.innerHTML='<div class="auth-card"><p class="sub">Подключение…</p></div>';
  fbAuth.signInAnonymously().then(function(){
    return fbDb.collection('meta').doc('bootstrap').get();
  }).then(function(metaDoc){
    if(!metaDoc.exists){showBootstrapForm(cb);return;}
    var uid=fbAuth.currentUser.uid;
    fbDb.collection('sessions').doc(uid).get().then(function(sd){
      if(sd.exists){
        fbDb.collection('users').doc(sd.data().username).get().then(function(ud){
          if(ud.exists){
            SESSION={uid:uid,username:sd.data().username,role:ud.data().role,displayName:ud.data().displayName||sd.data().username};
            gate.classList.add('hidden');renderUserBadge();cb();
          } else {showLoginForm(cb,'Учётная запись была удалена — войдите заново.');}
        }).catch(function(){showLoginForm(cb);});
      } else {showLoginForm(cb);}
    }).catch(function(){showLoginForm(cb);});
  }).catch(function(e){
    gate.innerHTML='<div class="auth-card"><h2>Не удалось подключиться</h2>'+
      '<p class="note">Проверьте интернет-соединение и обновите страницу.<br>Техническое сообщение: '+esc(e.message||String(e))+'</p></div>';
  });
}

function showLoginForm(cb,note){
  var gate=document.getElementById('authGate');
  gate.innerHTML='<div class="auth-card">'+
    '<h2>Кодекс Ночи</h2><p class="sub">Вход для рассказчика и игроков</p>'+
    (note?'<p class="note">'+esc(note)+'</p>':'')+
    '<label for="authUser">Логин</label><input id="authUser" type="text" autocomplete="username" autocapitalize="off" autocorrect="off">'+
    '<label for="authPass">Пароль</label><input id="authPass" type="password" autocomplete="current-password">'+
    '<div class="err" id="authErr"></div>'+
    '<button class="mini pri" type="button" id="authGo">Войти</button>'+
    '<p class="sub switch">Ещё нет аккаунта? <a id="authToReg">Зарегистрироваться</a></p>'+
    '</div>';
  var user=document.getElementById('authUser'),pass=document.getElementById('authPass'),
      err=document.getElementById('authErr'),go=document.getElementById('authGo');
  function submit(){
    var u=user.value.trim().toLowerCase(),p=pass.value;
    err.textContent='';
    if(!u||!p){err.textContent='Заполните логин и пароль.';return;}
    go.disabled=true;go.textContent='Проверка…';
    sha256Hex(p).then(function(hash){
      var uid=fbAuth.currentUser.uid;
      return fbDb.collection('sessions').doc(uid).set({username:u,passwordHash:hash,createdAt:firebase.firestore.FieldValue.serverTimestamp()})
        .then(function(){return fbDb.collection('users').doc(u).get();});
    }).then(function(ud){
      var data=ud.data();
      SESSION={uid:fbAuth.currentUser.uid,username:u,role:data.role,displayName:data.displayName||u};
      gate.classList.add('hidden');renderUserBadge();cb();
    }).catch(function(){
      go.disabled=false;go.textContent='Войти';
      err.textContent='Неверный логин или пароль.';
    });
  }
  go.addEventListener('click',submit);
  pass.addEventListener('keydown',function(e){if(e.key==='Enter')submit();});
  document.getElementById('authToReg').addEventListener('click',function(){showRegisterForm(cb);});
  user.focus();
}

function showRegisterForm(cb){
  var gate=document.getElementById('authGate');
  gate.innerHTML='<div class="auth-card">'+
    '<h2>Кодекс Ночи</h2><p class="sub">Регистрация игрока</p>'+
    '<label for="regUser">Логин</label><input id="regUser" type="text" autocomplete="username" autocapitalize="off" autocorrect="off">'+
    '<label for="regPass">Пароль</label><input id="regPass" type="password" autocomplete="new-password">'+
    '<label for="regPass2">Повторите пароль</label><input id="regPass2" type="password" autocomplete="new-password">'+
    '<div class="err" id="regErr"></div>'+
    '<button class="mini pri" type="button" id="regGo">Зарегистрироваться</button>'+
    '<p class="sub switch">Уже есть аккаунт? <a id="regToLogin">Войти</a></p>'+
    '</div>';
  var user=document.getElementById('regUser'),pass=document.getElementById('regPass'),pass2=document.getElementById('regPass2'),
      err=document.getElementById('regErr'),go=document.getElementById('regGo');
  function submit(){
    var u=user.value.trim().toLowerCase(),p=pass.value,p2=pass2.value;
    err.textContent='';
    if(!u||!p){err.textContent='Заполните логин и пароль.';return;}
    if(!/^[a-z0-9_]+$/.test(u)){err.textContent='Логин — латиница, цифры и «_», без пробелов.';return;}
    if(p.length<4){err.textContent='Пароль слишком короткий (мин. 4 символа).';return;}
    if(p!==p2){err.textContent='Пароли не совпадают.';return;}
    go.disabled=true;go.textContent='Создание…';
    sha256Hex(p).then(function(hash){
      return fbDb.collection('users').doc(u).set({passwordHash:hash,role:'player',displayName:u,createdAt:firebase.firestore.FieldValue.serverTimestamp()})
        .catch(function(e){e.__step='create';throw e;})
        .then(function(){
          var uid=fbAuth.currentUser.uid;
          return fbDb.collection('sessions').doc(uid).set({username:u,passwordHash:hash,createdAt:firebase.firestore.FieldValue.serverTimestamp()})
            .catch(function(e){e.__step='session';throw e;});
        });
    }).then(function(){
      SESSION={uid:fbAuth.currentUser.uid,username:u,role:'player',displayName:u};
      gate.classList.add('hidden');renderUserBadge();cb();
    }).catch(function(e){
      go.disabled=false;go.textContent='Зарегистрироваться';
      var code=(e&&e.code)?String(e.code).replace(/^firestore\//,''):'';
      console.error('Регистрация не удалась',e&&e.__step,code,e);
      if(e&&e.__step==='session') err.textContent='Аккаунт создан, но не получилось сразу войти — обновите страницу и войдите с этим логином и паролем.';
      else if(code==='permission-denied') err.textContent='Такой логин уже занят. Попробуй другой.';
      else err.textContent='Не получилось создать аккаунт'+(code?' (код ошибки: '+code+')':'')+'. Попробуй ещё раз или напиши мастеру.';
    });
  }
  go.addEventListener('click',submit);
  pass2.addEventListener('keydown',function(e){if(e.key==='Enter')submit();});
  document.getElementById('regToLogin').addEventListener('click',function(){showLoginForm(cb);});
  user.focus();
}

function loadAdminUsers(){
  var box=document.getElementById('adminUserList');
  fbDb.collection('users').get().then(function(qs){
    if(qs.empty){box.className='empty';box.innerHTML='<b>Пусто</b><span>Учётных записей пока нет.</span>';return;}
    box.className='';
    var rows=[];
    qs.forEach(function(doc){rows.push({u:doc.id,role:doc.data().role,name:doc.data().displayName||doc.id});});
    rows.sort(function(a,b){return a.u<b.u?-1:1;});
    box.innerHTML=rows.map(function(r){
      return '<div class="admin-row" data-u="'+esc(r.u)+'">'+
        '<div class="who"><b>'+esc(r.name)+'</b><span>@'+esc(r.u)+'</span></div>'+
        '<select class="mini roleSel"'+(r.u===SESSION.username?' disabled title="Свою роль поменять нельзя — это защита от случайного понижения себя"':'')+'>'+['player','master','admin'].map(function(k){
          return '<option value="'+k+'"'+(k===r.role?' selected':'')+'>'+ROLE_NAMES[k]+'</option>';}).join('')+'</select>'+
        '<button class="mini" type="button" data-act="reset">Сбросить пароль</button>'+
        (r.u!==SESSION.username?'<button class="mini" type="button" data-act="del">Удалить</button>':'')+
        '</div>';
    }).join('');
    [].forEach.call(box.querySelectorAll('.admin-row'),function(row){
      var u=row.getAttribute('data-u');
      var rs=row.querySelector('.roleSel'),was=rs.value;
      rs.addEventListener('change',function(e){
        var nv=e.target.value;
        if(!confirm('Сменить роль «'+u+'» на «'+ROLE_NAMES[nv]+'»?')){rs.value=was;return;}
        fbDb.collection('users').doc(u).update({role:nv}).then(function(){was=nv;})
          .catch(function(er){rs.value=was;alert('Не получилось: '+(er.message||er));});
      });
      row.querySelector('[data-act="reset"]').addEventListener('click',function(){
        var np=prompt('Новый пароль для «'+u+'»:');
        if(!np)return;
        sha256Hex(np).then(function(hash){return fbDb.collection('users').doc(u).update({passwordHash:hash});})
          .then(function(){alert('Пароль обновлён.');});
      });
      var delBtn=row.querySelector('[data-act="del"]');
      if(delBtn)delBtn.addEventListener('click',function(){
        if(confirm('Удалить учётную запись «'+u+'»?'))fbDb.collection('users').doc(u).delete().then(loadAdminUsers);
      });
    });
  }).catch(function(e){box.innerHTML='<b>Ошибка загрузки</b><span>'+esc(e.message||String(e))+'</span>';});
}

function pcOwnerOf(x){return x&&x.owner?String(x.owner).toLowerCase():null;}
function isLivePc(x){return !!x && !!fbDb && (x._liveKind==='pcs' || (PCS.indexOf(x)>-1 && !!pcOwnerOf(x)));}
function canEditLivePc(x){
  if(!SESSION) return false;
  if(x._liveKind==='pcs') return pcOwnerOf(x)===SESSION.username;
  if(SESSION.role==='admin'||SESSION.role==='master') return true;
  return pcOwnerOf(x)===SESSION.username;
}

function stopPcSync(){ if(pcstateUnsub){pcstateUnsub();pcstateUnsub=null;} }

function startPcSyncIfLive(x){
  stopPcSync();
  if(!isLivePc(x)) return;
  var key=trkKey(x),id=x.id;
  pcstateUnsub=fbDb.collection('pcstate').doc(id).onSnapshot(function(doc){
    PCSTATE_CACHE[key]=doc.exists?doc.data():trkDefault(x);
    refreshTrackers(key);
  },function(){
  });
}

function pcSyncWrite(x,st){
  if(!isLivePc(x)||!canEditLivePc(x)) return;
  var data={};for(var k in st) data[k]=st[k];
  data.updatedAt=firebase.firestore.FieldValue.serverTimestamp();
  data.updatedBy=SESSION.username;
  var col=x._liveKind==='pcs'?'pcs':'pcstate';
  fbDb.collection(col).doc(x.id).set(data,{merge:true}).catch(function(){
  });
}

function pcFormRead(){
  function v(id){var el=document.getElementById(id);return el?el.value.trim():'';}
  var name=v('pcf_name');
  if(!name) return {err:'Укажите имя персонажа.'};
  function rows(n,idA,idB){var out=[];for(var i=0;i<n;i++){var a=v(idA+i),b=v(idB+i);if(a||b)out.push([a,b]);}return out;}
  var data={
    name:name,short:v('pcf_short'),clan:v('pcf_clan'),sect:v('pcf_sect'),
    gen:v('pcf_gen')?+v('pcf_gen'):null,bp:v('pcf_bp')!==''?+v('pcf_bp'):0,
    predator:v('pcf_pred'),sire:v('pcf_sire'),
    concept:rows(4,'pcf_cL','pcf_cT'),
    convictions:rows(3,'pcf_bB','pcf_bA'),
    track:{humanity:v('pcf_hum')!==''?+v('pcf_hum'):7,hunger:v('pcf_hun')!==''?+v('pcf_hun'):1}
  };
  return {data:data};
}

  var data=pcToFs(r.data),btn=document.querySelector('[data-pcf="save"]');
  if(btn){btn.disabled=true;btn.textContent='Сохранение…';}
  var p;
  if(existing&&existing.id){
    data.updatedAt=firebase.firestore.FieldValue.serverTimestamp();
    data.updatedBy=SESSION.username;
    p=fbDb.collection('pcs').doc(existing.id).set(data,{merge:true}).then(function(){return existing.id;});
  } else {
    data.owner=SESSION.username;
    data.attrs={};data.skills={};data.disciplines=[];data.advantages=[];
    var dv=pcDerived(data);
    data.hunger=data.track.hunger;data.hMax=dv.hMax;data.hSup=0;data.hAgg=0;
    data.wMax=dv.wMax;data.wSup=0;data.wAgg=0;data.hum=data.track.humanity;data.stains=0;
    data.createdAt=firebase.firestore.FieldValue.serverTimestamp();
    data.updatedAt=firebase.firestore.FieldValue.serverTimestamp();
    data.updatedBy=SESSION.username;

  p.then(function(newId){
    closePcForm();
    location.hash='#/coterie/'+newId;
    if(location.hash==='#/coterie/'+newId) rerenderCoterieIfOpen();
  }).catch(function(e){
    if(btn){btn.disabled=false;btn.textContent=existing&&existing.id?'Сохранить':'Создать персонажа';}
    if(err) err.textContent=(e&&e.code==='permission-denied')
      ? 'Firestore отказал в доступе. Похоже, в Firebase Console ещё не опубликованы обновлённые правила (firestore.rules, коллекция pcs) — вставьте файл целиком в Firestore Database → Rules → Publish и попробуйте снова.'
      : 'Не получилось: '+esc(e.message||String(e));
  });

function openPcForm(existing,mountId){
  var box=document.getElementById(mountId);
  if(!box) return;
  box.innerHTML=pcFormHtml(existing||{});
  box.scrollIntoView({behavior:'smooth',block:'start'});
  [].forEach.call(box.querySelectorAll('[data-pcf]'),function(btn){
    btn.addEventListener('click',function(){
      var a=btn.getAttribute('data-pcf');
      if(a==='save') pcFormSave(existing);
      else if(a==='cancel'){box.innerHTML='';}
      else if(a==='del'){
        if(!existing||!existing.id) return;
        if(!confirm('Удалить персонажа «'+existing.name+'» без возможности восстановить?')) return;

          .catch(function(e){alert('Не получилось: '+(e.message||e));});
      }
    });
  });
}

var GM_LAYER_EMBED=null;
var GM_STATE={source:null,updatedAt:null,by:null,count:0,miss:[],error:null};
var gmUnsub=null;

function gmTarget(cat,id){
  if(cat==='pcs') return findIn(PCS,id);
  var c=catById(cat);return c?findIn(c.arr,id):null;
}
function gmHosts(){
  var out=PCS.slice();
  CATS.forEach(function(c){(c.arr||[]).forEach(function(x){out.push(x);});});
  return out;
}
function dropGml(arr){if(!arr)return;for(var i=arr.length-1;i>=0;i--)if(arr[i]&&arr[i]._gml)arr.splice(i,1);}
function removeGmLayer(){
  gmHosts().forEach(function(x){dropGml(x.blocks);dropGml(x.ties);});
  dropGml(RELATIONS);dropGml(BONDS);dropGml(BOONS);
  GM_STATE.count=0;GM_STATE.miss=[];
}
function applyGmLayer(L){
  removeGmLayer();
  if(!L) return;
  var n=0,miss=[];
  (L.notes||[]).forEach(function(note){
    var x=gmTarget(note.cat,note.id);
    if(!x){miss.push((note.cat||'?')+' / '+(note.id||'?'));return;}
    (note.blocks||[]).forEach(function(b){
      var nb={};for(var k in b)if(k!=='after')nb[k]=b[k];nb.gm=true;nb._gml=true;
      x.blocks=x.blocks||[];
      var i=-1;if(b.after)for(var q=0;q<x.blocks.length;q++)if(x.blocks[q].t===b.after&&!x.blocks[q]._gml){i=q;break;}
      if(i<0)x.blocks.push(nb);
      else{var j=i+1;while(j<x.blocks.length&&x.blocks[j]._gml)j++;x.blocks.splice(j,0,nb);}
      n++;
    });
    (note.ties||[]).forEach(function(t){
      x.ties=x.ties||[];x.ties.push({text:typeof t==='string'?t:(t.text||''),gm:true,_gml:true});n++;
    });
  });
  [['relations',RELATIONS],['bonds',BONDS],['boons',BOONS]].forEach(function(p){
    (L[p[0]]||[]).forEach(function(r){var o={};for(var k in r)o[k]=r[k];o.gm=true;o._gml=true;p[1].push(o);n++;});
  });
  GM_STATE.count=n;GM_STATE.miss=miss;
}
function gmRerender(){
  IDX=null;
  if(!SESSION||!document.getElementById('app')) return;
  var y=window.scrollY;dispatch();window.scrollTo(0,y);activateRolls(app);
}
function startGmLayer(){
  if(gmUnsub){gmUnsub();gmUnsub=null;}
  if(GM_LAYER_EMBED){applyGmLayer(GM_LAYER_EMBED);GM_STATE.source='embed';return;}
  if(!fbDb||!canGm()) return;
  gmUnsub=fbDb.collection('gmlayer').doc('main').onSnapshot(function(d){
    if(!d.exists){removeGmLayer();GM_STATE.source='none';GM_STATE.error=null;}
    else{
      var v=d.data();
      try{applyGmLayer(JSON.parse(v.json||'{}'));GM_STATE.source='firestore';GM_STATE.error=null;
        GM_STATE.updatedAt=v.updatedAt&&v.updatedAt.toDate?v.updatedAt.toDate():null;GM_STATE.by=v.by||null;}
      catch(e){removeGmLayer();GM_STATE.error='Сохранённый слой не читается: '+(e.message||e);}
    }
    gmRerender();
  },function(e){GM_STATE.error=(e&&e.code==='permission-denied')
      ?'Firestore не пустил к мастерскому слою. Проверьте, что в консоли Firebase опубликованы правила с блоком gmlayer (файл firestore.rules целиком).'
      :'Не удалось загрузить мастерский слой: '+(e.message||e);
    gmRerender();});
}

function gmValidate(L){
  if(!L||typeof L!=='object') return 'Это не файл мастерского слоя.';
  if(!Array.isArray(L.notes)||!Array.isArray(L.relations)) return 'В файле нет разделов notes и relations — это не gm-layer.json.';
  return '';
}

  setTheme('court');crumb([['Мастерский слой']]);
  var st;
  if(GM_STATE.source==='embed') st='Предпросмотр: слой встроен прямо в этот файл.';

  else if(GM_STATE.source==='firestore') st='Слой загружен: <b>'+GM_STATE.count+'</b> '+plural(GM_STATE.count,'тайна','тайны','тайн')+
    (GM_STATE.updatedAt?' · обновлён '+esc(GM_STATE.updatedAt.toLocaleString('ru-RU')):'')+(GM_STATE.by?' · загрузил '+esc(GM_STATE.by):'');
  else if(GM_STATE.source==='none') st='Слой ещё ни разу не загружали.';
  else st='Слой загружается…';
  var miss=GM_STATE.miss.length?'<div class="note"><b>Не нашлись заметки</b>Тайны для этих записей есть в слое, но самих записей на сайте нет — возможно, сайт старее слоя: '+esc(GM_STATE.miss.join(', '))+'</div>':'';
  var up=fbDb?'<div class="panel"><h4>Обновить слой</h4><p>Выберите файл <b>gm-layer.json</b> из папки Kodeks_Nochi_master на компьютере рассказчика. Он заменит весь слой целиком.</p>'+
      '<input type="file" id="gmFile" accept=".json,application/json"> <button class="mini pri" type="button" id="gmUp">Загрузить</button>'+
      '<div class="u-mt10 u-c-bad err" id="gmErr"></div></div>':'';

  d.concept=rows(d.concept,'l','t');
  d.convictions=rows(d.convictions,'c','a');
  d.disciplines=(d.disciplines||[]).map(function(r){return Array.isArray(r)?[r[0],+r[1]||0,r[2]||'']:[r.n||'',+r.d||0,r.p||''];});
  d.advantages=(d.advantages||[]).map(function(r){return Array.isArray(r)?r:[r.n||'',+r.d||0,r.k||'merit',r.t||'',!!r.l];});
  return d;
}
function pcToFs(data){
  var o={};for(var k in data)o[k]=data[k];
  if(o.concept) o.concept=o.concept.map(function(r){return {l:r[0]||'',t:r[1]||''};});
  if(o.convictions) o.convictions=o.convictions.map(function(r){return {c:r[0]||'',a:r[1]||''};});
  if(o.disciplines) o.disciplines=o.disciplines.map(function(r){return {n:r[0]||'',d:+r[1]||0,p:r[2]||''};});
  if(o.advantages) o.advantages=o.advantages.map(function(r){return {n:r[0]||'',d:+r[1]||0,k:r[2]||'merit',t:r[3]||'',l:!!r[4]};});

function scoreEntry(e,words){
  var total=0,why='',ti=-1,hitW='';
  for(var i=0;i<words.length;i++){var w=words[i],r=scoreWord(e,w),f=1;
    [1,2].forEach(function(cut){if(words[i].length<4+cut)return;var w2=words[i].slice(0,-cut),r2=scoreWord(e,w2);
      if(r2.s*.8>r.s*f){r=r2;f=.8;w=w2;}});
    if(!r.s)return null;
    total+=r.s*f;if(r.why&&!why)why=r.why;if(r.ti>-1&&ti<0){ti=r.ti;hitW=w;}}
  if(!e.real)total*=.6;
  return {e:e,s:total,why:why,ti:ti,w:hitW};
}
function searchHits(v){
  if(!IDX)buildIndex();
  var words=v.toLowerCase().split(/\s+/).filter(Boolean);if(!words.length)return [];
  return IDX.map(function(e){return scoreEntry(e,words);}).filter(Boolean)
    .sort(function(a,b){return b.s-a.s||a.e.name.length-b.e.name.length;}).slice(0,12);
}
function hl(s,q){var i=s.toLowerCase().indexOf(q);if(!q||i<0)return esc(s);return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+q.length))+'</mark>'+esc(s.slice(i+q.length));}
function initSearch(){
  var q=document.getElementById('q'),res=document.getElementById('qres'),sel=0,hits=[];
  function run(){
    var v=q.value.trim().toLowerCase();
    if(!v){res.hidden=true;return;}
    hits=searchHits(v);var w0=v.split(/\s+/)[0];
    sel=0;
    res.innerHTML=hits.length?hits.map(function(h,i){var sn='';
      if(h.ti>-1){var a=Math.max(0,h.ti-40);sn=(a?'…':'')+h.e.text.slice(a,h.ti+70)+'…';}
      return '<a href="'+h.e.href+'" class="'+(i===0?'on':'')+'"><span class="t">'+hl(h.e.name,w0)+'</span><span class="c">'+esc(h.e.cat)+'</span>'+
        (h.why?'<span class="g">'+esc(h.why)+'</span>':'')+
        (sn?'<span class="s">'+hl(sn,h.w||w0)+'</span>':'')+'</a>';}).join(''):'<div class="none">Ничего не найдено. Кодекс пока почти пуст — поиск оживёт вместе с заметками.</div>';
    res.hidden=false;
  }
  q.addEventListener('input',run);q.addEventListener('focus',run);
  q.addEventListener('keydown',function(e){var as=res.querySelectorAll('a');
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!as.length)return;as[sel].classList.remove('on');
      sel=(sel+(e.key==='ArrowDown'?1:-1)+as.length)%as.length;as[sel].classList.add('on');as[sel].scrollIntoView({block:'nearest'});}
    else if(e.key==='Enter'){if(as[sel]){location.hash=as[sel].getAttribute('href');res.hidden=true;q.blur();}}
    else if(e.key==='Escape'){res.hidden=true;q.blur();}});
  res.addEventListener('click',function(){res.hidden=true;q.value='';});
  document.addEventListener('click',function(e){if(!e.target.closest('.srch'))res.hidden=true;});
  document.addEventListener('keydown',function(e){if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();q.focus();}});
}

function dispatch(){
  stopPcSync();
  var h=location.hash.replace(/^#\/?/,''),m;
  if(!h){viewHome();return 'top';}
  if(h==='world'||h==='cons'||h==='tools'||h==='cats'){viewHome(h);return 'anchor';}
  if((m=/^cat\/([\w-]+)$/.exec(h))){var c=catById(m[1]);if(c){viewList(c);return 'top';}}
  if((m=/^tool\/([\w-]+)$/.exec(h))){var t=toolById(m[1]);if(t){TOOL_VIEWS[t.id](t);return 'top';}}
  if((m=/^pc\/([\w-]+)$/.exec(h))){viewPC(m[1]);return 'top';}
  if((m=/^coterie\/([\w-]+)$/.exec(h))){viewLivePC(m[1]);return 'top';}
  if((m=/^player\/([\w-]+)$/.exec(h))){viewPlayer(m[1]);return 'top';}
  if(h==='master/gm'){if(canGm()){viewGmLayer();return 'top';}viewHome();return 'top';}
  if(h==='admin/users'){if(SESSION&&SESSION.role==='admin'){viewAdminUsers();return 'top';}viewHome();return 'top';}
  if((m=/^([\w-]+)\/([\w-]+)$/.exec(h))){var cc=catByRoute(m[1]);
    if(m[1]==='domain'&&!findIn(DOMAINS,m[2])&&findIn(PLACES,m[2])){location.replace('#/place/'+m[2]);return 'keep';}
    if(cc){viewEntry(cc,m[2]);return cc.kind==='cards'&&!cc.full?'keep':'top';}}
  viewHome();return 'top';
}
function route(){var r=dispatch();if(r==='top')window.scrollTo(0,0);activateRolls(app);}
window.addEventListener('hashchange',route);
bootAuth(function(){
  initDock();
  initSearch();
  initSession();
  startCoterieSync();
  startGmLayer();
  route();
});
</script>
