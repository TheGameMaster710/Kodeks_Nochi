  blocks:[
   {t:'До Объятия', text:'Родом из Англии. При жизни был торговцем и мошенником и всерьёз увлекался эзотерикой.'},
   {t:'Ссора с Камарильей', text:'Камарилья запрещала напрямую продавать обычным людям то, что доступно вампиру. Джоуэл за деньги обращал людей в гулей, и за это его преследовали.\n\nЕго имя стало нарицательным. Когда вампир берёт со смертных деньги за дар крови, старые сородичи до сих пор говорят о нём: «Торгует, как Пэйн».'},
   {t:'Новый Свет', text:'В Америку он приплыл вместе с революционерами. Ему нужна была свобода от Камарильи, но ещё больше его интересовали магические практики коренного населения. Знания у коренных жителей он добывал Доминированием и торговлей, которая обычно была выгодна ему, а не им.'},
   {t:'Ячейка', text:'В ячейке было около пятнадцати Тремер, и всех объединяла одна идея: с помощью магии коренных американцев найти для магии Тремер новые направления и применения. Джоуэл был их идейным лидером.\n\nДвое из ячейки, его потомки и ученики, в ночь войны присягнули Камарилье. Они отказались от его учения и позволили стереть себе память о нём. Стирала её сама [[Геката]], и восстановить эту память невозможно.'},
   {t:'Характер', text:'Глубокий старик, одержимый безумной идеей и жадный до денег. Он постоянно потирал руки и говорил слегка возбуждённо, будто всё время чего-то ждал.\n\nДва других главы, [[Эва Сэймур]] и [[Воробей]], его мало волновали. Пока они не мешали его исследованиям, он о них не думал.\n\nВоробей прислал ему [[Кольцо клуба Воробья|кольцо-приглашение]] в свой клуб в знак того, что признаёт его товарищем по делу Анархов. Джоуэл его носил, но в клуб так ни разу и не пришёл. После его падения перстень отправили в сокровищницу клуба «[[Эден]]», и там ли он сейчас, неизвестно.'},
   {t:'Дело', text:'Зарабатывал торговлей, мошенничеством и продажей магических услуг. К нему шли в основном богатые горожане, которые хотели научиться колдовать или жить вечно, и солдаты, которым нужны были силы перед сражением.'},
   {t:'Сила', text:'Могущественный доминатор. Его главной техникой считается «Манипулирование массами»: она позволяла держать под контролем до десяти человек одновременно.\n\nХодят слухи, что его гули умели колдовать.'},
   {t:'Изыскания', text:'Он искал способы развить магию вампиров, и что-то у него, судя по всему, получилось: его дневник и все копии дневника считаются еретическими.\n\nОн похищал обычных жителей и ставил на них опыты. Цель этих опытов Камарилья засекретила и признала еретической.'},
   {t:'Особняк', text:'В особняке были библиотека, лаборатория и небольшое жилое помещение, где могла проводить день вся ячейка. Сейчас это убежище Камарильи, а подвал с лабораторией замурован по приказу Гекаты.'},
   {t:'Падение', text:'В ночь [[Война Гекаты|Войны Гекаты]] он пал вторым. Когда [[Геката]] вошла в его логово, он натравил на неё десяток своих гулей, а потом попытался подчинить её Доминированием. Она только улыбнулась и размозжила ему голову о ближайшую стену. На рассвете его вместе с двумя другими лидерами вынесли под солнце.\n\nПрисягнувшие запомнили, что за всю ночь она улыбнулась только раз. С тех пор её улыбка считается при Дворе дурным знаком.'},
   {t:'Дневник', text:'Своё учение он записывал в кожаный фолиант, в котором было около 250 страниц ([[Дневник Джоуэла Пэйна]]). Камарилья признала эти записи еретическими и уничтожила, но страницы его изысканий до сих пор время от времени находят у Анархов.\n\nСтраницу легко узнать. Это пожелтевшая, потёртая от времени бумага с чёрной ажурной рамкой по краю. Текст написан кровью на древнеанглийском. Встречаются и подделки, которые продают доверчивым.\n\nНайденные страницы Камарилья отбирает, а их владельца отдаёт под суд.'},
   {t:'Собиратели', text:'Ячейка Анархов из клана [[Носферату]] собирает его учение по найденным страницам и обрывкам. Возглавляет её [[Дэвид Палумбо]], а обитает она где-то на кладбище Вудлон. Эти Анархи хотят возродить и учение, и его самого. Из трёх урн с прахом старых Анархов им нужна только его урна.'},
   {t:'След у смертных', text:'В людской истории та зима запомнилась тем, что при загадочных обстоятельствах исчезли сразу несколько богатейших жителей Нью-Йорка.'},
   {t:'Память', text:'Джоуэл считается исторической личностью, и говорить о нём как о части истории города можно. Но писать о нём разрешено только в книгах, доступных вампирам, а не простым людям. Его учение признано еретическим и запрещено для всех.\n\nКамарильские считают его безумным стариком, который занимался ересью и ставил опыты на людях. Анархи считают его просто безумцем.\n\nЕго золото было обычной казной. [[Дневник Джоуэла Пэйна|Страницы его дневника]] ценятся гораздо выше.'},

   {t:'Кому их вручали', text:'[[Джоуэл Пэйн]] получил кольцо как знак того, что Воробей признаёт его товарищем по делу Анархов. Джоуэл носил его на правой руке, но в клуб по этому приглашению так ни разу и не пришёл. После его падения перстень отправили в сокровищницу клуба «[[Эден]]». Там ли он до сих пор, неизвестно. Тех, кто собирает страницы его дневника, эта вещь не интересует.\n\n[[Эва Сэймур]] кольца не получила. У некоторых участниц её ячейки они были.'},

   {t:'Что оно даёт', text:'Силы в кольце нет. Его действие держится на уважении Анархов к собственной истории: кольцо буквально означает, что его владельца признали Анархом.\n\nЕго нужно носить на виду. Тогда Анархи принимают владельца за своего и относятся к нему как к собрату со Статусом 0, даже если хорошо знают, что он из Камарильи. Тому, кто и так принадлежит к секте, кольцо даёт 1 дополнительную точку Статуса в ней.\n\nКольцо не спасает того, чья репутация среди Анархов уже испорчена. При Статусе −2 или ниже своим его всё равно не считают, а кольцо на его руке только вызывает вопросы.\n\nКольцо с выбитым или заменённым камнем Анархи признают так же, как целое.'},

   {t:'Закон Камарильи', text:'Носить символы Анархов по законам Камарильи запрещено. Вампира, который появился с таким кольцом при Дворе, сразу хватают и ведут на суд. Если найдутся другие доказательства его анархических дел, его накажут в соответствии с ними.\n\nСами кольца Камарилья изымает и уничтожает как имущество Анархов.'},
   {t:'Аукционы', text:'Когда кольцо всплывает на аукционе, им обычно интересуются сразу обе стороны, и Камарилья, и Анархи. Кольцо стоит 2 точки Ресурсов. У покупателя Ресурсы снижаются на 2 до конца текущей истории, у продавца на тот же срок повышаются на 2. Потом уровень возвращается к прежнему.\n\nПродавец расплачивается репутацией. Он получает −2 к Статусу у той стороны, которой кольцо не досталось. Если кольцо купил смертный, продавец получает −1 к Статусу у обеих сторон.'},

function wikiTag(target,label){

function inl(s){return esc(s)
  .replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g,function(_,t,l){return wikiTag(t,l);})
  .replace(/\[\[([^\]]+)\]\]/g,function(_,t){return wikiTag(t,t);})
  .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
function md(s){ if(s==null) return ''; var p=String(s).split(/\n{2,}/);

    br(x2,y2,a+R(.2,.6),len*.72,d+1);br(x2,y2,a-R(.2,.6),len*.72,d+1);}
  br(500,500,Math.PI/2,140,0);return s+'</svg>';}

var GM_VIEW=true;

/* Одно имя — одна строка связи (v1.52): тайная связь с тем же персонажем, что
   и открытая, не даёт вторую строку, а дописывается к первой выделенной
   частью (.gm-inl). Ключ — первая [[ссылка]] строки; тайная строка без
   открытой пары выводится отдельно, как раньше. */
function tieKey(t){var s=typeof t==='string'?t:(t&&t.text)||'';var m=s.match(/^\s*\[\[([^\]|]+)/);return m?m[1].trim():null;}
function tieRows(ties){
  var rows=[];
  ties.forEach(function(t){
    var isGm=typeof t!=='string'&&t.gm,text=typeof t==='string'?t:(t.text||''),k=tieKey(t);
    if(isGm&&k){
      for(var i=0;i<rows.length;i++)if(!rows[i].gm&&rows[i].key&&same(rows[i].key,k)){
        rows[i].parts.push(text.replace(/^\s*\[\[[^\]]+\]\]\s*[—–-]\s*/,''));return;}
    }
    rows.push({key:k,gm:!!isGm,text:text,parts:[]});
  });
  return rows;
}
function commonTail(x){

  var tr=tieRows((x.ties||[]).filter(gmOk));
  if(tr.length) out+=section('Связи',tr.length,'<div class="panel"><ul>'+tr.map(function(r){
    if(r.gm) return '<li class="gm-li">'+md(r.text)+' '+gmBadge()+'</li>';
    return '<li>'+md(r.text)+r.parts.map(function(p){return ' <span class="gm-inl">'+gmBadge()+' '+md(p)+'</span>';}).join('')+'</li>';}).join('')+'</ul></div>');
  if(typeof localWebHtml==='function') out+=localWebHtml(x);
  out+=playlistHtml(x.playlist);
  out+=backlinksHtml(x);
  return out;
}

function strings(o,acc){acc=acc||[];

  else if(Array.isArray(o)) o.forEach(function(v){strings(v,acc);});
  else if(o&&typeof o==='object'){ if(o.gm&&!gmOn()) return acc; for(var k in o) if(k!=='id'&&k!=='acc'&&k!=='acc2'&&k!=='shape') strings(o[k],acc);}
  return acc;}
function allEntries(){

  SESSIONS.forEach(function(s){out.push({x:s,href:'#/cons',cat:'журнал',name:'Сессия '+s.n});});
  CHRON.forEach(function(c,i){out.push({x:c,href:'#/tool/chron',cat:c.kind==='memoriam'?'мемориам':'хроника',name:c.title||c.when||('Ночь '+(i+1))});});
  if(CHRONICLE.premise.length||CHRONICLE.history.length) out.push({x:CHRONICLE,href:'#/world',cat:'хроника',name:CHRONICLE.title||'Заглавная заметка'});

}
function mentions(x){
  var names=[x.name].concat(x.aliases||[]).concat(x.full?[x.full]:[]);
  return allEntries().filter(function(e){
    if(e.x===x) return false;
    var txt=strings(e.x).join('\n');
    return names.some(function(n){return n&&(txt.indexOf('[['+n+']]')>-1||txt.indexOf('[['+n+'|')>-1);});
  });
}
function backlinksHtml(x){

}

/* ================= КАРТОЧКИ СПИСКОВ ================= */
function chipsFor(c,x){
  var ch=[];
  if(c.id==='clans'){(x.disciplines||[]).forEach(function(d){ch.push(d);});}
  else if(c.id==='disciplines'){if(x.kind)ch.push(x.kind);if(x.resonance)ch.push(x.resonance);ch.push((x.powers||[]).length+' сил');}
  else if(c.id==='loresheets'){if(x.year!=null)ch.push(String(x.year));if((x.levels||[]).length)ch.push(x.levels.length+' ступеней');}
  else if(c.id==='sects'){var m=membersOf('sect',x);ch.push(m.length+' '+plural(m.length,'член','члена','членов'));}
  else if(c.id==='people'){[x.clan,x.sect,x.role,x.gen?x.gen+'-е пок.':''].forEach(function(v){if(v)ch.push(v);});}
  else if(c.id==='threats'){if(x.kind)ch.push(x.kind);}
  else if(c.id==='domains'){if(x.kind&&DOMAIN_KINDS[x.kind])ch.push(DOMAIN_KINDS[x.kind][0]);if(x.threat!=null)ch.push('угроза '+x.threat);}
  else (x.quick||[]).slice(0,3).forEach(function(q){ch.push(q[1]);});
  return ch;
}
function listCard(c,x){
  var ch=chipsFor(c,x);
  return '<a class="god-card'+(x.dead?' dead':'')+'" href="#/'+c.route+'/'+x.id+'" style="--c:'+(x.acc||c.c)+'">'+
    '<span class="k">'+numOf(c.arr,x)+' · '+esc(c.one.toUpperCase())+(x.dead?' · ☾ торпор':'')+'</span><h3>'+esc(x.name)+'</h3>'+
    (x.short?'<p class="pr">'+inl(x.short)+'</p>':'')+
    '<div class="foot">'+ch.map(function(v,i){return '<span class="chip'+(i===0?' hot':'')+'">'+esc(v)+'</span>';}).join('')+'</div></a>';
}
function ghostCard(label,name,chips,note){
  return '<div class="god-card ghost"><span class="k">'+esc(label)+' · ЗАМЕТКИ НЕТ</span><h3>'+esc(name)+'</h3>'+
    (note?'<p class="pr">'+esc(note)+'</p>':'')+
    '<div class="foot">'+(chips||[]).map(function(v){return '<span class="chip">'+esc(v)+'</span>';}).join('')+'</div></div>';
}
/* число активных заготовок-призраков раздела: CLAN_REF/DISC_REF для кланов
   и дисциплин (справочник книги), GHOSTS[c.id] для всех остальных разделов */

  if(c.id==='disciplines') return DISC_REF.filter(function(r){return !LINKS[r[0]];}).length;

function viewList(c){
  setTheme(c.theme);
  if(c.kind==='cards') return viewCards(c,null);
  if(c.kind==='tree') return viewPlaces();
  if(c.kind==='map') return viewDomains();
  if(c.id==='players') return viewPlayers();
  if(c.id==='loresheets') return viewLoresheets(c);

  if(c.id==='clans'){ghosts=CLAN_REF.filter(function(r){return !LINKS[r[0]];}).map(function(r){
    return ghostCard('КЛАН',r[0],r[1],'');}).join('');hint='Пунктирные карточки — заготовки из книги. Как только появится запись с тем же именем, заготовка исчезнет.';}
  else if(c.id==='disciplines'){ghosts=DISC_REF.filter(function(r){return !LINKS[r[0]];}).map(function(r){
    return ghostCard('ДИСЦИПЛИНА',r[0],r[1]!=='—'?['резонанс: '+r[1]]:[],'');}).join('');hint='Пунктирные карточки — заготовки из книги. Как только появится запись с тем же именем, заготовка исчезнет.';}
  else if(GHOSTS[c.id]&&GHOSTS[c.id].length){ghosts=GHOSTS[c.id].filter(function(n){return !LINKS[n];}).map(function(n){
    return ghostCard(c.one.toUpperCase(),n,[],'');}).join('');hint='Пунктирные карточки — упомянуты в заметках, но своей записи ещё нет. Как только появится запись с тем же именем, заготовка исчезнет.';}

/* Личности — клан теперь полноценная категория раздела, а не просто ключ
   сортировки: список делится на подразделы с заголовком и счётчиком, по
   одному на клан (алфавит, ru), плюс «Без клана» в конце для записей без
   поля clan. Заготовки-призраки (GHOSTS.people) клана не имеют — своей
   записи ещё нет, поэтому они идут отдельным подразделом в самом конце,
   а не внутри клановых групп. */
function viewPeople(c){
  var groups={},order=[];
  c.arr.forEach(function(x){var g=x.clan||'Без клана';
    if(!groups[g]){groups[g]=[];order.push(g);}groups[g].push(x);});
  order.sort(function(a,b){if(a==='Без клана')return b==='Без клана'?0:1;
    if(b==='Без клана')return -1;return a.localeCompare(b,'ru');});
  var gh=(GHOSTS.people||[]).filter(function(n){return !LINKS[n];});
  var sections=order.map(function(g){
    var list=groups[g].slice().sort(function(a,b){return (a.name||'').localeCompare(b.name||'','ru');});
    return '<div class="sec-head" style="margin:34px 0 14px"><h3>'+esc(g)+'</h3><span class="eyebrow">'+list.length+' '+plural(list.length,'запись','записи','записей')+'</span></div>'+
      '<div class="gods">'+list.map(function(x){return listCard(c,x);}).join('')+'</div>';});
  var inner=sections.join('');
  if(gh.length) inner+='<div class="sec-head" style="margin:34px 0 14px"><h3>Клан неизвестен</h3><span class="eyebrow">'+gh.length+' '+plural(gh.length,'заготовка','заготовки','заготовок')+'</span></div>'+
    '<div class="gods">'+gh.map(function(n){return ghostCard('ЛИЧНОСТЬ',n,[],'');}).join('')+'</div>';
  if(!order.length&&!gh.length) inner=emptyBox('Записей пока нет','Раздел ждёт первых заметок хроники.');
  else if(gh.length) inner+='<p class="hint">Пунктирные карточки — упомянуты в заметках, но своей записи ещё нет (клан пока неизвестен). Как только появится запись с тем же именем, заготовка исчезнет.</p>';
  listShell(c,inner);
}

/* Лоршиты — события истории города: карточки идут в хронологическом
   порядке (по году), а не как обычно (сперва настоящие записи, потом
   заготовки). Год настоящей записи — LORESHEETS[].year; год заготовки —
   справочник LORE_YEARS в p2_data.html (не хранится в самой GHOSTS,
   чтобы не усложнять общий формат заготовок остальных разделов). Запись
   или заготовка без известного года уходит в конец списка. */
function viewLoresheets(c){
  var gh=(GHOSTS.loresheets||[]).filter(function(n){return !LINKS[n];});
  var items=c.arr.map(function(x){return {y:x.year,html:listCard(c,x)};})
    .concat(gh.map(function(n){return {y:(typeof LORE_YEARS!=='undefined'?LORE_YEARS[n]:null),html:ghostCard('ЛОРШИТ',n,[],'')};}));
  items.sort(function(a,b){var ay=a.y==null?Infinity:a.y,by=b.y==null?Infinity:b.y;return ay-by;});
  var inner=items.length?'<div class="gods">'+items.map(function(i){return i.html;}).join('')+'</div>'
    :emptyBox('Записей пока нет','Раздел ждёт первых заметок хроники.');
  if(gh.length) inner+='<p class="hint">Карточки идут в хронологическом порядке. Пунктирные — упомянуты в заметках, но своей записи ещё нет; как только появится запись с тем же именем, заготовка исчезнет.</p>';
  listShell(c,inner);
}

/* компактные разделы: все записи — полные карточки на одной странице */
function fullCard(c,x){
  var par=[];
  if(c.id==='rituals'){par=[['Тип',x.kind],['Уровень',x.lvl],['Цена',x.cost],['Пул',x.pool],['Ингредиенты',x.ingredients]];}
  if(c.id==='predators'){par=[['Пул охоты',x.pool],['Даёт',(x.gains||[]).join('; ')]];}
  if(c.id==='merits'){par=[['Вид',x.kind],['Точки',x.dots]];}

/* ================= ЧЛЕНСТВО И ПОЛИТИКА ================= */
function membersOf(field,x){var names=[x.name].concat(x.aliases||[]);
  return allPeople().filter(function(p){return names.indexOf(p[field])>-1;});}
function personHref(p){return PCS.indexOf(p)>-1?'#/pc/'+p.id:'#/person/'+p.id;}
function personSub(p){return '<a class="subcard" href="'+personHref(p)+'" style="--c:'+(p.acc||'var(--acc)')+'">'+
  '<span class="k">'+(PCS.indexOf(p)>-1?'персонаж игрока':'личность')+(p.dead?' · ☾ торпор':'')+'</span><h4>'+esc(p.name)+'</h4>'+
  '<div class="ds">'+esc([p.clan,p.sect,p.role].filter(Boolean).join(' · ')||p.short||'')+'</div></a>';}
function politicsHtml(x){
  var n=x.name,out='';
  var bonds=BONDS.filter(gmOk).filter(function(b){return same(b.thrall,n)||same(b.regnant,n);});
  var boons=BOONS.filter(gmOk).filter(function(b){return same(b.debtor,n)||same(b.creditor,n);});
  /* v1.73 — связь показывается только «от хозяина страницы»: note — на
     странице a, noteB — на странице b (нет noteB — на странице b связи нет) */
  function relNote(r){return same(r.a,n)?(r.note||''):(r.noteB||'');}
  var rel=RELATIONS.filter(gmOk).filter(function(r){return same(r.a,n)||(same(r.b,n)&&r.noteB);});
  function gb(o){return o.gm?' '+gmBadge():'';}
  var sire=x.sire, childer=allPeople().filter(function(p){return same(p.sire,n);});
  var rows=[];
  if(sire) rows.push('<li>Сир: '+nameLink(sire)+'</li>');
  if(childer.length) rows.push('<li>Потомки: '+childer.map(function(p){return nameLink(p.name);}).join(', ')+'</li>');
  bonds.forEach(function(b){rows.push('<li>Кровные узы '+dots(b.level,3)+': '+nameLink(b.thrall)+' → '+nameLink(b.regnant)+(b.note?' — '+inl(b.note):'')+gb(b)+'</li>');});
  boons.forEach(function(b){var L=BOON_LEVELS[b.level]||['?',''];
    rows.push('<li>'+L[0]+' долг ('+(BOON_STATUS[b.status]||b.status)+'): '+nameLink(b.debtor)+' должен '+nameLink(b.creditor)+(b.why?' — '+inl(b.why):'')+gb(b)+'</li>');});
  /* одно имя — одна строка (v1.52): тайная связь с тем же персонажем
     дописывается к открытой выделенной частью, а не даёт вторую строку */
  var relRows=[];
  rel.forEach(function(r){var other=same(r.a,n)?r.b:r.a;
    if(r.gm)for(var i=0;i<relRows.length;i++)if(!relRows[i].r.gm&&same(relRows[i].other,other)){relRows[i].parts.push(r);return;}
    relRows.push({r:r,other:other,parts:[]});});
  relRows.forEach(function(w){var r=w.r,T=REL_TYPES[r.type]||REL_TYPES.other;
    rows.push('<li><span style="color:'+T[1]+'">'+T[0]+'</span>: '+nameLink(w.other)+(relNote(r)?' — '+inl(relNote(r)):'')+gb(r)+
      w.parts.map(function(p){var PT=REL_TYPES[p.type]||REL_TYPES.other,same_t=p.type===r.type;
        return ' <span class="gm-inl">'+gmBadge()+' '+(same_t?'':'<span style="color:'+PT[1]+'">'+PT[0]+'</span>'+(relNote(p)?': ':''))+inl(relNote(p))+'</span>';}).join('')+'</li>');});
  if(x.status) Object.keys(x.status).forEach(function(s){rows.push('<li>Статус ('+esc(s)+'): '+dots(statusNow(n,s,x.status[s]))+'</li>');});
  if(rows.length) out=section('Положение среди Сородичей',rows.length,'<div class="panel"><ul>'+rows.join('')+'</ul></div>');
  return out;
}

  shaped.filter(function(d){return !d.shape&&d.point;}).forEach(function(d){var K=DOMAIN_KINDS[d.kind]||['','#888'];

/* ================= ТРЕКЕРЫ ПЕРСОНАЖЕЙ ================= */
var TRK_OBJ={};
function trkKey(x){return (x._liveKind==='pcs'?'lpc:':PCS.indexOf(x)>-1?'pc:':PEOPLE.indexOf(x)>-1?'person:':'threat:')+x.id;}
function trkDefault(x){var t=x.track||{};
  return {hunger:t.hunger!=null?t.hunger:1,hMax:t.healthMax||7,hSup:0,hAgg:0,wMax:t.wpMax||5,wSup:0,wAgg:0,
    hum:t.humanity!=null?t.humanity:7,stains:0};}
function trkGet(key){var x=TRK_OBJ[key];if(!x)return null;
  var d=trkDefault(x);
  if(x._liveKind==='pcs'){
    /* самостоятельный чарник — снимок Firestore лежит прямо в x (см. p3h_coterie.js) */
    ['hunger','hMax','hSup','hAgg','wMax','wSup','wAgg','hum','stains'].forEach(function(k){if(x[k]!=null)d[k]=x[k];});
  } else if(isLivePc(x)){
    var live=PCSTATE_CACHE[key];
    if(live) for(var k in d) if(live[k]!=null) d[k]=live[k];
  } else {
    var s=STORE.get('trk:'+key,null);
    if(s) for(var k2 in d) if(s[k2]!=null) d[k2]=s[k2];
  }
  d.hMax=(x.track&&x.track.healthMax)||d.hMax;d.wMax=(x.track&&x.track.wpMax)||d.wMax;
  if(x._liveKind==='pcs'&&x.attrs){var dv=pcDerived(x);d.hMax=dv.hMax;d.wMax=dv.wMax;} /* интерактивный чарник: из атрибутов, p3j_sheet.js */
  return d;}
function trkSet(key,st){
  var x=TRK_OBJ[key];
  if(isLivePc(x)&&!canEditLivePc(x)){refreshTrackers(key);return;} /* нет прав на этот живой лист — откатываем показ к последнему известному состоянию */
  st.hunger=Math.max(0,Math.min(5,st.hunger));st.hum=Math.max(0,Math.min(10,st.hum));st.stains=Math.max(0,Math.min(10,st.stains));
  ['h','w'].forEach(function(p){var mx=st[p+'Max'];st[p+'Agg']=Math.max(0,Math.min(mx,st[p+'Agg']));st[p+'Sup']=Math.max(0,Math.min(mx-st[p+'Agg'],st[p+'Sup']));});
  STORE.set('trk:'+key,st); /* локальная копия всегда — офлайн-страховка, а для NPC/угроз это и есть единственное хранилище */
  if(x&&x._liveKind==='pcs') for(var sk in st) x[sk]=st[sk]; /* свой лист: сразу в объект — бросок видит новый Голод до ответа сервера, а предпросмотр без сервера вообще только так и работает */
  if(isLivePc(x)){if(x._liveKind!=='pcs')PCSTATE_CACHE[key]=st;pcSyncWrite(x,st);}
  refreshTrackers(key);}
function damage(st,p,kind,sign){
  var mx=st[p+'Max'];
  if(sign<0){if(kind==='s')st[p+'Sup']--;else st[p+'Agg']--;return;}
  var free=mx-st[p+'Sup']-st[p+'Agg'];
  if(kind==='s'){if(free>0)st[p+'Sup']++;else if(st[p+'Sup']>0){st[p+'Sup']--;st[p+'Agg']++;}}
  else{if(free>0)st[p+'Agg']++;else if(st[p+'Sup']>0){st[p+'Sup']--;st[p+'Agg']++;}}
}
function boxes(max,agg,sup){var s='';for(var i=0;i<max;i++){
  var c=i<agg?'a':i<agg+sup?'s':'';s+='<span class="box '+c+'" style="display:inline-grid;place-items:center;cursor:default">'+(c==='a'?'✕':c==='s'?'╱':'')+'</span>';}return s;}
function trkInner(key){
  var x=TRK_OBJ[key],live=isLivePc(x);
  if(live&&x._liveKind!=='pcs'&&!(key in PCSTATE_CACHE)) return '<div class="trk"><div class="tsync load">Загрузка живого листа…</div></div>';
  var st=trkGet(key);if(!st)return '';
  var editable=!live||canEditLivePc(x);
  function ctl(html){return editable?html:'';}
  var hFull=st.hSup+st.hAgg>=st.hMax,wFull=st.wSup+st.wAgg>=st.wMax;
  var pips='';for(var i=1;i<=5;i++){var on=i<=st.hunger;
    pips+=editable?('<button class="pip'+(on?' on':'')+'" type="button" data-act="hun" data-v="'+i+'" title="Голод '+i+'"></button>')
                  :('<span class="pip'+(on?' on':'')+'" style="cursor:default" title="Голод '+i+'"></span>');}
  var hum='';for(var j=0;j<10;j++){var filled=j<st.hum,stn=j>=10-st.stains;
    hum+='<span class="box'+(filled?' h':'')+(stn?' st':'')+'" style="display:inline-grid;place-items:center;cursor:default">'+(stn?'╱':'')+'</span>';}
  var remorseDice=Math.max(1,10-st.hum-st.stains);
  var sync=live?('<div class="tsync">● живой лист'+(editable?' — правки видят все за столом':' игрока @'+esc(x.owner)+' — только просмотр')+'</div>'):'';
  return sync+'<div class="trk">'+
   '<div class="tbox"><div class="th"><b>Голод</b><span class="val">'+st.hunger+'</span></div><div class="pips">'+pips+'</div>'+
     ctl('<div class="ctl"><button class="mini" data-act="hun0">сбросить в 0</button><button class="mini pri" data-act="rouse">Пробуждение</button></div>')+
     (st.hunger>=5?'<div class="warn">Голод 5: проверки пробуждения невозможны, Зверь у самой поверхности.</div>':'')+'</div>'+
   '<div class="tbox"><div class="th"><b>Здоровье</b><span class="val">'+(st.hMax-st.hSup-st.hAgg)+'/'+st.hMax+'</span></div><div class="pips">'+boxes(st.hMax,st.hAgg,st.hSup)+'</div>'+
     ctl('<div class="ctl"><button class="mini" data-act="d" data-p="h" data-k="s">+ ╱</button><button class="mini" data-act="d" data-p="h" data-k="a">+ ✕</button>'+
     '<button class="mini" data-act="h" data-p="h" data-k="s">− ╱</button><button class="mini" data-act="h" data-p="h" data-k="a">− ✕</button></div>')+
     (st.hAgg>=st.hMax?'<div class="warn">Все клетки тяжёлые: торпор.</div>':hFull?'<div class="warn">Ослаблен: −2 к физическим пулам.</div>':'')+'</div>'+
   '<div class="tbox"><div class="th"><b>Сила воли</b><span class="val">'+(st.wMax-st.wSup-st.wAgg)+'/'+st.wMax+'</span></div><div class="pips">'+boxes(st.wMax,st.wAgg,st.wSup)+'</div>'+
     ctl('<div class="ctl"><button class="mini" data-act="d" data-p="w" data-k="s">+ ╱</button><button class="mini" data-act="d" data-p="w" data-k="a">+ ✕</button>'+
     '<button class="mini" data-act="h" data-p="w" data-k="s">− ╱</button><button class="mini" data-act="h" data-p="w" data-k="a">− ✕</button></div>')+
     (wFull?'<div class="warn">Ослаблен: −2 к социальным и ментальным пулам.</div>':'')+'</div>'+
   '<div class="tbox"><div class="th"><b>Человечность</b><span class="val">'+st.hum+'</span></div><div class="pips">'+hum+'</div>'+
     ctl('<div class="ctl"><button class="mini" data-act="hum" data-v="-1">− Чел.</button><button class="mini" data-act="hum" data-v="1">+ Чел.</button>'+
     '<button class="mini" data-act="stn" data-v="1">+ Скверна</button><button class="mini" data-act="stn" data-v="-1">− Скверна</button>'+
     '<button class="mini pri" data-act="remorse" title="Кубов: '+remorseDice+'">Раскаяние ('+remorseDice+'к)</button></div>')+
     (st.stains>10-st.hum?'<div class="warn">Скверна залезла на Человечность: персонаж ослаблен, деградация.</div>':'')+
     '<div class="tsub">Проверка раскаяния — в конце сессии, если есть Скверна.</div></div>'+
   '</div>'+ctl('<div class="ctl" style="margin-top:8px"><button class="mini" data-act="reset" title="Вернуть стартовые значения персонажа">Сброс к стартовым</button></div>');
}
function trackerHtml(x){var key=trkKey(x);TRK_OBJ[key]=x;return '<div class="trkwrap" data-trk="'+key+'">'+trkInner(key)+'</div>';}
function refreshTrackers(key){
  [].forEach.call(document.querySelectorAll('[data-trk="'+key+'"]'),function(el){el.innerHTML=trkInner(key);});
  [].forEach.call(document.querySelectorAll('[data-mini="'+key+'"]'),function(el){el.innerHTML=miniPips(key);});
  if(dkPc&&dkPc.value===key) dkHun.value=trkGet(key).hunger;
}
function remorse(key){
  var x=TRK_OBJ[key],st=trkGet(key);
  if(!st.stains){pushLog('Раскаяние · '+x.name,'Скверны нет — проверка не нужна','—','');return;}
  var n=Math.max(1,10-st.hum-st.stains),r=[],ok=false;
  for(var i=0;i<n;i++){var v=d(10);r.push(v);if(v>=6)ok=true;}
  if(ok){st.stains=0;}else{st.hum-=1;st.stains=0;}
  trkSet(key,st);
  pushLog('Раскаяние · '+x.name,'['+r.join(' ')+']',ok?'Сохранил':'−1 Чел.',ok?'ok':'no');
  openDock();
}
function onTrk(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var w=b.closest('[data-trk],[data-mini]');if(!w)return;
  var key=w.getAttribute('data-trk')||w.getAttribute('data-mini'),st=trkGet(key),a=b.getAttribute('data-act'),v=+b.getAttribute('data-v');
  if(a==='hun'){st.hunger=(st.hunger===v)?v-1:v;}
  else if(a==='hun0') st.hunger=0;
  else if(a==='d') damage(st,b.getAttribute('data-p'),b.getAttribute('data-k'),1);
  else if(a==='h') damage(st,b.getAttribute('data-p'),b.getAttribute('data-k'),-1);
  else if(a==='hum') st.hum+=v;
  else if(a==='stn') st.stains+=v;
  else if(a==='remorse'){remorse(key);return;}
  else if(a==='rouse'){rouseFor(key,false);return;}
  else if(a==='reset'){
    var x2=TRK_OBJ[key];
    if(isLivePc(x2)&&!canEditLivePc(x2)){refreshTrackers(key);return;}
    STORE.del('trk:'+key);
    if(isLivePc(x2)){var d0=trkDefault(x2);if(x2._liveKind!=='pcs')PCSTATE_CACHE[key]=d0;pcSyncWrite(x2,d0);}
    refreshTrackers(key);return;
  }
  else return;
  trkSet(key,st);
}
function wireTrackers(){}  /* делегирование висит на document — см. initDock() */
function miniPips(key){var st=trkGet(key),s='';
  for(var i=1;i<=5;i++) s+='<button class="pip'+(i<=st.hunger?' on':'')+'" type="button" data-act="hun" data-v="'+i+'"></button>';

/* ================= КОСТИ V5 ================= */
function d(n){return 1+Math.floor(Math.random()*n);}
var LOG=[],LAST=null,dock,dkPc,dkHun,dkPool,dkDif,dkOut,dkLog,dkWp;
function pushLog(label,detailText,total,cls){
  LOG.unshift({l:label,d:detailText,t:total,c:cls||''});if(LOG.length>40)LOG.pop();
  dkLog.innerHTML=LOG.slice(0,20).map(function(e){return '<li><span class="f">'+esc(e.l)+' · '+esc(e.d)+'</span><span class="t '+e.c+'">'+esc(String(e.t))+'</span></li>';}).join('');
  document.getElementById('dkLast').textContent=label+' → '+total;
}
function openDock(){dock.classList.remove('min');document.getElementById('dkHint').textContent='свернуть';}
function evalPool(r){
  var succ=0,tens=0,hTen=false,hOne=false;
  r.dice.forEach(function(x){if(x.v>=6)succ++;if(x.v===10){tens++;if(x.h)hTen=true;}if(x.h&&x.v===1)hOne=true;});
  var pairs=Math.floor(tens/2);succ+=pairs*2;
  var crit=pairs>0,messy=crit&&hTen,D=r.dif,v={succ:succ,crit:crit,messy:messy,hOne:hOne};
  if(D>0){
    var win=succ>=D;v.cls=win?(messy?'messy':'win'):(hOne?'bestial':'fail');
    v.title=win?(messy?'Грязный крит':crit?'Критический успех':'Успех'):(hOne?'Звериный провал':succ===0?'Полный провал':'Провал');
    v.text=succ+' усп. против сложности '+D+(win?' · перевес '+(succ-D):' · не хватило '+(D-succ));
    if(win&&messy) v.text+=' · успех, но Зверь берёт своё: одержимость или последствия по решению рассказчика';
    if(!win&&hOne) v.text+=' · провал с участием Зверя: одержимость или иная беда';
  }else{
    v.cls=messy?'messy':'win';v.title=succ+' '+plural(succ,'успех','успеха','успехов');
    var f=[];if(crit)f.push(messy?'грязный крит (если бросок успешен)':'критический успех (если бросок успешен)');
    if(hOne)f.push('звериный провал, если бросок провален');if(!succ)f.push('ни одного успеха');
    v.text=f.join(' · ')||'сложность не задана — сравните с ней сами';
  }
  return v;
}
function renderRoll(){
  var r=LAST,v=evalPool(r);
  dkOut.innerHTML='<div class="dice">'+r.dice.map(function(x,i){
    var c='die'+(x.h?' h':'')+(x.v>=6?' succ':'')+(x.v===10?' ten':'')+(x.h&&x.v===1?' one':'')+(x.sel?' sel':'')+(x.rr?' rr':'');
    return '<button type="button" class="'+c+'" data-i="'+i+'" title="'+(x.h?'кость Голода':'обычная кость')+'">'+x.v+'</button>';}).join('')+'</div>'+
    '<div class="verdict '+v.cls+'"><h5>'+v.title+'</h5>'+esc(v.text)+'</div>';
  dkWp.disabled=r.wpUsed||!r.dice.some(function(x){return !x.h;});
  return v;
}
function rollPool(pool,hunger,dif,label){
  pool=Math.max(1,Math.min(30,+pool||1));hunger=Math.max(0,Math.min(5,+hunger||0));
  var h=Math.min(hunger,pool),dice=[];
  for(var i=0;i<pool;i++) dice.push({v:d(10),h:i>=pool-h});
  LAST={dice:dice,dif:+dif||0,pool:pool,hunger:h,wpUsed:false,label:label||'Пул '+pool};
  var v=renderRoll();
  pushLog(LAST.label+' · Голод '+h+(LAST.dif?' · сл. '+LAST.dif:''),dice.map(function(x){return (x.h?'h':'')+x.v;}).join(' '),v.title,
    v.cls==='win'?'ok':(v.cls==='fail'||v.cls==='bestial')?'no':'');
  openDock();
}
function wpReroll(){
  if(!LAST||LAST.wpUsed)return;
  var sel=LAST.dice.filter(function(x){return x.sel&&!x.h;});
  if(!sel.length) sel=LAST.dice.filter(function(x){return !x.h&&x.v<6;}).slice(0,3);
  if(!sel.length){pushLog('Переброс СВ','нечего перебрасывать — провалов на обычных костях нет','—');return;}
  LAST.dice.forEach(function(x){x.rr=false;});
  sel.slice(0,3).forEach(function(x){x.v=d(10);x.sel=false;x.rr=true;});
  LAST.wpUsed=true;
  var key=dkPc.value;if(key&&TRK_OBJ[key]){var st=trkGet(key);damage(st,'w','s',1);trkSet(key,st);}
  var v=renderRoll();
  pushLog('Переброс СВ ('+sel.length+')'+(key&&TRK_OBJ[key]?' · −1 СВ '+TRK_OBJ[key].name:''),LAST.dice.map(function(x){return (x.h?'h':'')+x.v;}).join(' '),v.title,
    v.cls==='win'?'ok':(v.cls==='fail'||v.cls==='bestial')?'no':'');
}
function rouseFor(key,twice){
  var x=key?TRK_OBJ[key]:null,st=x?trkGet(key):null;
  if(st&&st.hunger>=5){pushLog('Пробуждение · '+x.name,'Голод 5 — проверка невозможна','Голод 5','no');openDock();return;}
  var a=d(10),b=twice?d(10):null,ok=a>=6||(b!=null&&b>=6);
  if(st&&!ok){st.hunger+=1;trkSet(key,st);}
  pushLog('Пробуждение'+(twice?' с перебросом':'')+(x?' · '+x.name:''),'['+a+(b!=null?' / '+b:'')+']',ok?'Голод тот же':'+1 Голод',ok?'ok':'no');
  if(!x&&!ok){dkHun.value=Math.min(5,(+dkHun.value||0)+1);}
  openDock();
}

/* текстовые формулы → кнопки: «пул 6», «пул 6 / сл. 3», «проверка пробуждения», «2к10+1» */
var ROLL_RE=/(пул\s+(\d{1,2})(?:\s*[\/,;]\s*сл\.?\s*(\d{1,2}))?)|(проверк[аеуи]\s+пробуждения)|((\d{0,2})[кК](\d{1,3})(?:\s*([+−–-])\s*(\d{1,3}))?)/gi;
function activateRolls(root){
  var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),skip={BUTTON:1,SCRIPT:1,STYLE:1,A:1,TEXTAREA:1,INPUT:1,SELECT:1,OPTION:1},targets=[],node;
  while((node=walker.nextNode())){var par=node.parentNode;
    if(!par||skip[par.nodeName]||(par.closest&&par.closest('a,button,svg,.srch-res,.dock')))continue;
    ROLL_RE.lastIndex=0;if(ROLL_RE.test(node.nodeValue))targets.push(node);}
  targets.forEach(function(n){
    var txt=n.nodeValue,frag=document.createDocumentFragment(),last=0,m,made=0;ROLL_RE.lastIndex=0;
    while((m=ROLL_RE.exec(txt))){
      var prev=m.index>0?txt.charAt(m.index-1):'';
      if(/[0-9A-Za-zА-Яа-яЁё]/.test(prev))continue;
      var b=document.createElement('button');b.type='button';b.className='roll';b.textContent=m[0];
      if(m[1]){b.dataset.pool=m[2];if(m[3])b.dataset.dif=m[3];}
      else if(m[4]){b.dataset.rouse='1';}
      else{var sides=+m[7],cnt=m[6]?+m[6]:1;if([2,3,4,6,8,10,12,20,100].indexOf(sides)<0||cnt<1||cnt>30)continue;
        b.dataset.n=cnt;b.dataset.s=sides;b.dataset.m=m[9]?(m[8]==='+'?1:-1)*(+m[9]):0;}
      if(m.index>last)frag.appendChild(document.createTextNode(txt.slice(last,m.index)));
      frag.appendChild(b);last=m.index+m[0].length;made++;}
    if(!made)return;
    if(last<txt.length)frag.appendChild(document.createTextNode(txt.slice(last)));
    n.parentNode.replaceChild(frag,n);});
}
function onRollClick(e){
  var die=e.target.closest('.die');
  if(die&&LAST&&!LAST.wpUsed){var x=LAST.dice[+die.dataset.i];
    if(x&&!x.h){var n=LAST.dice.filter(function(y){return y.sel;}).length;if(x.sel||n<3)x.sel=!x.sel;renderRoll();}return;}
  var btn=e.target.closest('.roll');if(!btn)return;
  e.preventDefault();
  if(btn.dataset.pool){dkPool.value=btn.dataset.pool;dkDif.value=btn.dataset.dif||0;rollPool(dkPool.value,dkHun.value,dkDif.value,btn.textContent);return;}
  if(btn.dataset.rouse){rouseFor(dkPc.value||null,false);return;}
  var tot=0,rs=[];for(var i=0;i<+btn.dataset.n;i++){var v=d(+btn.dataset.s);rs.push(v);tot+=v;}tot+=+btn.dataset.m;
  var nx=btn.nextSibling;if(nx&&nx.nodeType===1&&nx.classList.contains('rollres'))nx.remove();
  var s=document.createElement('span');s.className='rollres';s.textContent=tot;btn.parentNode.insertBefore(s,btn.nextSibling);
  pushLog(btn.textContent,'['+rs.join(' ')+']',tot);
}

function statusEvents(){var out=[];SESSIONS.forEach(function(s){s.items.forEach(function(it){
  if(it&&it.status) out.push({n:s.n,who:it.status.who,sect:it.status.sect||'',delta:+it.status.delta||0});});});return out;}
function statusNow(who,sect,base){var v=+base||0;statusEvents().forEach(function(e){if(same(e.who,who)&&e.sect===sect)v+=e.delta;});return Math.max(0,v);}
function statusSeries(){
  var keys={},order=[];
  function add(who,sect,base){var k=(hrefOf(who)||who)+'|'+sect;if(!keys[k]){keys[k]={who:who,sect:sect,base:+base||0};order.push(k);}}
  allPeople().forEach(function(p){if(p.status)Object.keys(p.status).forEach(function(s){add(p.name,s,p.status[s]);});});
  statusEvents().forEach(function(e){add(e.who,e.sect,0);});

}
var PAL=['#E0142F','#D4AF37','#8FB8DE','#B98CFF','#6FCF8E','#E0812E','#D1436A','#7FB5A8','#F2C14E','#9FB9D1'];

  var W=900,H=280,L=46,Rr=20,T=20,B=40,n0=rg[0]-1,n1=rg[1];

  function X(n){return L+(n-n0)/Math.max(1,n1-n0)*(W-L-Rr);} function Y(v){return T+(mx-v)/Math.max(1,mx-mn)*(H-T-B);}
  var g='';for(var v=mn;v<=mx;v++) g+='<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="rgba(255,255,255,.07)"/><text x="'+(L-10)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="11" fill="#A38F8C" font-family="JetBrains Mono">'+v+'</text>';

function statusChart(){

/* ================= ГРАФ СВЯЗЕЙ ================= */
function graphData(){
  var nodes={},list=[],edges=[];
  function node(n){var k=hrefOf(n)||n;if(!nodes[k]){var pc=PCS.some(function(p){return same(p.name,n);}),pe=PEOPLE.some(function(p){return same(p.name,n);});
    var who=null;allPeople().forEach(function(p){if(!who&&same(p.name,n))who=p;});
    var gmeta=(typeof GHOST_META!=='undefined'&&GHOST_META[n])||{};
    nodes[k]={id:k,name:n,href:hrefOf(n),kind:pc?'pc':pe?'person':'other',clan:who?who.clan||'':gmeta.clan||'',sect:who?who.sect||'':''};list.push(nodes[k]);}return nodes[k];}
  function edge(a,b,type,note,gm,noteB){if(!a||!b)return;edges.push({a:node(a),b:node(b),type:REL_TYPES[type]?type:'other',note:note||'',noteB:noteB||'',gm:!!gm});}
  /* gm-рёбра (с v1.42, §1.3.4) — только при виде «Мастер» */
  /* одна пара и тот же тип — одно ребро (v1.52): тайная часть дописывается
     к открытой заметке ребра, а не рисуется поверх второй линией */
  RELATIONS.filter(gmOk).forEach(function(r){
    if(r.gm){var t=REL_TYPES[r.type]?r.type:'other',host=null;
      edges.forEach(function(e){if(!host&&!e.gm&&e.type===t&&((e.a===node(r.a)&&e.b===node(r.b))||(e.a===node(r.b)&&e.b===node(r.a))))host=e;});
      if(host){host.note=(host.note?host.note+' · ':'')+'[для мастера] '+(r.note||'');return;}}
    edge(r.a,r.b,r.type,r.note,r.gm,r.noteB);});
  BONDS.filter(gmOk).forEach(function(b){edge(b.thrall,b.regnant,'bond','ступень '+b.level+(b.note?' · '+b.note:''));});
  BOONS.filter(gmOk).filter(function(b){return b.status==='open'||!b.status;}).forEach(function(b){edge(b.debtor,b.creditor,'debt',(BOON_LEVELS[b.level]||['долг'])[0]+' долг');});
  allPeople().forEach(function(p){if(p.sire)edge(p.sire,p.name,'sire','');});
  PCS.forEach(function(p){(p.convictions||[]).forEach(function(c){if(c[1])edge(p.name,c[1],'touch',c[0]);});});
  return {nodes:list,edges:edges,node:node,edge:edge};
}
/* v1.78 — слой упоминаний: ссылки [[…]] из блоков «Связи» всех заметок и
   принадлежность клану/секте. Включается переключателем, по умолчанию выключен. */
function addLinkLayer(G){
  function has(a,b){return G.edges.some(function(e){return (e.a===a&&e.b===b)||(e.a===b&&e.b===a);});}
  allEntries().forEach(function(en){var x=en.x;if(!x||!x.name||!x.ties)return;
    x.ties.filter(gmOk).forEach(function(t){var txt=typeof t==='string'?t:(t.text||''),m,re=/\[\[([^\]|]+)/g;
      while((m=re.exec(txt))){var n=m[1].trim();if(same(n,x.name))continue;var a=G.node(x.name),b=G.node(n);if(!has(a,b))G.edge(x.name,n,'link','',typeof t!=='string'&&t.gm);}});});
  allPeople().forEach(function(p){['clan','sect'].forEach(function(f){if(p[f]&&LINKS[p[f]]){var a=G.node(p.name),b=G.node(p[f]);if(!has(a,b))G.edge(p.name,p[f],'link','');}});});
}
/* цвета ромбов-заметок в графах; подобраны так, чтобы не совпадать с кланами */
var NOTE_COLORS={loresheets:'#F2E3B3',merits:'#7FE0C4',places:'#5C8DF0',domains:'#3F9FA8',clans:'#FF5A6E',sects:'#C9CED6',
  disciplines:'#C9A2F2',rituals:'#F0C75E',predators:'#F08A5D',threats:'#9FB9D1',players:'#E8B04B'};

var WEB_OFF={},WEB_LINKS=false,WEB_COLOR='clan',WEB_GROUP='',WEB_PATH={a:'',b:''};
var WEB_DBG=null; /* для тестов: последние узлы/рёбра графа и place() */
var WEB_VB=null; /* {x,y,w,h} — текущая видимая область графа (масштаб/панорама),
  в координатах симуляции 0..1000 × 0..640; null = сброшена, вид «по размеру».

      var side=(d1+d2)/2,s=Math.abs(side)<1?1:(side>0?1:-1),same_dir=(ax*bx+ay*by)>0?1:-1;
      off[i]-=M*s;off[j]+=M*s*same_dir;
    }
    edges.forEach(function(e,i){
      var dx=e.b.x-e.a.x,dy=e.b.y-e.a.y,L2=dx*dx+dy*dy||1,L=Math.sqrt(L2);
      N.forEach(function(n){if(n===e.a||n===e.b)return;
        var t=((n.x-e.a.x)*dx+(n.y-e.a.y)*dy)/L2;if(t<.04||t>.96)return;
        var dv=(dx*(n.y-e.a.y)-dy*(n.x-e.a.x))/L;if(Math.abs(dv)<22)off[i]+=(dv>0?-1:1)*34;});
    });
    return off.map(function(v){return Math.max(-110,Math.min(110,v));});
  }
  function place(){var bend=layoutBends();edges.forEach(function(e,i){var dx=e.b.x-e.a.x,dy=e.b.y-e.a.y,L=Math.sqrt(dx*dx+dy*dy)||1,off=bend[i],
      cx=(e.a.x+e.b.x)/2-dy/L*off,cy=(e.a.y+e.b.y)/2+dx/L*off;
    var d='M'+e.a.x.toFixed(1)+' '+e.a.y.toFixed(1)+'Q'+cx.toFixed(1)+' '+cy.toFixed(1)+' '+e.b.x.toFixed(1)+' '+e.b.y.toFixed(1);
    lines[i].setAttribute('d',d);hits[i].setAttribute('d',d);});
    N.forEach(function(n,i){gs[i].setAttribute('transform','translate('+n.x.toFixed(1)+','+n.y.toFixed(1)+')');});}
  if(!opt.local)WEB_DBG={N:N,edges:edges,place:place};
  place();
  function pt(ev){var p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
  /* Масштаб/панорама: viewBox — «камера» над сценой; предел отдаления — рамка FIT,

  function applyVB(){svg.setAttribute('viewBox',vb.x.toFixed(1)+' '+vb.y.toFixed(1)+' '+vb.w.toFixed(1)+' '+vb.h.toFixed(1));}
  var PAD=60;
  function clampVB(){var fx1=FIT.x+FIT.w,fy1=FIT.y+FIT.h;
    vb.x=vb.w>=FIT.w?FIT.x:Math.max(FIT.x-PAD,Math.min(fx1-vb.w+PAD,vb.x));
    vb.y=vb.h>=FIT.h?FIT.y:Math.max(FIT.y-PAD,Math.min(fy1-vb.h+PAD,vb.y));}

    var nw=Math.max(140,Math.min(FIT.w,vb.w*f)),nh=nw*(H/W);
    var nx=px-(px-vb.x)*(nw/vb.w),ny=py-(py-vb.y)*(nh/vb.h);
    vb.w=nw;vb.h=nh;vb.x=nx;vb.y=ny;clampVB();
  }
  [].forEach.call(box.querySelectorAll('[data-zoom]'),function(b){b.addEventListener('click',function(ev){
    ev.preventDefault();var k=b.getAttribute('data-zoom');
    if(k==='reset'){vb.x=FIT.x;vb.y=FIT.y;vb.w=FIT.w;vb.h=FIT.h;}

  if(!opt.local)svg.addEventListener('wheel',function(ev){ev.preventDefault();var p=pt(ev);zoomAt(p.x,p.y,ev.deltaY<0?1/1.15:1.15);applyVB();},{passive:false});
  /* v1.79 — нажатие отличаем от перетаскивания по сдвигу: палец на экране
     всегда чуть дрожит, и раньше любое дрожание считалось перетаскиванием —
     на телефоне узел не открывал заметку. Порог — 8 пикселей. */
  var drag=null,moved=false,pan=null,tapE=null,down=null;
  function far(ev){return down&&(Math.abs(ev.clientX-down.x)>8||Math.abs(ev.clientY-down.y)>8);}
  function openNode(n){

      [].forEach.call(lines,function(l,i){l.classList.toggle('on',edges[i].a===n||edges[i].b===n);});}});
  svg.addEventListener('pointerup',function(ev){var d0=drag;drag=null;pan=null;down=null;
    if(d0&&!moved){openNode(d0);return;}

  svg.addEventListener('pointercancel',function(){drag=null;pan=null;down=null;tapE=null;});

  svg.addEventListener('pointerleave',function(){box.classList.remove('hl');});
}

/* ================= ГРАФ ЗАМЕТКИ (v1.77) =================
   Малый граф внизу каждой заметки: сама заметка в центре и всё, с чем она
   связана. Рёбра: типизированные связи из общего графа (RELATIONS, узы,
   долги, сиры, Якоря), ссылки [[…]] из блока «Связи» (пунктир, тип link),
   для кланов и сект — их члены. Связи соседей между собой показаны бледно. */
function localGraph(x,ring2){
  var G=graphData(),key=hrefOf(x.name)||x.name,nodes={},list=[],edges=[];
  function add(n){var k=hrefOf(n)||n;if(!nodes[k]){var o=null;G.nodes.forEach(function(q){if(q.id===k)o=q;});
      if(!o)o=G.node(n);
      nodes[k]={id:k,name:o.name,href:o.href,kind:o.kind,clan:o.clan,sect:o.sect};list.push(nodes[k]);}return nodes[k];}
  var me=add(x.name);
  G.edges.forEach(function(e){if(e.a.id===key||e.b.id===key)edges.push({a:add(e.a.name),b:add(e.b.name),type:e.type,note:e.note,noteB:e.noteB,gm:e.gm});});
  function linked(n){return edges.some(function(e){return (e.a===me&&e.b.id===(hrefOf(n)||n))||(e.b===me&&e.a.id===(hrefOf(n)||n));});}
  (x.ties||[]).filter(gmOk).forEach(function(t){var txt=typeof t==='string'?t:(t.text||''),m,re=/\[\[([^\]|]+)/g;
    while((m=re.exec(txt))){var n=m[1].trim();if(same(n,x.name)||linked(n))continue;edges.push({a:me,b:add(n),type:'link',note:'',gm:typeof t!=='string'&&t.gm});}});
  ['clan','sect'].forEach(function(f){allPeople().forEach(function(p){if(same(p[f],x.name)&&!linked(p.name))edges.push({a:add(p.name),b:me,type:'link',note:''});});});
  var first=list.slice();
  /* второй круг: связи соседей с теми, кого в графе ещё нет */
  if(ring2)G.edges.forEach(function(e){if(e.a.id===key||e.b.id===key)return;
    var ia=first.some(function(n){return n.id===e.a.id;}),ib=first.some(function(n){return n.id===e.b.id;});
    if(ia!==ib)edges.push({a:add(e.a.name),b:add(e.b.name),type:e.type,note:e.note,noteB:e.noteB,gm:e.gm,dim:true,far:true});});
  G.edges.forEach(function(e){if(e.a.id===key||e.b.id===key)return;
    if(first.some(function(n){return n.id===e.a.id;})&&first.some(function(n){return n.id===e.b.id;}))edges.push({a:nodes[e.a.id],b:nodes[e.b.id],type:e.type,note:e.note,noteB:e.noteB,gm:e.gm,dim:true});});
  return {nodes:list,edges:edges,me:me};
}
var LOCAL_WEB_SEQ=0,LOCAL_WEB={};

var RES_LAST=null;
function rollResonance(){
  var t1=d(10),t2=null,temp;
  if(t1<=5)temp=TEMPERAMENT[0];else if(t1<=8)temp=TEMPERAMENT[1];else{t2=d(10);temp=t2>=9?TEMPERAMENT[3]:TEMPERAMENT[2];}

function sha256Hex(text){
  var enc=new TextEncoder().encode(text);
  return crypto.subtle.digest('SHA-256',enc).then(function(buf){
    return Array.prototype.map.call(new Uint8Array(buf),function(b){return b.toString(16).padStart(2,'0');}).join('');
  });
}

/* ================= ВХОД: ЗАПУСК ================= */
function bootAuth(cb){
  /* Обход входа для автотестов (test.py задаёт window.name ДО загрузки страницы) —
     Firebase недоступен из песочницы агента. Никаких реальных прав это не даёт:
     SESSION поддельная только на клиенте, любое чтение/запись в Firestore всё равно
     упрётся в правила безопасности без настоящей сессии — см. §1.3 в комментарии. */
  if(window.name==='KODEKS_TEST_BYPASS'){SESSION={uid:'test',username:'test',role:'admin',displayName:'Тест'};cb();return;}
  if(KODEKS_PREVIEW){SESSION={uid:'preview',username:'preview',role:'master',displayName:'Предпросмотр',preview:true};renderUserBadge();cb();return;}
  var gate=document.getElementById('authGate');
  gate.classList.remove('hidden');
  if(!fbAuth){
    gate.innerHTML='<div class="auth-card"><h2>Не удалось загрузить Firebase</h2>'+
      '<p class="note">Проверьте интернет-соединение (SDK грузится с www.gstatic.com) и обновите страницу. '+
      'Если это повторяется — возможно, блокировщик рекламы/скриптов режет Google-домены.</p></div>';
    return;
  }
  gate.innerHTML='<div class="auth-card"><p class="sub">Подключение…</p></div>';
  fbAuth.signInAnonymously().then(function(){
    return fbDb.collection('meta').doc('bootstrap').get();
  }).then(function(metaDoc){
    if(!metaDoc.exists){showBootstrapForm(cb);return;}
    var uid=fbAuth.currentUser.uid;
    fbDb.collection('sessions').doc(uid).get().then(function(sd){
      if(sd.exists){
        fbDb.collection('users').doc(sd.data().username).get().then(function(ud){
          if(ud.exists){
            SESSION={uid:uid,username:sd.data().username,role:ud.data().role,displayName:ud.data().displayName||sd.data().username};
            gate.classList.add('hidden');renderUserBadge();cb();
          } else {showLoginForm(cb,'Учётная запись была удалена — войдите заново.');}
        }).catch(function(){showLoginForm(cb);});
      } else {showLoginForm(cb);}
    }).catch(function(){showLoginForm(cb);});
  }).catch(function(e){
    gate.innerHTML='<div class="auth-card"><h2>Не удалось подключиться</h2>'+
      '<p class="note">Проверьте интернет-соединение и обновите страницу.<br>Техническое сообщение: '+esc(e.message||String(e))+'</p></div>';
  });
}

      var uid=fbAuth.currentUser.uid;

/* ================= ВХОД: САМОСТОЯТЕЛЬНАЯ РЕГИСТРАЦИЯ ИГРОКА (с v1.38) =================
   Сказано рассказчиком явно (v1.38): новых игроков больше не заводит админ руками
   через #/admin/users — они сами создают себе логин/пароль прямо на экране входа.
   Открыто полностью (спрошено явно) — без кода-приглашения, любой человек со
   ссылкой на сайт может завести себе аккаунт-игрока.
   Роль всегда 'player' — 'master'/'admin' по-прежнему заводит только сам админ
   (см. viewAdminUsers ниже), самостоятельная форма роль не спрашивает и в
   Firestore шлёт её жёстко зашитой, а не берёт с формы — правило create в
   firestore.rules отдельно перепроверяет, что это 'player', так что подделать
   роль через devtools не выйдет.
   «Логин не занят» не проверяется отдельным чтением заранее — правило read
   не пускает ещё не вошедшего читать чужой users/{u} (см. firestore.rules), а
   значит и не узнать заранее. Вместо этого сама попытка create — это и есть
   проверка: если документ с таким id уже существует, Firestore трактует
   запись как update (не create) независимо от того, что вызвал клиент, а
   правило update требует isAdmin() — значит попытка с занятым логином сама
   получит permission-denied, ровно нужное поведение, без гонки состояний. */
function showRegisterForm(cb){
  var gate=document.getElementById('authGate');
  gate.innerHTML='<div class="auth-card">'+
    '<h2>Кодекс Ночи</h2><p class="sub">Регистрация игрока</p>'+
    '<label for="regUser">Логин</label><input id="regUser" type="text" autocomplete="username" autocapitalize="off" autocorrect="off">'+
    '<label for="regPass">Пароль</label><input id="regPass" type="password" autocomplete="new-password">'+
    '<label for="regPass2">Повторите пароль</label><input id="regPass2" type="password" autocomplete="new-password">'+
    '<div class="err" id="regErr"></div>'+
    '<button class="mini pri" type="button" id="regGo">Зарегистрироваться</button>'+
    '<p class="sub switch">Уже есть аккаунт? <a id="regToLogin">Войти</a></p>'+
    '</div>';
  var user=document.getElementById('regUser'),pass=document.getElementById('regPass'),pass2=document.getElementById('regPass2'),
      err=document.getElementById('regErr'),go=document.getElementById('regGo');
  function submit(){
    var u=user.value.trim().toLowerCase(),p=pass.value,p2=pass2.value;
    err.textContent='';
    if(!u||!p){err.textContent='Заполните логин и пароль.';return;}
    if(!/^[a-z0-9_]+$/.test(u)){err.textContent='Логин — латиница, цифры и «_», без пробелов.';return;}
    if(p.length<4){err.textContent='Пароль слишком короткий (мин. 4 символа).';return;}
    if(p!==p2){err.textContent='Пароли не совпадают.';return;}
    go.disabled=true;go.textContent='Создание…';
    sha256Hex(p).then(function(hash){
      return fbDb.collection('users').doc(u).set({passwordHash:hash,role:'player',displayName:u,createdAt:firebase.firestore.FieldValue.serverTimestamp()})
        .catch(function(e){e.__step='create';throw e;})
        .then(function(){
          var uid=fbAuth.currentUser.uid;
          return fbDb.collection('sessions').doc(uid).set({username:u,passwordHash:hash,createdAt:firebase.firestore.FieldValue.serverTimestamp()})
            .catch(function(e){e.__step='session';throw e;});
        });
    }).then(function(){
      SESSION={uid:fbAuth.currentUser.uid,username:u,role:'player',displayName:u};
      gate.classList.add('hidden');renderUserBadge();cb();
    }).catch(function(e){
      go.disabled=false;go.textContent='Зарегистрироваться';
      err.textContent=(e&&e.__step==='session')
        ? 'Аккаунт создан, но не получилось сразу войти — обновите страницу и войдите с этим логином и паролем.'
        : 'Не получилось — возможно, такой логин уже занят. Попробуй другой.';
    });
  }
  go.addEventListener('click',submit);
  pass2.addEventListener('keydown',function(e){if(e.key==='Enter')submit();});
  document.getElementById('regToLogin').addEventListener('click',function(){showLoginForm(cb);});
  user.focus();
}

/* ================= ВХОД: ПЕРВЫЙ ЗАПУСК (СОЗДАНИЕ ПЕРВОГО АДМИНА) ================= */
function showBootstrapForm(cb){
  var gate=document.getElementById('authGate');
  gate.innerHTML='<div class="auth-card">'+
    '<h2>Первый запуск</h2><p class="sub">Учётных записей ещё нет — заведите первую, админскую</p>'+
    '<label for="bsUser">Логин</label><input id="bsUser" type="text" autocomplete="username" autocapitalize="off" autocorrect="off">'+
    '<label for="bsPass">Пароль</label><input id="bsPass" type="password" autocomplete="new-password">'+
    '<div class="err" id="bsErr"></div>'+
    '<button class="mini pri" type="button" id="bsGo">Создать админа и войти</button>'+
    '</div>';
  var user=document.getElementById('bsUser'),pass=document.getElementById('bsPass'),
      err=document.getElementById('bsErr'),go=document.getElementById('bsGo');
  go.addEventListener('click',function(){
    var u=user.value.trim().toLowerCase(),p=pass.value;
    err.textContent='';
    if(!u||!p){err.textContent='Заполните логин и пароль.';return;}
    if(p.length<4){err.textContent='Пароль слишком короткий (мин. 4 символа).';return;}
    go.disabled=true;go.textContent='Создание…';
    sha256Hex(p).then(function(hash){
      var uid=fbAuth.currentUser.uid;
      /* Не batch(): правила Firestore проверяют каждую запись batch по снимку
         базы ДО всего пакета, поэтому sessions/{uid} не увидел бы только что
         созданный в том же batch users/{u} (см. v1.34 в комментарии). Пишем
         последовательно — users сначала, meta/bootstrap последним, чтобы
         каждая следующая проверка правил видела уже сохранённый результат
         предыдущей записи. */
      return fbDb.collection('users').doc(u).set({passwordHash:hash,role:'admin',displayName:u,createdAt:firebase.firestore.FieldValue.serverTimestamp()})
        .then(function(){return fbDb.collection('sessions').doc(uid).set({username:u,passwordHash:hash,createdAt:firebase.firestore.FieldValue.serverTimestamp()});})
        .then(function(){return fbDb.collection('meta').doc('bootstrap').set({done:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()});});
    }).then(function(){
      SESSION={uid:fbAuth.currentUser.uid,username:u,role:'admin',displayName:u};
      gate.classList.add('hidden');renderUserBadge();cb();
    }).catch(function(e){
      go.disabled=false;go.textContent='Создать админа и войти';
      err.textContent='Не получилось: '+esc(e.message||String(e));
    });
  });
  user.focus();
}

      '<div><label>Новый логин</label><input id="newUser" type="text" autocapitalize="off" autocorrect="off" style="width:150px"></div>'+
      '<div><label>Пароль</label><input id="newPass" type="text" style="width:150px"></div>'+
      '<div><label>Роль</label><select id="newRole"><option value="player">Игрок</option><option value="master">Мастер</option><option value="admin">Админ</option></select></div>'+
      '<button class="mini pri" type="button" id="newGo">Создать</button>'+
    '</div><div class="err" id="adminErr"></div>'+
    '</div></section>';
  loadAdminUsers();
  document.getElementById('newGo').addEventListener('click',function(){
    var u=document.getElementById('newUser').value.trim().toLowerCase(),
        p=document.getElementById('newPass').value,
        r=document.getElementById('newRole').value,
        err=document.getElementById('adminErr');
    err.textContent='';
    if(!u||!p){err.textContent='Заполните логин и пароль.';return;}
    fbDb.collection('users').doc(u).get().then(function(existing){
      if(existing.exists){err.textContent='Такой логин уже занят.';return;}
      return sha256Hex(p).then(function(hash){
        return fbDb.collection('users').doc(u).set({passwordHash:hash,role:r,displayName:u,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
      }).then(function(){
        document.getElementById('newUser').value='';document.getElementById('newPass').value='';
        loadAdminUsers();
      });
    }).catch(function(e){err.textContent='Не получилось: '+esc(e.message||String(e));});
  });
}
function loadAdminUsers(){
  var box=document.getElementById('adminUserList');
  fbDb.collection('users').get().then(function(qs){
    if(qs.empty){box.className='empty';box.innerHTML='<b>Пусто</b><span>Учётных записей пока нет.</span>';return;}
    box.className='';
    var rows=[];
    qs.forEach(function(doc){rows.push({u:doc.id,role:doc.data().role,name:doc.data().displayName||doc.id});});
    rows.sort(function(a,b){return a.u<b.u?-1:1;});
    box.innerHTML=rows.map(function(r){
      return '<div class="admin-row" data-u="'+esc(r.u)+'">'+
        '<div class="who"><b>'+esc(r.name)+'</b><span>@'+esc(r.u)+'</span></div>'+
        '<select class="mini roleSel"'+(r.u===SESSION.username?' disabled title="Свою роль поменять нельзя — это защита от случайного понижения себя"':'')+'>'+['player','master','admin'].map(function(k){
          return '<option value="'+k+'"'+(k===r.role?' selected':'')+'>'+ROLE_NAMES[k]+'</option>';}).join('')+'</select>'+
        '<button class="mini" type="button" data-act="reset">Сбросить пароль</button>'+
        (r.u!==SESSION.username?'<button class="mini" type="button" data-act="del">Удалить</button>':'')+
        '</div>';
    }).join('');
    [].forEach.call(box.querySelectorAll('.admin-row'),function(row){
      var u=row.getAttribute('data-u');
      var rs=row.querySelector('.roleSel'),was=rs.value;
      rs.addEventListener('change',function(e){
        var nv=e.target.value;
        if(!confirm('Сменить роль «'+u+'» на «'+ROLE_NAMES[nv]+'»?')){rs.value=was;return;}
        fbDb.collection('users').doc(u).update({role:nv}).then(function(){was=nv;})
          .catch(function(er){rs.value=was;alert('Не получилось: '+(er.message||er));});
      });
      row.querySelector('[data-act="reset"]').addEventListener('click',function(){
        var np=prompt('Новый пароль для «'+u+'»:');
        if(!np)return;
        sha256Hex(np).then(function(hash){return fbDb.collection('users').doc(u).update({passwordHash:hash});})
          .then(function(){alert('Пароль обновлён.');});
      });
      var delBtn=row.querySelector('[data-act="del"]');
      if(delBtn)delBtn.addEventListener('click',function(){
        if(confirm('Удалить учётную запись «'+u+'»?'))fbDb.collection('users').doc(u).delete().then(loadAdminUsers);
      });
    });
  }).catch(function(e){box.innerHTML='<b>Ошибка загрузки</b><span>'+esc(e.message||String(e))+'</span>';});
}

/* ================= ЖИВЫЕ ЛИСТЫ ПЕРСОНАЖЕЙ (Firestore, с v1.35) =================
   Первая функция из бэклога §1.2 «игровая механика». Track персонажа игрока
   (голод/здоровье/воля/человечность — тот же объект, что раньше жил только
   в localStorage, см. trkDefault/trkGet/trkSet в p3c_dice.js) для PCS-записи
   с полем owner теперь хранится в Firestore (pcstate/{id персонажа}) и виден
   всем залогиненным сразу, без обновления страницы у других участников.
   NPC и угрозы (PEOPLE/THREATS) НЕ трогаем — они как были, так и остаются
   только в localStorage: owner у них никогда не выставляется, значит
   isLivePc() для них всегда false, весь путь ниже для них не используется.

   PCS[].owner — логин (username) учётной записи Firestore, которой должен
   принадлежать этот персонаж. Поле выставляется мной (агентом) в данных по
   прямому указанию рассказчика — так же, как и все остальные поля PCS,
   рассказчик сам файл не редактирует (см. правила в начале файла). Если
   owner не задан — персонаж работает как раньше, чисто локально.

   ПРАВА РЕДАКТИРОВАНИЯ (см. предупреждение в firestore.rules у pcstate):
   мастер/админ — всегда; игрок — только если owner совпадает с его логином.
   Проверка — только на клиенте (canEditLivePc), правила Firestore пропускают
   запись от ЛЮБОГО игрока или мастера технически (модель доверия закрытой
   группы, та же, что и для паролей без соли — см. §1.3). Кнопки правки на
   чужом живом листе просто не рисуются (см. изменения в trkInner). */

var PCSTATE_CACHE={};  /* {trkKey: {...track...}|null} — последний снимок Firestore для персонажей PCS[], чья страница сейчас открыта (см. ниже — самостоятельные чарники x._liveKind==='pcs' эту кэш-таблицу не используют, у них снимок уже лежит прямо в самом объекте, см. p3h_coterie.js) */
var pcstateUnsub=null; /* отписка от текущего onSnapshot — вызывается при уходе со страницы персонажа, см. dispatch() в p3e_home.js */

/* С v1.37 «живой лист» бывает ДВУХ видов — важно не путать (см. §1.3.2 в
   комментарии):
   1) СТАРЫЙ (с v1.35): запись в статичном PCS[] с полем owner — полную
      анкету по-прежнему пишет рассказчик (агент) по надиктовке, живой
      только track (голод/здоровье/воля/человечность), см. pcstate/{id}
      ниже. Мастер/админ могут править ЛЮБОЙ такой лист.
   2) НОВЫЙ (с v1.37): персонаж, которого игрок/мастер завёл САМ прямо на
      сайте (вкладка Котерия) — вся анкета целиком живёт в Firestore
      (коллекция pcs), не только track. Такие объекты помечены полем
      x._liveKind==='pcs' (проставляется в p3h_coterie.js при получении
      снимка коллекции). Здесь правило ИНАЧЕ: править может ТОЛЬКО
      владелец — даже мастер и админ такой лист не редактируют, только
      просматривают (см. панель мастера/просмотр админа в p3h_coterie.js;
      сказано рассказчиком явно, v1.37). */
function pcOwnerOf(x){return x&&x.owner?String(x.owner).toLowerCase():null;}
function isLivePc(x){return !!x && !!fbDb && (x._liveKind==='pcs' || (PCS.indexOf(x)>-1 && !!pcOwnerOf(x)));}
function canEditLivePc(x){
  if(!SESSION) return false;
  if(x._liveKind==='pcs') return pcOwnerOf(x)===SESSION.username; /* самостоятельный чарник — без исключений для мастера/админа */
  if(SESSION.role==='admin'||SESSION.role==='master') return true;
  return pcOwnerOf(x)===SESSION.username;
}

function stopPcSync(){ if(pcstateUnsub){pcstateUnsub();pcstateUnsub=null;} }

/* Вызывается из viewPC() при открытии страницы персонажа — если это живой
   персонаж, подписываемся на его документ; иначе просто убеждаемся, что
   старая подписка (с предыдущей страницы) снята. */
function startPcSyncIfLive(x){
  stopPcSync();
  if(!isLivePc(x)) return;
  var key=trkKey(x),id=x.id;
  pcstateUnsub=fbDb.collection('pcstate').doc(id).onSnapshot(function(doc){
    PCSTATE_CACHE[key]=doc.exists?doc.data():trkDefault(x);
    refreshTrackers(key);
  },function(){
    /* нет сети / нет прав на чтение — остаёмся без живых данных,
       trkGet() сам откатится на localStorage/дефолты (см. p3c_dice.js) */
  });
}

function pcSyncWrite(x,st){
  if(!isLivePc(x)||!canEditLivePc(x)) return;
  var data={};for(var k in st) data[k]=st[k];
  data.updatedAt=firebase.firestore.FieldValue.serverTimestamp();
  data.updatedBy=SESSION.username;
  /* самостоятельный чарник (x._liveKind==='pcs') хранит track ПРЯМО в своём
     документе pcs/{id} вместе с анкетой — merge:true, чтобы не затереть
     остальные поля анкеты; старый механизм пишет в отдельный pcstate/{id},
     там merge не нужен, но и не мешает. */
  var col=x._liveKind==='pcs'?'pcs':'pcstate';
  fbDb.collection(col).doc(x.id).set(data,{merge:true}).catch(function(){
    /* офлайн/ошибка сети — локальная копия в STORE (см. trkSet) уже сохранена,
       при следующем подключении onSnapshot подтянет актуальную версию сервера */
  });
}

/* ================= КОТЕРИЯ: САМОСТОЯТЕЛЬНЫЕ ЧАРНИКИ (Firestore, с v1.37) =================
   См. §1.3.2 в комментарии p0_comment.html за полным описанием. Коротко:
   игрок заводит своего персонажа САМ во вкладке Котерия (#/cat/players) —
   вся анкета целиком хранится в Firestore (коллекция pcs), а не только
   track, как у старого механизма живых листов (p3g_pcsync.js, v1.35,
   pcstate/{id} для статичных PCS[] с owner). Оба механизма живут
   параллельно и не пересекаются — см. предупреждение в p3g_pcsync.js.

   ВИДИМОСТЬ (сказано рассказчиком, v1.37): игрок видит и открывает
   только свой чарник; мастер получает панель выбора ников игроков, чтобы
   заглянуть к любому; админ видит все автоматически. Обеспечено ПРАВИЛАМИ
   Firestore (firestore.rules, allow read у /pcs/{pcId}), а не только
   сокрытием кнопок на клиенте — чужой документ, который не проходит
   правило, сервер просто не отдаст, даже если знать его id.

   ПРАВКА: только владелец, всегда — даже мастер и админ чужой
   самостоятельный чарник не редактируют, только смотрят. Это НАРОЧНО
   отличается от старого механизма (там мастер/админ правят любой живой
   лист) — сказано явно, v1.37.

   LIVE_PCS — плоский кэш коллекции pcs, каким его сейчас видят ПРАВИЛА
   для текущего пользователя (у игрока это только его собственные записи,
   у мастера/админа — все). Обновляется целиком при каждом onSnapshot;
   чтобы не путать «старые» объекты из прошлого снимка ссылками, у каждого
   объекта проставлен маркер _liveKind:'pcs' (проверяется по значению
   поля, а не по индексу в массиве — см. isLivePc/canEditLivePc/trkKey). */

var LIVE_PCS=[];          /* [{..анкета+track.., id, owner, _liveKind:'pcs'}] */
var PLAYER_ACCOUNTS=[];   /* [{u,name}] — только для панели мастера, см. ниже про users/{username} */
var livePcsUnsub=null,playersUnsub=null;
var COTERIE_PICK=null;    /* выбранный в панели мастера логин игрока, null = никто не выбран */

function startCoterieSync(){
  /* предпросмотр для телефона (без сервера) — один пример-персонаж, чтобы
     было на чём посмотреть интерактивный лист; правки живут до перезагрузки */
  if(KODEKS_PREVIEW&&SESSION&&!LIVE_PCS.length){
    LIVE_PCS=[pcFromFs({id:'preview-demo',_liveKind:'pcs',owner:SESSION.username,name:'Пример персонажа',
      short:'Лист для проверки с телефона — правки не сохраняются после перезагрузки',clan:'Бруха',gen:12,bp:1,
      attrs:{str:3,dex:2,sta:3,cha:2,man:2,com:2,int:1,wit:3,res:2},skills:{bra:3,ath:2,itm:2,str2:2,ste:1,awa:1,dri:1},
      disciplines:[{n:'Могущество',d:2,p:''},{n:'Присутствие',d:1,p:''}],advantages:(typeof MERITS!=='undefined'&&MERITS.length?[{n:MERITS[0].name,d:3,k:'merit',t:'',l:true}]:[]),huntA:'str',huntS:'bra',xpTotal:0,xpSpent:0,
      hunger:1,hMax:6,hSup:0,hAgg:0,wMax:4,wSup:0,wAgg:0,hum:7,stains:0})];
    return;
  }
  if(!fbDb||!SESSION) return;
  if(livePcsUnsub) livePcsUnsub();
  /* ВАЖНО (баг, найден на живом сайте, v1.40): правило чтения pcs —
     isMaster() || resource.data.owner==sessionUsername() — зависит от
     resource.data для не-мастера. Firestore не «фильтрует» список по
     правилу построчно: для ЗАПРОСА (list/onSnapshot) без where он
     ЗАРАНЕЕ проверяет, гарантирует ли правило допуск КАЖДОГО возможного
     документа в коллекции — а для игрока это не так (в коллекции есть
     чужие pcs), значит весь запрос целиком получает permission-denied,
     даже если фактически там сейчас только его собственный документ.
     Из-за этого свой только что созданный чарник молча не появлялся в
     LIVE_PCS — карточка «Персонаж недоступен» оставалась навсегда, хотя
     сам документ в Firestore прекрасно создавался (write — отдельное,
     не list-правило). Лечится тем, что запрос игрока сам сужается через
     where('owner','==',...) — тогда Firestore видит, что каждый
     возможный результат уже удовлетворяет правилу, и разрешает список.
     Мастер/админ — без where, у них isMaster() допускает всю коллекцию
     независимо от resource.data (правило это распознаёт статически). */
  var pcsCol=fbDb.collection('pcs');
  var pcsQuery=(SESSION.role==='master'||SESSION.role==='admin')?pcsCol:pcsCol.where('owner','==',SESSION.username);
  livePcsUnsub=pcsQuery.onSnapshot(function(qs){
    var fresh=[];
    qs.forEach(function(doc){var d=pcFromFs(doc.data());d.id=doc.id;d._liveKind='pcs';fresh.push(d);}); /* pcFromFs — p3j_sheet.js: строки-объекты Firestore → [[…]] */
    LIVE_PCS=fresh;
    LIVE_PCS.forEach(function(x){TRK_OBJ[trkKey(x)]=x;});
    refreshPcSelectAfterSync();
    LIVE_PCS.forEach(function(x){refreshTrackers(trkKey(x));});
    rerenderCoterieIfOpen();
  },function(){LIVE_PCS=[];rerenderCoterieIfOpen();});
  if(playersUnsub){playersUnsub();playersUnsub=null;}
  /* Панель мастера читает users, отфильтрованные по role:'player' — нужно
     расширенное правило чтения (см. firestore.rules v1.37: users/{username}
     allow read теперь и по isMaster(), не только isAdmin()). */
  if(SESSION.role==='master'){
    playersUnsub=fbDb.collection('users').where('role','==','player').onSnapshot(function(qs){
      var fresh=[];qs.forEach(function(doc){fresh.push({u:doc.id,name:doc.data().displayName||doc.id});});
      fresh.sort(function(a,b){return a.name<b.name?-1:1;});
      PLAYER_ACCOUNTS=fresh;
      rerenderCoterieIfOpen();
    },function(){PLAYER_ACCOUNTS=[];});
  }
}
function rerenderCoterieIfOpen(){
  var mount=document.getElementById('pcFormMount');
  if(mount&&mount.innerHTML.trim()) return; /* форма создания/правки открыта — не затираем набираемый текст */
  var h=location.hash.replace(/^#\/?/,''),m;
  /* открыт режим «Правка листа» (p3j_sheet.js) — не перерисовываем, иначе
     слетит фокус с поля, в которое сейчас печатают; трекеры обновлены выше */
  if((m=/^coterie\/([\w-]+)$/.exec(h))&&SHEET_EDIT[m[1]]) return;
  if(h==='cat/players'){viewPlayers();return;}
  if((m=/^coterie\/([\w-]+)$/.exec(h))){viewLivePC(m[1]);return;}
}

function myLivePcs(){return SESSION?LIVE_PCS.filter(function(p){return p.owner===SESSION.username;}):[];}
function livePcsOf(u){return LIVE_PCS.filter(function(p){return p.owner===u;});}
function findLivePc(id){for(var i=0;i<LIVE_PCS.length;i++)if(LIVE_PCS[i].id===id)return LIVE_PCS[i];return null;}

/* ================= СПИСКИ (вкладка Котерия) ================= */
function pcMiniList(list){
  if(!list.length) return '<div class="tsub">Пока никого.</div>';
  return '<div class="pc-mini-list">'+list.map(function(x){
    return '<div class="row"><a href="#/coterie/'+x.id+'">'+esc(x.name)+(x.dead?' ☾':'')+'</a>'+
      '<span class="tag">'+esc(x.clan||'—')+'</span></div>';}).join('')+'</div>';
}
function coterieLiveHtml(){
  if(!SESSION) return '';
  var role=SESSION.role,mine=myLivePcs();
  var out='<div class="pc-panel"><h3>Мои персонажи</h3><p class="sub">Заводите и правите прямо здесь — '+
    (role==='player'?'видят ещё мастер (через панель ниже) и админ':'видит ещё админ')+
    ', редактируете только вы, даже они.</p>'+
    pcMiniList(mine)+
    '<div class="ctl" style="margin-top:12px"><button class="mini pri" type="button" id="pcNewBtn">+ Создать персонажа</button></div>'+
    '<div id="pcFormMount"></div></div>';
  if(role==='master'){
    out+='<div class="pc-panel"><h3>Персонажи игроков</h3><p class="sub">Выберите игрока, чтобы заглянуть в его лист — правка недоступна, только просмотр.</p>'+
      '<div class="pc-pick"><select id="pcPickPlayer"><option value="">— выберите игрока —</option>'+
      PLAYER_ACCOUNTS.map(function(a){return '<option value="'+esc(a.u)+'"'+(COTERIE_PICK===a.u?' selected':'')+'>'+esc(a.name)+' (@'+esc(a.u)+')</option>';}).join('')+
      '</select></div>'+
      (COTERIE_PICK?pcMiniList(livePcsOf(COTERIE_PICK)):(PLAYER_ACCOUNTS.length?'':'<div class="tsub">Ни у одного игрока пока нет учётной записи — заведите через «пользователи».</div>'))+
      '</div>';
  } else if(role==='admin'){
    var others=LIVE_PCS.filter(function(x){return x.owner!==SESSION.username;});
    out+='<div class="pc-panel"><h3>Все чарники (админ)</h3><p class="sub">Видно автоматически, без выбора — просмотр, правка только у владельца.</p>'+
      (others.length?'<div class="pc-mini-list">'+others.map(function(x){return '<div class="row"><a href="#/coterie/'+x.id+'">'+esc(x.name)+'</a><span class="tag">@'+esc(x.owner)+'</span></div>';}).join('')+'</div>'
        :'<div class="tsub">Пока никто, кроме вас, персонажа не завёл.</div>')+
      '</div>';
  }
  return out;
}
function wireCoterieLive(container){
  if(!SESSION) return;
  var newBtn=container.querySelector('#pcNewBtn');
  if(newBtn) newBtn.addEventListener('click',function(){openPcForm(null,'pcFormMount');});
  var pick=container.querySelector('#pcPickPlayer');
  if(pick) pick.addEventListener('change',function(){COTERIE_PICK=pick.value||null;viewPlayers();});
}

/* ================= СТРАНИЦА ОДНОГО ЖИВОГО ПЕРСОНАЖА ================= */
function viewLivePC(id){
  var x=findLivePc(id);
  setTheme('player');
  if(!x){
    crumb([['Котерия','#/cat/players']]);
    app.innerHTML='<div class="wrap rise"><a class="back" href="#/cat/players">← котерия</a>'+
      emptyBox('Персонаж недоступен','Либо данные ещё загружаются, либо у вас нет прав его видеть, либо он удалён.')+'</div>';
    return;
  }
  TRK_OBJ[trkKey(x)]=x;
  crumb([['Котерия','#/cat/players'],[x.name]]);
  var editable=canEditLivePc(x); /* для _liveKind==='pcs' это строго «владелец, без исключений» — см. p3g_pcsync.js */
  var strip=[['Клан',x.clan?wikiTag(x.clan,esc(x.clan)):'',1],['Секта',x.sect?wikiTag(x.sect,esc(x.sect)):'',1],
    ['Поколение',x.gen||''],['Мощь крови',x.bp!=null?String(x.bp):''],['Тип хищника',x.predator?wikiTag(x.predator,esc(x.predator)):'',1],
    ['Сир',x.sire?nameLink(x.sire):'',1]];
  var out='<div class="wrap rise"><a class="back" href="#/cat/players">← котерия</a>'+
    jcard(x,'персонаж игрока · @'+esc(x.owner)+(editable?'':' · только просмотр'),strip)+
    section('Трекеры','живой лист — Firestore',trackerHtml(x))+
    sheetHtml(x,editable); /* p3j_sheet.js — атрибуты, навыки, дисциплины, охота, бросок… */
  if(x.convictions&&x.convictions.length) out+=section('Убеждения и Якоря',x.convictions.length,tableHtml({head:['Убеждение','Якорь'],
    rows:x.convictions.map(function(v){return [v[0],v[1]?'[['+v[1]+']]':'—'];})}));

  app.innerHTML=out+'<div style="height:30px"></div></div>';
  wireTrackers(app);

  }
}
