/* текстовые формулы → кнопки: «пул 6», «пул 6 / сл. 3», «проверка пробуждения», «2к10+1» */
var ROLL_RE=/(пул\s+(\d{1,2})(?:\s*[\/,;]\s*сл\.?\s*(\d{1,2}))?)|(проверк[аеуи]\s+пробуждения)|((\d{0,2})[кК](\d{1,3})(?:\s*([+−–-])\s*(\d{1,3}))?)/gi;
function activateRolls(root){
  var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),skip={BUTTON:1,SCRIPT:1,STYLE:1,A:1,TEXTAREA:1,INPUT:1,SELECT:1,OPTION:1},targets=[],node;
  while((node=walker.nextNode())){var par=node.parentNode;
    if(!par||skip[par.nodeName]||(par.closest&&par.closest('a,button,svg,.srch-res,.dock')))continue;
    ROLL_RE.lastIndex=0;if(ROLL_RE.test(node.nodeValue))targets.push(node);}
  targets.forEach(function(n){
    var txt=n.nodeValue,frag=document.createDocumentFragment(),last=0,m,made=0;ROLL_RE.lastIndex=0;
    while((m=ROLL_RE.exec(txt))){
      var prev=m.index>0?txt.charAt(m.index-1):'';
      if(/[0-9A-Za-zА-Яа-яЁё]/.test(prev))continue;
      var b=document.createElement('button');b.type='button';b.className='roll';b.textContent=m[0];
      if(m[1]){b.dataset.pool=m[2];if(m[3])b.dataset.dif=m[3];}
      else if(m[4]){b.dataset.rouse='1';}
      else{var sides=+m[7],cnt=m[6]?+m[6]:1;if([2,3,4,6,8,10,12,20,100].indexOf(sides)<0||cnt<1||cnt>30)continue;
        b.dataset.n=cnt;b.dataset.s=sides;b.dataset.m=m[9]?(m[8]==='+'?1:-1)*(+m[9]):0;}
      if(m.index>last)frag.appendChild(document.createTextNode(txt.slice(last,m.index)));
      frag.appendChild(b);last=m.index+m[0].length;made++;}
    if(!made)return;
    if(last<txt.length)frag.appendChild(document.createTextNode(txt.slice(last)));
    n.parentNode.replaceChild(frag,n);});
}
function onRollClick(e){

function sessRange(){var ns=SESSIONS.map(function(s){return s.n;});return ns.length?[Math.min.apply(null,ns),Math.max.apply(null,ns)]:null;}

/* ================= СТАТУС ================= */
function statusEvents(){var out=[];SESSIONS.forEach(function(s){s.items.forEach(function(it){
  if(it&&it.status) out.push({n:s.n,who:it.status.who,sect:it.status.sect||'',delta:+it.status.delta||0});});});return out;}
function statusNow(who,sect,base){var v=+base||0;statusEvents().forEach(function(e){if(same(e.who,who)&&e.sect===sect)v+=e.delta;});return Math.max(0,v);}
function statusSeries(){
  var keys={},order=[];
  function add(who,sect,base){var k=(hrefOf(who)||who)+'|'+sect;if(!keys[k]){keys[k]={who:who,sect:sect,base:+base||0};order.push(k);}}
  allPeople().forEach(function(p){if(p.status)Object.keys(p.status).forEach(function(s){add(p.name,s,p.status[s]);});});
  statusEvents().forEach(function(e){add(e.who,e.sect,0);});
  return order.map(function(k){return keys[k];});
}
var PAL=['#E0142F','#D4AF37','#8FB8DE','#B98CFF','#6FCF8E','#E0812E','#D1436A','#7FB5A8','#F2C14E','#9FB9D1'];
function lineChart(series,yLabel){
  var rg=sessRange();if(!rg||!series.length)return '';
  var W=900,H=280,L=46,Rr=20,T=20,B=40,n0=rg[0]-1,n1=rg[1];
  var all=[];series.forEach(function(s){all=all.concat(s.pts.map(function(p){return p[1];}));});
  var mn=Math.min(0,Math.min.apply(null,all)),mx=Math.max(5,Math.max.apply(null,all));
  function X(n){return L+(n-n0)/Math.max(1,n1-n0)*(W-L-Rr);} function Y(v){return T+(mx-v)/Math.max(1,mx-mn)*(H-T-B);}
  var g='';for(var v=mn;v<=mx;v++) g+='<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="rgba(255,255,255,.07)"/><text x="'+(L-10)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="11" fill="#A38F8C" font-family="JetBrains Mono">'+v+'</text>';
  for(var n=n0;n<=n1;n++) g+='<text x="'+X(n)+'" y="'+(H-14)+'" text-anchor="middle" font-size="11" fill="#A38F8C" font-family="JetBrains Mono">'+(n===n0?'старт':'С'+n)+'</text>';
  series.forEach(function(s){g+='<polyline fill="none" stroke="'+s.color+'" stroke-width="2.5" points="'+s.pts.map(function(p){return X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1);}).join(' ')+'"/>'+
    s.pts.map(function(p){return '<circle cx="'+X(p[0]).toFixed(1)+'" cy="'+Y(p[1]).toFixed(1)+'" r="4" fill="'+s.color+'"><title>'+esc(s.name)+': '+p[1]+'</title></circle>';}).join('');});
  return '<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(yLabel)+'">'+g+'</svg><div class="legend">'+series.map(function(s){
    return '<span class="legend-item"><i style="background:'+s.color+'"></i>'+esc(s.name)+'<b>'+s.pts[s.pts.length-1][1]+'</b></span>';}).join('')+'</div></div>';
}
function statusChart(){
  var rg=sessRange();if(!rg)return '';
  var ser=statusSeries().map(function(s,i){var v=s.base,pts=[[rg[0]-1,v]];
    for(var n=rg[0];n<=rg[1];n++){statusEvents().forEach(function(e){if(e.n===n&&same(e.who,s.who)&&e.sect===s.sect)v+=e.delta;});pts.push([n,Math.max(0,v)]);}
    var sc=null;SECTS.forEach(function(x){if(x.name===s.sect&&x.acc)sc=x.acc;});
    return {name:s.who+(s.sect?' · '+s.sect:''),color:PAL[i%PAL.length]||sc,pts:pts};});
  return lineChart(ser,'Статус по сессиям');
}

/* ================= ГРАФ СВЯЗЕЙ ================= */
function graphData(){
  var nodes={},list=[],edges=[];
  function node(n){var k=hrefOf(n)||n;if(!nodes[k]){var pc=PCS.some(function(p){return same(p.name,n);}),pe=PEOPLE.some(function(p){return same(p.name,n);});
    nodes[k]={id:k,name:n,href:hrefOf(n),kind:pc?'pc':pe?'person':'other'};list.push(nodes[k]);}return nodes[k];}
  function edge(a,b,type,note,gm){if(!a||!b)return;edges.push({a:node(a),b:node(b),type:REL_TYPES[type]?type:'other',note:note||'',gm:!!gm});}
  /* gm-рёбра (с v1.42, §1.3.4) — только при виде «Мастер» */
  RELATIONS.filter(gmOk).forEach(function(r){edge(r.a,r.b,r.type,r.note,r.gm);});
  BONDS.filter(gmOk).forEach(function(b){edge(b.thrall,b.regnant,'bond','ступень '+b.level+(b.note?' · '+b.note:''));});
  BOONS.filter(gmOk).filter(function(b){return b.status==='open'||!b.status;}).forEach(function(b){edge(b.debtor,b.creditor,'debt',(BOON_LEVELS[b.level]||['долг'])[0]+' долг');});
  allPeople().forEach(function(p){if(p.sire)edge(p.sire,p.name,'sire','');});
  PCS.forEach(function(p){(p.convictions||[]).forEach(function(c){if(c[1])edge(p.name,c[1],'touch',c[0]);});});
  return {nodes:list,edges:edges};
}

function drawWeb(G){
  var W=1000,H=640,box=document.getElementById('web');
  var edges=G.edges.filter(function(e){return !WEB_OFF[e.type];});
  var N=G.nodes;N.forEach(function(n,i){var a=i/N.length*Math.PI*2;n.x=W/2+Math.cos(a)*220;n.y=H/2+Math.sin(a)*200;n.vx=0;n.vy=0;});
  for(var it=0;it<420;it++){
    for(var i=0;i<N.length;i++)for(var j=i+1;j<N.length;j++){var a=N[i],b=N[j],dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+.01,f=9000/d2,dd=Math.sqrt(d2);
      a.vx+=f*dx/dd;a.vy+=f*dy/dd;b.vx-=f*dx/dd;b.vy-=f*dy/dd;}
    edges.forEach(function(e){var dx=e.b.x-e.a.x,dy=e.b.y-e.a.y,dd=Math.sqrt(dx*dx+dy*dy)+.01,f=(dd-190)*.02;
      e.a.vx+=f*dx/dd;e.a.vy+=f*dy/dd;e.b.vx-=f*dx/dd;e.b.vy-=f*dy/dd;});
    N.forEach(function(n){n.vx+=(W/2-n.x)*.004;n.vy+=(H/2-n.y)*.004;n.x+=n.vx*.5;n.y+=n.vy*.5;n.vx*=.6;n.vy*=.6;
      n.x=Math.max(60,Math.min(W-60,n.x));n.y=Math.max(40,Math.min(H-40,n.y));});
  }
  var col={pc:'#E8B04B',person:'#D0243F',other:'#8FB8DE'};
  var defs='<defs>'+Object.keys(REL_TYPES).map(function(k){return '<marker id="ar-'+k+'" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="'+REL_TYPES[k][1]+'"/></marker>';}).join('')+'</defs>';
  var dir={bond:1,debt:1,sire:1,serve:1,touch:1};
  if(!WEB_VB) WEB_VB={x:0,y:0,w:W,h:H};
  var vb=WEB_VB;
  var s='<svg viewBox="'+vb.x.toFixed(1)+' '+vb.y.toFixed(1)+' '+vb.w.toFixed(1)+' '+vb.h.toFixed(1)+'">'+defs;
  var pairN={};edges.forEach(function(e){var k=[e.a.id,e.b.id].sort().join('~');e.k=pairN[k]=(pairN[k]||0)+1;e.flip=e.a.id>e.b.id;});
  edges.forEach(function(e,i){s+='<path class="edge" fill="none" data-e="'+i+'" stroke="'+REL_TYPES[e.type][1]+'" stroke-width="2.2"'+(dir[e.type]?' marker-end="url(#ar-'+e.type+')"':'')+
    (e.type==='touch'?' stroke-dasharray="5 5"':e.gm?' stroke-dasharray="2 4"':'')+'><title>'+esc((e.gm?'[для мастера] ':'')+REL_TYPES[e.type][0]+(e.note?': '+e.note:''))+'</title></path>';});
  N.forEach(function(n,i){s+='<g class="node" data-n="'+i+'"><circle r="'+(n.kind==='other'?9:13)+'" fill="'+col[n.kind]+'" stroke="#000" stroke-width="2"/>'+
    '<text y="-18" text-anchor="middle">'+esc(n.name)+'</text></g>';});
  var zoomHtml='<div class="zoomctl"><button type="button" data-zoom="in" title="Приблизить" aria-label="Приблизить">+</button>'+
    '<button type="button" data-zoom="out" title="Отдалить" aria-label="Отдалить">−</button>'+
    '<button type="button" data-zoom="reset" class="rst" title="Сбросить масштаб" aria-label="Сбросить масштаб">1:1</button></div>';
  box.innerHTML=s+'</svg>'+zoomHtml;
  var svg=box.querySelector('svg'),lines=svg.querySelectorAll('.edge'),gs=svg.querySelectorAll('.node');
  function place(){edges.forEach(function(e,i){var dx=e.b.x-e.a.x,dy=e.b.y-e.a.y,L=Math.sqrt(dx*dx+dy*dy)||1,
      off=(e.k-1)*(e.k%2?1:-1)*0+(e.k===1?0:(e.k%2?1:-1)*Math.ceil((e.k-1)/2)*34)*(e.flip?-1:1),
      cx=(e.a.x+e.b.x)/2-dy/L*off,cy=(e.a.y+e.b.y)/2+dx/L*off;
    lines[i].setAttribute('d','M'+e.a.x.toFixed(1)+' '+e.a.y.toFixed(1)+'Q'+cx.toFixed(1)+' '+cy.toFixed(1)+' '+e.b.x.toFixed(1)+' '+e.b.y.toFixed(1));});
    N.forEach(function(n,i){gs[i].setAttribute('transform','translate('+n.x.toFixed(1)+','+n.y.toFixed(1)+')');});}
  place();
  function pt(ev){var p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
  /* Масштаб/панорама: viewBox — «камера» над неизменной сценой 1000×640,
     позиции узлов и путей не трогает. zoomAt держит точку (px,py) на месте
     под курсором/центром при изменении масштаба (как в картах). */
  function applyVB(){svg.setAttribute('viewBox',vb.x.toFixed(1)+' '+vb.y.toFixed(1)+' '+vb.w.toFixed(1)+' '+vb.h.toFixed(1));}
  function zoomAt(px,py,f){
    var nw=Math.max(140,Math.min(W,vb.w*f)),nh=nw*(H/W);
    var nx=px-(px-vb.x)*(nw/vb.w),ny=py-(py-vb.y)*(nh/vb.h),pad=60;
    vb.w=nw;vb.h=nh;
    vb.x=Math.max(-pad,Math.min(W-nw+pad,nx));
    vb.y=Math.max(-pad,Math.min(H-nh+pad,ny));
  }
  [].forEach.call(box.querySelectorAll('[data-zoom]'),function(b){b.addEventListener('click',function(ev){
    ev.preventDefault();var k=b.getAttribute('data-zoom');
    if(k==='reset'){vb.x=0;vb.y=0;vb.w=W;vb.h=H;}
    else zoomAt(vb.x+vb.w/2,vb.y+vb.h/2,k==='in'?1/1.4:1.4);
    applyVB();});});
  svg.addEventListener('wheel',function(ev){ev.preventDefault();var p=pt(ev);zoomAt(p.x,p.y,ev.deltaY<0?1/1.15:1.15);applyVB();},{passive:false});
  var drag=null,moved=false,pan=null;
  svg.addEventListener('pointerdown',function(ev){var g=ev.target.closest('.node');
    if(g){drag=N[+g.getAttribute('data-n')];moved=false;svg.setPointerCapture(ev.pointerId);return;}
    pan={cx:ev.clientX,cy:ev.clientY,vx:vb.x,vy:vb.y};moved=false;svg.setPointerCapture(ev.pointerId);});
  svg.addEventListener('pointermove',function(ev){
    if(drag){var p=pt(ev);drag.x=p.x;drag.y=p.y;moved=true;place();return;}
    if(pan){var rect=svg.getBoundingClientRect(),sx=vb.w/rect.width,sy=vb.h/rect.height,
        dx=(ev.clientX-pan.cx)*sx,dy=(ev.clientY-pan.cy)*sy,pad=60;
      if(Math.abs(ev.clientX-pan.cx)>2||Math.abs(ev.clientY-pan.cy)>2)moved=true;
      vb.x=Math.max(-pad,Math.min(W-vb.w+pad,pan.vx-dx));
      vb.y=Math.max(-pad,Math.min(H-vb.h+pad,pan.vy-dy));
      applyVB();return;}
    var g=ev.target.closest('.node');box.classList.toggle('hl',!!g);
    if(g){var n=N[+g.getAttribute('data-n')];[].forEach.call(gs,function(x,i){x.classList.toggle('on',N[i]===n||edges.some(function(e){return (e.a===n&&e.b===N[i])||(e.b===n&&e.a===N[i]);}));});
      [].forEach.call(lines,function(l,i){l.classList.toggle('on',edges[i].a===n||edges[i].b===n);});}});
  svg.addEventListener('pointerup',function(ev){var d0=drag;drag=null;pan=null;if(d0&&!moved&&d0.href)location.hash=d0.href;});
  svg.addEventListener('pointerleave',function(){box.classList.remove('hl');});
}

function sha256Hex(text){
  var enc=new TextEncoder().encode(text);
  return crypto.subtle.digest('SHA-256',enc).then(function(buf){
    return Array.prototype.map.call(new Uint8Array(buf),function(b){return b.toString(16).padStart(2,'0');}).join('');
  });
}

function bootAuth(cb){
  /* Обход входа для автотестов (test.py задаёт window.name ДО загрузки страницы) —
     Firebase недоступен из песочницы агента. Никаких реальных прав это не даёт:
     SESSION поддельная только на клиенте, любое чтение/запись в Firestore всё равно
     упрётся в правила безопасности без настоящей сессии — см. §1.3 в комментарии. */
  if(window.name==='KODEKS_TEST_BYPASS'){SESSION={uid:'test',username:'test',role:'admin',displayName:'Тест'};cb();return;}
  if(KODEKS_PREVIEW){SESSION={uid:'preview',username:'preview',role:'master',displayName:'Предпросмотр',preview:true};renderUserBadge();cb();return;}
  var gate=document.getElementById('authGate');
  gate.classList.remove('hidden');
  if(!fbAuth){
    gate.innerHTML='<div class="auth-card"><h2>Не удалось загрузить Firebase</h2>'+
      '<p class="note">Проверьте интернет-соединение (SDK грузится с www.gstatic.com) и обновите страницу. '+
      'Если это повторяется — возможно, блокировщик рекламы/скриптов режет Google-домены.</p></div>';
    return;
  }
  gate.innerHTML='<div class="auth-card"><p class="sub">Подключение…</p></div>';
  fbAuth.signInAnonymously().then(function(){
    return fbDb.collection('meta').doc('bootstrap').get();
  }).then(function(metaDoc){
    if(!metaDoc.exists){showBootstrapForm(cb);return;}
    var uid=fbAuth.currentUser.uid;
    fbDb.collection('sessions').doc(uid).get().then(function(sd){
      if(sd.exists){
        fbDb.collection('users').doc(sd.data().username).get().then(function(ud){
          if(ud.exists){
            SESSION={uid:uid,username:sd.data().username,role:ud.data().role,displayName:ud.data().displayName||sd.data().username};
            gate.classList.add('hidden');renderUserBadge();cb();
          } else {showLoginForm(cb,'Учётная запись была удалена — войдите заново.');}
        }).catch(function(){showLoginForm(cb);});
      } else {showLoginForm(cb);}
    }).catch(function(){showLoginForm(cb);});
  }).catch(function(e){
    gate.innerHTML='<div class="auth-card"><h2>Не удалось подключиться</h2>'+

    (note?'<p class="note">'+esc(note)+'</p>':'')+
    '<label for="authUser">Логин</label><input id="authUser" type="text" autocomplete="username" autocapitalize="off" autocorrect="off">'+
    '<label for="authPass">Пароль</label><input id="authPass" type="password" autocomplete="current-password">'+
    '<div class="err" id="authErr"></div>'+
    '<button class="mini pri" type="button" id="authGo">Войти</button>'+
    '<p class="sub switch">Ещё нет аккаунта? <a id="authToReg">Зарегистрироваться</a></p>'+
    '</div>';
  var user=document.getElementById('authUser'),pass=document.getElementById('authPass'),
      err=document.getElementById('authErr'),go=document.getElementById('authGo');
  function submit(){
    var u=user.value.trim().toLowerCase(),p=pass.value;
    err.textContent='';
    if(!u||!p){err.textContent='Заполните логин и пароль.';return;}
    go.disabled=true;go.textContent='Проверка…';
    sha256Hex(p).then(function(hash){
      var uid=fbAuth.currentUser.uid;
      return fbDb.collection('sessions').doc(uid).set({username:u,passwordHash:hash,createdAt:firebase.firestore.FieldValue.serverTimestamp()})
        .then(function(){return fbDb.collection('users').doc(u).get();});
    }).then(function(ud){
      var data=ud.data();
      SESSION={uid:fbAuth.currentUser.uid,username:u,role:data.role,displayName:data.displayName||u};
      gate.classList.add('hidden');renderUserBadge();cb();
    }).catch(function(){
      go.disabled=false;go.textContent='Войти';
      err.textContent='Неверный логин или пароль.';
    });
  }
  go.addEventListener('click',submit);
  pass.addEventListener('keydown',function(e){if(e.key==='Enter')submit();});
  document.getElementById('authToReg').addEventListener('click',function(){showRegisterForm(cb);});
  user.focus();
}

/* ================= ВХОД: САМОСТОЯТЕЛЬНАЯ РЕГИСТРАЦИЯ ИГРОКА (с v1.38) =================
   Сказано рассказчиком явно (v1.38): новых игроков больше не заводит админ руками
   через #/admin/users — они сами создают себе логин/пароль прямо на экране входа.
   Открыто полностью (спрошено явно) — без кода-приглашения, любой человек со
   ссылкой на сайт может завести себе аккаунт-игрока.
   Роль всегда 'player' — 'master'/'admin' по-прежнему заводит только сам админ
   (см. viewAdminUsers ниже), самостоятельная форма роль не спрашивает и в
   Firestore шлёт её жёстко зашитой, а не берёт с формы — правило create в
   firestore.rules отдельно перепроверяет, что это 'player', так что подделать
   роль через devtools не выйдет.
   «Логин не занят» не проверяется отдельным чтением заранее — правило read
   не пускает ещё не вошедшего читать чужой users/{u} (см. firestore.rules), а
   значит и не узнать заранее. Вместо этого сама попытка create — это и есть
   проверка: если документ с таким id уже существует, Firestore трактует
   запись как update (не create) независимо от того, что вызвал клиент, а
   правило update требует isAdmin() — значит попытка с занятым логином сама
   получит permission-denied, ровно нужное поведение, без гонки состояний. */
function showRegisterForm(cb){
  var gate=document.getElementById('authGate');
  gate.innerHTML='<div class="auth-card">'+
    '<h2>Кодекс Ночи</h2><p class="sub">Регистрация игрока</p>'+
    '<label for="regUser">Логин</label><input id="regUser" type="text" autocomplete="username" autocapitalize="off" autocorrect="off">'+
    '<label for="regPass">Пароль</label><input id="regPass" type="password" autocomplete="new-password">'+
    '<label for="regPass2">Повторите пароль</label><input id="regPass2" type="password" autocomplete="new-password">'+
    '<div class="err" id="regErr"></div>'+
    '<button class="mini pri" type="button" id="regGo">Зарегистрироваться</button>'+
    '<p class="sub switch">Уже есть аккаунт? <a id="regToLogin">Войти</a></p>'+
    '</div>';
  var user=document.getElementById('regUser'),pass=document.getElementById('regPass'),pass2=document.getElementById('regPass2'),
      err=document.getElementById('regErr'),go=document.getElementById('regGo');
  function submit(){
    var u=user.value.trim().toLowerCase(),p=pass.value,p2=pass2.value;
    err.textContent='';
    if(!u||!p){err.textContent='Заполните логин и пароль.';return;}
    if(!/^[a-z0-9_]+$/.test(u)){err.textContent='Логин — латиница, цифры и «_», без пробелов.';return;}
    if(p.length<4){err.textContent='Пароль слишком короткий (мин. 4 символа).';return;}
    if(p!==p2){err.textContent='Пароли не совпадают.';return;}
    go.disabled=true;go.textContent='Создание…';
    sha256Hex(p).then(function(hash){
      return fbDb.collection('users').doc(u).set({passwordHash:hash,role:'player',displayName:u,createdAt:firebase.firestore.FieldValue.serverTimestamp()})
        .catch(function(e){e.__step='create';throw e;})
        .then(function(){
          var uid=fbAuth.currentUser.uid;
          return fbDb.collection('sessions').doc(uid).set({username:u,passwordHash:hash,createdAt:firebase.firestore.FieldValue.serverTimestamp()})
            .catch(function(e){e.__step='session';throw e;});
        });
    }).then(function(){
      SESSION={uid:fbAuth.currentUser.uid,username:u,role:'player',displayName:u};
      gate.classList.add('hidden');renderUserBadge();cb();
    }).catch(function(e){
      go.disabled=false;go.textContent='Зарегистрироваться';
      err.textContent=(e&&e.__step==='session')
        ? 'Аккаунт создан, но не получилось сразу войти — обновите страницу и войдите с этим логином и паролем.'
        : 'Не получилось — возможно, такой логин уже занят. Попробуй другой.';
    });
  }
  go.addEventListener('click',submit);
  pass2.addEventListener('keydown',function(e){if(e.key==='Enter')submit();});
  document.getElementById('regToLogin').addEventListener('click',function(){showLoginForm(cb);});
  user.focus();
}

/* ================= ВХОД: ПЕРВЫЙ ЗАПУСК (СОЗДАНИЕ ПЕРВОГО АДМИНА) ================= */
function showBootstrapForm(cb){
  var gate=document.getElementById('authGate');
  gate.innerHTML='<div class="auth-card">'+
    '<h2>Первый запуск</h2><p class="sub">Учётных записей ещё нет — заведите первую, админскую</p>'+
    '<label for="bsUser">Логин</label><input id="bsUser" type="text" autocomplete="username" autocapitalize="off" autocorrect="off">'+
    '<label for="bsPass">Пароль</label><input id="bsPass" type="password" autocomplete="new-password">'+
    '<div class="err" id="bsErr"></div>'+
    '<button class="mini pri" type="button" id="bsGo">Создать админа и войти</button>'+
    '</div>';
  var user=document.getElementById('bsUser'),pass=document.getElementById('bsPass'),
      err=document.getElementById('bsErr'),go=document.getElementById('bsGo');
  go.addEventListener('click',function(){
    var u=user.value.trim().toLowerCase(),p=pass.value;
    err.textContent='';
    if(!u||!p){err.textContent='Заполните логин и пароль.';return;}
    if(p.length<4){err.textContent='Пароль слишком короткий (мин. 4 символа).';return;}
    go.disabled=true;go.textContent='Создание…';
    sha256Hex(p).then(function(hash){
      var uid=fbAuth.currentUser.uid;
      /* Не batch(): правила Firestore проверяют каждую запись batch по снимку
         базы ДО всего пакета, поэтому sessions/{uid} не увидел бы только что
         созданный в том же batch users/{u} (см. v1.34 в комментарии). Пишем
         последовательно — users сначала, meta/bootstrap последним, чтобы
         каждая следующая проверка правил видела уже сохранённый результат
         предыдущей записи. */
      return fbDb.collection('users').doc(u).set({passwordHash:hash,role:'admin',displayName:u,createdAt:firebase.firestore.FieldValue.serverTimestamp()})
        .then(function(){return fbDb.collection('sessions').doc(uid).set({username:u,passwordHash:hash,createdAt:firebase.firestore.FieldValue.serverTimestamp()});})
        .then(function(){return fbDb.collection('meta').doc('bootstrap').set({done:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()});});
    }).then(function(){
      SESSION={uid:fbAuth.currentUser.uid,username:u,role:'admin',displayName:u};
      gate.classList.add('hidden');renderUserBadge();cb();
    }).catch(function(e){
      go.disabled=false;go.textContent='Создать админа и войти';
      err.textContent='Не получилось: '+esc(e.message||String(e));
    });
  });
  user.focus();
}

}

function loadAdminUsers(){
  var box=document.getElementById('adminUserList');
  fbDb.collection('users').get().then(function(qs){
    if(qs.empty){box.className='empty';box.innerHTML='<b>Пусто</b><span>Учётных записей пока нет.</span>';return;}
    box.className='';
    var rows=[];
    qs.forEach(function(doc){rows.push({u:doc.id,role:doc.data().role,name:doc.data().displayName||doc.id});});
    rows.sort(function(a,b){return a.u<b.u?-1:1;});
    box.innerHTML=rows.map(function(r){
      return '<div class="admin-row" data-u="'+esc(r.u)+'">'+
        '<div class="who"><b>'+esc(r.name)+'</b><span>@'+esc(r.u)+'</span></div>'+
        '<select class="mini roleSel"'+(r.u===SESSION.username?' disabled title="Свою роль поменять нельзя — это защита от случайного понижения себя"':'')+'>'+['player','master','admin'].map(function(k){
          return '<option value="'+k+'"'+(k===r.role?' selected':'')+'>'+ROLE_NAMES[k]+'</option>';}).join('')+'</select>'+
        '<button class="mini" type="button" data-act="reset">Сбросить пароль</button>'+
        (r.u!==SESSION.username?'<button class="mini" type="button" data-act="del">Удалить</button>':'')+
        '</div>';
    }).join('');
    [].forEach.call(box.querySelectorAll('.admin-row'),function(row){
      var u=row.getAttribute('data-u');
      var rs=row.querySelector('.roleSel'),was=rs.value;
      rs.addEventListener('change',function(e){
        var nv=e.target.value;
        if(!confirm('Сменить роль «'+u+'» на «'+ROLE_NAMES[nv]+'»?')){rs.value=was;return;}
        fbDb.collection('users').doc(u).update({role:nv}).then(function(){was=nv;})
          .catch(function(er){rs.value=was;alert('Не получилось: '+(er.message||er));});
      });
      row.querySelector('[data-act="reset"]').addEventListener('click',function(){
        var np=prompt('Новый пароль для «'+u+'»:');
        if(!np)return;
        sha256Hex(np).then(function(hash){return fbDb.collection('users').doc(u).update({passwordHash:hash});})
          .then(function(){alert('Пароль обновлён.');});
      });
      var delBtn=row.querySelector('[data-act="del"]');
      if(delBtn)delBtn.addEventListener('click',function(){
        if(confirm('Удалить учётную запись «'+u+'»?'))fbDb.collection('users').doc(u).delete().then(loadAdminUsers);
      });
    });
  }).catch(function(e){box.innerHTML='<b>Ошибка загрузки</b><span>'+esc(e.message||String(e))+'</span>';});
}

/* ================= ЖИВЫЕ ЛИСТЫ ПЕРСОНАЖЕЙ (Firestore, с v1.35) =================
   Первая функция из бэклога §1.2 «игровая механика». Track персонажа игрока
   (голод/здоровье/воля/человечность — тот же объект, что раньше жил только
   в localStorage, см. trkDefault/trkGet/trkSet в p3c_dice.js) для PCS-записи
   с полем owner теперь хранится в Firestore (pcstate/{id персонажа}) и виден
   всем залогиненным сразу, без обновления страницы у других участников.
   NPC и угрозы (PEOPLE/THREATS) НЕ трогаем — они как были, так и остаются
   только в localStorage: owner у них никогда не выставляется, значит
   isLivePc() для них всегда false, весь путь ниже для них не используется.

   PCS[].owner — логин (username) учётной записи Firestore, которой должен
   принадлежать этот персонаж. Поле выставляется мной (агентом) в данных по
   прямому указанию рассказчика — так же, как и все остальные поля PCS,
   рассказчик сам файл не редактирует (см. правила в начале файла). Если
   owner не задан — персонаж работает как раньше, чисто локально.

   ПРАВА РЕДАКТИРОВАНИЯ (см. предупреждение в firestore.rules у pcstate):
   мастер/админ — всегда; игрок — только если owner совпадает с его логином.
   Проверка — только на клиенте (canEditLivePc), правила Firestore пропускают
   запись от ЛЮБОГО игрока или мастера технически (модель доверия закрытой
   группы, та же, что и для паролей без соли — см. §1.3). Кнопки правки на
   чужом живом листе просто не рисуются (см. изменения в trkInner). */

var PCSTATE_CACHE={};  /* {trkKey: {...track...}|null} — последний снимок Firestore для персонажей PCS[], чья страница сейчас открыта (см. ниже — самостоятельные чарники x._liveKind==='pcs' эту кэш-таблицу не используют, у них снимок уже лежит прямо в самом объекте, см. p3h_coterie.js) */
var pcstateUnsub=null; /* отписка от текущего onSnapshot — вызывается при уходе со страницы персонажа, см. dispatch() в p3e_home.js */

/* С v1.37 «живой лист» бывает ДВУХ видов — важно не путать (см. §1.3.2 в
   комментарии):
   1) СТАРЫЙ (с v1.35): запись в статичном PCS[] с полем owner — полную
      анкету по-прежнему пишет рассказчик (агент) по надиктовке, живой
      только track (голод/здоровье/воля/человечность), см. pcstate/{id}
      ниже. Мастер/админ могут править ЛЮБОЙ такой лист.
   2) НОВЫЙ (с v1.37): персонаж, которого игрок/мастер завёл САМ прямо на
      сайте (вкладка Котерия) — вся анкета целиком живёт в Firestore
      (коллекция pcs), не только track. Такие объекты помечены полем
      x._liveKind==='pcs' (проставляется в p3h_coterie.js при получении
      снимка коллекции). Здесь правило ИНАЧЕ: править может ТОЛЬКО
      владелец — даже мастер и админ такой лист не редактируют, только
      просматривают (см. панель мастера/просмотр админа в p3h_coterie.js;
      сказано рассказчиком явно, v1.37). */
function pcOwnerOf(x){return x&&x.owner?String(x.owner).toLowerCase():null;}
function isLivePc(x){return !!x && !!fbDb && (x._liveKind==='pcs' || (PCS.indexOf(x)>-1 && !!pcOwnerOf(x)));}
function canEditLivePc(x){
  if(!SESSION) return false;
  if(x._liveKind==='pcs') return pcOwnerOf(x)===SESSION.username; /* самостоятельный чарник — без исключений для мастера/админа */
  if(SESSION.role==='admin'||SESSION.role==='master') return true;
  return pcOwnerOf(x)===SESSION.username;
}

function stopPcSync(){ if(pcstateUnsub){pcstateUnsub();pcstateUnsub=null;} }

/* Вызывается из viewPC() при открытии страницы персонажа — если это живой
   персонаж, подписываемся на его документ; иначе просто убеждаемся, что
   старая подписка (с предыдущей страницы) снята. */
function startPcSyncIfLive(x){
  stopPcSync();
  if(!isLivePc(x)) return;
  var key=trkKey(x),id=x.id;
  pcstateUnsub=fbDb.collection('pcstate').doc(id).onSnapshot(function(doc){
    PCSTATE_CACHE[key]=doc.exists?doc.data():trkDefault(x);
    refreshTrackers(key);
  },function(){
    /* нет сети / нет прав на чтение — остаёмся без живых данных,
       trkGet() сам откатится на localStorage/дефолты (см. p3c_dice.js) */
  });
}

function pcSyncWrite(x,st){
  if(!isLivePc(x)||!canEditLivePc(x)) return;
  var data={};for(var k in st) data[k]=st[k];
  data.updatedAt=firebase.firestore.FieldValue.serverTimestamp();
  data.updatedBy=SESSION.username;
  /* самостоятельный чарник (x._liveKind==='pcs') хранит track ПРЯМО в своём
     документе pcs/{id} вместе с анкетой — merge:true, чтобы не затереть
     остальные поля анкеты; старый механизм пишет в отдельный pcstate/{id},
     там merge не нужен, но и не мешает. */
  var col=x._liveKind==='pcs'?'pcs':'pcstate';
  fbDb.collection(col).doc(x.id).set(data,{merge:true}).catch(function(){
    /* офлайн/ошибка сети — локальная копия в STORE (см. trkSet) уже сохранена,
       при следующем подключении onSnapshot подтянет актуальную версию сервера */
  });
}

/* ================= КОТЕРИЯ: САМОСТОЯТЕЛЬНЫЕ ЧАРНИКИ (Firestore, с v1.37) =================
   См. §1.3.2 в комментарии p0_comment.html за полным описанием. Коротко:
   игрок заводит своего персонажа САМ во вкладке Котерия (#/cat/players) —
   вся анкета целиком хранится в Firestore (коллекция pcs), а не только
   track, как у старого механизма живых листов (p3g_pcsync.js, v1.35,
   pcstate/{id} для статичных PCS[] с owner). Оба механизма живут
   параллельно и не пересекаются — см. предупреждение в p3g_pcsync.js.

   ВИДИМОСТЬ (сказано рассказчиком, v1.37): игрок видит и открывает
   только свой чарник; мастер получает панель выбора ников игроков, чтобы
   заглянуть к любому; админ видит все автоматически. Обеспечено ПРАВИЛАМИ
   Firestore (firestore.rules, allow read у /pcs/{pcId}), а не только
   сокрытием кнопок на клиенте — чужой документ, который не проходит
   правило, сервер просто не отдаст, даже если знать его id.

   ПРАВКА: только владелец, всегда — даже мастер и админ чужой
   самостоятельный чарник не редактируют, только смотрят. Это НАРОЧНО
   отличается от старого механизма (там мастер/админ правят любой живой
   лист) — сказано явно, v1.37.

   LIVE_PCS — плоский кэш коллекции pcs, каким его сейчас видят ПРАВИЛА
   для текущего пользователя (у игрока это только его собственные записи,
   у мастера/админа — все). Обновляется целиком при каждом onSnapshot;
   чтобы не путать «старые» объекты из прошлого снимка ссылками, у каждого
   объекта проставлен маркер _liveKind:'pcs' (проверяется по значению
   поля, а не по индексу в массиве — см. isLivePc/canEditLivePc/trkKey). */

var LIVE_PCS=[];          /* [{..анкета+track.., id, owner, _liveKind:'pcs'}] */
var PLAYER_ACCOUNTS=[];   /* [{u,name}] — только для панели мастера, см. ниже про users/{username} */
var livePcsUnsub=null,playersUnsub=null;
var COTERIE_PICK=null;    /* выбранный в панели мастера логин игрока, null = никто не выбран */

function startCoterieSync(){
  /* предпросмотр для телефона (без сервера) — один пример-персонаж, чтобы
     было на чём посмотреть интерактивный лист; правки живут до перезагрузки */
  if(KODEKS_PREVIEW&&SESSION&&!LIVE_PCS.length){
    LIVE_PCS=[pcFromFs({id:'preview-demo',_liveKind:'pcs',owner:SESSION.username,name:'Пример персонажа',
      short:'Лист для проверки с телефона — правки не сохраняются после перезагрузки',clan:'Бруха',gen:12,bp:1,
      attrs:{str:3,dex:2,sta:3,cha:2,man:2,com:2,int:1,wit:3,res:2},skills:{bra:3,ath:2,itm:2,str2:2,ste:1,awa:1,dri:1},
      disciplines:[{n:'Могущество',d:2,p:''},{n:'Присутствие',d:1,p:''}],advantages:[],huntA:'str',huntS:'bra',xpTotal:0,xpSpent:0,
      hunger:1,hMax:6,hSup:0,hAgg:0,wMax:4,wSup:0,wAgg:0,hum:7,stains:0})];
    return;
  }
  if(!fbDb||!SESSION) return;
  if(livePcsUnsub) livePcsUnsub();
  /* ВАЖНО (баг, найден на живом сайте, v1.40): правило чтения pcs —
     isMaster() || resource.data.owner==sessionUsername() — зависит от
     resource.data для не-мастера. Firestore не «фильтрует» список по
     правилу построчно: для ЗАПРОСА (list/onSnapshot) без where он
     ЗАРАНЕЕ проверяет, гарантирует ли правило допуск КАЖДОГО возможного
     документа в коллекции — а для игрока это не так (в коллекции есть
     чужие pcs), значит весь запрос целиком получает permission-denied,
     даже если фактически там сейчас только его собственный документ.
     Из-за этого свой только что созданный чарник молча не появлялся в
     LIVE_PCS — карточка «Персонаж недоступен» оставалась навсегда, хотя
     сам документ в Firestore прекрасно создавался (write — отдельное,
     не list-правило). Лечится тем, что запрос игрока сам сужается через
     where('owner','==',...) — тогда Firestore видит, что каждый
     возможный результат уже удовлетворяет правилу, и разрешает список.
     Мастер/админ — без where, у них isMaster() допускает всю коллекцию
     независимо от resource.data (правило это распознаёт статически). */
  var pcsCol=fbDb.collection('pcs');
  var pcsQuery=(SESSION.role==='master'||SESSION.role==='admin')?pcsCol:pcsCol.where('owner','==',SESSION.username);
  livePcsUnsub=pcsQuery.onSnapshot(function(qs){
    var fresh=[];
    qs.forEach(function(doc){var d=pcFromFs(doc.data());d.id=doc.id;d._liveKind='pcs';fresh.push(d);}); /* pcFromFs — p3j_sheet.js: строки-объекты Firestore → [[…]] */
    LIVE_PCS=fresh;
    LIVE_PCS.forEach(function(x){TRK_OBJ[trkKey(x)]=x;});
    refreshPcSelectAfterSync();
    LIVE_PCS.forEach(function(x){refreshTrackers(trkKey(x));});
    rerenderCoterieIfOpen();
  },function(){LIVE_PCS=[];rerenderCoterieIfOpen();});
  if(playersUnsub){playersUnsub();playersUnsub=null;}
  /* Панель мастера читает users, отфильтрованные по role:'player' — нужно
     расширенное правило чтения (см. firestore.rules v1.37: users/{username}
     allow read теперь и по isMaster(), не только isAdmin()). */
  if(SESSION.role==='master'){
    playersUnsub=fbDb.collection('users').where('role','==','player').onSnapshot(function(qs){
      var fresh=[];qs.forEach(function(doc){fresh.push({u:doc.id,name:doc.data().displayName||doc.id});});
      fresh.sort(function(a,b){return a.name<b.name?-1:1;});
      PLAYER_ACCOUNTS=fresh;
      rerenderCoterieIfOpen();
    },function(){PLAYER_ACCOUNTS=[];});
  }
}
function rerenderCoterieIfOpen(){
  var mount=document.getElementById('pcFormMount');
  if(mount&&mount.innerHTML.trim()) return; /* форма создания/правки открыта — не затираем набираемый текст */
  var h=location.hash.replace(/^#\/?/,''),m;
  /* открыт режим «Правка листа» (p3j_sheet.js) — не перерисовываем, иначе
     слетит фокус с поля, в которое сейчас печатают; трекеры обновлены выше */
  if((m=/^coterie\/([\w-]+)$/.exec(h))&&SHEET_EDIT[m[1]]) return;
  if(h==='cat/players'){viewPlayers();return;}
  if((m=/^coterie\/([\w-]+)$/.exec(h))){viewLivePC(m[1]);return;}
}

function myLivePcs(){return SESSION?LIVE_PCS.filter(function(p){return p.owner===SESSION.username;}):[];}
function livePcsOf(u){return LIVE_PCS.filter(function(p){return p.owner===u;});}
function findLivePc(id){for(var i=0;i<LIVE_PCS.length;i++)if(LIVE_PCS[i].id===id)return LIVE_PCS[i];return null;}

function pcFormRead(){
  function v(id){var el=document.getElementById(id);return el?el.value.trim():'';}
  var name=v('pcf_name');
  if(!name) return {err:'Укажите имя персонажа.'};
  function rows(n,idA,idB){var out=[];for(var i=0;i<n;i++){var a=v(idA+i),b=v(idB+i);if(a||b)out.push([a,b]);}return out;}
  var data={
    name:name,short:v('pcf_short'),clan:v('pcf_clan'),sect:v('pcf_sect'),
    gen:v('pcf_gen')?+v('pcf_gen'):null,bp:v('pcf_bp')!==''?+v('pcf_bp'):0,
    predator:v('pcf_pred'),sire:v('pcf_sire'),
    concept:rows(4,'pcf_cL','pcf_cT'),
    convictions:rows(3,'pcf_bB','pcf_bA'),
    track:{humanity:v('pcf_hum')!==''?+v('pcf_hum'):7,hunger:v('pcf_hun')!==''?+v('pcf_hun'):1}
  };
  return {data:data};
}
function pcFormSave(existing){
  var r=pcFormRead(),err=document.getElementById('pcfErr');
  if(r.err){err.textContent=r.err;return;}
  if(!fbDb){err.textContent=KODEKS_PREVIEW?'В предпросмотре без сервера новые персонажи не сохраняются — посмотрите лист на готовом примере.':'Нет соединения с Firebase — обновите страницу и попробуйте ещё раз.';return;} /* защита от гонки, если Firebase отвалился уже после входа (см. §1.3) */
  var data=pcToFs(r.data),btn=document.querySelector('[data-pcf="save"]'); /* pcToFs — p3j_sheet.js: Firestore не принимает массив в массиве */
  if(btn){btn.disabled=true;btn.textContent='Сохранение…';}
  var p;
  if(existing&&existing.id){
    data.updatedAt=firebase.firestore.FieldValue.serverTimestamp();
    data.updatedBy=SESSION.username;
    p=fbDb.collection('pcs').doc(existing.id).set(data,{merge:true}).then(function(){return existing.id;});
  } else {
    data.owner=SESSION.username;
    data.attrs={};data.skills={};data.disciplines=[];data.advantages=[];
    var dv=pcDerived(data);
    data.hunger=data.track.hunger;data.hMax=dv.hMax;data.hSup=0;data.hAgg=0;
    data.wMax=dv.wMax;data.wSup=0;data.wAgg=0;data.hum=data.track.humanity;data.stains=0;
    data.createdAt=firebase.firestore.FieldValue.serverTimestamp();
    data.updatedAt=firebase.firestore.FieldValue.serverTimestamp();
    data.updatedBy=SESSION.username;
    p=fbDb.collection('pcs').add(data).then(function(ref){return ref.id;});
  }
  p.then(function(newId){
    closePcForm();
    location.hash='#/coterie/'+newId;
    if(location.hash==='#/coterie/'+newId) rerenderCoterieIfOpen();
  }).catch(function(e){
    if(btn){btn.disabled=false;btn.textContent=existing&&existing.id?'Сохранить':'Создать персонажа';}
    /* permission-denied тут почти всегда значит одно: в Firebase Console ещё
       не опубликованы актуальные firestore.rules (коллекция pcs добавлена в
       них с v1.37) — без явного сообщения это выглядит как «форма съела
       нажатие и ничего не произошло», хотя на самом деле Firestore просто
       отказал в записи. См. v1.39 в журнале. */
    if(err) err.textContent=(e&&e.code==='permission-denied')
      ? 'Firestore отказал в доступе. Похоже, в Firebase Console ещё не опубликованы обновлённые правила (firestore.rules, коллекция pcs) — вставьте файл целиком в Firestore Database → Rules → Publish и попробуйте снова.'
      : 'Не получилось: '+esc(e.message||String(e));
  });
}
function openPcForm(existing,mountId){
  var box=document.getElementById(mountId);
  if(!box) return;
  box.innerHTML=pcFormHtml(existing||{});
  box.scrollIntoView({behavior:'smooth',block:'start'});
  [].forEach.call(box.querySelectorAll('[data-pcf]'),function(btn){
    btn.addEventListener('click',function(){
      var a=btn.getAttribute('data-pcf');
      if(a==='save') pcFormSave(existing);
      else if(a==='cancel'){box.innerHTML='';}
      else if(a==='del'){
        if(!existing||!existing.id) return;
        if(!confirm('Удалить персонажа «'+existing.name+'» без возможности восстановить?')) return;
        fbDb.collection('pcs').doc(existing.id).delete().then(function(){location.hash='#/cat/players';})
          .catch(function(e){alert('Не получилось: '+(e.message||e));});
      }
    });
  });
}
function closePcForm(){var box=document.getElementById('pcFormMount');if(box)box.innerHTML='';}

/* ================= МАСТЕРСКИЙ СЛОЙ: ТУМАН ВОЙНЫ (с v1.44, §1.3.4) =================
   Тайны «для мастера» НЕ лежат в index.html. Их источник — p2_gm.js вне
   репозитория → gm-layer.json → мастер загружает его здесь, на странице
   #/master/gm, в Firestore gmlayer/main. Правило firestore.rules пускает
   к этому документу только isMaster() (мастер или админ), так что игрок
   не получит тайны ни через интерфейс, ни через исходный код страницы,
   ни через прямой запрос к базе. Для мастера слой накладывается поверх
   публичных данных (applyGmLayer) и помечается gm:true — дальше работает
   прежний переключатель «Вид» из p3a_core.js. В предпросмотре для
   телефона build_preview.py подставляет слой прямо в GM_LAYER_EMBED. */
var GM_LAYER_EMBED=null;
var GM_STATE={source:null,updatedAt:null,by:null,count:0,miss:[],error:null};
var gmUnsub=null;

function gmTarget(cat,id){
  if(cat==='pcs') return findIn(PCS,id);
  var c=catById(cat);return c?findIn(c.arr,id):null;
}
function gmHosts(){
  var out=PCS.slice();
  CATS.forEach(function(c){(c.arr||[]).forEach(function(x){out.push(x);});});
  return out;
}
function dropGml(arr){if(!arr)return;for(var i=arr.length-1;i>=0;i--)if(arr[i]&&arr[i]._gml)arr.splice(i,1);}
function removeGmLayer(){
  gmHosts().forEach(function(x){dropGml(x.blocks);dropGml(x.ties);});
  dropGml(RELATIONS);dropGml(BONDS);dropGml(BOONS);
  GM_STATE.count=0;GM_STATE.miss=[];
}
function applyGmLayer(L){
  removeGmLayer();
  if(!L) return;
  var n=0,miss=[];
  (L.notes||[]).forEach(function(note){
    var x=gmTarget(note.cat,note.id);
    if(!x){miss.push((note.cat||'?')+' / '+(note.id||'?'));return;}
    (note.blocks||[]).forEach(function(b){
      var nb={};for(var k in b)if(k!=='after')nb[k]=b[k];nb.gm=true;nb._gml=true;
      x.blocks=x.blocks||[];
      var i=-1;if(b.after)for(var q=0;q<x.blocks.length;q++)if(x.blocks[q].t===b.after&&!x.blocks[q]._gml){i=q;break;}
      if(i<0)x.blocks.push(nb);
      else{var j=i+1;while(j<x.blocks.length&&x.blocks[j]._gml)j++;x.blocks.splice(j,0,nb);}
      n++;
    });
    (note.ties||[]).forEach(function(t){
      x.ties=x.ties||[];x.ties.push({text:typeof t==='string'?t:(t.text||''),gm:true,_gml:true});n++;
    });
  });
  [['relations',RELATIONS],['bonds',BONDS],['boons',BOONS]].forEach(function(p){
    (L[p[0]]||[]).forEach(function(r){var o={};for(var k in r)o[k]=r[k];o.gm=true;o._gml=true;p[1].push(o);n++;});
  });
  GM_STATE.count=n;GM_STATE.miss=miss;
}
function gmRerender(){
  IDX=null;
  if(!SESSION||!document.getElementById('app')) return;
  var y=window.scrollY;dispatch();window.scrollTo(0,y);activateRolls(app);
}
function startGmLayer(){
  if(gmUnsub){gmUnsub();gmUnsub=null;}
  if(GM_LAYER_EMBED){applyGmLayer(GM_LAYER_EMBED);GM_STATE.source='embed';return;}
  if(!fbDb||!canGm()) return;
  gmUnsub=fbDb.collection('gmlayer').doc('main').onSnapshot(function(d){
    if(!d.exists){removeGmLayer();GM_STATE.source='none';GM_STATE.error=null;}
    else{
      var v=d.data();
      try{applyGmLayer(JSON.parse(v.json||'{}'));GM_STATE.source='firestore';GM_STATE.error=null;
        GM_STATE.updatedAt=v.updatedAt&&v.updatedAt.toDate?v.updatedAt.toDate():null;GM_STATE.by=v.by||null;}
      catch(e){removeGmLayer();GM_STATE.error='Сохранённый слой не читается: '+(e.message||e);}
    }
    gmRerender();
  },function(e){GM_STATE.error=(e&&e.code==='permission-denied')
      ?'Firestore не пустил к мастерскому слою. Проверьте, что в консоли Firebase опубликованы правила с блоком gmlayer (файл firestore.rules целиком).'
      :'Не удалось загрузить мастерский слой: '+(e.message||e);
    gmRerender();});
}

/* ---------- страница «Мастерский слой» (#/master/gm) ---------- */
function gmValidate(L){
  if(!L||typeof L!=='object') return 'Это не файл мастерского слоя.';
  if(!Array.isArray(L.notes)||!Array.isArray(L.relations)) return 'В файле нет разделов notes и relations — это не gm-layer.json.';
  return '';
}
function viewGmLayer(){
  setTheme('court');crumb([['Мастерский слой']]);
  var st;
  if(GM_STATE.source==='embed') st='Предпросмотр: слой встроен прямо в этот файл.';
  else if(GM_STATE.error) st='<span style="color:var(--bad)">'+esc(GM_STATE.error)+'</span>';
  else if(GM_STATE.source==='firestore') st='Слой загружен: <b>'+GM_STATE.count+'</b> '+plural(GM_STATE.count,'тайна','тайны','тайн')+
    (GM_STATE.updatedAt?' · обновлён '+esc(GM_STATE.updatedAt.toLocaleString('ru-RU')):'')+(GM_STATE.by?' · загрузил '+esc(GM_STATE.by):'');
  else if(GM_STATE.source==='none') st='Слой ещё ни разу не загружали.';
  else st='Слой загружается…';
  var miss=GM_STATE.miss.length?'<div class="note"><b>Не нашлись заметки</b>Тайны для этих записей есть в слое, но самих записей на сайте нет — возможно, сайт старее слоя: '+esc(GM_STATE.miss.join(', '))+'</div>':'';
  var up=fbDb?'<div class="panel"><h4>Обновить слой</h4><p>Выберите файл <b>gm-layer.json</b> из папки Kodeks_Nochi_master на компьютере рассказчика. Он заменит весь слой целиком.</p>'+
      '<input type="file" id="gmFile" accept=".json,application/json"> <button class="mini pri" type="button" id="gmUp">Загрузить</button>'+
      '<div class="err" id="gmErr" style="margin-top:10px;color:var(--bad)"></div></div>':'';
  app.innerHTML='<section class="sec"><div class="wrap rise"><a class="back" href="#/">← к титулу</a>'+
    '<div class="sec-head" style="margin-top:22px"><h2>Мастерский слой</h2><span class="eyebrow">только для мастера</span></div>'+
    '<p class="lede" style="margin:0 0 20px">Тайны хроники, которые видит только мастер: скрытые блоки заметок, тайные связи и рёбра графа. Игрокам сервер их не отдаёт вовсе.</p>'+
    '<div class="panel"><p>'+st+'</p></div>'+miss+up+'</div></section>';
  var b=document.getElementById('gmUp');if(!b)return;
  b.addEventListener('click',function(){
    var f=document.getElementById('gmFile').files[0],err=document.getElementById('gmErr');err.textContent='';
    if(!f){err.textContent='Сначала выберите файл.';return;}
    if(f.size>900000){err.textContent='Файл слишком большой для одного документа Firestore.';return;}
    b.disabled=true;b.textContent='Загрузка…';
    f.text().then(function(txt){
      var L;try{L=JSON.parse(txt);}catch(e){throw new Error('Файл не читается как JSON.');}
      var v=gmValidate(L);if(v)throw new Error(v);
      return fbDb.collection('gmlayer').doc('main').set({json:txt,by:SESSION.username,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
    }).then(function(){b.disabled=false;b.textContent='Загрузить';})
    .catch(function(e){b.disabled=false;b.textContent='Загрузить';
      err.textContent=(e&&e.code==='permission-denied')?'Firestore отказал: проверьте, что правила с блоком gmlayer опубликованы в консоли Firebase.':(e.message||String(e));});
  });
}

/* ================= ИНТЕРАКТИВНЫЙ ЧАРНИК V5 (самостоятельные чарники, с v1.45) =================
   См. §1.3.5 в комментарии. Сказано рассказчиком: в Котерии должен быть
   полноценный интерактивный лист вампира — атрибуты, навыки, дисциплины,
   метод охоты и т.п., плюс встроенный бросок. Страница #/coterie/<id>
   (viewLivePC в p3h_coterie.js) рисует лист через sheetHtml(x).

   ДАННЫЕ в документе pcs/{id} (Firestore НЕ принимает массив внутри
   массива — поэтому строки хранятся объектами, а в памяти страницы
   переводятся в привычные [[…]] функциями pcFromFs/pcToFs ниже):
     attrs:{str,dex,sta,cha,man,com,int,wit,res}   1..5 (нет поля = 1)
     skills:{ath,…}                                0..5 (нет поля = 0)
     specs:'текст'          специализации, свободным текстом
     disciplines:[{n,d,p}]  название, точки, силы (строки через \n)
     advantages:[{n,d,k,t}] достоинства/недостатки/фоны: k = merit|flaw|bg
     predator, huntA, huntS тип хищника и пул охоты (ключ атрибута + навыка)
     xpTotal, xpSpent, notes, hBonus, wBonus
     concept:[{l,t}], convictions:[{c,a}]
   Здоровье = Выносливость+3(+hBonus), Сила воли = Самообладание+Решимость
   (+wBonus) — считает pcDerived(), трекер берёт отсюда (trkGet в p3c_dice.js).
   Правка — только владелец (правила pcs), в режиме «Правка листа»;
   сохранение само, с задержкой (sheetQueueSave). Бросок — у всех, кто
   видит лист: клик по атрибуту/навыку/дисциплине кладёт его в пул. */

var SHEET_ATTRS=[
 ['Физические',[['str','Сила'],['dex','Ловкость'],['sta','Выносливость']]],
 ['Социальные',[['cha','Обаяние'],['man','Манипуляция'],['com','Самообладание']]],
 ['Ментальные',[['int','Интеллект'],['wit','Сообразительность'],['res','Решимость']]]
];
var SHEET_SKILLS=[
 ['Физические',[['ath','Атлетика'],['bra','Драка'],['cra','Ремесло'],['dri','Вождение'],['fir','Стрельба'],['lar','Воровство'],['mel','Ближний бой'],['ste','Скрытность'],['sur','Выживание']]],
 ['Социальные',[['ani','Обращение с животными'],['eti','Этикет'],['ins','Проницательность'],['itm','Запугивание'],['lea','Лидерство'],['prf','Исполнение'],['prs','Убеждение'],['str2','Знание улиц'],['sub','Хитрость']]],
 ['Ментальные',[['aca','Гуманитарные науки'],['awa','Бдительность'],['fin','Финансы'],['inv','Расследование'],['med','Медицина'],['occ','Оккультизм'],['pol','Политика'],['sci','Наука'],['tec','Технологии']]]
];
/* типы хищника из книги — только названия; способы охоты хроники (PREDATORS)
   идут в списке первыми */
var PRED_REF=['Уличная кошка','Мешочник','Кровавая пиявка','Тесак','Консенсуалист','Фермер','Осирис','Песочный человек','Королева сцены','Сирена'];
var ADV_KINDS={merit:'Достоинство',flaw:'Недостаток',bg:'Фон'};

var SHEET_EDIT={};  /* id → true, пока открыт режим «Правка листа» */
var SHEET_SEL={};   /* id → {t:['a:str','s:bra','d:0'], mod, dif, surge} — выбранный пул */
var SHEET_TIMER={};

/* ---------- формат Firestore ↔ память ---------- */
function pcFromFs(d){
  function rows(v,a,b){return (v||[]).map(function(r){return Array.isArray(r)?r:[r[a]||'',r[b]||''];});}
  d.concept=rows(d.concept,'l','t');
  d.convictions=rows(d.convictions,'c','a');
  d.disciplines=(d.disciplines||[]).map(function(r){return Array.isArray(r)?[r[0],+r[1]||0,r[2]||'']:[r.n||'',+r.d||0,r.p||''];});
  d.advantages=(d.advantages||[]).map(function(r){return Array.isArray(r)?r:[r.n||'',+r.d||0,r.k||'merit',r.t||''];});
  return d;
}
function pcToFs(data){
  var o={};for(var k in data)o[k]=data[k];
  if(o.concept) o.concept=o.concept.map(function(r){return {l:r[0]||'',t:r[1]||''};});
  if(o.convictions) o.convictions=o.convictions.map(function(r){return {c:r[0]||'',a:r[1]||''};});
  if(o.disciplines) o.disciplines=o.disciplines.map(function(r){return {n:r[0]||'',d:+r[1]||0,p:r[2]||''};});
  if(o.advantages) o.advantages=o.advantages.map(function(r){return {n:r[0]||'',d:+r[1]||0,k:r[2]||'merit',t:r[3]||''};});
  return o;
}

/* ---------- значения и производные ---------- */
function sAttr(x,k){var v=(x.attrs||{})[k];return v==null?1:+v;}
function sSkill(x,k){return +((x.skills||{})[k]||0);}
function traitName(k){
  var p=k.split(':'),list=p[0]==='a'?SHEET_ATTRS:SHEET_SKILLS,out=k;
  if(p[0]==='d') return null;
  list.forEach(function(g){g[1].forEach(function(t){if(t[0]===p[1])out=t[1];});});return out;
}
function traitGroup(k){ /* 0 физ, 1 соц, 2 мент — для штрафа ослабления */
  var p=k.split(':'),list=p[0]==='a'?SHEET_ATTRS:p[0]==='s'?SHEET_SKILLS:null,g=-1;
  if(list) list.forEach(function(gr,i){gr[1].forEach(function(t){if(t[0]===p[1])g=i;});});return g;
}
function traitVal(x,k){
  var p=k.split(':');
  if(p[0]==='a') return sAttr(x,p[1]);
  if(p[0]==='s') return sSkill(x,p[1]);
  if(p[0]==='d'){var d=(x.disciplines||[])[+p[1]];return d?+d[1]||0:0;}
  return 0;
}
function traitLabel(x,k){var p=k.split(':');if(p[0]==='d'){var d=(x.disciplines||[])[+p[1]];return d?d[0]:'?';}return traitName(k);}
function pcDerived(x){
  return {hMax:Math.max(1,sAttr(x,'sta')+3+(+x.hBonus||0)),wMax:Math.max(1,sAttr(x,'com')+sAttr(x,'res')+(+x.wBonus||0))};
}
function bpRow(x){var b=Math.max(0,Math.min(10,+x.bp||0));return BP_TABLE[b]||BP_TABLE[0];}
function surgeDice(x){var m=/(\d+)/.exec(bpRow(x)[1]||'');return m?+m[1]:0;}

/* ---------- пул броска ---------- */
function sheetSel(x){return SHEET_SEL[x.id]||(SHEET_SEL[x.id]={t:[],mod:0,dif:0,surge:false});}
function sheetPool(x){
  var s=sheetSel(x),key=trkKey(x),st=trkGet(key),parts=[],sum=0;
  s.t.forEach(function(k){var v=traitVal(x,k);parts.push([traitLabel(x,k),v]);sum+=v;});
  var groups=s.t.map(traitGroup),pen=0,why=[];
  if(st&&st.hSup+st.hAgg>=st.hMax&&groups.indexOf(0)>-1){pen+=2;why.push('ослаблен здоровьем');}
  if(st&&st.wSup+st.wAgg>=st.wMax&&(groups.indexOf(1)>-1||groups.indexOf(2)>-1)){pen+=2;why.push('ослаблен волей');}
  var surge=s.surge?surgeDice(x):0;
  var total=Math.max(0,sum+(+s.mod||0)-pen+surge);
  return {parts:parts,sum:sum,mod:+s.mod||0,pen:pen,why:why,surge:surge,total:total,hunger:st?st.hunger:0};
}
function sheetRollHtml(x){
  var s=sheetSel(x),P=sheetPool(x);
  var chips=P.parts.length?P.parts.map(function(p,i){return '<button type="button" class="chip hot" data-sh="unpick" data-i="'+i+'">'+esc(p[0])+' '+p[1]+' ✕</button>';}).join(' ')
    :'<span class="tsub">Нажмите на атрибут, навык или дисциплину — они сложатся в пул.</span>';
  var brk=P.parts.map(function(p){return esc(p[0])+' '+p[1];}).join(' + ')+(P.mod?(P.mod>0?' + ':' − ')+Math.abs(P.mod):'')+
    (P.pen?' − '+P.pen+' ('+P.why.join(', ')+')':'')+(P.surge?' + '+P.surge+' (всплеск)':'');
  return '<div class="sh-roll">'+
    '<div class="sh-chips">'+chips+'</div>'+
    '<div class="sh-rctl">'+
     '<label>Модиф.<input type="number" id="shMod" value="'+(+s.mod||0)+'" min="-10" max="10"></label>'+
     '<label>Сложность<input type="number" id="shDif" value="'+(+s.dif||0)+'" min="0" max="15"></label>'+
     '<label class="chk"><input type="checkbox" id="shSurge"'+(s.surge?' checked':'')+'> Всплеск крови (+'+surgeDice(x)+', пробуждение)</label>'+
    '</div>'+
    '<div class="sh-total"><b>Пул '+P.total+'</b> · Голод '+P.hunger+(brk?'<span class="tsub"> = '+brk+'</span>':'')+'</div>'+
    '<div class="ctl"><button class="mini pri" type="button" data-sh="roll"'+(P.total<1?' disabled':'')+'>Бросить</button>'+
    '<button class="mini" type="button" data-sh="rouse">Проверка пробуждения</button>'+
    (x.huntA&&x.huntS?'<button class="mini" type="button" data-sh="hunt">Бросок охоты</button>':'')+
    '<button class="mini" type="button" data-sh="clear">Очистить пул</button></div></div>';
}

/* ---------- отрисовка ---------- */
function sDots(x,k,val,min,max,edit){
  var s='';for(var i=1;i<=max;i++){var on=i<=val;
    s+=edit?'<button type="button" class="sd'+(on?' on':'')+'" data-sh="dot" data-k="'+k+'" data-v="'+i+'" data-min="'+min+'" aria-label="'+i+'"></button>'
           :'<span class="sd'+(on?' on':'')+'"></span>';}
  return '<span class="sdots">'+s+'</span>';
}
function traitRow(x,k,label,val,min,edit){
  var sel=sheetSel(x).t.indexOf(k)>-1;
  return '<div class="sh-row'+(sel?' sel':'')+(val===0?' zero':'')+'"><button type="button" class="sh-name" data-sh="pick" data-k="'+k+'">'+esc(label)+'</button>'+sDots(x,k,val,min,5,edit)+'</div>';
}
function statsGrid(x,list,pref,min,edit){
  return '<div class="sh-grid">'+list.map(function(g){
    return '<div class="sh-col"><div class="sh-gh">'+g[0]+'</div>'+g[1].map(function(t){
      var k=pref+':'+t[0];return traitRow(x,k,t[1],pref==='a'?sAttr(x,t[0]):sSkill(x,t[0]),min,edit);}).join('')+'</div>';}).join('')+'</div>';
}
function optList(names,sel){
  var seen={},out='<option value=""'+(!sel?' selected':'')+'>—</option>';
  names.forEach(function(n){if(!n||seen[n])return;seen[n]=1;out+='<option'+(n===sel?' selected':'')+'>'+esc(n)+'</option>';});
  if(sel&&!seen[sel]) out+='<option selected>'+esc(sel)+'</option>';
  return out;
}
function allDiscNames(){return DISCIPLINES.map(function(d){return d.name;}).concat(DISC_REF.map(function(d){return d[0];}));}
function allClanNames(){return CLANS.map(function(c){return c.name;}).concat(CLAN_REF.map(function(c){return c[0];}));}
function allSectNames(){return SECTS.map(function(c){return c.name;}).concat(GHOSTS.sects||[]);}
function allPredNames(){return PREDATORS.map(function(c){return c.name;}).concat(PRED_REF);}
function clanDiscs(x){var r=null;CLAN_REF.forEach(function(c){if(c[0]===x.clan)r=c[1];});return r||[];}
function attrOpts(sel){var o='<option value="">—</option>';SHEET_ATTRS.forEach(function(g){g[1].forEach(function(t){o+='<option value="'+t[0]+'"'+(t[0]===sel?' selected':'')+'>'+t[1]+'</option>';});});return o;}
function skillOpts(sel){var o='<option value="">—</option>';SHEET_SKILLS.forEach(function(g){g[1].forEach(function(t){o+='<option value="'+t[0]+'"'+(t[0]===sel?' selected':'')+'>'+t[1]+'</option>';});});return o;}

function sheetHtml(x,editable){
  var edit=editable&&!!SHEET_EDIT[x.id],out='';
  out+='<div class="sheet" data-pc="'+esc(x.id)+'">';
  /* сказано рассказчиком (v1.47): кнопку правки листа тяжело заметить —
     теперь это крупная кнопка на всю ширину; в режиме правки панель липнет
     к верху экрана, чтобы «Готово» всегда было под рукой */
  if(editable) out+='<div class="sh-bar'+(edit?' editing':'')+'"><button type="button" class="sh-edit" data-sh="edit">'+
    (edit?'✓ Готово — закончить правку':'✎ Править лист персонажа')+'</button>'+
    '<span class="sh-hint" id="shSaved">'+(edit?'Нажимайте на точки, чтобы менять значения; всё сохраняется само.':'Здесь меняются атрибуты, навыки, дисциплины, охота, опыт и заметки.')+'</span></div>';
  out+=section('Бросок','',sheetRollHtml(x));
  out+=section('Атрибуты','',statsGrid(x,SHEET_ATTRS,'a',1,edit));
  out+=section('Навыки','',statsGrid(x,SHEET_SKILLS,'s',0,edit)+
    (edit?'<label class="sh-lab">Специализации</label><textarea id="sh_specs" rows="2" placeholder="Например: Драка (ножи), Оккультизм (Тремер)">'+esc(x.specs||'')+'</textarea>'
         :(x.specs?'<div class="panel" style="margin-top:12px"><b>Специализации:</b> '+esc(x.specs)+'</div>':'')));
  /* дисциплины */
  var disc=x.disciplines||[],cd=clanDiscs(x),dh;
  if(edit){
    dh='<div class="sh-disc-ed">'+disc.map(function(d,i){
      return '<div class="sh-drow"><select data-shf="dn" data-i="'+i+'">'+optList(allDiscNames(),d[0])+'</select>'+
        sDots(x,'d:'+i,+d[1]||0,0,5,true)+'<button type="button" class="mini" data-sh="ddel" data-i="'+i+'" title="Убрать">✕</button>'+
        '<textarea data-shf="dp" data-i="'+i+'" rows="2" placeholder="Силы — по одной на строку">'+esc(d[2]||'')+'</textarea></div>';}).join('')+
      '<button type="button" class="mini" data-sh="dadd">+ Дисциплина</button></div>';
  } else {
    dh=disc.length?'<div class="sh-disc">'+disc.map(function(d,i){

/* ---------- правка и сохранение ---------- */
function sheetQueueSave(x){
  var el=document.getElementById('shSaved');if(el)el.textContent='Сохранение…';
  clearTimeout(SHEET_TIMER[x.id]);
  SHEET_TIMER[x.id]=setTimeout(function(){
    if(!fbDb){var ep=document.getElementById('shSaved');if(ep)ep.textContent='Предпросмотр: изменения живут только в этом окне.';return;}
    if(!canEditLivePc(x))return;
    var data=pcToFs({attrs:x.attrs||{},skills:x.skills||{},specs:x.specs||'',disciplines:x.disciplines||[],advantages:x.advantages||[],
      predator:x.predator||'',huntA:x.huntA||'',huntS:x.huntS||'',xpTotal:+x.xpTotal||0,xpSpent:+x.xpSpent||0,notes:x.notes||'',
      hBonus:+x.hBonus||0,wBonus:+x.wBonus||0});
    data.updatedAt=firebase.firestore.FieldValue.serverTimestamp();data.updatedBy=SESSION.username;
    fbDb.collection('pcs').doc(x.id).set(data,{merge:true}).then(function(){
      var e2=document.getElementById('shSaved');if(e2)e2.textContent='Сохранено.';
    }).catch(function(e){var e3=document.getElementById('shSaved');if(e3)e3.textContent='Не сохранилось: '+(e.message||e);});
  },700);
}
function sheetRedraw(x){
  var y=window.scrollY;viewLivePC(x.id);window.scrollTo(0,y);
}
function sheetPc(el){var w=el.closest('.sheet');return w?findLivePc(w.getAttribute('data-pc')):null;}
document.addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('[data-sh]'):null;if(!b)return;
  var x=sheetPc(b);if(!x)return;
  var a=b.getAttribute('data-sh'),s=sheetSel(x),key=trkKey(x),edit=canEditLivePc(x)&&SHEET_EDIT[x.id];
  if(a==='edit'){SHEET_EDIT[x.id]=!SHEET_EDIT[x.id];sheetRedraw(x);return;}
  if(a==='pick'){var k=b.getAttribute('data-k'),i=s.t.indexOf(k);if(i>-1)s.t.splice(i,1);else s.t.push(k);sheetRedraw(x);return;}
  if(a==='unpick'){s.t.splice(+b.getAttribute('data-i'),1);sheetRedraw(x);return;}
  if(a==='clear'){s.t=[];s.mod=0;s.surge=false;sheetRedraw(x);return;}
  if(a==='roll'||a==='hunt'){
    var P,label;
    if(a==='hunt'){P={total:sAttr(x,x.huntA)+sSkill(x,x.huntS),hunger:trkGet(key).hunger};label=x.name+' · охота ('+traitName('a:'+x.huntA)+' + '+traitName('s:'+x.huntS)+')';}
    else{P=sheetPool(x);label=x.name+' · '+(P.parts.map(function(p){return p[0];}).join(' + ')||'пул');}
    if(dkPc){fillPcSelect();dkPc.value=key;}
    if(a==='roll'&&s.surge&&P.surge){rouseFor(key,false);P.hunger=trkGet(key).hunger;}
    rollPool(P.total,P.hunger,a==='roll'?(+s.dif||0):0,label);
    return;
  }
  if(a==='rouse'){if(dkPc){fillPcSelect();dkPc.value=key;}rouseFor(key,false);return;}
  if(!edit) return;
  if(a==='dot'){
    var kk=b.getAttribute('data-k'),v=+b.getAttribute('data-v'),mn=+b.getAttribute('data-min'),p=kk.split(':'),cur;
    if(p[0]==='a'){x.attrs=x.attrs||{};cur=sAttr(x,p[1]);x.attrs[p[1]]=Math.max(mn,cur===v?v-1:v);}
    else if(p[0]==='s'){x.skills=x.skills||{};cur=sSkill(x,p[1]);x.skills[p[1]]=Math.max(mn,cur===v?v-1:v);}
    else if(p[0]==='d'){var dd=x.disciplines[+p[1]];cur=+dd[1]||0;dd[1]=cur===v?v-1:v;}
    else if(p[0]==='v'){var aa=x.advantages[+p[1]];cur=+aa[1]||0;aa[1]=cur===v?v-1:v;}
    refreshTrackers(key);sheetRedraw(x);sheetQueueSave(x);return;
  }
  if(a==='dadd'){x.disciplines=x.disciplines||[];x.disciplines.push(['',1,'']);sheetRedraw(x);sheetQueueSave(x);return;}
  if(a==='ddel'){x.disciplines.splice(+b.getAttribute('data-i'),1);s.t=s.t.filter(function(k){return k.indexOf('d:')!==0;});sheetRedraw(x);sheetQueueSave(x);return;}
  if(a==='aadd'){x.advantages=x.advantages||[];x.advantages.push(['',1,'merit','']);sheetRedraw(x);sheetQueueSave(x);return;}
  if(a==='adel'){x.advantages.splice(+b.getAttribute('data-i'),1);sheetRedraw(x);sheetQueueSave(x);return;}
});
function sheetField(e){
  var el=e.target;if(!el||!el.closest)return;
  var w=el.closest('.sheet');if(!w)return;
  var x=findLivePc(w.getAttribute('data-pc'));if(!x)return;
  var s=sheetSel(x);
  if(el.id==='shMod'){s.mod=+el.value||0;if(e.type==='change')sheetRedraw(x);return;}
  if(el.id==='shDif'){s.dif=+el.value||0;return;}
  if(el.id==='shSurge'){s.surge=el.checked;sheetRedraw(x);return;}
  if(!canEditLivePc(x)||!SHEET_EDIT[x.id])return;
  var f=el.getAttribute('data-shf'),i=+el.getAttribute('data-i');
  if(el.id==='sh_specs') x.specs=el.value;
  else if(f==='dn'){x.disciplines[i][0]=el.value;}
  else if(f==='dp'){x.disciplines[i][2]=el.value;}
  else if(f==='an'){x.advantages[i][0]=el.value;}
  else if(f==='ak'){x.advantages[i][2]=el.value;}
  else if(f==='at'){x.advantages[i][3]=el.value;}
  else if(f==='pred'||f==='huntA'||f==='huntS'||f==='notes'){x[f==='pred'?'predator':f]=el.value;}
  else if(f==='xpTotal'||f==='xpSpent'||f==='hBonus'||f==='wBonus'){x[f]=+el.value||0;if(f==='hBonus'||f==='wBonus')refreshTrackers(trkKey(x));}
  else return;
  sheetQueueSave(x);
}
document.addEventListener('input',sheetField);
document.addEventListener('change',sheetField);

function tmin(s){var m=/^(\d{1,2}):(\d{2})$/.exec(s||'');return m?(+m[1])*60+(+m[2]):null;}
function fmtT(m){m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60);}
function nightState(){var N=ACTIVE_SESSION.night||{};var s=STORE.get('night',null)||{};

function nightHtml(){
  var n=nightState(),ss=tmin(n.sunset),sr=tmin(n.sunrise),nw=tmin(n.now);
  if(ss==null||sr==null||nw==null) return '<div class="warn">Время в формате ЧЧ:ММ</div>';
  var total=(sr-ss+1440)%1440||1440,el=(nw-ss+1440)%1440;if(el>total)el=total;
  var left=total-el,h=Math.floor(left/60),m=left%60;
  return '<div class="dawn-big'+(left<=60?' urgent':'')+'">'+(left<=0?'Рассвет':h+' ч '+pad(m)+' мин')+'</div>'+
    '<div class="tsub">'+(left<=0?'солнце встаёт — в убежище!':'до рассвета · сейчас '+fmtT(nw))+'</div>'+
    '<div class="dawn-bar"><i style="width:'+(el/total*100).toFixed(1)+'%"></i></div>'+
    '<div class="ctl" style="display:flex;gap:6px;flex-wrap:wrap"><button class="mini" data-nt="-15">−15 м</button><button class="mini" data-nt="15">+15 м</button>'+
    '<button class="mini" data-nt="30">+ сцена 30 м</button><button class="mini pri" data-nt="60">+1 ч</button></div>'+
    '<div class="times"><label>Закат<input type="time" data-nf="sunset" value="'+n.sunset+'"></label><label>Рассвет<input type="time" data-nf="sunrise" value="'+n.sunrise+'"></label>'+
    '<label>Сейчас<input type="time" data-nf="now" value="'+n.now+'"></label></div>';
}

    '<div class="ctl" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><button class="mini pri" data-oa="next">Следующий ход</button><button class="mini" data-oa="sort">Сортировать</button>'+
    (PCS.length?'<button class="mini" data-oa="coterie">+ котерия</button>':'')+'<button class="mini" data-oa="clear">Очистить</button></div>'+
    '<div class="tsub">В V5 нет броска инициативы: порядок задаёт рассказчик (обычно по пулу действия или Сообразительности + Бдительности).</div>';
}
function sessFlow(nodes){return '<ul class="sflow">'+nodes.map(function(n){return '<li><span class="nd'+(n.cls?' '+n.cls:'')+'">'+md(n.t)+'</span>'+(n.kids?sessFlow(n.kids):'')+'</li>';}).join('')+'</ul>';}
function renderSession(){
  var S=ACTIVE_SESSION||{},filled=!!(S.n||(S.flow&&S.flow.length));
  document.getElementById('sessTitle').innerHTML=filled?'Сессия '+(S.n||'')+(S.name?' — '+(S.place?'<a href="'+esc(S.place)+'" style="color:var(--acc);text-decoration:none">'+esc(S.name)+'</a>':esc(S.name)):'')
    :'План не задан';
  document.getElementById('sessSub').textContent=filled?(S.sub||''):'Инструменты ночи работают и без плана';
  var h='<details class="sess-sec" open><summary>Ночь · до рассвета</summary><div class="in" id="nightBox">'+nightHtml()+'</div></details>';
  if(PCS.length) h+='<details class="sess-sec" open><summary>Голод котерии</summary><div class="in">'+PCS.map(function(x){var k=trkKey(x);TRK_OBJ[k]=x;
    return '<div class="coterie-row"><a class="nm" href="#/pc/'+x.id+'">'+esc(x.name)+'</a><div data-mini="'+k+'">'+miniPips(k)+'</div></div>';}).join('')+'</div></details>';
  h+='<details class="sess-sec"><summary>Очерёдность</summary><div class="in" id="orderBox">'+orderHtml()+'</div></details>';
  var v=masqNow(),L=masqLevel(v);
  h+='<details class="sess-sec"><summary>Маскарад · '+esc(L[1])+' '+v+'</summary><div class="in">'+masqGauge(v,true)+
    '<div class="ctl" style="display:flex;gap:6px;margin-top:10px"><button class="mini" data-sq="-1">−1</button><button class="mini pri" data-sq="1">+1 нарушение</button><a class="mini" href="#/tool/masq" style="text-decoration:none">шкала →</a></div></div></details>';
  if(!filled) h+='<div class="in" style="padding:16px"><div class="sess-note"><b>План пуст</b>Сцены, развилки, таблицы и плейлисты следующей сессии появятся здесь.</div></div>';
  else{
    if(S.flow&&S.flow.length) h+='<details class="sess-sec" open><summary>Структура сессии</summary><div class="in">'+sessFlow(S.flow)+(S.priority?'<div class="sess-note"><b>При нехватке времени</b>'+md(S.priority)+'</div>':'')+'</div></details>';
    if(S.decisions&&S.decisions.length) h+='<details class="sess-sec"><summary>Ключевые решения</summary><div class="in"><ul class="sess-list">'+S.decisions.map(function(x){return '<li>'+md(x)+'</li>';}).join('')+'</ul></div></details>';
    if(S.tables&&S.tables.length) h+='<details class="sess-sec"><summary>Таблицы</summary><div class="in">'+S.tables.map(function(t){
      return '<h4 style="font-size:19px;margin-top:10px">'+esc(t.name)+'</h4>'+(t.note?'<div class="sess-note">'+md(t.note)+'</div>':'')+(t.groups||[]).map(function(g){return (g.sub?'<div class="eyebrow" style="margin-top:8px">'+esc(g.sub)+'</div>':'')+tableHtml(g.table);}).join('');}).join('')+'</div></details>';
    if(S.afterLog&&S.afterLog.length) h+='<details class="sess-sec"><summary>После сессии — в журнал</summary><div class="in"><ul class="sess-list">'+S.afterLog.map(function(x){return '<li>'+md(x)+'</li>';}).join('')+'</ul></div></details>';
  }
  if(S.playlists&&S.playlists.length) h+='<details class="sess-sec"><summary>Плейлисты</summary><div class="in">'+S.playlists.map(function(p){
    return '<div class="sess-note"><b>'+esc(p[0])+'</b>'+(/^https?:\/\//.test(p[1])?'<a href="'+esc(p[1])+'" target="_blank" rel="noopener" style="color:var(--acc)">открыть ↗</a>':md(p[1]))+'</div>';}).join('')+'</div></details>';
  var body=document.getElementById('sessBody');
  var open={};[].forEach.call(body.querySelectorAll('details'),function(d,i){open[i]=d.open;});
  body.innerHTML=h;
  if(Object.keys(open).length)[].forEach.call(body.querySelectorAll('details'),function(d,i){if(open[i]!=null)d.open=open[i];});
  activateRolls(body);
}
function initSession(){
  var tab=document.getElementById('sessTab'),back=document.getElementById('sessBackdrop'),body=document.getElementById('sessBody');
  function setOpen(on){document.body.classList.toggle('sess-open',on);STORE.set('sessOpen',on);}
  tab.addEventListener('click',function(){setOpen(true);});
  document.getElementById('sessClose').addEventListener('click',function(){setOpen(false);});
  back.addEventListener('click',function(){setOpen(false);});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&document.body.classList.contains('sess-open'))setOpen(false);});
  body.addEventListener('click',function(e){
    var b=e.target.closest('[data-nt]');
    if(b){var n=nightState();n.now=fmtT(tmin(n.now)+(+b.getAttribute('data-nt')));STORE.set('night',n);document.getElementById('nightBox').innerHTML=nightHtml();return;}
    var q=e.target.closest('[data-sq]');
    if(q){STORE.set('masqLive',masqLive()+(+q.getAttribute('data-sq')));renderSession();if(/^#\/tool\/masq/.test(location.hash))route();return;}
    var od=e.target.closest('[data-od]'),oa=e.target.closest('[data-oa]'),o=orderState();
    if(od){o.list.splice(+od.getAttribute('data-od'),1);if(o.cur>=o.list.length)o.cur=0;}
    else if(oa){var a=oa.getAttribute('data-oa');
      if(a==='add'){var nm=document.getElementById('odN').value.trim();if(!nm)return;o.list.push({n:nm,v:document.getElementById('odV').value||'—'});}
      else if(a==='next'){if(!o.list.length)return;o.cur++;if(o.cur>=o.list.length){o.cur=0;o.round++;}}
      else if(a==='sort'){o.list.sort(function(x,y){return (+y.v||0)-(+x.v||0);});o.cur=0;}
      else if(a==='coterie'){PCS.forEach(function(x){if(!o.list.some(function(y){return y.n===x.name;}))o.list.push({n:x.name,v:'—'});});}
      else if(a==='clear'){o={list:[],cur:0,round:1};}}
    else return;
    STORE.set('order',o);document.getElementById('orderBox').innerHTML=orderHtml();
    var inp=document.getElementById('odN');if(oa&&oa.getAttribute('data-oa')==='add'&&inp)inp.focus();
  });
  body.addEventListener('keydown',function(e){if(e.key==='Enter'&&(e.target.id==='odN'||e.target.id==='odV')){var b=body.querySelector('[data-oa="add"]');if(b)b.click();}});
  body.addEventListener('change',function(e){var f=e.target.getAttribute('data-nf');if(!f)return;var n=nightState();n[f]=e.target.value;STORE.set('night',n);document.getElementById('nightBox').innerHTML=nightHtml();});
  renderSession();
  var pref=STORE.get('sessOpen',null);
  if(pref===true||(pref==null&&ACTIVE_SESSION&&ACTIVE_SESSION.n&&window.matchMedia('(min-width:1180px)').matches)) setOpen(true);
}

/* ================= ПОИСК ================= */
var IDX=null;
function buildIndex(){
  IDX=allEntries().map(function(e){return {name:e.name||'',cat:e.cat,href:e.href,text:strings(e.x).join(' · ').replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g,'$2').replace(/\[\[([^\]]+)\]\]/g,'$1').replace(/\*\*/g,'')};});
  CATS.forEach(function(c){IDX.push({name:c.name,cat:'раздел',href:'#/cat/'+c.id,text:c.d+' '+c.lede});});
  TOOLS.forEach(function(t){IDX.push({name:t.name,cat:'инструмент',href:'#/tool/'+t.id,text:t.d});});
  CLAN_REF.forEach(function(r){if(!LINKS[r[0]])IDX.push({name:r[0],cat:'клан · заготовка',href:'#/cat/clans',text:r[1].join(', ')});});
  Object.keys(GHOSTS).forEach(function(id){var c=catById(id);if(!c)return;
    GHOSTS[id].forEach(function(n){if(!LINKS[n])IDX.push({name:n,cat:c.one+' · заготовка',href:'#/cat/'+id,text:'упомянуто в заметках, своей записи ещё нет'});});});
  COMPULSIONS.clan.forEach(function(c){IDX.push({name:c[1],cat:'одержимость',href:'#/tool/compulsions',text:c[0]+' · '+c[2]});});
}
function hl(s,q){var i=s.toLowerCase().indexOf(q);if(i<0)return esc(s);return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+q.length))+'</mark>'+esc(s.slice(i+q.length));}
function initSearch(){
  var q=document.getElementById('q'),res=document.getElementById('qres'),sel=0,hits=[];
  function run(){
    if(!IDX)buildIndex();var v=q.value.trim().toLowerCase();
    if(!v){res.hidden=true;return;}
    hits=IDX.map(function(e){var n=e.name.toLowerCase(),t=e.text.toLowerCase(),s=0;
      if(n.indexOf(v)===0)s=3;else if(n.indexOf(v)>-1)s=2;else if(t.indexOf(v)>-1)s=1;return {e:e,s:s,ti:t.indexOf(v)};})
      .filter(function(h){return h.s;}).sort(function(a,b){return b.s-a.s;}).slice(0,12);
    sel=0;
    res.innerHTML=hits.length?hits.map(function(h,i){var sn='';
      if(h.ti>-1){var a=Math.max(0,h.ti-40);sn=(a?'…':'')+h.e.text.slice(a,h.ti+70)+'…';}
      return '<a href="'+h.e.href+'" class="'+(i===0?'on':'')+'"><span class="t">'+hl(h.e.name,v)+'</span><span class="c">'+esc(h.e.cat)+'</span>'+
        (sn?'<span class="s">'+hl(sn,v)+'</span>':'')+'</a>';}).join(''):'<div class="none">Ничего не найдено. Кодекс пока почти пуст — поиск оживёт вместе с заметками.</div>';
    res.hidden=false;
  }
  q.addEventListener('input',run);q.addEventListener('focus',run);
  q.addEventListener('keydown',function(e){var as=res.querySelectorAll('a');
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!as.length)return;as[sel].classList.remove('on');
      sel=(sel+(e.key==='ArrowDown'?1:-1)+as.length)%as.length;as[sel].classList.add('on');as[sel].scrollIntoView({block:'nearest'});}
    else if(e.key==='Enter'){if(as[sel]){location.hash=as[sel].getAttribute('href');res.hidden=true;q.blur();}}
    else if(e.key==='Escape'){res.hidden=true;q.blur();}});
  res.addEventListener('click',function(){res.hidden=true;q.value='';});
  document.addEventListener('click',function(e){if(!e.target.closest('.srch'))res.hidden=true;});
  document.addEventListener('keydown',function(e){if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();q.focus();}});
}

/* ================= РОУТЕР ================= */
function dispatch(){
  /* уходим со страницы — снимаем подписку на живой лист персонажа, если она
     была; если новый маршрут снова #/pc/<живой>, viewPC() откроет её заново
     (см. startPcSyncIfLive() в p3g_pcsync.js) */
  stopPcSync();
  var h=location.hash.replace(/^#\/?/,''),m;
  if(!h){viewHome();return 'top';}
  if(h==='world'||h==='cons'||h==='tools'||h==='cats'){viewHome(h);return 'anchor';}
  if((m=/^cat\/([\w-]+)$/.exec(h))){var c=catById(m[1]);if(c){viewList(c);return 'top';}}
  if((m=/^tool\/([\w-]+)$/.exec(h))){var t=toolById(m[1]);if(t){TOOL_VIEWS[t.id](t);return 'top';}}
  if((m=/^pc\/([\w-]+)$/.exec(h))){viewPC(m[1]);return 'top';}
  if((m=/^coterie\/([\w-]+)$/.exec(h))){viewLivePC(m[1]);return 'top';}
  if((m=/^player\/([\w-]+)$/.exec(h))){viewPlayer(m[1]);return 'top';}
  if(h==='master/gm'){if(canGm()){viewGmLayer();return 'top';}viewHome();return 'top';}
  if(h==='admin/users'){if(SESSION&&SESSION.role==='admin'){viewAdminUsers();return 'top';}viewHome();return 'top';}
  if((m=/^([\w-]+)\/([\w-]+)$/.exec(h))){var cc=catByRoute(m[1]);if(cc){viewEntry(cc,m[2]);return cc.kind==='cards'?'keep':'top';}}
  viewHome();return 'top';
}
function route(){var r=dispatch();if(r==='top')window.scrollTo(0,0);activateRolls(app);}
window.addEventListener('hashchange',route);
/* Раньше здесь сразу вызывался route() — теперь всё приложение стартует только
   после успешного входа, см. bootAuth() в p3f_auth.js (§1.3 в комментарии). */
bootAuth(function(){
  initDock();
  initSearch();
  initSession();
  startCoterieSync(); /* см. p3h_coterie.js — самостоятельные чарники игроков, живая подписка на всю сессию, не только на страницу */
  startGmLayer(); /* p3i_gm.js — мастерский слой (туман войны): игроку ничего, мастеру тайны из Firestore */
  route();
});
</script>
