Прочитай этот комментарий ЦЕЛИКОМ перед любой правкой. Он — единственная
документация файла. Пользователь (рассказчик) сам файл НЕ редактирует:
он присылает заметки свободным текстом по-русски («после сессии 3 Анна
задолжала Графу малый долг…»), а ты переводишь их в данные. Правки идут
итеративно, от версии к версии; в конце этого комментария веди ЖУРНАЛ
ИЗМЕНЕНИЙ.

ЖЁСТКОЕ ПРАВИЛО ИНТЕРФЕЙСА: в видимом тексте страницы не должно быть
технических подсказок (имён массивов, полей, id, синтаксиса). Пустые
состояния и подписи пишутся для читателя-рассказчика («Долгов пока нет»),
а не для редактора. Всё техническое живёт только здесь и в коде.

ДОКУМЕНТ ВИДЯТ ИГРОКИ — НО ЕСТЬ СЛОЙ МАСТЕРА (v1.18, изменено v1.42).
Было: тайн «для мастера» не спрашивать и не записывать. С v1.42 сказано
пользователем: раз на сайте есть роли, вопросы «для мастера» в опросах
задавать МОЖНО. Всё, что рассказчик называет тайным / «для мастера»
(слабости, уязвимости, сюжетные тайны, скрытая правда за слухом), пиши
ТОЛЬКО в p2_gm.js (с v1.44 — мастерский слой, туман войны, §1.3.4):
блок / связь / ребро графа для нужной записи. В p2_data.html тайн быть
не должно вовсе — это публичный файл, build.sh падает на gm:true в нём.
Публичная версия того же события остаётся обычным текстом в p2_data
(«больше их никто не видел»), тайна — в p2_gm.js. Никогда не клади тайну

ОЦЕНКА КАЖДОЙ ЗАМЕТКИ (сказано пользователем, v1.23). Это правило про ЧАТ,
не про сам документ — в данные хроники ничего из этого не пишется. Как
только заметка доведена до финальной компиляции и добавлена в данные
(запись PEOPLE/LORESHEETS/DOMAINS/CLANS/… или интервью по ней завершено),
дай в ответе разбор с позиции нарративного/стори-дизайнера: что в заметке
получилось хорошо, что слабее, насколько она стыкуется с уже существующим
сеттингом и другими записями хроники — и заверши оценкой по шкале 1–10.
Делай это после каждой добавленной заметки без напоминаний, не только
когда попросят. Замечания из этого разбора учитывай при составлении
следующих раундов интервью и будущих заметок — они рабочий инструмент
для тебя, а не часть документа для игроков.

ДОСТАВКА ИЗМЕНЕНИЙ: ТЕЛЕФОН vs ПК (сказано пользователем, v1.36). Это

Рассказчик пишет заметки в основном с телефона — в этот момент связь с
его компьютером (device bridge / приложение Claude на ПК) неактивна.
НЕ пытайся в этом случае сразу залить изменения на устройство или
запушить в репозиторий — это либо тихо не сработает, либо попадёт не
туда. Вместо этого после любой правки данных хроники (и вообще любых
правок этого файла) собирай самодостаточный локальный HTML (bash build.sh,
затем python3 build_preview.py — с v1.42 это отдельная копия без

откроет его в браузере и проверит результат оффлайн, без бэкенда.
Заливка изменений на устройство/в репозиторий/публикация на сайт —
только по отдельной явной просьбе рассказчика, когда он сам говорит,
что сейчас за ПК со связанной средой («я на этой среде», «подлей на
сайт» и т.п.). Заливка с v1.44: index.html, firestore.rules, images/ и
src/ (все исходники, КРОМЕ p2_gm.js и gm-layer.json) — в папку
репозитория; p2_gm.js и gm-layer.json — в C:\Users\RIX\source\
Kodeks_Nochi_master\ (ВНЕ репозитория, репозиторий публичный). Если
менялся мастерский слой — напомни рассказчику загрузить gm-layer.json
на сайте (ссылка «тайны» в плашке пользователя → «Мастерский слой»). Не проверяй молча, подключён ли сейчас device bridge, и
не предлагай залить — просто отдавай файл по умолчанию, пока не
попросили иначе.

1.1 ХОСТИНГ И КАРТИНКИ (с v1.27)
════════════════════════════════════════════════════════════════════════════
С v1.27 у файла два места жизни одновременно:
  (а) исходники в /home/claude/v5/ собираются build.sh в один офлайн-файл
      kodeks-nochi.html — как раньше, для локального использования;
  (б) тот же собранный файл лежит в GitHub-репозитории пользователя как
      index.html и раздаётся через GitHub Pages по постоянной ссылке
      (https://<логин>.github.io/<репозиторий>/) — так пользователь
      открывает хронику на телефоне (можно добавить на экран «Домой») и
      делится ссылкой с игроками. Рядом с index.html в том же репозитории
      лежит папка images/ — это и есть решение проблемы разбухания файла
      от вшитых картинок (см. правило про x.img ниже, §3.1).

КАРТИНКИ — НОВОЕ ПРАВИЛО ПО УМОЛЧАНИЮ: пользователь присылает файл
изображения в чат → сохраняй его КАК ОТДЕЛЬНЫЙ ФАЙЛ в images/ (осмысленное
имя транслитом от id записи, например images/cornejo.jpg) → в x.img (или
CITY_MAP.img) пиши ОТНОСИТЕЛЬНЫЙ ПУТЬ 'images/cornejo.jpg', а не base64.
Так делали для CITY_MAP.img (v1.27 — фон карты вынесен из base64 в
images/city-map.svg, см. §3.3). Правило v1.8 «спрашивать перед вшиванием
base64» по сути снято этим — сама причина (разбухание файла) больше не
действует, раз картинки не вшиваются, а лежат рядом файлами. Но при
добавлении НОВОЙ картинки к записи всё равно уточни у пользователя её имя/
куда класть, если это не очевидно из контекста.
ВАЖНО: если правишь файлы вручную в этой сессии (не просто дописываешь
данные), после того как пользователь пришлёт новую картинку — она должна
быть реально закоммичена и запушена в репозиторий (просто прописать путь
в x.img недостаточно, файл должен физически появиться в images/ на
GitHub, иначе ссылка будет битой). Токен доступа для пуша пользователь
даёт каждый раз заново в чате — он одноразовый и нигде между сессиями не
хранится (осознанное решение по безопасности, не баг).

1.2 ROADMAP: ПЕРЕХОД НА BACKEND (Firebase) — с v1.29, ЕЩЁ НЕ НАЧАТО
════════════════════════════════════════════════════════════════════════════
СТАТУС: пользователь планирует со временем уйти с чисто-статичного GitHub
Pages (§1.1) на Firebase (Auth + Firestore + Storage), чтобы получить живое
состояние (не только localStorage в браузере, §6) и разделение видимости
контента (не всё, что видит ГМ, обязано быть видно игрокам). Сначала
пользователь хочет дожать текущий контентный проект — сама миграция это
ОТДЕЛЬНЫЙ будущий этап, к реализации ещё не приступали. Ниже — зафиксированный
бэклог функций, отобранный пользователем явным мультивыбором, чтобы не
потерять его до начала работы.

  1) ИГРОВАЯ МЕХАНИКА (во время сессии)
     · живые листы персонажей — track (§3.1/6) редактируется прямо на
       сайте и хранится в Firestore вместо стартовых значений в файле
     · бросок кубов V5 с логом — общий для стола фид бросков (не только
       локальный док костей, §1 «КОСТИ V5»)
     · заявки на даунтайм — игрок отправляет действие между сессиями,
       ГМ отвечает/резолвит, история сохраняется
     · трекер опыта (XP) — журнал начислений и трат по каждому PCS

  2) ДОСТУП И РОЛИ
     · своя закрытая система логинов: только логин+пароль, БЕЗ e-mail
       (пользователь явно исключил почту — узкий круг игроков)
     · три роли: админ / мастер / игрок; роль игроку назначает и меняет
       только админ (админ — техническая роль, ОТДЕЛЬНАЯ от мастера/ГМ)
     · у каждого игрока — свои листы персонажей и своя история бросков
     · РЕШЕНИЕ ПО ПАРОЛЯМ (важно, зафиксировано в чате): изначально
       пользователь просил, чтобы админ мог «скопировать» текущий пароль
       игрока. Ему объяснили: это требует хранить пароли в открытом виде
       в базе — обычный Firebase Auth так делать не даёт вообще никому
       (хранит только хэши, без исключений для админов). Пользователь
       осознанно выбрал БЕЗОПАСНЫЙ вариант: обычный Firebase Auth, админ
       может мгновенно СБРОСИТЬ пароль игрока (поставить новый), но не
       увидеть/скопировать старый. Это финальное решение для реализации —
       НЕ путать с первоначальной формулировкой «скопировать».

  3) ПРИВАТНОСТЬ КОНТЕНТА (то, чего нельзя сделать в статичном HTML)
     · скрытый контент / туман войны — часть записи (или отдельная
       запись) видна только ГМ и раскрывается игрокам по ходу игры
     · личные шёпоты игроку — ГМ отправляет секретную информацию,
       видимую только одному конкретному игроку, а не всем с доступом
       к документу (сейчас документ видят все игроки целиком, см.
       правило «ДОКУМЕНТ ВИДЯТ ИГРОКИ» в начале файла — с бэкендом это
       правило можно будет смягчить точечно, а не только избеганием тем)

  4) МИР И ПОВЕСТВОВАНИЕ
     · карта связей — уже есть офлайн (граф из RELATIONS/BONDS/открытых
       BOONS/sire, §3.4 «ВАЖНО (v1.21)»); с бэкендом может стать общей
       живой картой, а не пересчётом из статичного файла при каждой сборке
     · трекер репутации фракций — статус игрока у каждой секты/фракции
       отдельно от общего Статуса Камарильи/Анархов (§3.4 COURT/status)

  НЕ ОТДЕЛЬНАЯ ФИЧА, А СЛЕДСТВИЕ: автосинхронизация между устройствами
  реализовывать отдельно не нужно — появится сама, как только данные
  переедут в Firestore и появятся логины (сейчас состояние живёт только в
  localStorage конкретного браузера, §6, и никак не расшаривается).

  ТЕХНИЧЕСКИЙ РИСК НА БУДУЩЕЕ (не решено, решать при старте миграции):
  логин без e-mail обычно реализуют поверх Firebase Auth через «фейковый»
  email вида username@<домен>.local — так сохраняется нормальное хэширование
  паролей бесплатно, без Cloud Functions (для них нужен платный тариф Blaze,
  хоть использование и остаётся в бесплатной квоте). Финальную схему
  аккаунтов проектировать отдельно, не раньше самого начала миграции.

  СТАТУС (обновлено v1.38): фундамент (доступ и роли, п.2 выше) — РЕАЛИЗОВАН,
  см. §1.3, и с v1.38 включает самостоятельную регистрацию игроков (§1.3.3) —
  админ больше не заводит новых игроков руками, они делают это сами на
  экране входа. Из группы 1 (игровая механика) реализован первый пункт — живые
  листы персонажей, см. §1.3.1, и расширен самостоятельным созданием чарников
  игроками/мастером через вкладку Котерия — см. §1.3.2 (v1.37; фактически
  первый кусочек будущей «приватности контента» из бэклога ниже, только для
  чарников, не для всего остального). Остальное (лог бросков с общим фидом,
  даунтайм, XP; приватность контента шире чарников; мир) — по-прежнему
  только запланировано.

1.3 АВТОРИЗАЦИЯ (Firebase, с v1.31)
════════════════════════════════════════════════════════════════════════════
РЕАЛИЗОВАНО: логин/пароль без e-mail, три роли (админ/мастер/игрок), админ
сбрасывает пароль игрока (не видит старый). Модель — НЕ обычный Firebase
Auth email/password (см. §1.2 v1.29 — от него отказались, чтобы не включать
платный тариф Blaze ради серверной функции сброса пароля). Вместо этого:

  МЕХАНИЗМ. Анонимная авторизация Firebase (бесплатна, без e-mail) даёт
  каждой вкладке браузера служебный uid — это только «якорь сессии» для
  правил Firestore, сам человек через него не идентифицируется. Проверка
  логин/пароль происходит в правилах Firestore (firestore.rules, лежит
  рядом с исходниками, НЕ часть собранного HTML — вставляется в Firebase
  Console → Firestore → Rules отдельно, руками пользователя): клиент
  считает SHA-256 пароля (crypto.subtle, без соли и без bcrypt/Argon2 —
  это ЗАМЕТНО слабее промышленного хранения паролей, но пользователь
  осознанно выбрал этот вариант ради простоты и нулевой стоимости для
  закрытой группы доверенных игроков, см. чат) и пытается создать документ
  sessions/{uid} с этим хэшем — запись правилами разрешена, ТОЛЬКО если
  хэш совпал с сохранённым в users/{имя}.passwordHash. Роль потом всегда
  вычисляется заново через users/{имя}.role (два прыжка get() в правилах,
  sessionUsername() → myRole() в firestore.rules) — клиент не может
  «заявить» себе роль, только у auth.rules есть последнее слово.

  КОЛЛЕКЦИИ FIRESTORE:
    meta/bootstrap    {done:true} — появляется после первого админа,
                      закрывает возможность создать ещё одного «первого»
    users/{username}  {passwordHash, role:'admin'|'master'|'player',
                      displayName, createdAt} — username = id документа
    sessions/{uid}    {username, passwordHash, createdAt} — по одному на
                      анонимный uid браузера; удаляется при выходе

  ПЕРВЫЙ ЗАПУСК: пока users пуст (нет meta/bootstrap) — вместо формы входа
  показывается «Первый запуск», создающая единственного первого админа
  ТРЕМЯ ПОСЛЕДОВАТЕЛЬНЫМИ записями — users, потом sessions, потом
  meta/bootstrap (НЕ batch(), см. v1.34: правила Firestore проверяют
  каждую запись batch по снимку базы ДО всего пакета, поэтому запись
  sessions/{uid} не видела бы только что созданный в том же batch
  users/{имя} — «Missing or insufficient permissions»). Порядок важен:
  users первым (пока meta/bootstrap ещё нет — иначе его же правило create
  не пропустит), meta/bootstrap последним (закрывает лазейку).
  Дальше новых пользователей заводит только админ через #/admin/users
  (там запись users/{имя} одиночная, не batch — этой проблемы нет).

  ФАЙЛЫ: FIREBASE_CONFIG, bootAuth(), формы входа/бутстрапа, бейдж
  пользователя (#userBadge) и админ-панель (viewAdminUsers(), маршрут
  #/admin/users, ТОЛЬКО для role:'admin' — вне CATS/TOOLS: это техническая
  панель приложения, а не контент хроники, поэтому в общий список
  инструментов рассказчика её не добавляли) — всё в файле p3f_auth.js
  (см. §1 — с v1.33 идёт ПЕРЕД p3e_home.js в сборке; закрывающие
  </script></body></html> — в p3e_home.js, он снова последний). Три
  <script src> с самим SDK — в конце <head>, в p1_head.html.
  Старт движка обёрнут: p3e_home.js больше не вызывает route() напрямую,
  а передаёт весь обычный bootstrap (initDock/initSearch/initSession/route)
  колбэком в bootAuth() — вызывается только ПОСЛЕ успешного входа.
  ЕСЛИ SDK НЕ ЗАГРУЗИЛСЯ (нет сети, блокировщик) — typeof firebase
  остаётся 'undefined', fbApp/fbAuth/fbDb остаются null, bootAuth()
  показывает понятную карточку с ошибкой вместо падения всего скрипта на
  ReferenceError — проверено (см. §10, скриншот shots/authgate_error.png).

  БАГ v1.33 (ПОРЯДОК ФАЙЛОВ, УЖЕ ИСПРАВЛЕН): изначально p3f_auth.js шёл
  ПОСЛЕДНИМ в сборке, а его же bootAuth() вызывался из хвоста p3e_home.js —
  то есть ДО того, как в p3f_auth.js успевала выполниться сама строка
  fbAuth=firebase.auth(). Верхнеуровневые var-присваивания выполняются по
  физическому порядку в файле (в отличие от объявлений function, которые
  хостятся целиком) — поэтому в момент вызова bootAuth() переменная fbAuth
  ВСЕГДА была undefined, и пользователь ВСЕГДА видел карточку «не удалось
  загрузить Firebase», даже при полностью рабочей сети и загруженном SDK
  (перепутать с блокировщиком/сетью легко — сама карточка на это и
  намекает, но причина была не в этом). Раскрыто пользователем: ошибка
  повторилась на телефоне с мобильного интернета без антивируса/блокировщиков,
  что и исключило сетевую причину. Исправление — поменять местами
  p3f_auth.js и p3e_home.js в build.sh (p3f теперь ПЕРЕД p3e), перенести
  закрывающие </script></body></html> в конец p3e_home.js (см. §1).

  ТЕСТЫ: Firebase недоступен из песочницы агента (тот же сетевой запрет,
  что и на все Google-домены, см. §1.2 v1.29) — test.py перед переходом на
  страницу ставит window.name='KODEKS_TEST_BYPASS' (Playwright add_init_
  script), bootAuth() при этом флаге сразу подставляет фиктивную
  SESSION={role:'admin',…} на клиенте и не трогает Firebase вообще. ВАЖНО:
  именно поэтому регресс-тест не поймал баг v1.33 — обходной путь
  возвращается из bootAuth() ДО проверки fbAuth, то есть реальная ветка
  входа (и порядок её кода) тестами не покрыта вообще. Обход — это
  НЕ дыра в безопасности реального сайта: обойти можно только явно выставив
  window.name ДО загрузки страницы (недоступно через обычную ссылку/query-
  string), а даже с поддельной SESSION никакое реальное чтение/запись в
  Firestore не пройдёт без настоящей сессии — сервер (правила) проверяют
  независимо от того, что думает о себе клиент.

  ЧТО ПОКА НЕ СДЕЛАНО (из §1.2): лог бросков за общим столом, даунтайм, XP,
  шёпоты и т.д. (туман войны — сделан в v1.44, §1.3.4) — ещё не переехали в Firestore, живут как раньше
  в файле/localStorage. «Живые листы персонажей» — первый пункт §1.2 —
  реализованы, см. §1.3.1 ниже. Правила для остальных будущих коллекций —
  только заготовка-комментарий в конце firestore.rules.


════════════════════════════════════════════════════════════════════════════
1.3.1 ЖИВЫЕ ЛИСТЫ ПЕРСОНАЖЕЙ (Firestore, с v1.35)
════════════════════════════════════════════════════════════════════════════
Первый пункт бэклога §1.2 («игровая механика»). Track персонажа игрока
(голод/здоровье/воля/человечность — та же структура, что trkDefault/trkGet/
trkSet уже вели в localStorage, см. §3.1/6) для PCS-записи с полем owner
теперь хранится в Firestore и виден/меняется у всех участников без
перезагрузки страницы (слушатель onSnapshot). NPC/угрозы (PEOPLE/THREATS)
НЕ трогали — они как были, так и остались чисто в localStorage.

  КАК ВКЛЮЧИТЬ ДЛЯ КОНКРЕТНОГО ПЕРСОНАЖА: добавить полю PCS-записи
  owner:'логин' — это логин (username) учётной записи Firestore (см. §1.3),
  которой должен принадлежать лист. Поле выставляет агент по прямому
  указанию рассказчика в свободном тексте («лист Анны должен принадлежать
  аккаунту vlad») — так же, как и все остальные поля PCS; рассказчик сам
  файл не редактирует (см. правила в начале файла). ВАЖНО: на момент v1.35
  PCS в данных этой хроники сейчас пустой массив без единой записи — механизм построен и готов,
  но применить его не к чему, пока в хронике нет ни одного заведённого
  персонажа игрока. Как только появится первый — нужно узнать у
  рассказчика, чей логин к нему привязать.

  ПРАВА: мастер/админ редактирует любой живой лист; игрок — только свой
  (owner совпадает с его логином); остальные видят лист, но без кнопок
  правки (только просмотр) — листы персонажей и так открыты всем ролям в
  приложении, тумана войны ещё нет (§1.2). Проверка владения — ТОЛЬКО на
  клиенте (canEditLivePc() в p3g_pcsync.js); правила Firestore пропускают
  запись от любого игрока или мастера технически (см. предупреждение прямо
  в firestore.rules у match /pcstate/{pcId} — самому полю owner ВНУТРИ
  записываемого документа доверять нельзя, это дало бы любому игроку
  вписать «owner: себя» и захватить чужой лист; настоящей проверки владения
  через Firestore пока нет, только через данные страницы). Это сознательное
  упрощение под модель доверия проекта — закрытая группа друзей, тот же
  подход, что и к паролям без соли (§1.3).

  ФАЙЛЫ: PCSTATE_CACHE/pcstateUnsub/isLivePc()/canEditLivePc()/
  startPcSyncIfLive()/stopPcSync()/pcSyncWrite() — в НОВОМ файле
  p3g_pcsync.js (собирается между p3f_auth.js и p3e_home.js, см. §1).
  trkGet()/trkSet()/trkInner() в p3c_dice.js научены разделять «живой» PC
  (читают/пишут через p3g_pcsync) и обычный NPC/угрозу (как раньше, только
  localStorage) — единая точка входа для проверки прав есть только одна:
  trkSet() отказывает в записи, если isLivePc(x) && !canEditLivePc(x), и
  этим прикрывает ВСЕ пути изменения трекера разом (кнопки на странице
  персонажа, быстрый ввод голода и «Пробуждение»/переброс СВ в доке костей
  внизу экрана) — не только кнопки в trkInner(). stopPcSync() вызывается в
  начале dispatch() (p3e_home.js) при уходе с любой страницы, чтобы не
  копить забытые подписки; startPcSyncIfLive() — из viewPC() при открытии
  листа. viewPC() открыт всем ролям сразу, чтения pcstate можно не ждать
  отдельного экрана — trkInner() сама показывает «Загрузка живого листа…»
  до первого снимка.

  ИЗВЕСТНОЕ ОГРАНИЧЕНИЕ (мелкое, не тронуто намеренно): «Пробуждение»/
  переброс СВ в доке костей для чужого (не своего, не мастерского) живого
  листа пишет запись в лог броска ДО фактической проверки прав в trkSet() —
  если запись отклонена, счётчик персонажа не меняется, но строка в логе
  («+1 Голод», «−1 СВ Имя») всё равно появится, слегка вводя в заблуждение.
  Не критично (не даёт реально изменить чужой лист, только неточная
  запись в логе для того, кто и так не имел права), чинить не стали ради
  экономии времени — если будет мешать, можно поправить в remorse()/
  wpReroll()/rouseFor() в p3c_dice.js: проверять canEditLivePc() ДО pushLog().


════════════════════════════════════════════════════════════════════════════
1.3.2 КОТЕРИЯ: САМОСТОЯТЕЛЬНЫЕ ЧАРНИКИ (Firestore, с v1.37)
════════════════════════════════════════════════════════════════════════════
Сказано рассказчиком явно (v1.37). Расширяет §1.3.1: там track живого PCS
редактируется на сайте, но САМУ анкету (клан/секта/дисциплины/…) всё ещё
пишет агент по надиктовке в статичный PCS[]. Здесь — другой, ПАРАЛЛЕЛЬНЫЙ
механизм: игрок заводит персонажа САМ во вкладке Котерия (#/cat/players),
без участия агента вообще, и вся анкета целиком (не только track) живёт в
Firestore, в НОВОЙ коллекции pcs (не pcstate — это разные коллекции для
разных механизмов, не путать при правках).

  ВИДИМОСТЬ (ключевое отличие от §1.3.1, спрошено и подтверждено
  рассказчиком явным выбором из двух вариантов): игрок видит и открывает
  ТОЛЬКО свой чарник; мастер получает в Котерии отдельную панель с
  выпадающим списком ников игроков (из users, role:'player') — выбрал
  игрока, увидел его лист, только просмотр; админ видит все чарники сразу,
  без выбора. Другие игроки друг друга не видят вообще. Это ОБЕСПЕЧЕНО
  правилами Firestore (allow read у match /pcs/{pcId} в firestore.rules),
  не только сокрытием кнопок на клиенте — в отличие от pcstate (§1.3.1),
  здесь owner — часть самого документа и проставляется правилом create
  (request.resource.data.owner == sessionUsername()), значит проверку
  владения можно доверить самим правилам, подделать чужой owner нельзя.

  ПРАВКА: только владелец, БЕЗ исключения для мастера/админа — они могут
  посмотреть чужой лист через панель/общий список, но не изменить его.
  Это НАРОЧНО отличается от §1.3.1 (там мастер/админ правят любой живой
  лист статичных PCS[]) — сказано явно, не унификация ради унификации.

  СХЕМА ДОКУМЕНТА pcs/{автогенерированный id}: owner:'логин' (иммутабельно
  после создания, проверяется правилом update), name, short, clan, sect,
  gen, bp, predator, sire, concept:[[label,text],…], disciplines:[[name,
  dots],…], convictions:[[belief,anchor],…], track:{healthMax,wpMax,
  humanity,hunger} (стартовые/максимумы — как у обычного PCS.track), плюс
  ТЕКУЩЕЕ состояние трекера прямо в этом же документе (не в отдельном
  pcstate!): hunger,hMax,hSup,hAgg,wMax,wSup,wAgg,hum,stains — та же форма,
  что раньше жила в pcstate/{id} или в localStorage (см. trkDefault в
  p3c_dice.js), плюс createdAt/updatedAt/updatedBy.

  КАК ЭТО СОВМЕЩЕНО С ДВИЖКОМ ТРЕКЕРОВ (§1.3.1/§6): вместо отдельного
  механизма — расширены те же trkKey()/isLivePc()/canEditLivePc()/
  trkGet()/trkSet()/fillPcSelect() (p3c_dice.js) и isLivePc()/
  canEditLivePc()/pcSyncWrite() (p3g_pcsync.js), чтобы понимать объекты с
  меткой x._liveKind==='pcs' (проставляется в p3h_coterie.js при получении
  снимка коллекции — проверка ИМЕННО по этой метке, не по индексу в
  LIVE_PCS[], потому что при каждом onSnapshot массив LIVE_PCS пересоздаётся
  целиком новыми объектами, и старая ссылка из TRK_OBJ иначе бы «протухла»
  посреди работы). Так все кнопки/дока костей/«Пробуждение»/сброс к
  стартовым и т.п. работают для самостоятельных чарников без дублирования
  кода — единственная реальная разница зашита в canEditLivePc() (владелец-
  только для _liveKind==='pcs') и в pcSyncWrite() (пишет в pcs вместо
  pcstate, с merge:true, чтобы не затирать остальные поля анкеты).

  ПОДПИСКА: в отличие от §1.3.1 (подписка на один документ, живёт только
  пока открыта страница конкретного персонажа), здесь ОДНА подписка на всю
  коллекцию pcs, запущенная один раз при входе (startCoterieSync() —
  вызывается из bootAuth() в p3e_home.js, рядом с initDock/initSearch/
  initSession) и живущая всю сессию, не привязана к странице.
  ВАЖНО, ИСПРАВЛЕНО В v1.40 (было записано неверно и стало настоящим багом
  на живом сайте — см. журнал): правила Firestore НЕ фильтруют список
  построчно сами по себе. Для мастера/админа запрос действительно можно
  не сужать (isMaster() не зависит от resource.data — Firestore допускает
  весь список статически), но для игрока запрос ОБЯЗАН сам добавлять
  .where('owner','==',username) — иначе Firestore не может доказать, что
  КАЖДЫЙ возможный результат запроса удовлетворяет правилу (в коллекции
  есть чужие документы), и отклоняет список целиком, а не просто чужие
  строки. Без этого свой только что созданный чарник у игрока молча не
  появлялся в LIVE_PCS[] — «Персонаж недоступен» навсегда, хотя сам
  документ создавался прекрасно (запись — отдельное правило, не list).
  Мастеру дополнительно поднимается подписка на users с
  role:'player' (PLAYER_ACCOUNTS[]) для панели выбора игрока — из-за этого
  пришлось расширить правило чтения users/{username} с isAdmin() до
  isMaster() (иначе мастер не смог бы прочитать даже список логинов).
  rerenderCoterieIfOpen() перерисовывает открытую страницу Котерии/
  персонажа при каждом обновлении подписки, НО пропускает перерисовку,
  если сейчас открыта форма создания/правки (#pcFormMount не пуста) — иначе
  чужое обновление посреди набора текста стёрло бы недописанную анкету.

  ФОРМА (p3h_coterie.js: pcFormHtml/pcFormRead/pcFormSave/openPcForm/
  closePcForm): встроена прямо в страницу (не всплывающее окно) — вкладка
  Котерия для создания, страница персонажа (#/coterie/<id>) для правки
  владельцем. Сознательно НЕ включены (см. «дальше» ниже, если понадобится):
  портрет (x.img — потребовал бы Firebase Storage, платный тариф, см.
  §1.3), богатые текстовые блоки (x.blocks — оставлены только у записей,
  которые пишет агент по надиктовке), плейлист, политический статус
  (x.status — управляется мастером через Двор, не самим игроком), готовые
  связи (x.ties — требуют знания остальной хроники). Поля клан/секта/тип
  хищника/дисциплина — выпадающие списки из CLANS/SECTS/PREDATORS/
  DISCIPLINES самой хроники (не свободный текст), чтобы вики-ссылки внутри
  анкеты (wikiTag) сами резолвились на записи разделов. Ряды концепции/
  дисциплин/убеждений — фиксированное число пустых слотов (4/4/3), без
  динамического добавления — пустые слоты при сохранении просто
  отбрасываются (см. pcFormRead → rows()); если рассказчику этого мало,
  расширить несложно, но пока не просили.

  СОЗНАТЕЛЬНО ОСТАВЛЕНО ЗА СКОБКАМИ (не баг, а обрезанный ради скорости
  охват v1.37 — можно расширить отдельным заходом, если попросят):
  самостоятельные чарники НЕ участвуют в allPeople()/membersOf() (не
  попадают в списки «Члены клана» на странице клана/секты и т.п.) и НЕ
  попадают в глобальный поиск (IDX/buildIndex) — оба этих пути сейчас
  ничем не защищены по видимости (публичны всем ролям), а самостоятельные
  чарники обязаны быть приватными, значит светить их там до появления
  настоящего «тумана войны» (§1.2) было бы утечкой. Ограничение
  осознанное, а не забытое — не «чинить», а «разворачивать вместе с
  приватностью контента из бэклога», если вообще понадобится.


1.3.3 РЕГИСТРАЦИЯ ИГРОКОВ (p3f_auth.js, с v1.38)
────────────────────────────────────────────────────────────────────────────
Сказано рассказчиком явно (v1.38): новых игроков больше не заводит админ
руками через #/admin/users — они сами создают себе логин и пароль на
экране входа. Спрошено явно и открыто ПОЛНОСТЬЮ (без кода-приглашения) —
любой человек со ссылкой на сайт может завести себе аккаунт-игрока.

ЧТО ДОБАВЛЕНО: на экране входа (showLoginForm) — ссылка «Ещё нет аккаунта?
Зарегистрироваться», переключающая на новую showRegisterForm (логин,
пароль, повтор пароля). Обе формы переключаются друг в друга без
перезагрузки страницы. Роль всегда жёстко 'player' — форма её вообще не
спрашивает, так что подделать через devtools можно разве что сам POST в
Firestore, а не то, что видно в разметке; правило ниже всё равно
перепроверяет role на сервере, а не верит клиенту.

FIRESTORE-ПРАВИЛО (firestore.rules, users/{username}): в allow create
добавлена третья ветка `|| request.resource.data.role == 'player'` — то
есть создание документа с role:'player' разрешено ЛЮБОЙ вошедшей (хотя бы
анонимно) сессии, без исключений. 'master'/'admin' по-прежнему заводит
только первый бутстрап (первая ветка) или сам админ руками (isAdmin(),
вторая ветка) — самостоятельная форма роль повыше прописать не может,
даже если бы попыталась, потому что правило проверяет её в самой
отправляемой записи, а не то, что показала клиентская форма.

«ЛОГИН УЖЕ ЗАНЯТ» — без отдельного чтения наперёд: правило read на
users/{username} не пускает ещё не вошедшего читать чужую запись, значит
заранее узнать «свободен ли логин» нечем. Вместо этого сама попытка
create — это и есть проверка: если документ с таким id уже существует,
Firestore трактует запись как update (независимо от того, что вызвал
клиент — .set() или .update()), а update требует isAdmin() — то есть
попытка занятым логином сама получит permission-denied, и клиент просто
показывает «попробуй другой логин». Гонки состояний тут нет: Firestore
сам решает create/update по факту существования документа на сервере, а
не по догадке клиента.

ПОСЛЕ РЕГИСТРАЦИИ вход происходит сразу же — showRegisterForm вслед за
users/{u}.set() сама создаёт sessions/{uid} с тем же passwordHash (тот же
шаг, что делает обычный логин), и только затем зовёт общий cb(). Если
первый шаг (создание users/{u}) прошёл, а второй (sessions/{uid}) неудачно
оборвался (сеть моргнула) — аккаунт уже реально создан с нужным паролем,
просто клиент об этом не знает; в этом случае показывается отдельное
сообщение «аккаунт создан, обновите страницу и войдите» вместо «логин
занят», чтобы не запутать игрока лишней попыткой регистрации тем же
логином (которая на этот раз закономерно получит «занят»).

Страница #/admin/users (viewAdminUsers) не убрана — админ по-прежнему
может завести мастера/другого админа, сменить роль, сбросить пароль или
удалить запись; в описании страницы добавлена строка о том, что игроки
теперь регистрируются сами.

Не проверено против реального Firebase (см. оговорку в §1.3.2 выше) —
структура проверена макетом (test_register.py): переключение форм;
валидация логина (только [a-z0-9_]), длины пароля (мин. 4) и совпадения
паролей; попытка занятым логином корректно отклоняется с понятной
ошибкой и остаётся на форме регистрации; успешная регистрация создаёт
запись с role:'player', сразу создаёт сессию и заходит; повторный вход
тем же логином/паролем (как после перезагрузки страницы) отрабатывает
штатно. Реальные правила Firestore нужно проверить на живом сайте после
публикации.

────────────────────────────────────────────────────────────────────────────
1.3.4 СЛОЙ МАСТЕРА И ПРЕДПРОСМОТР ДЛЯ ТЕЛЕФОНА (с v1.42)
────────────────────────────────────────────────────────────────────────────
Сказано рассказчиком: в заметках теперь бывает информация только для
мастера; в проверочных файлах для телефона на заметках и на графе связей
нужен переключатель «игрок ↔ мастер».
ТУМАН ВОЙНЫ (с v1.44, сказано рассказчиком: «доступ мастер/игрок —
полной интеграцией через правила Firestore, это и будет туманом войны»).
Цепочка: p2_gm.js (источник тайн, формат описан в его шапке; вне
репозитория) → make_gm_json.js (вызывается из build.sh) → gm-layer.json
→ мастер загружает его на сайте, страница #/master/gm (p3i_gm.js,
ссылка «тайны» в плашке пользователя) → Firestore gmlayer/main
{json, by, updatedAt} → правило read/write: isMaster(). После входа
startGmLayer() подписывается на этот документ — только если canGm();
applyGmLayer() вставляет тайны в публичные записи (blocks — после блока
с заголовком after или в конец; ties; RELATIONS/BONDS/BOONS) с метками
gm:true и _gml (по _gml removeGmLayer() их снимает перед повторным
наложением — повторная загрузка не дублирует). Игрок документа не
получает вообще: ни в интерфейсе, ни в исходнике index.html, ни прямым
запросом к базе. Если в слое есть тайна для записи, которой нет на
сайте (слой новее сайта), страница «Мастерский слой» это показывает.
Раскрыть тайну игрокам по ходу игры = перенести текст из p2_gm.js в
p2_data.html и залить сайт (отдельного механизма раскрытия пока нет).
ДАННЫЕ ПОСЛЕ НАЛОЖЕНИЯ: флаг gm:true у блока (blocks[]), у элемента
ties[] (объект {text:'…', gm:true} вместо строки), у ребра RELATIONS /
BONDS / BOONS. Больше нигде флаг не читается (concept, short, quick —
всегда публичные).
ДВИЖОК (p3a_core.js, раздел «СЛОЙ МАСТЕРА»): canGm() — роль master/admin;
GM_VIEW — положение переключателя (по умолчанию «Мастер», помнится в
localStorage kn_gmview); gmOn()=canGm()&&GM_VIEW; gmOk(o) — фильтр для
всех мест вывода. Фильтруется: commonTail (blocks, ties), politicsHtml,
graphData/viewWeb (рёбра + таблица уз), реестр долгов, strings() — а
значит и «Упоминания», и поиск (IDX сбрасывается при переключении).
gm-блок рисуется с пунктирной полосой слева и пометкой «для мастера» в
подписи; gm-связь/ребро — с плашкой «для мастера», на графе — мелким
пунктиром и «[для мастера]» в подсказке. Переключатель gmToggleHtml()
стоит на каждой странице записи (viewEntry, viewPC) и на графе связей;
игроку (role player) не показывается вовсе, и gm-части для него
отсутствуют всегда.
ПРЕДПРОСМОТР: build_preview.py берёт собранный kodeks-nochi.html,
меняет var KODEKS_PREVIEW=false на true (p3f_auth.js), подставляет
gm-layer.json в var GM_LAYER_EMBED (p3i_gm.js), убирает скрипты SDK
Firebase и встраивает images/*.jpg как data-URI →
/mnt/user-data/outputs/kodeks-nochi-vX.html. Файл личный (в нём тайны) —
только рассказчику, не в репозиторий.
В этом режиме Firebase не инициализируется, вход пропущен, SESSION —
локальная, роль master (плашка «Предпросмотр · без сервера»); живые
функции Firestore не работают — вместо коллекции pcs в Котерии один
локальный «Пример персонажа» (startCoterieSync, с v1.45), чтобы лист
можно было проверить с телефона. index.html для
сайта собирается как раньше — там KODEKS_PREVIEW всегда false.
ИСТОРИЯ: в v1.42–1.43 тайны лежали прямо в p2_data.html с gm:true —
это было лишь скрытие в интерфейсе (на сайт так и не попало). С v1.44 —
настоящая защита через Firestore, как описано выше.

1.3.5 ИНТЕРАКТИВНЫЙ ЧАРНИК V5 (p3j_sheet.js, с v1.45)
────────────────────────────────────────────────────────────────────────────
Сказано рассказчиком: в живых чарниках Котерии были только трекеры — нужен
полноценный интерактивный лист вампира: атрибуты, навыки, встроенный
бросок, выбор метода охоты, дисциплин и т.п. после создания.
СТРАНИЦА #/coterie/<id> (viewLivePC): шапка → Трекеры → sheetHtml(x):
Бросок · Атрибуты (9) · Навыки (27) + специализации · Дисциплины (точки
и силы свободным текстом, клановые помечены по CLAN_REF) · Охота (тип
хищника + пул охоты атрибут+навык) · Мощь крови (строка BP_TABLE) ·
Достоинства/недостатки/фоны · Опыт (всего/потрачено/доступно, доп.
здоровье/СВ) · Заметки; ниже — Убеждения и Якоря, Концепция, кнопка
«Анкета» (прежняя форма: имя, клан, секта, поколение, МК, хищник, сир,
стартовые Человечность/Голод, концепция, Убеждения).
ПРАВКА: только владелец (как и раньше — правила pcs), кнопка «Правка
листа»: клик по точкам меняет значение (повторный клик по той же точке —
минус один), поля и списки — сразу в объекте, сохранение само через
0,7 с (sheetQueueSave, set merge). Пока открыт режим правки,
rerenderCoterieIfOpen() не перерисовывает страницу (иначе слетал бы
фокус), трекеры обновляются как обычно.
БРОСОК (для всех, кто видит лист, включая мастера): клик по названию
атрибута/навыка/дисциплины кладёт его в пул (повторный — убирает);
модификатор, сложность, «Всплеск крови» (кости из BP_TABLE + проверка
пробуждения); ослабление учитывается само: −2 к физическим, если
здоровье заполнено, −2 к социальным/ментальным, если заполнена СВ.
Кнопки «Бросить», «Проверка пробуждения», «Бросок охоты» — через общий
док костей (rollPool/rouseFor), персонаж выставляется в доке, так что
Голод берётся с его трекера, а переброс СВ списывает его СВ.
ПРОИЗВОДНЫЕ: здоровье = Выносливость + 3 (+hBonus), СВ = Самообладание +
Решимость (+wBonus) — pcDerived(), подхватывает trkGet() для любого
документа pcs с полем attrs (старые чарники без attrs — как раньше, из
track). Новые чарники создаются с attrs:{} (все атрибуты 1, навыки 0).
СПРАВОЧНИКИ в выпадающих списках: клан — CLANS хроники + CLAN_REF; секта —
SECTS + GHOSTS.sects; дисциплины — DISCIPLINES + DISC_REF; тип хищника —
PREDATORS хроники + PRED_REF (только названия из книги, без правил —
механику способа охоты хроники описывает сама запись в PREDATORS).
ФОРМАТ FIRESTORE — ВАЖНО: Firestore НЕ принимает массив внутри массива.
До v1.45 форма писала concept/convictions/disciplines как [[a,b]] — такой
чарник с заполненными строками не сохранялся бы вовсе. Теперь строки
хранятся объектами ({l,t}, {c,a}, {n,d,p}, {n,d,k,t}); pcFromFs() при
чтении переводит их в привычные [[…]], pcToFs() — обратно при записи.
Любое новое поле-список в pcs — только через эти две функции.
ПРОВЕРКА: test_sheet.py — макет Firestore, который, как настоящий,
отвергает вложенные массивы и чужие записи: создание, правка точек,
дисциплин, охоты, сохранение, производные, бросок с Голодом и
ослаблением, бросок охоты, анкета не затирает дисциплины, мастер —
только просмотр и бросок.

2. ЧТО ПРАВИТЬ ПО ТИПОВЫМ ЗАПРОСАМ ПОЛЬЗОВАТЕЛЯ
════════════════════════════════════════════════════════════════════════════
«Название / город / эпоха хроники»     → CHRONICLE (title, city, era, power,
                                         tagline, lede, premise, history)
«Новый NPC / Сородич / гуль / смертный» → PEOPLE
«Игрок и его персонаж»                 → PLAYERS + PCS (PCS.player = PLAYERS.id)
«Клан / дисциплина / сила»             → CLANS / DISCIPLINES (.powers)
«Ритуал, церемония, формула»           → RITUALS
«Тип хищника / достоинство / недостаток / предыстория» → PREDATORS / MERITS
«Лоршит»                               → LORESHEETS. В ЭТОЙ хронике лоршит —
                                         не про человека/предмет, а про важное
                                         СОБЫТИЕ в истории мира/города (так
                                         решил пользователь явно, это не общее
                                         правило V5) — см. §3.2.
«Секта, фракция, культ»                → SECTS
«Место, убежище, клуб, комната»        → PLACES (вложенность через parent)
«Район, чья территория, охотугодья»    → DOMAINS (+ CITY_MAP для размеров)
«Охотники, инквизиция, чужаки»         → THREATS
«Предмет, реликвия, улика»             → ITEMS
«Кто на посту при Дворе»               → COURT[*].seats[*].holder
«Кто кому должен»                      → BOONS (+ ссылка boon:id в SESSIONS)
«Кровные узы, ступень выросла»         → BONDS: ОБНОВИ level существующей
                                         пары, не создавай дубль
«Любовь, вражда, союз, служение»       → RELATIONS
«Итоги сессии N»                       → SESSIONS (новый объект n:N) + эффекты
                                         событий + при необходимости dead:true,
                                         BONDS/BOONS/COURT, новая ночь в CHRON
«Флешбек / мемориам»                   → CHRON kind:'memoriam'
«План следующей сессии»                → ACTIVE_SESSION
«Сессия прошла»                        → перенеси итоги в SESSIONS, пункты
                                         afterLog учти, а ACTIVE_SESSION верни
                                         к пустому шаблону (оставь night)
«Маскарад пострадал»                   → событие в SESSIONS с masq:+N
«Текущий Голод/урон персонажа»         → PCS.track (стартовые значения). См. §6
«Музыка для персонажа/места/сцены»     → поле playlist записи или
                                         ACTIVE_SESSION.playlists
Если запрос не ложится ни в один массив — спроси пользователя или
предложи новый раздел (§8), не прячь данные в чужое поле.

Строки — в одинарных кавычках. Апостроф внутри экранируй \' , лучше
используй «ёлочки». Не вставляй HTML в данные — он экранируется.

3.1 ОБЩАЯ ЗАПИСЬ (почти все массивы разделов)
  id:'kebab-case'         обязательно; уникален в своём массиве; часть URL;
                          НЕ МЕНЯЙ у существующих записей (сломает URL и

  name:'Имя'              обязательно; уникален во ВСЁМ файле (вместе с
                          aliases и PCS.full) — по нему строятся ссылки

  short:'…'               одна строка: подзаголовок карточки и шапки
  acc:'#RRGGBB', acc2     необязательный цвет записи (иначе цвет раздела)

  img:'images/имя.jpg'   портрет/картинка записи (необязательно), показывается
                          в шапке (jcard) крупно по центру, сразу под
                          заголовком и над коротким описанием (short).
                          ВАЖНО (с v1.8, ПЕРЕСМОТРЕНО в v1.27): раньше сюда
                          вшивали base64 прямо вx.img, это раздувало файл,

                          умолчанию. С v1.27 проблема решена иначе: картинка
                          сохраняется как отдельный файл в images/ (см.
                          §1.1), а сюда пишется просто относительный путь —
                          файл больше не растёт от картинок вообще. Движок
                          одинаково понимает и такой путь, и полный URL, и
                          (для старых записей) data-URI — менять существующие

  concept:[['Метка','текст']]           сетка описательных блоков
  blocks:[ …секции… ]     свободные секции, каждая одного из видов:
      {t:'Заголовок', text:'абзацы'}

      {t:'Заголовок', table:{cap:'подпись', head:['A','B'], rows:[['1','2']]}}

               name ДОЛЖЕН совпадать с написанием в CLAN_REF (Бруха, Гангрел,
               Малкавиан, Носферату, Тореадор, Тремер, Вентру, Каитиф,
               Тонкокровные) — тогда заготовка-призрак исчезнет. Это ровно
               7 играбельных кланов основной книги + Каитиф и Тонкокровные;
               другие кланы (Бану Хаким, Геката, Ласомбра, Министерство,
               Равнос, Салюбри, Цимисх и т.д.) в основной книге не описаны
               как играбельные (только эпизодические упоминания) и
               намеренно не входят в CLAN_REF — не добавляй их обратно без
               явной просьбы пользователя и указания источника (допа).
  DISCIPLINES  kind:'Ментальная|Физическая|…'  resonance:'Флегматическая'
               threat:'угроза Маскараду'
               powers:[{lvl:1, name:'', cost:'проверка пробуждения|—',
                        pool:'Сообразительность + Проницательность',
                        dur:'одна сцена', amalgam:'Доминирование ••', text:''}]
               name — как в DISC_REF (Анимализм, Прорицание, Магия крови,
               Стремительность, Доминирование, Стойкость, Затемнение,
               Могущество, Присутствие, Превращение, Алхимия тонкокровных)
               — это 9 дисциплин основной книги + Алхимия тонкокровных.
               Забвение (Oblivion) в основной книге не описано (клан-
               носитель Геката — из допов) и намеренно исключено из
               DISC_REF/RESONANCE.
  RITUALS      kind:'Ритуал|Церемония|Формула' (группировка)  lvl:1..5
               cost  pool  ingredients  text        — страницы нет, карточка
  PREDATORS    pool:'…'  gains:['…']  text          — карточка
  MERITS       kind:'Достоинство|Недостаток|Предыстория' (группировка)
               dots:'••' или '•–•••'  text           — карточка
  LORESHEETS   name — ВАЖНОЕ СОБЫТИЕ в истории мира/города (не человек, не
               предмет — так решил пользователь для этой хроники, явно).
               levels:[[1,'Название ступени','текст'], …]
               year:1784 (опционально, число — год события для сортировки
               раздела Лоршиты по хронологии, см. viewLoresheets в
               p3a_core.js и LORE_YEARS в p2_data.html)
  SECTS        общая запись; name используется как ключ секты в PCS.sect,
               PEOPLE.sect, status, COURT.sect, SESSIONS.status.sect —
               пиши секту ОДИНАКОВО везде («Камарилья», «Анархи»).
  PLAYERS      {id, name, short, note, acc?} — люди за столом
  PCS          player:'id из PLAYERS'  clan:'Вентру'  sect:'Камарилья'
               gen:12 (число)  bp:1 (Мощь крови)  sire:'Имя'  predator:'Имя'
               full:'полное имя' (резолвится как alias)
               status:{'Камарилья':1}   — БАЗА до событий журнала (§4)
               convictions:[['Убеждение','Имя Якоря'], …]
               disciplines:[['Доминирование',2], …]
               track:{healthMax:7, wpMax:5, humanity:7, hunger:1}
               owner:'логин'  — необязательное, с v1.35 (§1.3.1): логин
               учётной записи Firestore, чей это персонаж — track тогда
               становится «живым» (хранится в Firestore, редактируется
               игроком/мастером прямо на сайте) вместо стартовых значений
               из файла. Выставляется агентом по прямому указанию
               рассказчика, никогда самостоятельно. НЕ ПУТАТЬ с
               самостоятельными чарниками (§1.3.2, с v1.37) — те игрок
               заводит сам во вкладке Котерия, минуя агента и минуя PCS[]
               вообще: у них своя коллекция Firestore (pcs), своя страница
               (#/coterie/<id>), своя, более строгая модель прав (правка
               только у владельца). Оба механизма живут параллельно.
  PEOPLE       как PCS, но без player; плюс role:'Шериф'; track — только
               если нужен трекер (тогда NPC появится в доке костей).
               Раздел #/cat/people рендерится через viewPeople (p3a_core.js,
               v1.22, вызывается из viewList): клан — полноценная категория
               списка, не просто ключ сортировки. Записи делятся на
               подразделы с заголовком-клана и счётчиком (алфавит,
               localeCompare 'ru'); внутри подраздела — по .name. Запись
               без clan уходит в подраздел «Без клана» в конце; заготовки-
               призраки GHOSTS.people (клан неизвестен, записи ещё нет) —
               отдельным подразделом «Клан неизвестен» после всех клановых.
  PLACES       parent:'id родителя' (нет → корень)  ghosts:['зона без
               заметки']  domain:'id из DOMAINS'
               КОНВЕНЦИЯ (сказано пользователем, v1.26): по умолчанию
               локации в этой хронике пишутся ПЛОСКО — без parent и без
               ghosts:[] (никакой вложенности). parent/ghosts остаются
               доступным механизмом движка, но не используются по
               умолчанию: если локация разрастается настолько, что у неё
               реально появляются свои подзоны/уровни, такую крупную
               локацию оформляют как отдельный DOMAINS, а не как дерево
               PLACES. Пример плоской записи без children: 'Эден' (v1.26).
  DOMAINS      holder:'Имя'  kind: ключ DOMAIN_KINDS (domain | hunt |
               elysium | contested | barrens | haven)  threat:0..5
               shape:'x,y x,y x,y …' — многоугольник в координатах
               CITY_MAP.w × CITY_MAP.h (по умолчанию 1000×640; ≥3 точек).
               point:'x,y' — вместо shape для ОДНОГО ЗДАНИЯ (элизиум,
               убежище, логово): рисуется маленькой точкой цвета типа.
               Сказано рассказчиком (v1.48): места, не занимающие
               площадь, зоной не делать — иначе соседние здания
               перегрузят карту. Зона (shape) — только для угодий,
               районов, спорных территорий. Точку тоже проверять на сушу.
               Без shape и point домен есть в списке, но не на карте.
               ПРАВИЛО (сказано пользователем, v1.36 — на этом уже
               споткнулись: у 'Эден' не было записи в DOMAINS вообще,
               из-за чего клуб-элизиум не показывался на карте угодий,
               хотя запись PLACES для него существовала). При заведении
               КАЖДОЙ новой локации (PLACES) спрашивай себя: это угодья,
               элизиум, спорная территория или другое «владение» в
               терминах DOMAIN_KINDS? Если да — заводи парную запись в
               DOMAINS (с примерным shape на city-map.svg) и проставляй
               PLACES[].domain на её id, а не только описывай владение
               текстом внутри самой заметки.
               ПРОВЕРКА shape НА СУШУ (сказано по факту бага, v1.39 — на
               этом уже споткнулись: 'грубо на глаз' для Эдена означало
               «взять готовый shape соседнего домена и просто сдвинуть Y»,
               а остров на city-map.svg лежит по диагонали ЮЗ→СВ, а не
               строго по оси Y — сдвиг «на север» без сдвига «на восток»
               увёл полигон в воду). city-map.svg — это НАСТОЯЩИЙ полигон
               суши (пять <polygon> — боро), не просто декоративный фон:
               прежде чем считать shape готовым, проверь координаты каждой
               вершины геометрически (см. пример подхода в журнале
               изменений v1.39 — shapely, point-in-polygon), а не только
               «на глаз по числам». Ориентир — соседний уже существующий
               домен на том же участке суши: бери его shape как основу и
               двигай в сторону, где полигон СОСЕДА подсказывает, что
               берег идёт, а не по одной оси.
  THREATS      kind:'Охотник|Гуль|Сородич|Чужак|Иное'
               stat:[['Пул атаки','7'], …]  track (необязательно)
  ITEMS        общая запись

  ЗАГОТОВКИ-ПРИЗРАКИ ЗА ПРЕДЕЛАМИ КЛАНОВ/ДИСЦИПЛИН (var GHOSTS, конец d.js):
  Для CLANS/DISCIPLINES заготовки берутся из CLAN_REF/DISC_REF (справочник
  книги, §7). Для остальных разделов такого справочника нет — вместо него
  GHOSTS{people:[…], places:[…], sects:[…], items:[…], threats:[…],
  loresheets:[…], rituals:[…], predators:[…], merits:[…]} — список имён,
  которые ты САМ упомянул в тексте заметок, но полноценной записи для них
  ещё не завёл.
  ПРАВИЛО (важно — на этом уже дважды спотыкались): при добавлении КАЖДОЙ
  новой заметки перечитывай её на предмет чужих имён собственных не только
  в [[Имя]] и card.name, но и в обычном тексте без вики-разметки — short,
  tag, ячейки таблиц (table.rows), quick, ties. Название бара, района,
  фракции или человека, просто упомянутое в таблице или абзаце БЕЗ [[…]],
  всё равно означает «эта сущность существует в хронике, но не описана» —
  заносить в GHOSTS нужно и такие имена, не дожидаясь, пока пользователь
  сам укажет на пропуск. Раздел определяешь по смыслу (кто-то с
  ролью/сиром/приближённым — people; район/бар/дом — places; Камарилья/
  Анархи и т.п. — sects). Ничего не удаляй из GHOSTS вручную — когда
  появится настоящая запись с тем же name, заготовка сама перестанет
  отображаться (движок сверяется с LINKS).
  ЛОРШИТЫ ОСОБО: в этой хронике лоршит — ВАЖНОЕ СОБЫТИЕ в истории мира или
  города, а не человек и не предмет (явное решение пользователя). Источник
  для GHOSTS.loresheets — датированные события в блоках «История» и
  подобных: если у события уже есть имя/заголовок в тексте — заноси его
  как есть; если событие только подразумевается через безымянную фигуру
  («кто он такой, уже никто не помнит») — заносить нечего, пока у САМОГО
  СОБЫТИЯ (не у фигуры) нет названия. Также LINKS — один общий регистр
  имён на ВСЕ разделы сразу (regLink не различает категории), поэтому имя
  события в LORESHEETS не должно совпадать с именем человека/места из
  другого раздела («Война Гекаты», а не «Геката» — Геката уже отдельная
  заготовка в people и станет отдельной записью с тем же name; так и
  разошлись). Тот же принцип держи в уме и для остальных разделов: два
  разных раздела не должны целиться в одинаковый
  name — тогда LINKS не сможет их различить.

  ОБРАТНЫЕ СВЯЗИ В ties[] (сказано пользователем, v1.36 — на этом уже
  споткнулись: когда заводили 'Эден' и его Хранителя Элизиума Кейт
  Флэмор, в ties[] у Эдена связь с Гекатой прописали, а вот в уже
  СУЩЕСТВОВАВШЕЙ на тот момент записи Гекаты обратную строку про Кейт
  Флэмор — забыли; связь была видна только с одной стороны). ПРАВИЛО:
  при добавлении новой заметки, которая упоминает СВЯЗЬ с уже
  существующей записью (не только через политику/RELATIONS — см. ниже,
  а именно через свободный текст ties[]), проверяй и открывай СТАРУЮ
  запись тоже: если связь значима и её стоит увидеть с обеих сторон —
  добавляй туда обратную строку в ties[], не полагаясь на то, что
  читатель сам дойдёт от новой заметки к старой по ссылке [[…]]. Это
  отдельно от политических связей через глобальный RELATIONS[] (см.
  politicsHtml/§раздел ниже) — там связь всегда двусторонняя автоматически,
  проверка нужна именно для ручных текстовых ties[].

  ties[] НЕ ПИТАЕТ RELATIONS[] — ЗАВОДИ ОБЕ, ЕСЛИ НУЖНЫ ОБЕ (на этом
  споткнулись ещё раз, ровно на той же Кейт Флэмор, v1.39: добавили
  строку в ties[] Гекаты, решили что связь «готова», а на деле
  «Положение среди Сородичей» (politicsHtml, на странице личности) и
  Граф связей / Паутина (graphData, #/tool/web) читают ТОЛЬКО RELATIONS[]
  — свободный текст ties[] у них вообще не в источниках данных, это два
  полностью раздельных, никак не связанных друг с другом хранилища одной
  и той же фактически связи). ПРАВИЛО: когда новая связь между двумя
  персонажами/держателем и угодьем и т.п. значима настолько, что должна
  быть видна и в прозе на странице (ties[]), и в «Положении среди
  Сородичей»/Графе связей (RELATIONS[]) — заводи ОБЕ записи, они не
  синхронизируются друг с другом автоматически. Не каждая строка ties[]
  обязана иметь пару в RELATIONS[] (RELATIONS — про структурные типы:
  love/ally/enmity/rival/debt/bond/sire/touch/serve/other, см. REL_TYPES
  в p2_data.html) — но если тип отношения туда укладывается и рассказчик
  наверняка захочет видеть его на графе, не полагайся на то, что ties[]
  это уже покрыл.
  Отображение: на странице раздела (#/cat/<id>) — пунктирная карточка;
  для разделов без kind (clans, disciplines, loresheets, sects, people,
  threats, items) это карточка вида god-card (viewList, ghostCard); для
  разделов kind:'cards' (rituals, predators, merits) — карточка вида
  .card (viewCards, ghostFullCard) в общей сетке с обычными карточками;
  для PLACES (kind:'tree') — отдельно, пунктирной строкой в корне дерева
  локаций (вложенные подзоны внутри конкретного места по-прежнему через
  PLACES[].ghosts, см. выше); для DOMAINS (kind:'map', viewDomains) —
  той же карточкой god-card под картой, в общей сетке со «сфигуренными»
  доменами, но БЕЗ полигона на самой карте (у заготовки нет shape —
  появится, когда у домена будет реальная запись с координатами).
  ВАЖНО: «охотничьи угодья», район/территория, которую кто-то ДЕРЖИТ или
  за которую идёт борьба — это GHOSTS.domains, а не GHOSTS.places, даже
  если по ощущению это «локация». PLACES — это конкретные вложенные точки
  (бар, дом, комната, элизиум), DOMAINS — территория на карте города со
  своим держателем/типом/уровнем угрозы. Не путай эти два раздела при
  заведении новых имён.
  ЛОРШИТЫ — СОРТИРОВКА ПО ХРОНОЛОГИИ (v1.21): раздел #/cat/loresheets
  рендерится не общей viewList(), а отдельной viewLoresheets() (p3a_core.js)
  — настоящие записи (по LORESHEETS[].year) и заготовки-призраки
  (GHOSTS.loresheets, год ищется в справочнике LORE_YEARS, p2_data.html,
  сразу после var GHOSTS) сливаются в ОДИН список и сортируются по году
  вместе, а не «сперва карточки, потом заготовки» как везде. Год неизвестен
  — карточка уходит в конец. Когда у события заводится настоящая запись
  LORESHEETS с полем year, соответствующую строку в LORE_YEARS можно (и
  стоит) убрать — она нужна только для ещё не описанных событий.

3.3 ХРОНИКА И КАРТА
  CHRONICLE  id:'…' (ключ хранилища браузера, §6 — не меняй без нужды)
             title, city, era, power, tagline, lede: строки
             premise:[['Метка','текст']]  history:[['Дата/эпоха','текст']]
             CHRONICLE.city автоматически становится ссылкой на титул.
  CITY_MAP   {img:'', w:1000, h:640, note:''}; img — URL или data:-URL
             подложки. Предпочитай пустой img (файл должен жить офлайн).

3.4 ПОЛИТИКА
  COURT      [{sect:'Камарилья', seats:[{title:'Князь', tier:1..4,
             holder:'Имя' или '' (пусто = вакансия), note:''}]}]
             tier = ряд в иерархии (1 — вершина). Шаблон содержит посты
             Камарильи и Анархов — удаляй/добавляй по хронике.
  BOONS      [{id:'b-…', debtor:'Имя', creditor:'Имя',
             level:'trivial|minor|major|life', status:'open|paid|broken',
             why:'за что', n:номер сессии}]
             Погашение = смена status на месте, запись не удалять.
  BONDS      [{thrall:'кто пьёт', regnant:'чью кровь', level:1..3, note}]
  RELATIONS  [{a:'Имя', b:'Имя', type: ключ REL_TYPES, note:''}]
             REL_TYPES: love ally enmity rival debt bond sire touch serve
             other. Узы, открытые долги, сиры и Якоря в граф добавляются
             САМИ — не дублируй их в RELATIONS.
             ВАЖНО (v1.21): «Граф связей» (#/tool/web, graphData в
             p3d_tools.js) строит узлы и рёбра ТОЛЬКО из RELATIONS/BONDS/
             BOONS(open)/.sire/PCS.convictions — прозу из PEOPLE[].ties
             инструмент не читает вообще. Поэтому при каждом новом факте
             отношений (в интервью личности или в свободном тексте, включая
             ties) добавляй СТРУКТУРНОЕ ребро в RELATIONS тоже — иначе лицо
             физически не появится на графе. Имя без своей записи (только
             GHOSTS) всё равно становится валидным узлом графа — меньше,
             синее, некликабельно, но подписано.
             МАСШТАБ (v1.22): drawWeb (p3d_tools.js) держит «камеру» —
             var WEB_VB={x,y,w,h} — поверх неизменной сцены симуляции
             1000×640; сами координаты узлов/рёбер масштаб не трогает,
             меняется только SVG viewBox. Кнопки +/−/1:1 в углу графа,
             колесо мыши (масштаб к курсору) и перетаскивание пустого фона
             (панорама — срабатывает только когда клик НЕ по узлу, иначе
             это обычное перетаскивание узла) читают и пишут один и тот же
             vb. WEB_VB — module-level переменная, как WEB_OFF: масштаб и
             панорама не сбрасываются при переключении фильтров типа связи
             (viewWeb вызывает drawWeb заново, но WEB_VB тот же объект);
             сбрасывается только кнопкой «1:1» или полной перезагрузкой
             страницы.

3.5 ВРЕМЯ И ЖУРНАЛ
  SESSIONS   [{n:1, date:'', note:'', items:[ … ]}], n — целые, по
             возрастанию, без повторов. Элемент items — либо строка,
             либо объект события:
               {t:'текст с [[ссылками]]',
                status:{who:'Имя', sect:'Камарилья', delta:+1|-1},
                masq:+N|-N,               // шкала Маскарада
                boon:'id из BOONS',       // чип-ссылка на реестр долгов
                bond:'Анна → Граф, 2'}    // чип-подпись; саму ступень

  • баланс долгов, счётчики записей, поиск
  • заготовки-призраки (пунктирные карточки без записи) — для кланов и
    дисциплин из CLAN_REF/DISC_REF (§7), для остальных разделов — из
    var GHOSTS (§3.2, конец d.js)
  • порядок разделов на титуле — по убыванию числа записей (пересчитывается

7. СПРАВОЧНИКИ СИСТЕМЫ — ПРАВИЛА, НЕ ЗАМЕТКИ
════════════════════════════════════════════════════════════════════════════
CLAN_REF, DISC_REF, BP_TABLE, RESONANCE, TEMPERAMENT, COMPULSIONS —
данные правил V5, ЖЁСТКО ОГРАНИЧЕННЫЕ ТОЛЬКО ОСНОВНОЙ КНИГОЙ (Vampire:
the Masquerade Corebook, Renegade). У пользователя нет доступа к
дополнениям (Players Guide, Camarilla, Anarch, Chicago by Night,
Cults of the Blood Gods и т.д.) — НЕ добавляй факты оттуда, даже если
они общеизвестны фанатам системы. Отсюда сознательно исключены:
  · кланы вне основной книги (Бану Хаким, Геката, Ласомбра,
    Министерство, Равнос, Салюбри, Цимисх — в корбуке только
    эпизодические лорные упоминания, не полноценные главы) —
    CLAN_REF содержит только 7 кланов корбука + Каитиф + Тонкокровные;
  · дисциплина Забвение (Oblivion, клан-носитель Геката из допов) —
    её нет в DISC_REF/RESONANCE.
Проверено построчно по тексту книги (pdftotext) на момент v1.2; если
пользователь пришлёт другую книгу/доп — можно расширять, но явно
спрашивай/фиксируй источник каждого нового факта.
BOON_LEVELS, BOON_STATUS — термины (trivial/minor/major/life boon)
подтверждены по корбуку. REL_TYPES, DOMAIN_KINDS — это НЕ цитаты
правил, а собственные категории приложения для учёта отношений и
локаций хроники; их можно менять свободно под нужды конкретной игры.
Меняй справочники правил только по явной просьбе (хоумрул, эррата,
новый источник). Ключи словарей используются в данных — переименование
ключа ломает записи, которые его используют.

  □ ПРЕДЛОЖЕНИЯ ПЕРЕД ЗАМЕТКОЙ (сказано рассказчиком, v1.50): после
    интервью, до сборки заметки — предложи список фактов-дополнений в

    «для мастера» — только в p2_gm.js. Невыбранные не использовать.
  □ правь точечно (str_replace), не переписывай массивы «по памяти»;
    новые записи дописывай в конец массива (порядок = номер записи)
  □ перед добавлением сверь name со всеми существующими name/aliases
  □ поля — строго по схеме §3, лишних не выдумывай
  □ после правки — синтаксис:
      python3 -c "s=open('ФАЙЛ').read();a=s.rindex('<scr'+'ipt>')+8;
        open('c.js','w').write(s[a:s.rindex('</scr'+'ipt>')])" && node --check c.js
      (rindex обязателен: слово «script» встречается и в этом комментарии)
  □ битые ссылки (данные без движка):
      вырежи из c.js всё до маркера КОНЕЦ ДАННЫХ в d.js, затем
      node -e "eval(require('fs').readFileSync('d.js','utf8')
        .replace(/^var /gm,'global.'));…"
      собери имена name/aliases/full и ищи /\[\[([^\]|]+)/g ТОЛЬКО по
      строковым значениям (рекурсивный обход, не JSON.stringify)
  □ при возможности открой файл в headless-браузере и пройди маршруты
    из §1: не должно быть ошибок в консоли
  □ интерфейс — без технических подсказок (см. начало)
  □ допиши строку в ЖУРНАЛ ИЗМЕНЕНИЙ ниже и подними версию
  □ в ответе пользователю: что добавлено/изменено и какие ссылки
