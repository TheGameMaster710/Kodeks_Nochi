    '<p class="lede" style="margin:0 0 30px">'+esc(c.lede)+'</p>'+inner+'</div></section>';
}

function viewList(c){
  setTheme(c.theme);
  if(c.kind==='cards') return viewCards(c,null);
  if(c.kind==='tree') return viewPlaces();
  if(c.kind==='map') return viewDomains();
  if(c.id==='players') return viewPlayers();
  if(c.id==='loresheets') return viewLoresheets(c);
  if(c.id==='people') return viewPeople(c);
  var cards=c.arr.map(function(x){return listCard(c,x);}).join('');
  var ghosts='',hint='';
  if(c.id==='clans'){ghosts=CLAN_REF.filter(function(r){return !LINKS[r[0]];}).map(function(r){
    return ghostCard('КЛАН',r[0],r[1],'');}).join('');hint='Пунктирные карточки — заготовки из книги. Как только появится запись с тем же именем, заготовка исчезнет.';}
  else if(c.id==='disciplines'){ghosts=DISC_REF.filter(function(r){return !LINKS[r[0]];}).map(function(r){
    return ghostCard('ДИСЦИПЛИНА',r[0],r[1]!=='—'?['резонанс: '+r[1]]:[],'');}).join('');hint='Пунктирные карточки — заготовки из книги. Как только появится запись с тем же именем, заготовка исчезнет.';}
  else if(GHOSTS[c.id]&&GHOSTS[c.id].length){ghosts=GHOSTS[c.id].filter(function(n){return !LINKS[n];}).map(function(n){
    return ghostCard(c.one.toUpperCase(),n,[],'');}).join('');hint='Пунктирные карточки — упомянуты в заметках, но своей записи ещё нет. Как только появится запись с тем же именем, заготовка исчезнет.';}
  var inner=(cards||ghosts)?'<div class="gods">'+cards+ghosts+'</div>':emptyBox('Записей пока нет','Раздел ждёт первых заметок хроники.');
  if(ghosts) inner+='<p class="hint">'+hint+'</p>';
  listShell(c,inner);
}

/* Личности — клан теперь полноценная категория раздела, а не просто ключ
   сортировки: список делится на подразделы с заголовком и счётчиком, по
   одному на клан (алфавит, ru), плюс «Без клана» в конце для записей без
   поля clan. Заготовки-призраки (GHOSTS.people) клана не имеют — своей
   записи ещё нет, поэтому они идут отдельным подразделом в самом конце,
   а не внутри клановых групп. */
function viewPeople(c){
  var groups={},order=[];
  c.arr.forEach(function(x){var g=x.clan||'Без клана';
    if(!groups[g]){groups[g]=[];order.push(g);}groups[g].push(x);});
  order.sort(function(a,b){if(a==='Без клана')return b==='Без клана'?0:1;
    if(b==='Без клана')return -1;return a.localeCompare(b,'ru');});
  var gh=(GHOSTS.people||[]).filter(function(n){return !LINKS[n];});
  var sections=order.map(function(g){
    var list=groups[g].slice().sort(function(a,b){return (a.name||'').localeCompare(b.name||'','ru');});
    return '<div class="sec-head" style="margin:34px 0 14px"><h3>'+esc(g)+'</h3><span class="eyebrow">'+list.length+' '+plural(list.length,'запись','записи','записей')+'</span></div>'+
      '<div class="gods">'+list.map(function(x){return listCard(c,x);}).join('')+'</div>';});
  var inner=sections.join('');
  if(gh.length) inner+='<div class="sec-head" style="margin:34px 0 14px"><h3>Клан неизвестен</h3><span class="eyebrow">'+gh.length+' '+plural(gh.length,'заготовка','заготовки','заготовок')+'</span></div>'+
    '<div class="gods">'+gh.map(function(n){return ghostCard('ЛИЧНОСТЬ',n,[],'');}).join('')+'</div>';
  if(!order.length&&!gh.length) inner=emptyBox('Записей пока нет','Раздел ждёт первых заметок хроники.');
  else if(gh.length) inner+='<p class="hint">Пунктирные карточки — упомянуты в заметках, но своей записи ещё нет (клан пока неизвестен). Как только появится запись с тем же именем, заготовка исчезнет.</p>';
  listShell(c,inner);
}

/* Лоршиты — события истории города: карточки идут в хронологическом
   порядке (по году), а не как обычно (сперва настоящие записи, потом
   заготовки). Год настоящей записи — LORESHEETS[].year; год заготовки —
   справочник LORE_YEARS в p2_data.html (не хранится в самой GHOSTS,
   чтобы не усложнять общий формат заготовок остальных разделов). Запись
   или заготовка без известного года уходит в конец списка. */
function viewLoresheets(c){
  var gh=(GHOSTS.loresheets||[]).filter(function(n){return !LINKS[n];});
  var items=c.arr.map(function(x){return {y:x.year,html:listCard(c,x)};})
    .concat(gh.map(function(n){return {y:(typeof LORE_YEARS!=='undefined'?LORE_YEARS[n]:null),html:ghostCard('ЛОРШИТ',n,[],'')};}));
  items.sort(function(a,b){var ay=a.y==null?Infinity:a.y,by=b.y==null?Infinity:b.y;return ay-by;});
  var inner=items.length?'<div class="gods">'+items.map(function(i){return i.html;}).join('')+'</div>'
    :emptyBox('Записей пока нет','Раздел ждёт первых заметок хроники.');
  if(gh.length) inner+='<p class="hint">Карточки идут в хронологическом порядке. Пунктирные — упомянуты в заметках, но своей записи ещё нет; как только появится запись с тем же именем, заготовка исчезнет.</p>';
  listShell(c,inner);
}

/* компактные разделы: все записи — полные карточки на одной странице */
function fullCard(c,x){
  var par=[];
  if(c.id==='rituals'){par=[['Тип',x.kind],['Уровень',x.lvl],['Цена',x.cost],['Пул',x.pool],['Ингредиенты',x.ingredients]];}
  if(c.id==='predators'){par=[['Пул охоты',x.pool],['Даёт',(x.gains||[]).join('; ')]];}
  if(c.id==='merits'){par=[['Вид',x.kind],['Точки',x.dots]];}
  par=par.filter(function(p){return p[1]!=null&&p[1]!=='';});
  return '<article class="card" id="c-'+c.route+'-'+x.id+'" style="--c:'+(x.acc||c.c)+'">'+
    '<span class="tag">'+esc(x.kind||c.one)+(x.lvl?' '+x.lvl:'')+'</span><h4>'+esc(x.name)+'</h4>'+
    (x.short?'<div class="tsub">'+inl(x.short)+'</div>':'')+
    (par.length?'<dl class="par">'+par.map(function(p){return '<dt>'+esc(p[0])+'</dt><dd>'+inl(String(p[1]))+'</dd>';}).join('')+'</dl>':'')+
    '<div class="eff">'+md(x.text||'')+'</div></article>';
}
function ghostFullCard(c,name){
  return '<article class="card ghost"><span class="tag">'+esc(c.one)+' · нет</span><h4>'+esc(name)+'</h4>'+
    '<div class="eff">Упомянуто в заметках, своей записи ещё нет.</div></article>';
}
function viewCards(c,focusId){
  setTheme(c.theme);
  var inner;
  var gh=(GHOSTS[c.id]||[]).filter(function(n){return !LINKS[n];});
  if(!c.arr.length&&!gh.length) inner=emptyBox('Записей пока нет','Здесь появятся карточки с полным текстом — чтобы читать за столом одним экраном.');
  else{
    var groups={},order=[];
    c.arr.forEach(function(x){var g=c.group?(x[c.group]||'Прочее'):'';if(!groups[g]){groups[g]=[];order.push(g);}groups[g].push(x);});
    inner=order.map(function(g){
      var list=groups[g].slice().sort(function(a,b){return (a.lvl||0)-(b.lvl||0);});
      return (g?'<div class="sec-head" style="margin:34px 0 14px"><h3>'+esc(g)+'</h3><span class="eyebrow">'+list.length+'</span></div>':'')+
        '<div class="grid">'+list.map(function(x){return fullCard(c,x);}).join('')+'</div>';}).join('');
    if(gh.length){inner+='<div class="grid">'+gh.map(function(n){return ghostFullCard(c,n);}).join('')+'</div>'+
      '<p class="hint">Пунктирные карточки — упомянуты в заметках, но своей записи ещё нет.</p>';}
  }
  listShell(c,inner);
  if(focusId){var el=document.getElementById('c-'+c.route+'-'+focusId);
    if(el) requestAnimationFrame(function(){el.scrollIntoView({block:'center',behavior:'smooth'});el.classList.add('flash');});}
}

/* ================= ЧЛЕНСТВО И ПОЛИТИКА ================= */
function membersOf(field,x){var names=[x.name].concat(x.aliases||[]);
  return allPeople().filter(function(p){return names.indexOf(p[field])>-1;});}
function personHref(p){return PCS.indexOf(p)>-1?'#/pc/'+p.id:'#/person/'+p.id;}
function personSub(p){return '<a class="subcard" href="'+personHref(p)+'" style="--c:'+(p.acc||'var(--acc)')+'">'+
  '<span class="k">'+(PCS.indexOf(p)>-1?'персонаж игрока':'личность')+(p.dead?' · ✝':'')+'</span><h4>'+esc(p.name)+'</h4>'+
  '<div class="ds">'+esc([p.clan,p.sect,p.role].filter(Boolean).join(' · ')||p.short||'')+'</div></a>';}
function politicsHtml(x){
  var n=x.name,out='';
  var bonds=BONDS.filter(function(b){return same(b.thrall,n)||same(b.regnant,n);});
  var boons=BOONS.filter(function(b){return same(b.debtor,n)||same(b.creditor,n);});
  var rel=RELATIONS.filter(function(r){return same(r.a,n)||same(r.b,n);});
  var sire=x.sire, childer=allPeople().filter(function(p){return same(p.sire,n);});
  var rows=[];
  if(sire) rows.push('<li>Сир: '+nameLink(sire)+'</li>');
  if(childer.length) rows.push('<li>Потомки: '+childer.map(function(p){return nameLink(p.name);}).join(', ')+'</li>');
  bonds.forEach(function(b){rows.push('<li>Кровные узы '+dots(b.level,3)+': '+nameLink(b.thrall)+' → '+nameLink(b.regnant)+(b.note?' — '+inl(b.note):'')+'</li>');});
  boons.forEach(function(b){var L=BOON_LEVELS[b.level]||['?',''];
    rows.push('<li>'+L[0]+' долг ('+(BOON_STATUS[b.status]||b.status)+'): '+nameLink(b.debtor)+' должен '+nameLink(b.creditor)+(b.why?' — '+inl(b.why):'')+'</li>');});
  rel.forEach(function(r){var T=REL_TYPES[r.type]||REL_TYPES.other;
    rows.push('<li><span style="color:'+T[1]+'">'+T[0]+'</span>: '+nameLink(same(r.a,n)?r.b:r.a)+(r.note?' — '+inl(r.note):'')+'</li>');});
  if(x.status) Object.keys(x.status).forEach(function(s){rows.push('<li>Статус ('+esc(s)+'): '+dots(statusNow(n,s,x.status[s]))+'</li>');});
  if(rows.length) out=section('Положение среди Сородичей',rows.length,'<div class="panel"><ul>'+rows.join('')+'</ul></div>');
  return out;
}

/* ================= СТРАНИЦА ЗАПИСИ (общая) ================= */
function viewEntry(c,id){
  var x=findIn(c.arr,id);
  if(!x){location.hash='#/cat/'+c.id;return;}
  if(c.kind==='cards'){viewCards(c,id);return;}
  setTheme(c.theme,x.acc);
  crumb([[c.name,'#/cat/'+c.id],[x.name]]);
  var eyebrow='запись '+numOf(c.arr,x)+' · '+esc(c.name.toLowerCase());
  var strip=[],mid='',top='';
  if(c.id==='clans'){
    strip=[['Дисциплины',(x.disciplines||[]).map(function(d){return wikiTag(d,esc(d));}).join(' '),1]];
    var pan='';
    if(x.bane) pan+='<div class="panel"><h4>Проклятие</h4>'+md(x.bane)+'</div>';
    if(x.compulsion) pan+='<div class="panel"><h4>Одержимость'+(x.compulsion.name?': '+esc(x.compulsion.name):'')+'</h4>'+md(x.compulsion.text||'')+'</div>';
    if(pan) mid+=section('Кровь клана','',pan);
    var mem=membersOf('clan',x);
    mid+=section('В городе',mem.length,mem.length?'<div class="subgrid">'+mem.map(personSub).join('')+'</div>'
      :emptyBox('Никого не записано','Члены клана, известные котерии, появятся здесь.'));
  }
  if(c.id==='disciplines'){
    strip=[['Тип',x.kind],['Резонанс',x.resonance],['Угроза Маскараду',x.threat]];
    var lv={};(x.powers||[]).forEach(function(p){(lv[p.lvl]=lv[p.lvl]||[]).push(p);});
    var inner=Object.keys(lv).sort().map(function(l){
      return '<div class="sec-head" style="margin:30px 0 12px"><h3>Уровень '+l+'</h3><span class="eyebrow">'+dots(+l)+'</span></div>'+
        '<div class="grid">'+lv[l].map(function(p){
          var par=[['Цена',p.cost],['Пул',p.pool],['Длительность',p.dur],['Амальгама',p.amalgam]].filter(function(q){return q[1];});
          return '<article class="card"><span class="tag">ур. '+p.lvl+'</span><h4>'+esc(p.name)+'</h4>'+
            (par.length?'<dl class="par">'+par.map(function(q){return '<dt>'+q[0]+'</dt><dd>'+inl(q[1])+'</dd>';}).join('')+'</dl>':'')+
            '<div class="eff">'+md(p.text||'')+'</div></article>';}).join('')+'</div>';}).join('');
    mid+=section('Силы',(x.powers||[]).length,inner||emptyBox('Сил пока нет','Силы появятся здесь, разложенные по уровням.'));
  }
  if(c.id==='loresheets'){
    mid+=section('Ступени',(x.levels||[]).length,(x.levels||[]).length?'<div class="grid">'+x.levels.map(function(l){
      return '<article class="card"><span class="tag">'+dots(l[0])+'</span><h4>'+esc(l[1])+'</h4><div class="eff">'+md(l[2]||'')+'</div></article>';}).join('')+'</div>'
      :emptyBox('Ступеней пока нет','Ступени лоршита появятся здесь.'));
  }
  if(c.id==='sects'){
    var cm=membersOf('sect',x),seats=courtOf(x.name);
    if(seats) mid+=section('Посты при Дворе','',courtHtml(seats));
    mid+=section('Члены',cm.length,cm.length?'<div class="subgrid">'+cm.map(personSub).join('')+'</div>'
      :emptyBox('Никого не записано','Известные члены секты появятся здесь.'));
  }
  if(c.id==='people'){
    strip=[['Клан',x.clan?wikiTag(x.clan,esc(x.clan)):'',1],['Секта',x.sect?wikiTag(x.sect,esc(x.sect)):'',1],['Поколение',x.gen],
      ['Мощь крови',x.bp],['Роль',x.role],['Сир',x.sire?nameLink(x.sire):'',1]];
    if(x.track) top+=section('Трекеры','сохраняются в браузере',trackerHtml(x));
    mid+=politicsHtml(x);
  }
  if(c.id==='places'){
    var anc=[],p=x;while(p.parent){p=findIn(PLACES,p.parent);if(!p)break;anc.unshift(p);}
    top+='<div class="chain"><span class="l">вложенность</span><a href="#/cat/places">Локации</a><span class="sep">›</span>'+
      anc.map(function(a){return '<a href="#/place/'+a.id+'">'+esc(a.name)+'</a><span class="sep">›</span>';}).join('')+
      '<span class="cur">'+esc(x.name)+'</span></div>';
    var dm=x.domain?findIn(DOMAINS,x.domain):null;
    if(dm) strip=[['Домен','<a class="wiki" href="#/domain/'+dm.id+'">'+esc(dm.name)+'</a>',1]];
    var kids=PLACES.filter(function(k){return k.parent===x.id;}),gh=x.ghosts||[];
    if(kids.length||gh.length) mid+=section('Вложенные локации',kids.length+gh.length,'<div class="subgrid">'+
      kids.map(function(k){return '<a class="subcard" href="#/place/'+k.id+'" style="--c:'+(k.acc||c.c)+'"><span class="k">подзона</span><h4>'+esc(k.name)+'</h4><div class="ds">'+inl(k.short||'')+'</div></a>';}).join('')+
      gh.map(function(g){return '<div class="subcard ghost"><span class="k">заметки нет</span><h4>'+esc(g)+'</h4></div>';}).join('')+'</div>');
  }
  if(c.id==='domains'){
    var K=DOMAIN_KINDS[x.kind]||['—','#888'];
    strip=[['Тип','<span style="color:'+K[1]+'">'+K[0]+'</span>',1],['Держатель',x.holder?nameLink(x.holder):'',1],
      ['Угроза Маскараду',x.threat!=null?dots(x.threat):'',1]];
    var inPl=PLACES.filter(function(p){return p.domain===x.id;});
    if(inPl.length) mid+=section('Локации домена',inPl.length,'<div class="subgrid">'+inPl.map(function(k){
      return '<a class="subcard" href="#/place/'+k.id+'"><span class="k">локация</span><h4>'+esc(k.name)+'</h4><div class="ds">'+inl(k.short||'')+'</div></a>';}).join('')+'</div>');
  }
  if(c.id==='threats'){
    strip=[['Вид',x.kind]].concat(x.stat||[]);
    if(x.track) top+=section('Трекеры','сохраняются в браузере',trackerHtml(x));
  }
  app.innerHTML='<div class="wrap rise"><a class="back" href="#/cat/'+c.id+'">← '+esc(c.name.toLowerCase())+'</a>'+
    (c.id==='places'?top:'')+jcard(x,eyebrow,strip)+(c.id!=='places'?top:'')+mid+commonTail(x)+'<div style="height:30px"></div></div>';
  wireTrackers(app);
}

/* ================= КОТЕРИЯ ================= */
function pcsOf(pid){return PCS.filter(function(x){return x.player===pid;});}
function viewPlayers(){
  var c=catById('players');setTheme('player');
  var cards=PLAYERS.map(function(pl){var list=pcsOf(pl.id);
    return '<a class="god-card" href="#/player/'+pl.id+'" style="--c:'+(pl.acc||c.c)+'"><span class="k">'+numOf(PLAYERS,pl)+' · ИГРОК</span>'+
      '<h3>'+esc(pl.name)+'</h3><p class="pr">'+inl(pl.short||'')+'</p><div class="foot">'+
      '<span class="chip hot">'+list.length+' '+plural(list.length,'персонаж','персонажа','персонажей')+'</span>'+
      list.map(function(x){return '<span class="chip">'+(x.dead?'✝ ':'')+esc(x.name)+'</span>';}).join('')+'</div></a>';}).join('');
  var orphans=PCS.filter(function(x){return !findIn(PLAYERS,x.player);});
  var inner=PLAYERS.length||PCS.length?'<div class="gods">'+cards+'</div>'+
    (orphans.length?'<div class="sec-head" style="margin:34px 0 14px"><h3>Без игрока</h3></div><div class="subgrid">'+orphans.map(personSub).join('')+'</div>':'')
    :emptyBox('Котерия ещё не собрана','Здесь появятся игроки и их персонажи — у каждого персонажа будет страница с трекерами.');
  listShell(c,inner,PLAYERS.length);
}
function viewPlayer(id){
  var pl=findIn(PLAYERS,id);if(!pl){location.hash='#/cat/players';return;}
  setTheme('player',pl.acc);crumb([['Котерия','#/cat/players'],[pl.name]]);
  var list=pcsOf(pl.id);
  app.innerHTML='<div class="wrap rise"><a class="back" href="#/cat/players">← котерия</a>'+
    jcard({name:pl.name,short:pl.note||pl.short},'игрок '+numOf(PLAYERS,pl))+
    section('Персонажи',list.length,list.length?'<div class="subgrid">'+list.map(personSub).join('')+'</div>':emptyBox('Персонажей пока нет','Персонажи игрока появятся здесь.'))+'</div>';
}
function viewPC(id){
  var x=findIn(PCS,id);if(!x){location.hash='#/cat/players';return;}
  var pl=findIn(PLAYERS,x.player);
  setTheme('player',x.acc);crumb([['Котерия','#/cat/players']].concat(pl?[[pl.name,'#/player/'+pl.id]]:[]).concat([[x.name]]));
  var chain='<div class="chain"><span class="l">котерия</span><a href="#/cat/players">Игроки</a><span class="sep">›</span>'+
    (pl?'<a href="#/player/'+pl.id+'">'+esc(pl.name)+'</a><span class="sep">›</span>':'')+'<span class="cur">'+esc(x.name)+'</span></div>';
  var strip=[['Клан',x.clan?wikiTag(x.clan,esc(x.clan)):'',1],['Секта',x.sect?wikiTag(x.sect,esc(x.sect)):'',1],
    ['Поколение',x.gen],['Мощь крови',x.bp!=null?String(x.bp):''],['Тип хищника',x.predator?wikiTag(x.predator,esc(x.predator)):'',1],
    ['Сир',x.sire?nameLink(x.sire):'',1]];
  var out='<div class="wrap rise"><a class="back" href="'+(pl?'#/player/'+pl.id:'#/cat/players')+'">← '+(pl?esc(pl.name.toLowerCase()):'котерия')+'</a>'+chain+
    jcard(x,'персонаж игрока'+(pl?' · '+esc(pl.name):''),strip)+
    section('Трекеры','сохраняются в браузере',trackerHtml(x));
  if(x.disciplines&&x.disciplines.length) out+=section('Дисциплины',x.disciplines.length,'<div class="defs">'+x.disciplines.map(function(d){
    return '<div class="def"><span class="l">'+wikiTag(d[0],esc(d[0]))+'</span><div class="v">'+dots(d[1])+'</div></div>';}).join('')+'</div>');
  if(x.convictions&&x.convictions.length) out+=section('Убеждения и Якоря',x.convictions.length,tableHtml({head:['Убеждение','Якорь'],
    rows:x.convictions.map(function(v){return [v[0],v[1]?'[['+v[1]+']]':'—'];})}));
  out+=politicsHtml(x)+commonTail(x);
  app.innerHTML=out+'<div style="height:30px"></div></div>';
  wireTrackers(app);
}

/* ================= ЛОКАЦИИ: ДЕРЕВО ================= */
function viewPlaces(){
  var c=catById('places');
  function row(p){return '<a class="lrow" href="#/place/'+p.id+'" style="--c:'+(p.acc||c.c)+'"><span class="nm">'+esc(p.name)+'</span>'+
    '<span class="ds">'+inl(p.short||'')+'</span><span class="meta"><span class="chip hot">'+
    (PLACES.filter(function(k){return k.parent===p.id;}).length+(p.ghosts||[]).length)+' подзон</span></span></a>';}
  function branch(p){var kids=PLACES.filter(function(k){return k.parent===p.id;}),gh=p.ghosts||[];
    return '<li>'+row(p)+(kids.length||gh.length?'<ul>'+kids.map(branch).join('')+gh.map(function(g){
      return '<li><div class="lrow ghost"><span class="nm">'+esc(g)+'</span><span class="ds">заметки нет</span></div></li>';}).join('')+'</ul>':'')+'</li>';}
  var roots=PLACES.filter(function(x){return !x.parent||!findIn(PLACES,x.parent);});
  var topGh=(GHOSTS.places||[]).filter(function(g){return !LINKS[g];});
  var topGhRows=topGh.map(function(g){return '<li><div class="lrow ghost"><span class="nm">'+esc(g)+'</span><span class="ds">заметки нет</span></div></li>';}).join('');
  listShell(c,(roots.length||topGh.length)?'<ul class="ltree">'+roots.map(branch).join('')+topGhRows+'</ul><p class="hint">Пунктиром — зоны и места без собственной заметки.</p>'
    :emptyBox('Локаций пока нет','Здесь вырастет дерево мест хроники: от района до отдельной комнаты.'));
}

/* ================= ДОМЕНЫ: КАРТА ================= */
function viewDomains(){
  var c=catById('domains');

/* ================= ТРЕКЕРЫ ПЕРСОНАЖЕЙ ================= */
var TRK_OBJ={};
function trkKey(x){return (PCS.indexOf(x)>-1?'pc:':PEOPLE.indexOf(x)>-1?'person:':'threat:')+x.id;}
function trkDefault(x){var t=x.track||{};
  return {hunger:t.hunger!=null?t.hunger:1,hMax:t.healthMax||7,hSup:0,hAgg:0,wMax:t.wpMax||5,wSup:0,wAgg:0,
    hum:t.humanity!=null?t.humanity:7,stains:0};}
function trkGet(key){var x=TRK_OBJ[key];if(!x)return null;
  var d=trkDefault(x),s=STORE.get('trk:'+key,null);
  if(s){for(var k in d) if(s[k]!=null) d[k]=s[k];}
  d.hMax=(x.track&&x.track.healthMax)||d.hMax;d.wMax=(x.track&&x.track.wpMax)||d.wMax;
  return d;}
function trkSet(key,st){
  st.hunger=Math.max(0,Math.min(5,st.hunger));st.hum=Math.max(0,Math.min(10,st.hum));st.stains=Math.max(0,Math.min(10,st.stains));
  ['h','w'].forEach(function(p){var mx=st[p+'Max'];st[p+'Agg']=Math.max(0,Math.min(mx,st[p+'Agg']));st[p+'Sup']=Math.max(0,Math.min(mx-st[p+'Agg'],st[p+'Sup']));});
  STORE.set('trk:'+key,st);refreshTrackers(key);}
function damage(st,p,kind,sign){
  var mx=st[p+'Max'];
  if(sign<0){if(kind==='s')st[p+'Sup']--;else st[p+'Agg']--;return;}
  var free=mx-st[p+'Sup']-st[p+'Agg'];
  if(kind==='s'){if(free>0)st[p+'Sup']++;else if(st[p+'Sup']>0){st[p+'Sup']--;st[p+'Agg']++;}}
  else{if(free>0)st[p+'Agg']++;else if(st[p+'Sup']>0){st[p+'Sup']--;st[p+'Agg']++;}}
}
function boxes(max,agg,sup){var s='';for(var i=0;i<max;i++){
  var c=i<agg?'a':i<agg+sup?'s':'';s+='<span class="box '+c+'" style="display:inline-grid;place-items:center;cursor:default">'+(c==='a'?'✕':c==='s'?'╱':'')+'</span>';}return s;}
function trkInner(key){
  var st=trkGet(key);if(!st)return '';
  var hFull=st.hSup+st.hAgg>=st.hMax,wFull=st.wSup+st.wAgg>=st.wMax;
  var pips='';for(var i=1;i<=5;i++) pips+='<button class="pip'+(i<=st.hunger?' on':'')+'" type="button" data-act="hun" data-v="'+i+'" title="Голод '+i+'"></button>';
  var hum='';for(var j=0;j<10;j++){var filled=j<st.hum,stn=j>=10-st.stains;
    hum+='<span class="box'+(filled?' h':'')+(stn?' st':'')+'" style="display:inline-grid;place-items:center;cursor:default">'+(stn?'╱':'')+'</span>';}
  var remorseDice=Math.max(1,10-st.hum-st.stains);
  return '<div class="trk">'+
   '<div class="tbox"><div class="th"><b>Голод</b><span class="val">'+st.hunger+'</span></div><div class="pips">'+pips+'</div>'+
     '<div class="ctl"><button class="mini" data-act="hun0">сбросить в 0</button><button class="mini pri" data-act="rouse">Пробуждение</button></div>'+
     (st.hunger>=5?'<div class="warn">Голод 5: проверки пробуждения невозможны, Зверь у самой поверхности.</div>':'')+'</div>'+
   '<div class="tbox"><div class="th"><b>Здоровье</b><span class="val">'+(st.hMax-st.hSup-st.hAgg)+'/'+st.hMax+'</span></div><div class="pips">'+boxes(st.hMax,st.hAgg,st.hSup)+'</div>'+
     '<div class="ctl"><button class="mini" data-act="d" data-p="h" data-k="s">+ ╱</button><button class="mini" data-act="d" data-p="h" data-k="a">+ ✕</button>'+
     '<button class="mini" data-act="h" data-p="h" data-k="s">− ╱</button><button class="mini" data-act="h" data-p="h" data-k="a">− ✕</button></div>'+
     (st.hAgg>=st.hMax?'<div class="warn">Все клетки тяжёлые: торпор (или окончательная смерть).</div>':hFull?'<div class="warn">Ослаблен: −2 к физическим пулам.</div>':'')+'</div>'+
   '<div class="tbox"><div class="th"><b>Сила воли</b><span class="val">'+(st.wMax-st.wSup-st.wAgg)+'/'+st.wMax+'</span></div><div class="pips">'+boxes(st.wMax,st.wAgg,st.wSup)+'</div>'+
     '<div class="ctl"><button class="mini" data-act="d" data-p="w" data-k="s">+ ╱</button><button class="mini" data-act="d" data-p="w" data-k="a">+ ✕</button>'+
     '<button class="mini" data-act="h" data-p="w" data-k="s">− ╱</button><button class="mini" data-act="h" data-p="w" data-k="a">− ✕</button></div>'+
     (wFull?'<div class="warn">Ослаблен: −2 к социальным и ментальным пулам.</div>':'')+'</div>'+
   '<div class="tbox"><div class="th"><b>Человечность</b><span class="val">'+st.hum+'</span></div><div class="pips">'+hum+'</div>'+
     '<div class="ctl"><button class="mini" data-act="hum" data-v="-1">− Чел.</button><button class="mini" data-act="hum" data-v="1">+ Чел.</button>'+
     '<button class="mini" data-act="stn" data-v="1">+ Скверна</button><button class="mini" data-act="stn" data-v="-1">− Скверна</button>'+
     '<button class="mini pri" data-act="remorse" title="Кубов: '+remorseDice+'">Раскаяние ('+remorseDice+'к)</button></div>'+
     (st.stains>10-st.hum?'<div class="warn">Скверна залезла на Человечность: персонаж ослаблен, деградация.</div>':'')+
     '<div class="tsub">Проверка раскаяния — в конце сессии, если есть Скверна.</div></div>'+
   '</div><div class="ctl" style="margin-top:8px"><button class="mini" data-act="reset" title="Вернуть стартовые значения персонажа">Сброс к стартовым</button></div>';
}
function trackerHtml(x){var key=trkKey(x);TRK_OBJ[key]=x;return '<div class="trkwrap" data-trk="'+key+'">'+trkInner(key)+'</div>';}
function refreshTrackers(key){
  [].forEach.call(document.querySelectorAll('[data-trk="'+key+'"]'),function(el){el.innerHTML=trkInner(key);});
  [].forEach.call(document.querySelectorAll('[data-mini="'+key+'"]'),function(el){el.innerHTML=miniPips(key);});
  if(dkPc&&dkPc.value===key) dkHun.value=trkGet(key).hunger;
}
function remorse(key){
  var x=TRK_OBJ[key],st=trkGet(key);
  if(!st.stains){pushLog('Раскаяние · '+x.name,'Скверны нет — проверка не нужна','—','');return;}
  var n=Math.max(1,10-st.hum-st.stains),r=[],ok=false;
  for(var i=0;i<n;i++){var v=d(10);r.push(v);if(v>=6)ok=true;}
  if(ok){st.stains=0;}else{st.hum-=1;st.stains=0;}
  trkSet(key,st);
  pushLog('Раскаяние · '+x.name,'['+r.join(' ')+']',ok?'Сохранил':'−1 Чел.',ok?'ok':'no');
  openDock();
}
function onTrk(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var w=b.closest('[data-trk],[data-mini]');if(!w)return;
  var key=w.getAttribute('data-trk')||w.getAttribute('data-mini'),st=trkGet(key),a=b.getAttribute('data-act'),v=+b.getAttribute('data-v');
  if(a==='hun'){st.hunger=(st.hunger===v)?v-1:v;}
  else if(a==='hun0') st.hunger=0;
  else if(a==='d') damage(st,b.getAttribute('data-p'),b.getAttribute('data-k'),1);
  else if(a==='h') damage(st,b.getAttribute('data-p'),b.getAttribute('data-k'),-1);
  else if(a==='hum') st.hum+=v;
  else if(a==='stn') st.stains+=v;
  else if(a==='remorse'){remorse(key);return;}
  else if(a==='rouse'){rouseFor(key,false);return;}
  else if(a==='reset'){STORE.del('trk:'+key);refreshTrackers(key);return;}
  else return;
  trkSet(key,st);
}
function wireTrackers(){}  /* делегирование висит на document — см. initDock() */
function miniPips(key){var st=trkGet(key),s='';
  for(var i=1;i<=5;i++) s+='<button class="pip'+(i<=st.hunger?' on':'')+'" type="button" data-act="hun" data-v="'+i+'"></button>';
  return '<div class="pips">'+s+'</div>';}

/* ================= КОСТИ V5 ================= */
function d(n){return 1+Math.floor(Math.random()*n);}
var LOG=[],LAST=null,dock,dkPc,dkHun,dkPool,dkDif,dkOut,dkLog,dkWp;
function pushLog(label,detailText,total,cls){
  LOG.unshift({l:label,d:detailText,t:total,c:cls||''});if(LOG.length>40)LOG.pop();
  dkLog.innerHTML=LOG.slice(0,20).map(function(e){return '<li><span class="f">'+esc(e.l)+' · '+esc(e.d)+'</span><span class="t '+e.c+'">'+esc(String(e.t))+'</span></li>';}).join('');
  document.getElementById('dkLast').textContent=label+' → '+total;
}
function openDock(){dock.classList.remove('min');document.getElementById('dkHint').textContent='свернуть';}
function evalPool(r){
  var succ=0,tens=0,hTen=false,hOne=false;
  r.dice.forEach(function(x){if(x.v>=6)succ++;if(x.v===10){tens++;if(x.h)hTen=true;}if(x.h&&x.v===1)hOne=true;});
  var pairs=Math.floor(tens/2);succ+=pairs*2;
  var crit=pairs>0,messy=crit&&hTen,D=r.dif,v={succ:succ,crit:crit,messy:messy,hOne:hOne};
  if(D>0){
    var win=succ>=D;v.cls=win?(messy?'messy':'win'):(hOne?'bestial':'fail');
    v.title=win?(messy?'Грязный крит':crit?'Критический успех':'Успех'):(hOne?'Звериный провал':succ===0?'Полный провал':'Провал');
    v.text=succ+' усп. против сложности '+D+(win?' · перевес '+(succ-D):' · не хватило '+(D-succ));
    if(win&&messy) v.text+=' · успех, но Зверь берёт своё: одержимость или последствия по решению рассказчика';
    if(!win&&hOne) v.text+=' · провал с участием Зверя: одержимость или иная беда';
  }else{
    v.cls=messy?'messy':'win';v.title=succ+' '+plural(succ,'успех','успеха','успехов');
    var f=[];if(crit)f.push(messy?'грязный крит (если бросок успешен)':'критический успех (если бросок успешен)');
    if(hOne)f.push('звериный провал, если бросок провален');if(!succ)f.push('ни одного успеха');
    v.text=f.join(' · ')||'сложность не задана — сравните с ней сами';
  }
  return v;
}
function renderRoll(){
  var r=LAST,v=evalPool(r);
  dkOut.innerHTML='<div class="dice">'+r.dice.map(function(x,i){
    var c='die'+(x.h?' h':'')+(x.v>=6?' succ':'')+(x.v===10?' ten':'')+(x.h&&x.v===1?' one':'')+(x.sel?' sel':'')+(x.rr?' rr':'');
    return '<button type="button" class="'+c+'" data-i="'+i+'" title="'+(x.h?'кость Голода':'обычная кость')+'">'+x.v+'</button>';}).join('')+'</div>'+
    '<div class="verdict '+v.cls+'"><h5>'+v.title+'</h5>'+esc(v.text)+'</div>';
  dkWp.disabled=r.wpUsed||!r.dice.some(function(x){return !x.h;});
  return v;
}
function rollPool(pool,hunger,dif,label){
  pool=Math.max(1,Math.min(30,+pool||1));hunger=Math.max(0,Math.min(5,+hunger||0));
  var h=Math.min(hunger,pool),dice=[];
  for(var i=0;i<pool;i++) dice.push({v:d(10),h:i>=pool-h});
  LAST={dice:dice,dif:+dif||0,pool:pool,hunger:h,wpUsed:false,label:label||'Пул '+pool};
  var v=renderRoll();
  pushLog(LAST.label+' · Голод '+h+(LAST.dif?' · сл. '+LAST.dif:''),dice.map(function(x){return (x.h?'h':'')+x.v;}).join(' '),v.title,
    v.cls==='win'?'ok':(v.cls==='fail'||v.cls==='bestial')?'no':'');
  openDock();
}
function wpReroll(){
  if(!LAST||LAST.wpUsed)return;
  var sel=LAST.dice.filter(function(x){return x.sel&&!x.h;});
  if(!sel.length) sel=LAST.dice.filter(function(x){return !x.h&&x.v<6;}).slice(0,3);
  if(!sel.length){pushLog('Переброс СВ','нечего перебрасывать — провалов на обычных костях нет','—');return;}
  LAST.dice.forEach(function(x){x.rr=false;});
  sel.slice(0,3).forEach(function(x){x.v=d(10);x.sel=false;x.rr=true;});
  LAST.wpUsed=true;
  var key=dkPc.value;if(key&&TRK_OBJ[key]){var st=trkGet(key);damage(st,'w','s',1);trkSet(key,st);}
  var v=renderRoll();
  pushLog('Переброс СВ ('+sel.length+')'+(key&&TRK_OBJ[key]?' · −1 СВ '+TRK_OBJ[key].name:''),LAST.dice.map(function(x){return (x.h?'h':'')+x.v;}).join(' '),v.title,
    v.cls==='win'?'ok':(v.cls==='fail'||v.cls==='bestial')?'no':'');
}
function rouseFor(key,twice){
  var x=key?TRK_OBJ[key]:null,st=x?trkGet(key):null;
  if(st&&st.hunger>=5){pushLog('Пробуждение · '+x.name,'Голод 5 — проверка невозможна','Голод 5','no');openDock();return;}
  var a=d(10),b=twice?d(10):null,ok=a>=6||(b!=null&&b>=6);
  if(st&&!ok){st.hunger+=1;trkSet(key,st);}
  pushLog('Пробуждение'+(twice?' с перебросом':'')+(x?' · '+x.name:''),'['+a+(b!=null?' / '+b:'')+']',ok?'Голод тот же':'+1 Голод',ok?'ok':'no');
  if(!x&&!ok){dkHun.value=Math.min(5,(+dkHun.value||0)+1);}
  openDock();
}

/* текстовые формулы → кнопки: «пул 6», «пул 6 / сл. 3», «проверка пробуждения», «2к10+1» */
var ROLL_RE=/(пул\s+(\d{1,2})(?:\s*[\/,;]\s*сл\.?\s*(\d{1,2}))?)|(проверк[аеуи]\s+пробуждения)|((\d{0,2})[кК](\d{1,3})(?:\s*([+−–-])\s*(\d{1,3}))?)/gi;
function activateRolls(root){
  var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),skip={BUTTON:1,SCRIPT:1,STYLE:1,A:1,TEXTAREA:1,INPUT:1,SELECT:1,OPTION:1},targets=[],node;
  while((node=walker.nextNode())){var par=node.parentNode;
    if(!par||skip[par.nodeName]||(par.closest&&par.closest('a,button,svg,.srch-res,.dock')))continue;
    ROLL_RE.lastIndex=0;if(ROLL_RE.test(node.nodeValue))targets.push(node);}
  targets.forEach(function(n){
    var txt=n.nodeValue,frag=document.createDocumentFragment(),last=0,m,made=0;ROLL_RE.lastIndex=0;
    while((m=ROLL_RE.exec(txt))){
      var prev=m.index>0?txt.charAt(m.index-1):'';
      if(/[0-9A-Za-zА-Яа-яЁё]/.test(prev))continue;
      var b=document.createElement('button');b.type='button';b.className='roll';b.textContent=m[0];
      if(m[1]){b.dataset.pool=m[2];if(m[3])b.dataset.dif=m[3];}
      else if(m[4]){b.dataset.rouse='1';}
      else{var sides=+m[7],cnt=m[6]?+m[6]:1;if([2,3,4,6,8,10,12,20,100].indexOf(sides)<0||cnt<1||cnt>30)continue;
        b.dataset.n=cnt;b.dataset.s=sides;b.dataset.m=m[9]?(m[8]==='+'?1:-1)*(+m[9]):0;}
      if(m.index>last)frag.appendChild(document.createTextNode(txt.slice(last,m.index)));
      frag.appendChild(b);last=m.index+m[0].length;made++;}
    if(!made)return;
    if(last<txt.length)frag.appendChild(document.createTextNode(txt.slice(last)));
    n.parentNode.replaceChild(frag,n);});
}
function onRollClick(e){
  var die=e.target.closest('.die');
  if(die&&LAST&&!LAST.wpUsed){var x=LAST.dice[+die.dataset.i];
    if(x&&!x.h){var n=LAST.dice.filter(function(y){return y.sel;}).length;if(x.sel||n<3)x.sel=!x.sel;renderRoll();}return;}
  var btn=e.target.closest('.roll');if(!btn)return;

  if(btn.dataset.pool){dkPool.value=btn.dataset.pool;dkDif.value=btn.dataset.dif||0;rollPool(dkPool.value,dkHun.value,dkDif.value,btn.textContent);return;}
  if(btn.dataset.rouse){rouseFor(dkPc.value||null,false);return;}
  var tot=0,rs=[];for(var i=0;i<+btn.dataset.n;i++){var v=d(+btn.dataset.s);rs.push(v);tot+=v;}tot+=+btn.dataset.m;
  var nx=btn.nextSibling;if(nx&&nx.nodeType===1&&nx.classList.contains('rollres'))nx.remove();

function sessRange(){var ns=SESSIONS.map(function(s){return s.n;});return ns.length?[Math.min.apply(null,ns),Math.max.apply(null,ns)]:null;}

function statusEvents(){var out=[];SESSIONS.forEach(function(s){s.items.forEach(function(it){
  if(it&&it.status) out.push({n:s.n,who:it.status.who,sect:it.status.sect||'',delta:+it.status.delta||0});});});return out;}
function statusNow(who,sect,base){var v=+base||0;statusEvents().forEach(function(e){if(same(e.who,who)&&e.sect===sect)v+=e.delta;});return Math.max(0,v);}
function statusSeries(){
  var keys={},order=[];
  function add(who,sect,base){var k=(hrefOf(who)||who)+'|'+sect;if(!keys[k]){keys[k]={who:who,sect:sect,base:+base||0};order.push(k);}}
  allPeople().forEach(function(p){if(p.status)Object.keys(p.status).forEach(function(s){add(p.name,s,p.status[s]);});});
  statusEvents().forEach(function(e){add(e.who,e.sect,0);});
  return order.map(function(k){return keys[k];});
}
var PAL=['#E0142F','#D4AF37','#8FB8DE','#B98CFF','#6FCF8E','#E0812E','#D1436A','#7FB5A8','#F2C14E','#9FB9D1'];
function lineChart(series,yLabel){
  var rg=sessRange();if(!rg||!series.length)return '';
  var W=900,H=280,L=46,Rr=20,T=20,B=40,n0=rg[0]-1,n1=rg[1];

  var mn=Math.min(0,Math.min.apply(null,all)),mx=Math.max(5,Math.max.apply(null,all));
  function X(n){return L+(n-n0)/Math.max(1,n1-n0)*(W-L-Rr);} function Y(v){return T+(mx-v)/Math.max(1,mx-mn)*(H-T-B);}
  var g='';for(var v=mn;v<=mx;v++) g+='<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="rgba(255,255,255,.07)"/><text x="'+(L-10)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="11" fill="#A38F8C" font-family="JetBrains Mono">'+v+'</text>';
  for(var n=n0;n<=n1;n++) g+='<text x="'+X(n)+'" y="'+(H-14)+'" text-anchor="middle" font-size="11" fill="#A38F8C" font-family="JetBrains Mono">'+(n===n0?'старт':'С'+n)+'</text>';
  series.forEach(function(s){g+='<polyline fill="none" stroke="'+s.color+'" stroke-width="2.5" points="'+s.pts.map(function(p){return X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1);}).join(' ')+'"/>'+
    s.pts.map(function(p){return '<circle cx="'+X(p[0]).toFixed(1)+'" cy="'+Y(p[1]).toFixed(1)+'" r="4" fill="'+s.color+'"><title>'+esc(s.name)+': '+p[1]+'</title></circle>';}).join('');});
  return '<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(yLabel)+'">'+g+'</svg><div class="legend">'+series.map(function(s){
    return '<span class="legend-item"><i style="background:'+s.color+'"></i>'+esc(s.name)+'<b>'+s.pts[s.pts.length-1][1]+'</b></span>';}).join('')+'</div></div>';

function statusChart(){
  var rg=sessRange();if(!rg)return '';
  var ser=statusSeries().map(function(s,i){var v=s.base,pts=[[rg[0]-1,v]];
    for(var n=rg[0];n<=rg[1];n++){statusEvents().forEach(function(e){if(e.n===n&&same(e.who,s.who)&&e.sect===s.sect)v+=e.delta;});pts.push([n,Math.max(0,v)]);}
    var sc=null;SECTS.forEach(function(x){if(x.name===s.sect&&x.acc)sc=x.acc;});
    return {name:s.who+(s.sect?' · '+s.sect:''),color:PAL[i%PAL.length]||sc,pts:pts};});

/* ================= ГРАФ СВЯЗЕЙ ================= */
function graphData(){
  var nodes={},list=[],edges=[];
  function node(n){var k=hrefOf(n)||n;if(!nodes[k]){var pc=PCS.some(function(p){return same(p.name,n);}),pe=PEOPLE.some(function(p){return same(p.name,n);});
    nodes[k]={id:k,name:n,href:hrefOf(n),kind:pc?'pc':pe?'person':'other'};list.push(nodes[k]);}return nodes[k];}
  function edge(a,b,type,note){if(!a||!b)return;edges.push({a:node(a),b:node(b),type:REL_TYPES[type]?type:'other',note:note||''});}
  RELATIONS.forEach(function(r){edge(r.a,r.b,r.type,r.note);});
  BONDS.forEach(function(b){edge(b.thrall,b.regnant,'bond','ступень '+b.level+(b.note?' · '+b.note:''));});
  BOONS.filter(function(b){return b.status==='open'||!b.status;}).forEach(function(b){edge(b.debtor,b.creditor,'debt',(BOON_LEVELS[b.level]||['долг'])[0]+' долг');});
  allPeople().forEach(function(p){if(p.sire)edge(p.sire,p.name,'sire','');});
  PCS.forEach(function(p){(p.convictions||[]).forEach(function(c){if(c[1])edge(p.name,c[1],'touch',c[0]);});});
  return {nodes:list,edges:edges};
}

function drawWeb(G){
  var W=1000,H=640,box=document.getElementById('web');
  var edges=G.edges.filter(function(e){return !WEB_OFF[e.type];});
  var N=G.nodes;N.forEach(function(n,i){var a=i/N.length*Math.PI*2;n.x=W/2+Math.cos(a)*220;n.y=H/2+Math.sin(a)*200;n.vx=0;n.vy=0;});
  for(var it=0;it<420;it++){
    for(var i=0;i<N.length;i++)for(var j=i+1;j<N.length;j++){var a=N[i],b=N[j],dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+.01,f=9000/d2,dd=Math.sqrt(d2);
      a.vx+=f*dx/dd;a.vy+=f*dy/dd;b.vx-=f*dx/dd;b.vy-=f*dy/dd;}
    edges.forEach(function(e){var dx=e.b.x-e.a.x,dy=e.b.y-e.a.y,dd=Math.sqrt(dx*dx+dy*dy)+.01,f=(dd-190)*.02;
      e.a.vx+=f*dx/dd;e.a.vy+=f*dy/dd;e.b.vx-=f*dx/dd;e.b.vy-=f*dy/dd;});
    N.forEach(function(n){n.vx+=(W/2-n.x)*.004;n.vy+=(H/2-n.y)*.004;n.x+=n.vx*.5;n.y+=n.vy*.5;n.vx*=.6;n.vy*=.6;
      n.x=Math.max(60,Math.min(W-60,n.x));n.y=Math.max(40,Math.min(H-40,n.y));});
  }
  var col={pc:'#E8B04B',person:'#D0243F',other:'#8FB8DE'};
  var defs='<defs>'+Object.keys(REL_TYPES).map(function(k){return '<marker id="ar-'+k+'" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="'+REL_TYPES[k][1]+'"/></marker>';}).join('')+'</defs>';
  var dir={bond:1,debt:1,sire:1,serve:1,touch:1};
  if(!WEB_VB) WEB_VB={x:0,y:0,w:W,h:H};
  var vb=WEB_VB;
  var s='<svg viewBox="'+vb.x.toFixed(1)+' '+vb.y.toFixed(1)+' '+vb.w.toFixed(1)+' '+vb.h.toFixed(1)+'">'+defs;
  var pairN={};edges.forEach(function(e){var k=[e.a.id,e.b.id].sort().join('~');e.k=pairN[k]=(pairN[k]||0)+1;e.flip=e.a.id>e.b.id;});
  edges.forEach(function(e,i){s+='<path class="edge" fill="none" data-e="'+i+'" stroke="'+REL_TYPES[e.type][1]+'" stroke-width="2.2"'+(dir[e.type]?' marker-end="url(#ar-'+e.type+')"':'')+
    (e.type==='touch'?' stroke-dasharray="5 5"':'')+'><title>'+esc(REL_TYPES[e.type][0]+(e.note?': '+e.note:''))+'</title></path>';});
  N.forEach(function(n,i){s+='<g class="node" data-n="'+i+'"><circle r="'+(n.kind==='other'?9:13)+'" fill="'+col[n.kind]+'" stroke="#000" stroke-width="2"/>'+
    '<text y="-18" text-anchor="middle">'+esc(n.name)+'</text></g>';});
  var zoomHtml='<div class="zoomctl"><button type="button" data-zoom="in" title="Приблизить" aria-label="Приблизить">+</button>'+
    '<button type="button" data-zoom="out" title="Отдалить" aria-label="Отдалить">−</button>'+
    '<button type="button" data-zoom="reset" class="rst" title="Сбросить масштаб" aria-label="Сбросить масштаб">1:1</button></div>';
  box.innerHTML=s+'</svg>'+zoomHtml;
  var svg=box.querySelector('svg'),lines=svg.querySelectorAll('.edge'),gs=svg.querySelectorAll('.node');
  function place(){edges.forEach(function(e,i){var dx=e.b.x-e.a.x,dy=e.b.y-e.a.y,L=Math.sqrt(dx*dx+dy*dy)||1,
      off=(e.k-1)*(e.k%2?1:-1)*0+(e.k===1?0:(e.k%2?1:-1)*Math.ceil((e.k-1)/2)*34)*(e.flip?-1:1),
      cx=(e.a.x+e.b.x)/2-dy/L*off,cy=(e.a.y+e.b.y)/2+dx/L*off;
    lines[i].setAttribute('d','M'+e.a.x.toFixed(1)+' '+e.a.y.toFixed(1)+'Q'+cx.toFixed(1)+' '+cy.toFixed(1)+' '+e.b.x.toFixed(1)+' '+e.b.y.toFixed(1));});
    N.forEach(function(n,i){gs[i].setAttribute('transform','translate('+n.x.toFixed(1)+','+n.y.toFixed(1)+')');});}
  place();
  function pt(ev){var p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
  /* Масштаб/панорама: viewBox — «камера» над неизменной сценой 1000×640,
     позиции узлов и путей не трогает. zoomAt держит точку (px,py) на месте
     под курсором/центром при изменении масштаба (как в картах). */
  function applyVB(){svg.setAttribute('viewBox',vb.x.toFixed(1)+' '+vb.y.toFixed(1)+' '+vb.w.toFixed(1)+' '+vb.h.toFixed(1));}
  function zoomAt(px,py,f){
    var nw=Math.max(140,Math.min(W,vb.w*f)),nh=nw*(H/W);
    var nx=px-(px-vb.x)*(nw/vb.w),ny=py-(py-vb.y)*(nh/vb.h),pad=60;
    vb.w=nw;vb.h=nh;
    vb.x=Math.max(-pad,Math.min(W-nw+pad,nx));
    vb.y=Math.max(-pad,Math.min(H-nh+pad,ny));
  }
  [].forEach.call(box.querySelectorAll('[data-zoom]'),function(b){b.addEventListener('click',function(ev){
    ev.preventDefault();var k=b.getAttribute('data-zoom');
    if(k==='reset'){vb.x=0;vb.y=0;vb.w=W;vb.h=H;}
    else zoomAt(vb.x+vb.w/2,vb.y+vb.h/2,k==='in'?1/1.4:1.4);
    applyVB();});});
  svg.addEventListener('wheel',function(ev){ev.preventDefault();var p=pt(ev);zoomAt(p.x,p.y,ev.deltaY<0?1/1.15:1.15);applyVB();},{passive:false});
  var drag=null,moved=false,pan=null;
  svg.addEventListener('pointerdown',function(ev){var g=ev.target.closest('.node');
    if(g){drag=N[+g.getAttribute('data-n')];moved=false;svg.setPointerCapture(ev.pointerId);return;}
    pan={cx:ev.clientX,cy:ev.clientY,vx:vb.x,vy:vb.y};moved=false;svg.setPointerCapture(ev.pointerId);});
  svg.addEventListener('pointermove',function(ev){
    if(drag){var p=pt(ev);drag.x=p.x;drag.y=p.y;moved=true;place();return;}
    if(pan){var rect=svg.getBoundingClientRect(),sx=vb.w/rect.width,sy=vb.h/rect.height,
        dx=(ev.clientX-pan.cx)*sx,dy=(ev.clientY-pan.cy)*sy,pad=60;
      if(Math.abs(ev.clientX-pan.cx)>2||Math.abs(ev.clientY-pan.cy)>2)moved=true;
      vb.x=Math.max(-pad,Math.min(W-vb.w+pad,pan.vx-dx));
      vb.y=Math.max(-pad,Math.min(H-vb.h+pad,pan.vy-dy));
      applyVB();return;}
    var g=ev.target.closest('.node');box.classList.toggle('hl',!!g);
    if(g){var n=N[+g.getAttribute('data-n')];[].forEach.call(gs,function(x,i){x.classList.toggle('on',N[i]===n||edges.some(function(e){return (e.a===n&&e.b===N[i])||(e.b===n&&e.a===N[i]);}));});
      [].forEach.call(lines,function(l,i){l.classList.toggle('on',edges[i].a===n||edges[i].b===n);});}});
  svg.addEventListener('pointerup',function(ev){var d0=drag;drag=null;pan=null;if(d0&&!moved&&d0.href)location.hash=d0.href;});
  svg.addEventListener('pointerleave',function(){box.classList.remove('hl');});
}

  '</div>'+
  '<section class="sec" id="world" style="padding-bottom:0"><div class="wrap">'+secHead(C.city||'Город','заглавная заметка')+world+'</div></section>'+
  '<section class="sec" id="cats"><div class="wrap">'+secHead('Разделы кодекса',CATS.length+' разделов · '+totalNotes()+' '+plural(totalNotes(),'запись','записи','записей'))+'<div class="cats">'+cats+'</div></div></section>'+
  '<section class="sec" id="tools" style="padding-top:0"><div class="wrap">'+secHead('Инструменты рассказчика',TOOLS.length+' инструментов')+'<div class="cats">'+tools+'</div></div></section>'+
  '<section class="sec cons" id="cons"><div class="wrap">'+secHead('Последствия',SESSIONS.length+' '+plural(SESSIONS.length,'сессия','сессии','сессий')+' в журнале')+
    '<p class="lede" style="margin:0 0 24px">Что котерия натворила и чем это обернулось. Эффекты событий сразу двигают Статус, Маскарад, долги и узы.</p>'+
    journalHtml()+
    (statusSeries().length&&SESSIONS.length?'<div class="sec-head" style="margin:34px 0 16px"><h3>Динамика Статуса</h3><span class="eyebrow">по сессиям</span></div>'+statusChart():'')+
  '</div></section>';
  document.getElementById('footL').textContent='Кодекс Ночи'+(C.title?' — '+C.title:'')+' · рабочая энциклопедия хроники';
  if(anchor){var el=document.getElementById(anchor);if(el)requestAnimationFrame(function(){el.scrollIntoView({block:'start',behavior:'smooth'});});}
}
function totalNotes(){var n=PCS.length;CATS.forEach(function(c){n+=c.arr.length;});return n;}

/* ================= ПАНЕЛЬ АКТИВНОЙ СЕССИИ ================= */
function tmin(s){var m=/^(\d{1,2}):(\d{2})$/.exec(s||'');return m?(+m[1])*60+(+m[2]):null;}
function fmtT(m){m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60);}
function nightState(){var N=ACTIVE_SESSION.night||{};var s=STORE.get('night',null)||{};
  return {sunset:s.sunset||N.sunset||'19:30',sunrise:s.sunrise||N.sunrise||'06:40',now:s.now||N.start||N.sunset||'21:00'};}
function nightHtml(){
  var n=nightState(),ss=tmin(n.sunset),sr=tmin(n.sunrise),nw=tmin(n.now);
  if(ss==null||sr==null||nw==null) return '<div class="warn">Время в формате ЧЧ:ММ</div>';
  var total=(sr-ss+1440)%1440||1440,el=(nw-ss+1440)%1440;if(el>total)el=total;
  var left=total-el,h=Math.floor(left/60),m=left%60;
  return '<div class="dawn-big'+(left<=60?' urgent':'')+'">'+(left<=0?'Рассвет':h+' ч '+pad(m)+' мин')+'</div>'+
    '<div class="tsub">'+(left<=0?'солнце встаёт — в убежище!':'до рассвета · сейчас '+fmtT(nw))+'</div>'+
    '<div class="dawn-bar"><i style="width:'+(el/total*100).toFixed(1)+'%"></i></div>'+
    '<div class="ctl" style="display:flex;gap:6px;flex-wrap:wrap"><button class="mini" data-nt="-15">−15 м</button><button class="mini" data-nt="15">+15 м</button>'+
    '<button class="mini" data-nt="30">+ сцена 30 м</button><button class="mini pri" data-nt="60">+1 ч</button></div>'+
    '<div class="times"><label>Закат<input type="time" data-nf="sunset" value="'+n.sunset+'"></label><label>Рассвет<input type="time" data-nf="sunrise" value="'+n.sunrise+'"></label>'+
    '<label>Сейчас<input type="time" data-nf="now" value="'+n.now+'"></label></div>';
}
function orderState(){return STORE.get('order',null)||{list:[],cur:0,round:1};}
function orderHtml(){
  var o=orderState();
  return '<div class="tsub">Раунд '+o.round+(o.list.length?' · ходит: <b style="color:var(--acc)">'+esc((o.list[o.cur]||{}).n||'')+'</b>':'')+'</div>'+
    '<ul class="order">'+o.list.map(function(x,i){return '<li class="'+(i===o.cur?'cur':'')+'"><span class="v">'+esc(x.v)+'</span><span class="nm">'+esc(x.n)+'</span><button data-od="'+i+'" title="Убрать">✕</button></li>';}).join('')+'</ul>'+
    '<div class="addrow"><input id="odN" placeholder="Имя"><input id="odV" class="sm" type="number" placeholder="№"><button class="mini" data-oa="add">+</button></div>'+
    '<div class="ctl" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><button class="mini pri" data-oa="next">Следующий ход</button><button class="mini" data-oa="sort">Сортировать</button>'+
    (PCS.length?'<button class="mini" data-oa="coterie">+ котерия</button>':'')+'<button class="mini" data-oa="clear">Очистить</button></div>'+
    '<div class="tsub">В V5 нет броска инициативы: порядок задаёт рассказчик (обычно по пулу действия или Сообразительности + Бдительности).</div>';
}
function sessFlow(nodes){return '<ul class="sflow">'+nodes.map(function(n){return '<li><span class="nd'+(n.cls?' '+n.cls:'')+'">'+md(n.t)+'</span>'+(n.kids?sessFlow(n.kids):'')+'</li>';}).join('')+'</ul>';}
function renderSession(){
  var S=ACTIVE_SESSION||{},filled=!!(S.n||(S.flow&&S.flow.length));
  document.getElementById('sessTitle').innerHTML=filled?'Сессия '+(S.n||'')+(S.name?' — '+(S.place?'<a href="'+esc(S.place)+'" style="color:var(--acc);text-decoration:none">'+esc(S.name)+'</a>':esc(S.name)):'')
    :'План не задан';
  document.getElementById('sessSub').textContent=filled?(S.sub||''):'Инструменты ночи работают и без плана';
  var h='<details class="sess-sec" open><summary>Ночь · до рассвета</summary><div class="in" id="nightBox">'+nightHtml()+'</div></details>';
  if(PCS.length) h+='<details class="sess-sec" open><summary>Голод котерии</summary><div class="in">'+PCS.map(function(x){var k=trkKey(x);TRK_OBJ[k]=x;
    return '<div class="coterie-row"><a class="nm" href="#/pc/'+x.id+'">'+esc(x.name)+'</a><div data-mini="'+k+'">'+miniPips(k)+'</div></div>';}).join('')+'</div></details>';
  h+='<details class="sess-sec"><summary>Очерёдность</summary><div class="in" id="orderBox">'+orderHtml()+'</div></details>';
  var v=masqNow(),L=masqLevel(v);
  h+='<details class="sess-sec"><summary>Маскарад · '+esc(L[1])+' '+v+'</summary><div class="in">'+masqGauge(v,true)+
    '<div class="ctl" style="display:flex;gap:6px;margin-top:10px"><button class="mini" data-sq="-1">−1</button><button class="mini pri" data-sq="1">+1 нарушение</button><a class="mini" href="#/tool/masq" style="text-decoration:none">шкала →</a></div></div></details>';
  if(!filled) h+='<div class="in" style="padding:16px"><div class="sess-note"><b>План пуст</b>Сцены, развилки, таблицы и плейлисты следующей сессии появятся здесь.</div></div>';
  else{
    if(S.flow&&S.flow.length) h+='<details class="sess-sec" open><summary>Структура сессии</summary><div class="in">'+sessFlow(S.flow)+(S.priority?'<div class="sess-note"><b>При нехватке времени</b>'+md(S.priority)+'</div>':'')+'</div></details>';
    if(S.decisions&&S.decisions.length) h+='<details class="sess-sec"><summary>Ключевые решения</summary><div class="in"><ul class="sess-list">'+S.decisions.map(function(x){return '<li>'+md(x)+'</li>';}).join('')+'</ul></div></details>';
    if(S.tables&&S.tables.length) h+='<details class="sess-sec"><summary>Таблицы</summary><div class="in">'+S.tables.map(function(t){
      return '<h4 style="font-size:19px;margin-top:10px">'+esc(t.name)+'</h4>'+(t.note?'<div class="sess-note">'+md(t.note)+'</div>':'')+(t.groups||[]).map(function(g){return (g.sub?'<div class="eyebrow" style="margin-top:8px">'+esc(g.sub)+'</div>':'')+tableHtml(g.table);}).join('');}).join('')+'</div></details>';
    if(S.afterLog&&S.afterLog.length) h+='<details class="sess-sec"><summary>После сессии — в журнал</summary><div class="in"><ul class="sess-list">'+S.afterLog.map(function(x){return '<li>'+md(x)+'</li>';}).join('')+'</ul></div></details>';
  }
  if(S.playlists&&S.playlists.length) h+='<details class="sess-sec"><summary>Плейлисты</summary><div class="in">'+S.playlists.map(function(p){
    return '<div class="sess-note"><b>'+esc(p[0])+'</b>'+(/^https?:\/\//.test(p[1])?'<a href="'+esc(p[1])+'" target="_blank" rel="noopener" style="color:var(--acc)">открыть ↗</a>':md(p[1]))+'</div>';}).join('')+'</div></details>';
  var body=document.getElementById('sessBody');
  var open={};[].forEach.call(body.querySelectorAll('details'),function(d,i){open[i]=d.open;});
  body.innerHTML=h;
  if(Object.keys(open).length)[].forEach.call(body.querySelectorAll('details'),function(d,i){if(open[i]!=null)d.open=open[i];});
  activateRolls(body);
}
function initSession(){
  var tab=document.getElementById('sessTab'),back=document.getElementById('sessBackdrop'),body=document.getElementById('sessBody');
  function setOpen(on){document.body.classList.toggle('sess-open',on);STORE.set('sessOpen',on);}
  tab.addEventListener('click',function(){setOpen(true);});
  document.getElementById('sessClose').addEventListener('click',function(){setOpen(false);});
  back.addEventListener('click',function(){setOpen(false);});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&document.body.classList.contains('sess-open'))setOpen(false);});
  body.addEventListener('click',function(e){
    var b=e.target.closest('[data-nt]');
    if(b){var n=nightState();n.now=fmtT(tmin(n.now)+(+b.getAttribute('data-nt')));STORE.set('night',n);document.getElementById('nightBox').innerHTML=nightHtml();return;}
    var q=e.target.closest('[data-sq]');
    if(q){STORE.set('masqLive',masqLive()+(+q.getAttribute('data-sq')));renderSession();if(/^#\/tool\/masq/.test(location.hash))route();return;}
    var od=e.target.closest('[data-od]'),oa=e.target.closest('[data-oa]'),o=orderState();
    if(od){o.list.splice(+od.getAttribute('data-od'),1);if(o.cur>=o.list.length)o.cur=0;}
    else if(oa){var a=oa.getAttribute('data-oa');
      if(a==='add'){var nm=document.getElementById('odN').value.trim();if(!nm)return;o.list.push({n:nm,v:document.getElementById('odV').value||'—'});}
      else if(a==='next'){if(!o.list.length)return;o.cur++;if(o.cur>=o.list.length){o.cur=0;o.round++;}}
      else if(a==='sort'){o.list.sort(function(x,y){return (+y.v||0)-(+x.v||0);});o.cur=0;}
      else if(a==='coterie'){PCS.forEach(function(x){if(!o.list.some(function(y){return y.n===x.name;}))o.list.push({n:x.name,v:'—'});});}
      else if(a==='clear'){o={list:[],cur:0,round:1};}}
    else return;
    STORE.set('order',o);document.getElementById('orderBox').innerHTML=orderHtml();
    var inp=document.getElementById('odN');if(oa&&oa.getAttribute('data-oa')==='add'&&inp)inp.focus();
  });
  body.addEventListener('keydown',function(e){if(e.key==='Enter'&&(e.target.id==='odN'||e.target.id==='odV')){var b=body.querySelector('[data-oa="add"]');if(b)b.click();}});
  body.addEventListener('change',function(e){var f=e.target.getAttribute('data-nf');if(!f)return;var n=nightState();n[f]=e.target.value;STORE.set('night',n);document.getElementById('nightBox').innerHTML=nightHtml();});
  renderSession();
  var pref=STORE.get('sessOpen',null);
  if(pref===true||(pref==null&&ACTIVE_SESSION&&ACTIVE_SESSION.n&&window.matchMedia('(min-width:1180px)').matches)) setOpen(true);
}

/* ================= ПОИСК ================= */
var IDX=null;
function buildIndex(){
  IDX=allEntries().map(function(e){return {name:e.name||'',cat:e.cat,href:e.href,text:strings(e.x).join(' · ').replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g,'$2').replace(/\[\[([^\]]+)\]\]/g,'$1').replace(/\*\*/g,'')};});
  CATS.forEach(function(c){IDX.push({name:c.name,cat:'раздел',href:'#/cat/'+c.id,text:c.d+' '+c.lede});});
  TOOLS.forEach(function(t){IDX.push({name:t.name,cat:'инструмент',href:'#/tool/'+t.id,text:t.d});});
  CLAN_REF.forEach(function(r){if(!LINKS[r[0]])IDX.push({name:r[0],cat:'клан · заготовка',href:'#/cat/clans',text:r[1].join(', ')});});
  Object.keys(GHOSTS).forEach(function(id){var c=catById(id);if(!c)return;
    GHOSTS[id].forEach(function(n){if(!LINKS[n])IDX.push({name:n,cat:c.one+' · заготовка',href:'#/cat/'+id,text:'упомянуто в заметках, своей записи ещё нет'});});});
  COMPULSIONS.clan.forEach(function(c){IDX.push({name:c[1],cat:'одержимость',href:'#/tool/compulsions',text:c[0]+' · '+c[2]});});
}
function hl(s,q){var i=s.toLowerCase().indexOf(q);if(i<0)return esc(s);return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+q.length))+'</mark>'+esc(s.slice(i+q.length));}
function initSearch(){
  var q=document.getElementById('q'),res=document.getElementById('qres'),sel=0,hits=[];
  function run(){
    if(!IDX)buildIndex();var v=q.value.trim().toLowerCase();
    if(!v){res.hidden=true;return;}
    hits=IDX.map(function(e){var n=e.name.toLowerCase(),t=e.text.toLowerCase(),s=0;
      if(n.indexOf(v)===0)s=3;else if(n.indexOf(v)>-1)s=2;else if(t.indexOf(v)>-1)s=1;return {e:e,s:s,ti:t.indexOf(v)};})
      .filter(function(h){return h.s;}).sort(function(a,b){return b.s-a.s;}).slice(0,12);
    sel=0;
    res.innerHTML=hits.length?hits.map(function(h,i){var sn='';
      if(h.ti>-1){var a=Math.max(0,h.ti-40);sn=(a?'…':'')+h.e.text.slice(a,h.ti+70)+'…';}
      return '<a href="'+h.e.href+'" class="'+(i===0?'on':'')+'"><span class="t">'+hl(h.e.name,v)+'</span><span class="c">'+esc(h.e.cat)+'</span>'+
        (sn?'<span class="s">'+hl(sn,v)+'</span>':'')+'</a>';}).join(''):'<div class="none">Ничего не найдено. Кодекс пока почти пуст — поиск оживёт вместе с заметками.</div>';
    res.hidden=false;
  }
  q.addEventListener('input',run);q.addEventListener('focus',run);
  q.addEventListener('keydown',function(e){var as=res.querySelectorAll('a');
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!as.length)return;as[sel].classList.remove('on');
      sel=(sel+(e.key==='ArrowDown'?1:-1)+as.length)%as.length;as[sel].classList.add('on');as[sel].scrollIntoView({block:'nearest'});}
    else if(e.key==='Enter'){if(as[sel]){location.hash=as[sel].getAttribute('href');res.hidden=true;q.blur();}}
    else if(e.key==='Escape'){res.hidden=true;q.blur();}});
  res.addEventListener('click',function(){res.hidden=true;q.value='';});
  document.addEventListener('click',function(e){if(!e.target.closest('.srch'))res.hidden=true;});
  document.addEventListener('keydown',function(e){if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();q.focus();}});
}

/* ================= РОУТЕР ================= */
function dispatch(){
  var h=location.hash.replace(/^#\/?/,''),m;
  if(!h){viewHome();return 'top';}
  if(h==='world'||h==='cons'||h==='tools'||h==='cats'){viewHome(h);return 'anchor';}
  if((m=/^cat\/([\w-]+)$/.exec(h))){var c=catById(m[1]);if(c){viewList(c);return 'top';}}
  if((m=/^tool\/([\w-]+)$/.exec(h))){var t=toolById(m[1]);if(t){TOOL_VIEWS[t.id](t);return 'top';}}
  if((m=/^pc\/([\w-]+)$/.exec(h))){viewPC(m[1]);return 'top';}
  if((m=/^player\/([\w-]+)$/.exec(h))){viewPlayer(m[1]);return 'top';}
  if((m=/^([\w-]+)\/([\w-]+)$/.exec(h))){var cc=catByRoute(m[1]);if(cc){viewEntry(cc,m[2]);return cc.kind==='cards'?'keep':'top';}}
  viewHome();return 'top';
}
function route(){var r=dispatch();if(r==='top')window.scrollTo(0,0);activateRolls(app);}
window.addEventListener('hashchange',route);
initDock();
initSearch();
initSession();
route();
</script>
